<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefly Forest</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050c14}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. fireflies.html?count=250 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  count: 190,    // number of fireflies
  wind: 1,       // grass sway strength
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
let W, H, DPR, sky, layers = [], flies = [], grass = [], glow, t = 0;
const LAYER_COL = ['#1d3442', '#10212c', '#060e14'];

function makeGlow() {
  const s = 64, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,220,1)'); gr.addColorStop(.1, 'rgba(230,255,120,.95)'); gr.addColorStop(.35, 'rgba(190,255,80,.3)'); gr.addColorStop(1, 'rgba(160,255,60,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return cv;
}

function pine(g, px, base, h) {
  const w = h * .32;
  g.fillRect(px - h * .015, base - h * .15, h * .03, h * .15);
  for (let k = 0; k < 6; k++) {
    const ty = base - h * .12 - k * h * .14, tw = w * (1 - k * .14);
    g.beginPath(); g.moveTo(px - tw, ty); g.lineTo(px, ty - h * .26); g.lineTo(px + tw, ty); g.fill();
  }
}
function leafy(g, px, base, h) {
  g.fillRect(px - h * .025, base - h * .5, h * .05, h * .5);
  for (let k = 0; k < 9; k++) { g.beginPath(); g.arc(px + rand(-.16, .16) * h, base - h * rand(.55, .85), h * rand(.1, .16), 0, TAU); g.fill(); }
}

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  glow = makeGlow();
  sky = document.createElement('canvas'); sky.width = W; sky.height = H;
  const g = sky.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#040a18'); gr.addColorStop(.45, '#12284a'); gr.addColorStop(.72, '#3b4a6a'); gr.addColorStop(.85, '#7a5a6a'); gr.addColorStop(1, '#2a2430');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H / 6000; i++) { const sy = Math.random() * H * .5; g.fillStyle = `rgba(255,255,255,${rand(.1, .6) * (1 - sy / (H * .5))})`; g.fillRect(Math.random() * W, sy, DPR, DPR); }
  // crescent moon
  const mx = W * .18, my = H * .16, mr = Math.min(W, H) * .035;
  g.fillStyle = '#f4ecd0'; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
  g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(mx + mr * .45, my - mr * .2, mr * .9, 0, TAU); g.fill(); g.globalCompositeOperation = 'source-over';
  layers = LAYER_COL.map((col, li) => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const l = cv.getContext('2d'); l.fillStyle = col;
    const base = H * [.7, .8, .93][li], hMin = H * [.1, .16, .28][li], hMax = H * [.2, .3, .55][li];
    l.fillRect(0, base, W, H - base);
    for (let px = rand(-40, 0) * DPR; px < W + 40 * DPR; px += rand(...[[14, 36], [30, 70], [90, 260]][li]) * DPR) {
      const h = rand(hMin, hMax); (Math.random() < .65 ? pine : leafy)(l, px, base + rand(0, 10) * DPR, h);
    }
    if (li < 2) { // mist in front of this layer
      const fg = l.createLinearGradient(0, base - H * .15, 0, H);
      fg.addColorStop(0, 'rgba(120,150,170,0)'); fg.addColorStop(1, `rgba(120,150,170,${.22 - li * .08})`);
      l.globalCompositeOperation = 'source-atop'; l.fillStyle = fg; l.fillRect(0, 0, W, H); l.globalCompositeOperation = 'source-over';
    }
    return cv;
  });
  flies = Array.from({ length: CFG.count }, () => {
    const d = Math.random() < .2 ? 0 : Math.random() < .55 ? 1 : Math.random() < .85 ? 2 : 3;
    return { d, x: Math.random() * W, y: rand(.35, .97) * H, a: Math.random() * TAU, sp: rand(8, 22) * DPR * (.5 + d * .4), T: rand(2, 5), ph: Math.random(), wob: Math.random() * TAU };
  });
  grass = Array.from({ length: Math.round(W / (4 * DPR)) }, (_, i) => ({ x: i * 4 * DPR + rand(-2, 2) * DPR, h: rand(.03, .09) * H, ph: Math.random() * TAU, lean: rand(-.3, .3) }));
}

function drawFlies(d, dt) {
  x.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    if (f.d !== d) continue;
    f.a += Math.sin(t * .7 + f.wob) * dt * 1.5;
    f.x += Math.cos(f.a) * f.sp * dt; f.y += Math.sin(f.a) * f.sp * dt * .6 + Math.sin(t * 1.3 + f.wob) * DPR * .2;
    if (f.x < -50) f.x = W + 40; if (f.x > W + 50) f.x = -40;
    if (f.y < H * .3) f.a = Math.abs(f.a); if (f.y > H * .98) f.a = -Math.abs(f.a);
    const p = (t / f.T + f.ph) % 1, b = p < .4 ? Math.pow(Math.sin(p / .4 * Math.PI), 2) : 0;
    if (b < .02) continue;
    const r = [7, 12, 19, 46][d] * DPR * (.6 + b * .4);
    x.globalAlpha = b * [.5, .75, 1, .45][d];
    x.drawImage(glow, f.x - r, f.y - r, r * 2, r * 2);
  }
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
}

function frame(dt) {
  t += dt;
  x.drawImage(sky, 0, 0);
  drawFlies(0, dt); x.drawImage(layers[0], 0, 0);
  drawFlies(1, dt); x.drawImage(layers[1], 0, 0);
  drawFlies(2, dt); x.drawImage(layers[2], 0, 0);
  x.strokeStyle = '#03070a'; x.lineWidth = 1.6 * DPR; x.beginPath();
  for (const g of grass) {
    const sway = (Math.sin(t * 1.1 + g.x * .004) * .5 + Math.sin(t * 2.3 + g.ph) * .2) * CFG.wind + g.lean;
    x.moveTo(g.x, H); x.quadraticCurveTo(g.x + sway * g.h * .3, H - g.h * .6, g.x + sway * g.h * .8, H - g.h);
  }
  x.stroke();
  drawFlies(3, dt);
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
