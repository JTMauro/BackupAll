<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyperspace</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000006}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. hyperspace.html?stars=2000&cruise=20 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  stars: 1400,   // star count
  speed: 1,      // overall speed
  cruise: 12,    // seconds cruising between warp jumps
  jump: 5,       // seconds each warp jump lasts
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, DPR, F, stars = [], t = 0;
const COLORS = ['#ffffff', '#cfe3ff', '#a9c8ff', '#ffe7c2', '#d7c9ff'];
const mk = (z) => ({ x: (Math.random() * 2 - 1), y: (Math.random() * 2 - 1), z: z ?? Math.random(), c: COLORS[Math.random() * COLORS.length | 0] });

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  F = Math.max(W, H) * .5;
  stars = Array.from({ length: CFG.stars }, () => mk());
  x.fillStyle = '#000006'; x.fillRect(0, 0, W, H);
}

const smooth = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
function warpLevel() {
  const cyc = CFG.cruise + CFG.jump, p = t % cyc - CFG.cruise;
  if (p < 0) return 0;
  return smooth(p / 1.2) * (1 - smooth((p - CFG.jump + 1.2) / 1.2));
}

function frame(dt) {
  t += dt;
  const w = warpLevel(), v = (.06 + w * 1.6) * CFG.speed, stretch = .02 + w * .35;
  const cx = W / 2 + Math.sin(t * .07) * W * .06, cy = H / 2 + Math.cos(t * .05) * H * .05;
  x.fillStyle = `rgba(0,0,6,${.55 - w * .3})`; x.fillRect(0, 0, W, H);
  if (w > .01) {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .5);
    g.addColorStop(0, `rgba(120,160,255,${.18 * w})`); g.addColorStop(1, 'rgba(120,160,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  x.lineCap = 'round';
  for (const s of stars) {
    s.z -= v * dt;
    if (s.z <= .01) { Object.assign(s, mk(1)); continue; }
    const sx = cx + s.x / s.z * F, sy = cy + s.y / s.z * F;
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) { Object.assign(s, mk(1)); continue; }
    const pz = Math.min(1, s.z + stretch), px = cx + s.x / pz * F, py = cy + s.y / pz * F;
    const b = Math.min(1, (1 - s.z) * 1.3);
    x.globalAlpha = b; x.strokeStyle = s.c;
    x.lineWidth = Math.max(.6, (1 - s.z) * 2.6) * DPR;
    x.beginPath(); x.moveTo(px, py); x.lineTo(sx + .01, sy); x.stroke();
  }
  x.globalAlpha = 1;
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
