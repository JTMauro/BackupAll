<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drone Light Show</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#01020a}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. drone-show.html?text=HAPPY%20BIRTHDAY&count=800 =====
const CFG = {
  fps: 60,
  pace: 0.4,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  count: 600,          // number of drones (400–1200)
  text: 'DREAM BIG',   // custom message the swarm spells
  hold: 10,            // seconds per formation
  clock24: 0,          // 1 = 24h clock formation
  trails: 0.45,        // 0 = no motion trails, 0.8 = long trails
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
const hash = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let W, H, DPR, S, cx, cy, waterY, bg, sprites = [], N, D = [], t = 0, fi = -1, fT = 0, perm = [], cur;

function sprite(h, white) {
  const s = 48, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  const col = white ? '255,250,240' : null;
  gr.addColorStop(0, '#fff');
  gr.addColorStop(.14, white ? `rgba(${col},1)` : `hsla(${h},100%,68%,1)`);
  gr.addColorStop(.4, white ? `rgba(${col},.28)` : `hsla(${h},100%,58%,.3)`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return cv;
}

function sampleText(str) {
  const w = 1200, h = 360, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  let fsz = 260; g.font = `900 ${fsz}px "Arial Black", Impact, sans-serif`;
  const m = g.measureText(str).width; if (m > w * .94) { fsz *= w * .94 / m; g.font = `900 ${fsz}px "Arial Black", Impact, sans-serif`; }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(str, w / 2, h / 2);
  const data = g.getImageData(0, 0, w, h).data, pts = [];
  const step = Math.max(2, Math.round(fsz / 40));
  for (let yy = 0; yy < h; yy += step) for (let xx = 0; xx < w; xx += step) if (data[(yy * w + xx) * 4 + 3] > 128) pts.push([(xx - w / 2) / w * 2.9, (yy - h / 2) / w * 2.9]);
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return pts;
}
const textFormation = (getStr, hueFn) => ({
  init() { this.pts = sampleText(getStr()); },
  at(k, n, t) {
    const p = this.pts, m = p.length;
    if (k >= m) { const q = p[k % m]; return [q[0] + Math.sin(k) * .004, q[1], -.3 - (k / n), 0, 0, .25]; }
    const q = p[k];
    return [q[0], q[1] + Math.sin(q[0] * 3 + t * 2) * .015, 0, ...hueFn(q, t)];
  },
});

// each formation returns [x, y, z, hue, whiteness, brightness] in show units
const FORMATIONS = [
  { name: 'grid', at(k, n, t) {
    const cols = Math.ceil(Math.sqrt(n * 2.4)), rows = Math.ceil(n / cols), i = k % cols, j = k / cols | 0;
    const u = i / (cols - 1) - .5, v = j / Math.max(1, rows - 1) - .5;
    return [u * 2.6, v * 1.0 + Math.sin(u * 8 + t * 2.4) * .06, Math.cos(u * 8 + t * 2.4) * .2, (u * 300 + t * 40 + 720) % 360, 0, 1];
  } },
  { name: 'sphere', at(k, n, t) {
    const y = 1 - 2 * (k + .5) / n, r = Math.sqrt(1 - y * y), ph = k * 2.39996 + t * .6;
    let X = Math.cos(ph) * r, Z = Math.sin(ph) * r, Y = y;
    const tl = .35, Y2 = Y * Math.cos(tl) - Z * Math.sin(tl), Z2 = Y * Math.sin(tl) + Z * Math.cos(tl);
    return [X * .95, Y2 * .95, Z2 * .95, (200 + y * 80 + 360) % 360, 0, 1];
  } },
  { name: 'heart', at(k, n, t) {
    const rings = [1, .76, .52, .28], ring = k % 4, m = Math.ceil(n / 4), a = (k / 4 | 0) / m * TAU;
    const beat = 1 + .06 * Math.pow(Math.max(0, Math.sin(t * 5)), 8);
    const sc = rings[ring] * beat / 17 * 1.15;
    return [16 * Math.pow(Math.sin(a), 3) * sc, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * sc - .05, 0, 345 + ring * 4, ring === 3 ? .6 : 0, 1];
  } },
  { name: 'clock', ...textFormation(() => new Date().toLocaleTimeString([], { hour: CFG.clock24 ? '2-digit' : 'numeric', minute: '2-digit', hour12: !CFG.clock24 }), (q, t) => [190 + q[0] * 30, .55, 1]) },
  { name: 'galaxy', at(k, n, t) {
    const fr = k / n, arm = k % 3, r = .06 + Math.pow(fr, .7) * 1.25;
    const ang = arm * TAU / 3 + r * 4.2 + t * .3 + (hash(k) - .5) * .5;
    const rr = r + (hash(k + 9) - .5) * .08;
    return [Math.cos(ang) * rr, Math.sin(ang) * rr * .4 + (hash(k + 3) - .5) * .04, Math.sin(ang) * rr * .9, (r < .3 ? 45 : 200 + r * 70), r < .25 ? .8 : 0, 1];
  } },
  { name: 'text', ...textFormation(() => CFG.text, (q, t) => [(q[0] * 80 + t * 60 + 720) % 360, 0, 1]) },
  { name: 'saturn', at(k, n, t) {
    if (k < n * .62) {
      const m = Math.floor(n * .62), y = 1 - 2 * (k + .5) / m, r = Math.sqrt(1 - y * y), ph = k * 2.39996 + t * .4;
      let X = Math.cos(ph) * r * .55, Y = y * .55, Z = Math.sin(ph) * r * .55;
      const band = Math.floor((y + 1) * 5) % 2;
      return rot(X, Y, Z, .38, 36 + band * 10, band * .3);
    }
    const j = k - Math.floor(n * .62), a = j * 2.39996 + t * .25, rad = .8 + hash(j) * .45;
    return rot(Math.cos(a) * rad, 0, Math.sin(a) * rad, .38, 30, .2);
    function rot(X, Y, Z, tl, h, w) { return [X, Y * Math.cos(tl) - Z * Math.sin(tl), Y * Math.sin(tl) + Z * Math.cos(tl), h, w, 1]; }
  } },
  { name: 'star', at(k, n, t) {
    const inner = k % 3 === 0, sc = inner ? .45 : 1;
    const u = ((k / n) * 10 + t * .15) % 10, v = Math.floor(u), f = u - v;
    const p = vi => { const a = vi / 10 * TAU - Math.PI / 2 + t * .15, r = vi % 2 ? .42 : 1; return [Math.cos(a) * r, Math.sin(a) * r]; };
    const A = p(v), B = p(v + 1);
    return [(A[0] + (B[0] - A[0]) * f) * sc * 1.05, (A[1] + (B[1] - A[1]) * f) * sc * 1.05, 0, inner ? 30 : 48, inner ? 0 : .35, 1];
  } },
  { name: 'wave', at(k, n, t) {
    const cols = 50, rows = Math.ceil(n / cols), i = k % cols, j = k / cols | 0;
    const u = i / (cols - 1), v = j / Math.max(1, rows - 1), ph = u * 7 - t * 3;
    return [(u - .5) * 2.4, (v - .5) * 1.25 + Math.sin(ph) * .07 * u, Math.cos(ph) * .18 * u, v * 300, 0, .85 + .15 * Math.sin(ph)];
  } },
];

function buildScene() {
  bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const g = bg.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, waterY);
  sky.addColorStop(0, '#01020a'); sky.addColorStop(.7, '#0a0c26'); sky.addColorStop(1, '#241a3e');
  g.fillStyle = sky; g.fillRect(0, 0, W, waterY);
  for (let i = 0; i < W * H / 6000; i++) { g.fillStyle = `rgba(255,255,255,${rand(.1, .6)})`; g.fillRect(Math.random() * W, Math.random() * waterY * .8, DPR, DPR); }
  // skyline
  const sk = document.createElement('canvas'); sk.width = W; sk.height = waterY;
  const s = sk.getContext('2d');
  let bx = 0;
  while (bx < W) {
    const bw = rand(18, 70) * DPR, bh = Math.pow(Math.random(), 2) * H * .16 + H * .02;
    s.fillStyle = '#070912'; s.fillRect(bx, waterY - bh, bw, bh);
    if (Math.random() < .2) s.fillRect(bx + bw / 2 - DPR, waterY - bh - bh * .25, 2 * DPR, bh * .25);
    for (let wy = waterY - bh + 4 * DPR; wy < waterY - 3 * DPR; wy += 5 * DPR)
      for (let wx = bx + 3 * DPR; wx < bx + bw - 3 * DPR; wx += 4 * DPR)
        if (Math.random() < .14) { s.fillStyle = ['#ffcf7a', '#a8d8ff', '#ffe9c0'][Math.random() * 3 | 0]; s.globalAlpha = rand(.3, .8); s.fillRect(wx, wy, 1.6 * DPR, 2 * DPR); s.globalAlpha = 1; }
    bx += bw + rand(-4, 6) * DPR;
  }
  g.drawImage(sk, 0, 0);
  // water
  const wg = g.createLinearGradient(0, waterY, 0, H);
  wg.addColorStop(0, '#0f0d24'); wg.addColorStop(1, '#020208');
  g.fillStyle = wg; g.fillRect(0, waterY, W, H - waterY);
  g.save(); g.globalAlpha = .28;
  for (let yy = 0; yy < H - waterY; yy += 2 * DPR) {
    const src = waterY - yy / .6 - 1; if (src < 0) break;
    g.drawImage(sk, 0, src, W, 2 * DPR, Math.sin(yy * .15) * 4 * DPR, waterY + yy, W, 2 * DPR);
  }
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i < 400; i++) g.fillRect(Math.random() * W, waterY + Math.pow(Math.random(), .7) * (H - waterY), rand(4, 30) * DPR, DPR);
}

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  waterY = H * .8; cx = W / 2; cy = H * .42; S = Math.min(W * .34, H * .3);
  sprites = []; for (let h = 0; h < 36; h++) sprites.push(sprite(h * 10)); sprites.push(sprite(0, true));
  buildScene();
  N = Math.max(100, Math.min(2000, CFG.count | 0));
  D = Array.from({ length: N }, (_, i) => ({ x: (i / N - .5) * 2.6, y: (waterY - cy) / S, z: 0, h: 200, w: 1, b: .3, rate: rand(1, 1.9), sx: 0, sy: 0 }));
  x.drawImage(bg, 0, 0);
  fi = -1; next();
}

function next() {
  fi = (fi + 1) % FORMATIONS.length; fT = 0; cur = FORMATIONS[fi];
  if (cur.init) cur.init();
  // pair drones to targets by left-to-right order to keep transitions tidy
  const tg = Array.from({ length: N }, (_, k) => [k, cur.at(k, N, t)[0]]).sort((a, b) => a[1] - b[1]);
  const dr = D.map((d, i) => [i, d.x]).sort((a, b) => a[1] - b[1]);
  perm = new Array(N); for (let r = 0; r < N; r++) perm[dr[r][0]] = tg[r][0];
}

function frame(dt) {
  t += dt; fT += dt;
  if (fT > CFG.hold) next();
  x.globalCompositeOperation = 'source-over';
  x.globalAlpha = 1 - CFG.trails; x.drawImage(bg, 0, 0); x.globalAlpha = 1;
  x.globalCompositeOperation = 'lighter';
  const base = S * .05, f = 2.6;
  for (let i = 0; i < N; i++) {
    const d = D[i], T = cur.at(perm[i], N, t), e = 1 - Math.exp(-dt * d.rate * 1.4);
    d.x += (T[0] - d.x) * e; d.y += (T[1] - d.y) * e; d.z += (T[2] - d.z) * e;
    let dh = ((T[3] - d.h) % 360 + 540) % 360 - 180; d.h = (d.h + dh * e + 360) % 360;
    d.w += (T[4] - d.w) * e; d.b += (T[5] - d.b) * e;
    const p = f / (f + d.z), sx = cx + d.x * S * p, sy = cy + d.y * S * p, sz = base * p;
    const spr = d.w > .5 ? sprites[36] : sprites[Math.round(d.h / 10) % 36];
    const tw = .85 + .15 * Math.sin(t * 6 + i);
    x.globalAlpha = Math.max(0, Math.min(1, d.b * tw * (p > 1 ? 1 : p)));
    x.drawImage(spr, sx - sz / 2, sy - sz / 2, sz, sz);
    const ry = waterY + (waterY - sy) * .45;
    if (ry < H && sy < waterY) {
      x.globalAlpha *= .3;
      x.drawImage(spr, sx - sz / 2 + Math.sin(ry * .05 + t * 2) * 5 * DPR, ry - sz / 4, sz, sz / 2);
    }
  }
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
