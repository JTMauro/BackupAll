<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koi Pond</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a1a1c}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. koi-pond.html?fish=12 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  fish: 8,       // number of koi
  pads: 9,       // lily pads
  rain: 1,       // ripples from light rain (0 = still water)
  // Click the pond (enable mouse input in Lively) to drop food: the koi will come.
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
let W, H, DPR, bed, fish = [], pads = [], ripples = [], food = [], t = 0;
const PATTERNS = [
  { base: '#f4f0ea', spots: '#ff5a1f', ink: null },   // kohaku
  { base: '#ffb020', spots: '#ff7a10', ink: null },   // yamabuki ogon
  { base: '#f4f0ea', spots: '#ff4a20', ink: '#15161a' }, // taisho sanke
  { base: '#ff6a20', spots: '#ffd2a0', ink: '#15161a' },
  { base: '#e8eef5', spots: '#b8c8da', ink: null },   // platinum
  { base: '#15161a', spots: '#ff7a20', ink: '#f4f0ea' }, // showa-ish
];

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  bed = document.createElement('canvas'); bed.width = W; bed.height = H;
  const g = bed.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  gr.addColorStop(0, '#1f4a48'); gr.addColorStop(1, '#0a1e22');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const peb = document.createElement('canvas'); peb.width = W; peb.height = H;
  const pg = peb.getContext('2d');
  for (let i = 0; i < W * H / 900; i++) {
    const r = rand(3, 14) * DPR, l = rand(18, 45);
    pg.fillStyle = `hsla(${rand(150, 200)},${rand(8, 25)}%,${l}%,${rand(.25, .6)})`;
    pg.beginPath(); pg.ellipse(Math.random() * W, Math.random() * H, r, r * rand(.6, 1), Math.random() * 3, 0, TAU); pg.fill();
  }
  g.filter = `blur(${2.5 * DPR}px)`; g.drawImage(peb, 0, 0); g.filter = 'none';
  const sh = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
  sh.addColorStop(0, 'rgba(0,10,12,0)'); sh.addColorStop(1, 'rgba(0,10,12,.6)');
  g.fillStyle = sh; g.fillRect(0, 0, W, H);
  const S = Math.min(W, H) / 900;
  fish = Array.from({ length: CFG.fish }, (_, i) => {
    const len = rand(90, 170) * DPR * Math.max(.7, S), hx = Math.random() * W, hy = Math.random() * H, a = Math.random() * TAU;
    const pat = PATTERNS[i % PATTERNS.length];
    return { len, a, sp: rand(30, 55) * DPR, turn: 0, wob: Math.random() * TAU, pat,
      pts: Array.from({ length: 14 }, (_, k) => [hx - Math.cos(a) * k * len / 13, hy - Math.sin(a) * k * len / 13]),
      spots: Array.from({ length: 4 + (Math.random() * 3 | 0) }, () => [rand(.05, .75), rand(-.6, .6), rand(.18, .35)]),
      inks: Array.from({ length: pat.ink ? 4 : 0 }, () => [rand(.15, .7), rand(-.7, .7), rand(.08, .16)]) };
  });
  pads = Array.from({ length: CFG.pads }, () => ({ x: Math.random() * W, y: Math.random() * H, r: rand(35, 70) * DPR * Math.max(.7, S), rot: Math.random() * TAU, notch: rand(.25, .45), flower: Math.random() < .35, vx: rand(-2, 2) * DPR, vr: rand(-.02, .02) }));
}

function steer(f, dt) {
  const [hx, hy] = f.pts[0];
  let target = null, best = 1e18;
  for (const p of food) { const d = (p.x - hx) ** 2 + (p.y - hy) ** 2; if (d < best) { best = d; target = p; } }
  let want = f.a + Math.sin(t * .4 + f.wob) * .8;
  const m = 80 * DPR;
  if (hx < m || hx > W - m || hy < m || hy > H - m) want = Math.atan2(H / 2 - hy, W / 2 - hx);
  if (target) { want = Math.atan2(target.y - hy, target.x - hx); if (best < (f.len * .2) ** 2) target.eaten = true; }
  let d = ((want - f.a) % TAU + TAU * 1.5) % TAU - Math.PI;
  f.a += Math.max(-1.6, Math.min(1.6, d * 1.5)) * dt;
  const sp = f.sp * (target ? 2.2 : 1) * (1 + .3 * Math.sin(t * 1.3 + f.wob));
  f.pts[0] = [hx + Math.cos(f.a) * sp * dt, hy + Math.sin(f.a) * sp * dt];
  const seg = f.len / 13;
  for (let k = 1; k < f.pts.length; k++) {
    const [px, py] = f.pts[k - 1], [qx, qy] = f.pts[k], ang = Math.atan2(qy - py, qx - px);
    f.pts[k] = [px + Math.cos(ang) * seg, py + Math.sin(ang) * seg];
  }
}

function bodyPath(f, ox = 0, oy = 0, scale = 1) {
  const L = [], R = [], n = f.pts.length;
  for (let k = 0; k < n; k++) {
    const u = k / (n - 1), w = f.len * .13 * scale * (u < .25 ? .75 + u : Math.max(.08, 1.15 - u * 1.15)) * (k === 0 ? .7 : 1);
    const [px, py] = f.pts[k], [qx, qy] = f.pts[Math.min(n - 1, k + 1)], [rx, ry] = f.pts[Math.max(0, k - 1)];
    const ang = Math.atan2(ry - qy, rx - qx) + Math.PI / 2;
    L.push([px + Math.cos(ang) * w + ox, py + Math.sin(ang) * w + oy]); R.push([px - Math.cos(ang) * w + ox, py - Math.sin(ang) * w + oy]);
  }
  const p = new Path2D(); p.moveTo(L[0][0], L[0][1]);
  for (let k = 1; k < n; k++) p.lineTo(L[k][0], L[k][1]);
  for (let k = n - 1; k >= 0; k--) p.lineTo(R[k][0], R[k][1]);
  p.closePath(); return p;
}
function along(f, u, side) {
  const n = f.pts.length, k = Math.min(n - 2, Math.floor(u * (n - 1))), [px, py] = f.pts[k], [qx, qy] = f.pts[k + 1];
  const ang = Math.atan2(py - qy, px - qx) + Math.PI / 2, w = f.len * .13;
  return [px + Math.cos(ang) * w * side, py + Math.sin(ang) * w * side];
}

function drawFish(f) {
  const n = f.pts.length, [tx, ty] = f.pts[n - 1], [sx, sy] = f.pts[n - 3], ta = Math.atan2(ty - sy, tx - sx), sw = Math.sin(t * 5 + f.wob) * .35;
  // fins
  x.fillStyle = 'rgba(255,245,235,.4)';
  for (const side of [-1, 1]) {
    const [fx, fy] = along(f, .22, side), [ax, ay] = f.pts[2], [bx, by] = f.pts[4], ba = Math.atan2(ay - by, ax - bx);
    x.beginPath(); x.ellipse(fx, fy, f.len * .14, f.len * .05, ba + side * (1.9 + Math.sin(t * 3 + f.wob) * .3), 0, TAU); x.fill();
  }
  x.beginPath(); x.moveTo(tx, ty);
  x.quadraticCurveTo(tx + Math.cos(ta + .6 + sw) * f.len * .3, ty + Math.sin(ta + .6 + sw) * f.len * .3, tx + Math.cos(ta + sw) * f.len * .24, ty + Math.sin(ta + sw) * f.len * .24);
  x.quadraticCurveTo(tx + Math.cos(ta - .6 + sw) * f.len * .3, ty + Math.sin(ta - .6 + sw) * f.len * .3, tx, ty);
  x.fill();
  // body with markings
  const body = bodyPath(f);
  x.save(); x.clip(body);
  x.fillStyle = f.pat.base; x.fill(body);
  x.fillStyle = f.pat.spots;
  for (const [u, s, r] of f.spots) { const [px, py] = along(f, u, s); x.beginPath(); x.arc(px, py, f.len * r * .32, 0, TAU); x.fill(); }
  if (f.pat.ink) { x.fillStyle = f.pat.ink; for (const [u, s, r] of f.inks) { const [px, py] = along(f, u, s); x.beginPath(); x.arc(px, py, f.len * r * .3, 0, TAU); x.fill(); } }
  const [hx, hy] = f.pts[0], [nx, ny] = f.pts[3];
  const sheen = x.createLinearGradient(hx, hy, nx, ny); sheen.addColorStop(0, 'rgba(255,255,255,.25)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = sheen; x.fill(body);
  x.restore();
}

function drawPad(p) {
  x.save(); x.translate(p.x, p.y); x.rotate(p.rot);
  x.fillStyle = 'rgba(0,12,10,.35)'; x.beginPath(); x.moveTo(10 * DPR, 12 * DPR); x.arc(10 * DPR, 12 * DPR, p.r, p.notch, TAU - .05); x.fill();
  const g = x.createRadialGradient(-p.r * .3, -p.r * .3, 0, 0, 0, p.r);
  g.addColorStop(0, '#5fa04a'); g.addColorStop(1, '#2c6a34');
  x.fillStyle = g; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, p.r, p.notch, TAU - .05); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(20,60,25,.5)'; x.lineWidth = DPR;
  for (let i = 0; i < 9; i++) { const a = p.notch + (TAU - p.notch) * i / 9; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a) * p.r * .92, Math.sin(a) * p.r * .92); x.stroke(); }
  if (p.flower) {
    for (let ring = 0; ring < 2; ring++) for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + ring * .4 + p.rot * -1, rr = p.r * (ring ? .28 : .42);
      x.fillStyle = ring ? '#ffd4e4' : '#f28ab2';
      x.beginPath(); x.ellipse(Math.cos(a) * rr * .55, Math.sin(a) * rr * .55, rr * .5, rr * .2, a, 0, TAU); x.fill();
    }
    x.fillStyle = '#ffd34a'; x.beginPath(); x.arc(0, 0, p.r * .1, 0, TAU); x.fill();
  }
  x.restore();
}

addEventListener('pointerdown', e => {
  const px = e.clientX * DPR, py = e.clientY * DPR;
  ripples.push({ x: px, y: py, r: 2, a: .8 });
  for (let i = 0; i < 6; i++) food.push({ x: px + rand(-25, 25) * DPR, y: py + rand(-25, 25) * DPR, life: 20 });
});

function frame(dt) {
  t += dt;
  for (const f of fish) steer(f, dt);
  for (const p of food) p.life -= dt;
  food = food.filter(p => !p.eaten && p.life > 0);
  x.drawImage(bed, 0, 0);
  x.fillStyle = 'rgba(0,10,10,.28)';
  for (const f of fish) x.fill(bodyPath(f, 14 * DPR, 18 * DPR, 1.05));
  for (const f of fish) drawFish(f);
  // caustic shimmer on the surface
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) {
    const cx = (Math.sin(t * .05 + i * 2.1) * .5 + .5) * W, cy = (Math.cos(t * .04 + i * 1.3) * .5 + .5) * H, r = Math.min(W, H) * (.15 + .08 * Math.sin(t * .3 + i));
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(120,220,200,${.035 + .02 * Math.sin(t + i)})`); g.addColorStop(1, 'rgba(120,220,200,0)');
    x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  x.globalCompositeOperation = 'source-over';
  for (const p of food) { x.fillStyle = '#c8a060'; x.beginPath(); x.arc(p.x, p.y, 2.5 * DPR, 0, TAU); x.fill(); }
  for (const p of pads) {
    p.x += p.vx * dt; p.rot += p.vr * dt;
    if (p.x < -p.r) p.x = W + p.r; if (p.x > W + p.r) p.x = -p.r;
    drawPad(p);
  }
  if (CFG.rain && Math.random() < dt * 1.5 * CFG.rain) ripples.push({ x: Math.random() * W, y: Math.random() * H, r: 2, a: .5 });
  for (const r of ripples) {
    r.r += 45 * DPR * dt; r.a -= dt * .28;
    for (let k = 0; k < 3; k++) {
      const rr = r.r - k * 12 * DPR; if (rr <= 0) continue;
      x.strokeStyle = `rgba(220,255,250,${Math.max(0, r.a) * (1 - k * .3)})`; x.lineWidth = 1.4 * DPR;
      x.beginPath(); x.arc(r.x, r.y, rr, 0, TAU); x.stroke();
    }
  }
  ripples = ripples.filter(r => r.a > 0);
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
