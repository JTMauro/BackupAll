<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonlit Ocean</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#02050d}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. moonlit-ocean.html?waves=1.5&lighthouse=0 =====
const CFG = {
  fps: 50,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  waves: 1,        // wave height
  speed: 1,        // wave speed
  lighthouse: 1,   // 1 = lighthouse on the headland, 0 = open sea
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
let W, H, DPR, hz, sky, clouds = [], land, mx, my, mr, t = 0;
const ROWS = 56;

function cloudSprite(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.filter = `blur(${h * .12}px)`;
  for (let i = 0; i < 14; i++) {
    const cx = rand(.28, .72) * w, cy = rand(.45, .58) * h, rx = rand(.08, .18) * w, ry = rand(.1, .18) * h;
    const gr = g.createLinearGradient(0, cy - ry, 0, cy + ry);
    gr.addColorStop(0, 'rgba(150,160,200,.55)'); gr.addColorStop(.4, 'rgba(40,46,72,.8)'); gr.addColorStop(1, 'rgba(15,18,32,.85)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.fill();
  }
  return cv;
}

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  hz = H * .56; mx = W * .42; my = H * .2; mr = Math.min(W, H) * .06;
  sky = document.createElement('canvas'); sky.width = W; sky.height = H;
  const g = sky.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, '#01030b'); gr.addColorStop(.6, '#0a1430'); gr.addColorStop(1, '#1f2c52');
  g.fillStyle = gr; g.fillRect(0, 0, W, hz);
  for (let i = 0; i < W * H / 3500; i++) { g.fillStyle = `rgba(255,255,255,${rand(.1, .7)})`; const s = rand(.5, 1.5) * DPR; g.fillRect(Math.random() * W, Math.random() * hz * .9, s, s); }
  const halo = g.createRadialGradient(mx, my, mr, mx, my, mr * 9);
  halo.addColorStop(0, 'rgba(210,220,255,.28)'); halo.addColorStop(1, 'rgba(210,220,255,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, hz);
  const mg = g.createRadialGradient(mx - mr * .3, my - mr * .3, 0, mx, my, mr);
  mg.addColorStop(0, '#ffffff'); mg.addColorStop(1, '#d9def0');
  g.fillStyle = mg; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
  g.fillStyle = 'rgba(150,160,190,.3)';
  [[-.3, -.1, .25], [.2, .25, .18], [.35, -.3, .12], [-.1, .45, .1]].forEach(([a, b, r]) => { g.beginPath(); g.arc(mx + a * mr, my + b * mr, r * mr, 0, TAU); g.fill(); });
  clouds = Array.from({ length: 5 }, (_, i) => { const w = rand(.4, .7) * W, h = w * .4; return { cv: cloudSprite(w | 0, h | 0), x: rand(-.3, 1) * W, y: rand(.04, .38) * H, v: rand(4, 10) * DPR }; });
  // headland with lighthouse
  land = document.createElement('canvas'); land.width = W; land.height = H;
  const l = land.getContext('2d'); l.fillStyle = '#02040a';
  l.beginPath(); l.moveTo(W * .7, hz + 2);
  for (let xx = W * .7; xx <= W; xx += 8 * DPR) { const u = (xx - W * .7) / (W * .3); l.lineTo(xx, hz - H * .07 * Math.sin(Math.min(1, u * 1.4) * Math.PI / 2) - H * .012 * Math.sin(u * 30) - rand(0, 2) * DPR); }
  l.lineTo(W, hz + 2); l.fill();
  if (CFG.lighthouse) {
    const lx = W * .86, base = hz - H * .072, th = H * .11, tw = H * .012;
    l.beginPath(); l.moveTo(lx - tw, base); l.lineTo(lx - tw * .7, base - th); l.lineTo(lx + tw * .7, base - th); l.lineTo(lx + tw, base); l.fill();
    l.fillRect(lx - tw, base - th - tw * 1.6, tw * 2, tw * .5);
    l.beginPath(); l.moveTo(lx - tw * .9, base - th - tw * 1.6); l.lineTo(lx, base - th - tw * 2.6); l.lineTo(lx + tw * .9, base - th - tw * 1.6); l.fill();
    land.lamp = [lx, base - th - tw * 1.05];
  }
}

function waveH(xx, p, i) {
  const s = W * (.04 + p * .45), u = xx / s, T = t * CFG.speed;
  return (Math.sin(u * 6.28 + T * 1.1 + i * .7) * .6 + Math.sin(u * 14.4 - T * 1.7 + i * 1.3) * .28 + Math.sin(u * 31 + T * 2.6 + i * .3) * .12) * p * H * .016 * CFG.waves;
}

function frame(dt) {
  t += dt;
  x.drawImage(sky, 0, 0);
  for (const cl of clouds) { cl.x += cl.v * dt; if (cl.x > W) cl.x = -cl.cv.width; x.globalAlpha = .75; x.drawImage(cl.cv, cl.x, cl.y - cl.cv.height * .4); x.globalAlpha = 1; }
  // horizon glow
  const hg = x.createLinearGradient(0, hz - H * .05, 0, hz);
  hg.addColorStop(0, 'rgba(80,100,160,0)'); hg.addColorStop(1, 'rgba(80,100,160,.35)');
  x.fillStyle = hg; x.fillRect(0, hz - H * .05, W, H * .05);
  // lighthouse beam (behind the headland silhouette)
  const step = 12 * DPR;
  if (CFG.lighthouse && land.lamp) {
    const [lx, ly] = land.lamp, th = t * .9, dir = Math.cos(th), face = Math.max(0, Math.sin(th));
    x.globalCompositeOperation = 'lighter';
    const L = W * .7 * Math.abs(dir) + W * .05, ex = lx + Math.sign(dir) * L;
    const bg = x.createLinearGradient(lx, ly, ex, ly);
    bg.addColorStop(0, `rgba(255,240,200,${.28 * (1 - face * .6)})`); bg.addColorStop(1, 'rgba(255,240,200,0)');
    x.fillStyle = bg; x.beginPath(); x.moveTo(lx, ly - 2 * DPR); x.lineTo(ex, ly - H * .05); x.lineTo(ex, ly + H * .03); x.lineTo(lx, ly + 2 * DPR); x.fill();
    x.globalCompositeOperation = 'source-over';
  }
  x.drawImage(land, 0, 0);
  if (CFG.lighthouse && land.lamp) {
    const [lx, ly] = land.lamp, face = Math.max(0, Math.sin(t * .9)), r = (8 + face * face * 60) * DPR;
    x.globalCompositeOperation = 'lighter';
    const lg = x.createRadialGradient(lx, ly, 0, lx, ly, r);
    lg.addColorStop(0, 'rgba(255,245,215,1)'); lg.addColorStop(.2, 'rgba(255,230,180,.5)'); lg.addColorStop(1, 'rgba(255,230,180,0)');
    x.fillStyle = lg; x.fillRect(lx - r, ly - r, r * 2, r * 2);
    x.globalCompositeOperation = 'source-over';
  }
  // ocean, far rows to near rows
  for (let i = 0; i < ROWS; i++) {
    const p = Math.pow((i + 1) / ROWS, 2.1), y = hz + (H - hz) * p - 1, amp = p * H * .016;
    const g = x.createLinearGradient(0, y - amp, 0, y + amp * 5 + 4 * DPR);
    g.addColorStop(0, `rgb(${18 + p * 10 | 0},${30 + p * 16 | 0},${62 + p * 18 | 0})`); g.addColorStop(1, '#02060f');
    x.fillStyle = g; x.beginPath(); x.moveTo(0, H);
    for (let xx = 0; xx <= W + step; xx += step) x.lineTo(xx, y + waveH(xx, p, i));
    x.lineTo(W, H); x.fill();
    x.strokeStyle = `rgba(150,175,230,${.04 + p * .08})`; x.lineWidth = DPR; x.beginPath();
    for (let xx = 0; xx <= W + step; xx += step) x.lineTo(xx, y + waveH(xx, p, i));
    x.stroke();
    // moon glitter
    const hw = W * (.015 + p * .22), gs = (3 + p * 9) * DPR;
    x.globalCompositeOperation = 'lighter';
    for (let xx = mx - hw; xx < mx + hw; xx += gs) {
      const b = Math.sin(xx * .05 / DPR + i * 1.3 + t * 2.1) * Math.sin(xx * .017 / DPR - t * 1.3 + i * 2.7);
      if (b < .45) continue;
      const fall = 1 - Math.abs(xx - mx) / hw, a = (b - .45) / .55 * fall * (.4 + .6 * (1 - p * .4));
      x.fillStyle = `rgba(235,240,255,${a})`;
      const dw = (2 + p * 16) * DPR * (.5 + b * .5);
      x.fillRect(xx - dw / 2, y + waveH(xx, p, i) - DPR, dw, Math.max(1, (1 + p * 2) * DPR));
    }
    x.globalCompositeOperation = 'source-over';
  }
  const vg = x.createLinearGradient(0, H * .8, 0, H);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,6,.45)');
  x.fillStyle = vg; x.fillRect(0, H * .8, W, H * .2);
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
