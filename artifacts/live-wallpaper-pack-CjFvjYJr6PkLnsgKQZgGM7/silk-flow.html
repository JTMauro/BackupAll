<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silk Flow</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#04040a}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. silk-flow.html?particles=4000&cycle=20 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  particles: 5000,   // number of silk threads
  speed: 1,          // flow speed
  cycle: 35,         // seconds per color palette
  fade: 0.014,       // trail fade (lower = longer silk)
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
// each palette: hue range [from, to], saturation, lightness
const PALETTES = [[190, 290, 90, 62], [300, 400, 95, 62], [140, 210, 85, 55], [15, 60, 100, 58], [220, 340, 85, 66], [160, 260, 70, 70]];
const B = 14; // color buckets per frame
let W, H, DPR, S, P = [], t = 0, paths = [];

function spawn(p) { p.x = Math.random() * W; p.y = Math.random() * H; p.life = rand(4, 10); p.age = 0; p.seed = Math.random(); }
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  S = Math.min(W, H);
  P = Array.from({ length: CFG.particles | 0 }, () => { const p = {}; spawn(p); p.age = Math.random() * p.life; return p; });
  x.fillStyle = '#04040a'; x.fillRect(0, 0, W, H);
}

// velocity = curl of a smooth potential, so the flow swirls without piling threads into one line
function field(px, py) {
  const nx = px / S * 2.4, ny = py / S * 2.4, T = t * .05;
  const a = nx * 1.3 + T, b = ny * 1.1 - T * 1.2, cc = nx * .7 - ny * .9 + T * .7, r = Math.hypot(nx - 2, ny - 1) || 1, d = r * 1.6 - T * 1.5;
  const e = nx * 2.3 - T * .8, f = ny * 2.1 + T * .6;
  const dx = 1.3 * Math.cos(a) * Math.cos(b) + .56 * Math.cos(cc) - .8 * Math.sin(d) * (nx - 2) / r + .35 * 2.3 * Math.cos(e) * Math.sin(f);
  const dy = -1.1 * Math.sin(a) * Math.sin(b) - .72 * Math.cos(cc) - .8 * Math.sin(d) * (ny - 1) / r + .35 * 2.1 * Math.sin(e) * Math.cos(f);
  return Math.atan2(-dx, dy);
}

function frame(dt) {
  t += dt;
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = `rgba(4,4,10,${1 - Math.pow(1 - CFG.fade, dt * 60)})`; x.fillRect(0, 0, W, H);
  // crossfade between palettes
  const pc = t / CFG.cycle, i0 = Math.floor(pc) % PALETTES.length, i1 = (i0 + 1) % PALETTES.length;
  let m = pc % 1; m = m < .8 ? 0 : (m - .8) / .2; m = m * m * (3 - 2 * m);
  const pa = PALETTES[i0], pb = PALETTES[i1], L = v => pa[v] + (pb[v] - pa[v]) * m;
  const h0 = L(0), h1 = L(1), sat = L(2), lit = L(3);
  paths = Array.from({ length: B }, () => new Path2D());
  const step = 1.7 * DPR * CFG.speed * dt * 60;
  for (const p of P) {
    p.age += dt;
    if (p.age > p.life || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) { spawn(p); continue; }
    const a = field(p.x, p.y), nx = p.x + Math.cos(a) * step, ny = p.y + Math.sin(a) * step;
    const bk = Math.min(B - 1, (p.seed * B) | 0);
    paths[bk].moveTo(p.x, p.y); paths[bk].lineTo(nx, ny);
    p.x = nx; p.y = ny;
  }
  x.globalCompositeOperation = 'lighter';
  x.lineWidth = 1.1 * DPR;
  for (let b = 0; b < B; b++) {
    const hue = h0 + (h1 - h0) * (b / (B - 1));
    x.strokeStyle = `hsla(${hue},${sat}%,${lit}%,.5)`;
    x.stroke(paths[b]);
  }
  x.globalCompositeOperation = 'source-over';
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
