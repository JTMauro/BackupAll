<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Jellyfish</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000610}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. deep-sea.html?count=14 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  count: 10,     // number of jellyfish
  speed: 1,      // swim speed
  rays: 1,       // 1 = light shafts from the surface, 0 = pitch black depths
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
let W, H, DPR, bg, jellies = [], snow = [], plank = [], t = 0;
const HUES = [185, 195, 290, 310, 260, 170, 330];

function mkJelly(init) {
  const z = rand(.35, 1), s = (z * rand(40, 75)) * DPR * Math.min(1.4, Math.max(.7, innerHeight / 900));
  return { x: rand(.05, .95) * W, y: init ? rand(.1, 1.1) * H : H + s * 2, s, z, hue: HUES[Math.random() * HUES.length | 0], T: rand(2.6, 4.2), ph: Math.random(), vx: 0, vy: 0, drift: Math.random() * TAU, nt: 8 + (Math.random() * 6 | 0), len: rand(2.2, 4.2) };
}

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const g = bg.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#08304a'); gr.addColorStop(.35, '#031628'); gr.addColorStop(1, '#00030a');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  jellies = Array.from({ length: CFG.count }, () => mkJelly(true)).sort((a, b) => a.z - b.z);
  snow = Array.from({ length: Math.round(W * H / 6000) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: rand(.2, 1), ph: Math.random() * TAU }));
  plank = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, ph: Math.random() * TAU, sp: rand(.5, 2) }));
}

function drawRays() {
  if (!CFG.rays) return;
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const sx = W * (i / 6) + Math.sin(t * .1 + i * 1.7) * W * .08, w = W * (.04 + .03 * Math.sin(i * 3.1)), lean = W * .15;
    const a = .035 + .025 * Math.sin(t * .3 + i * 2);
    const g = x.createLinearGradient(0, 0, 0, H * .85);
    g.addColorStop(0, `rgba(120,200,255,${a})`); g.addColorStop(1, 'rgba(120,200,255,0)');
    x.fillStyle = g; x.beginPath(); x.moveTo(sx - w, 0); x.lineTo(sx + w, 0); x.lineTo(sx + w * 3 + lean, H * .85); x.lineTo(sx - w * 2 + lean, H * .85); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
}

function drawJelly(j, dt) {
  const p = ((t / j.T) + j.ph) % 1;
  const cnt = p < .28 ? Math.sin(p / .28 * Math.PI / 2) : Math.pow(1 - (p - .28) / .72, 2);
  const thrust = p < .28 ? 1 : 0;
  j.vy += (-(thrust * 120) * j.z * DPR * CFG.speed - j.vy * 1.6) * dt + 8 * DPR * dt * j.z;
  j.drift += dt * .2;
  j.vx = Math.sin(j.drift) * 12 * DPR * j.z;
  j.x += j.vx * dt; j.y += j.vy * dt;
  if (j.y < -j.s * 6) Object.assign(j, mkJelly(false));

  const s = j.s, w = s * (1 - .2 * cnt), h = s * .8 * (1 + .15 * cnt), hue = j.hue, A = .45 + .55 * j.z;
  x.save(); x.translate(j.x, j.y); x.rotate(Math.atan2(j.vx, -j.vy - 1) * .5);
  x.globalCompositeOperation = 'lighter';
  // halo
  const halo = x.createRadialGradient(0, -h * .4, 0, 0, -h * .4, s * 2.4);
  halo.addColorStop(0, `hsla(${hue},100%,60%,${.16 * A})`); halo.addColorStop(1, `hsla(${hue},100%,50%,0)`);
  x.fillStyle = halo; x.fillRect(-s * 2.4, -h * .4 - s * 2.4, s * 4.8, s * 4.8);
  // tentacles
  const L = s * j.len, trail = -j.vy / (60 * DPR);
  x.lineCap = 'round';
  for (let i = 0; i < j.nt; i++) {
    const u = j.nt === 1 ? 0 : i / (j.nt - 1) * 2 - 1, x0 = u * w * .88;
    const g = x.createLinearGradient(0, 0, 0, L);
    g.addColorStop(0, `hsla(${hue + 20},100%,75%,${.55 * A})`); g.addColorStop(1, `hsla(${hue + 20},100%,60%,0)`);
    x.strokeStyle = g; x.lineWidth = Math.max(.6, s * .018);
    x.beginPath(); x.moveTo(x0, 0);
    for (let k = 1; k <= 22; k++) {
      const f = k / 22, yy = L * f * (1 - .25 * cnt) * (1 + trail * .1);
      x.lineTo(x0 * (1 - .35 * f) + Math.sin(t * 2.2 - k * .38 + i * 1.3 + j.ph * 9) * s * .18 * f, yy);
    }
    x.stroke();
  }
  // oral arms
  for (let i = 0; i < 4; i++) {
    const x0 = (i - 1.5) * w * .18;
    x.strokeStyle = `hsla(${hue - 20},100%,70%,${.22 * A})`; x.lineWidth = s * .07;
    x.beginPath(); x.moveTo(x0, -h * .05);
    for (let k = 1; k <= 12; k++) { const f = k / 12; x.lineTo(x0 + Math.sin(t * 1.6 - k * .5 + i * 2) * s * .12 * f, s * 1.5 * f * (1 - .2 * cnt)); }
    x.stroke();
  }
  // bell
  x.beginPath(); x.moveTo(-w, 0);
  x.bezierCurveTo(-w * 1.02, -h * 1.35, w * 1.02, -h * 1.35, w, 0);
  const sc = 9;
  for (let k = sc; k > 0; k--) { const xa = w - (2 * w) * (k - .5) / sc, xb = w - (2 * w) * k / sc; x.quadraticCurveTo(xa, s * .1 * (.6 + .4 * cnt), xb, 0); }
  x.closePath();
  const bell = x.createRadialGradient(0, -h * .7, s * .05, 0, -h * .3, s * 1.1);
  bell.addColorStop(0, `hsla(${hue},100%,85%,${.6 * A})`); bell.addColorStop(.6, `hsla(${hue},100%,60%,${.22 * A})`); bell.addColorStop(1, `hsla(${hue},100%,55%,${.08 * A})`);
  x.fillStyle = bell; x.fill();
  x.strokeStyle = `hsla(${hue},100%,80%,${.6 * A})`; x.lineWidth = Math.max(1, s * .025); x.stroke();
  // inner organs
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + t * .2;
    x.strokeStyle = `hsla(${hue + 40},100%,80%,${.45 * A})`; x.lineWidth = s * .03;
    x.beginPath(); x.ellipse(Math.cos(a) * w * .28, -h * .5 + Math.sin(a) * h * .12, s * .13, s * .07, a, 0, TAU); x.stroke();
  }
  // rim lights
  for (let i = 0; i <= 12; i++) { const u = i / 12 * 2 - 1, on = .5 + .5 * Math.sin(t * 4 + i * .9 + j.ph * 7); x.fillStyle = `hsla(${hue + 60},100%,85%,${on * .8 * A})`; x.beginPath(); x.arc(u * w * .98, s * .02, Math.max(.8 * DPR, s * .022), 0, TAU); x.fill(); }
  x.restore();
  x.globalCompositeOperation = 'source-over';
}

function frame(dt) {
  t += dt;
  x.drawImage(bg, 0, 0);
  drawRays();
  x.fillStyle = '#bfe6ff';
  for (const m of snow) {
    m.y += (6 + m.z * 10) * DPR * dt; m.x += Math.sin(t * .4 + m.ph) * 4 * DPR * dt;
    if (m.y > H) { m.y = -5; m.x = Math.random() * W; }
    x.globalAlpha = .12 + m.z * .3; const sz = (m.z * 1.8 + .4) * DPR; x.fillRect(m.x, m.y, sz, sz);
  }
  x.globalAlpha = 1;
  for (const j of jellies) drawJelly(j, dt);
  x.globalCompositeOperation = 'lighter';
  for (const p of plank) {
    p.x += Math.sin(t * .3 + p.ph) * 10 * DPR * dt; p.y += Math.cos(t * .25 + p.ph) * 8 * DPR * dt;
    const a = Math.max(0, Math.sin(t * p.sp + p.ph)); if (a < .05) continue;
    const r = 6 * DPR, g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, `rgba(140,255,240,${a * .9})`); g.addColorStop(1, 'rgba(140,255,240,0)');
    x.fillStyle = g; x.fillRect(p.x - r, p.y - r, r * 2, r * 2);
  }
  x.globalCompositeOperation = 'source-over';
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
