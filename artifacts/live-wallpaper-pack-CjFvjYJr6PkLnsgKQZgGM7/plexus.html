<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plexus Network</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#030611}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. plexus.html?hue=320&density=1.5 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  density: 1,   // number of nodes
  link: 150,    // max link distance in px
  hue: 195,     // base color hue (0-360)
  shift: 1,     // 1 = slowly cycle colors, 0 = fixed
  mouse: 1,     // 1 = nodes react to the cursor (enable mouse input in Lively)
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
let W, H, DPR, P = [], t = 0, mx = -1e9, my = -1e9;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  const n = Math.round(innerWidth * innerHeight / 11000 * CFG.density);
  P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: rand(-1, 1) * 18 * DPR, vy: rand(-1, 1) * 18 * DPR, r: rand(1, 2.4) * DPR, ph: Math.random() * 6 }));
}
addEventListener('mousemove', e => { mx = e.clientX * DPR; my = e.clientY * DPR; });
addEventListener('mouseleave', () => { mx = my = -1e9; });

function frame(dt) {
  t += dt;
  const hue = CFG.hue + (CFG.shift ? Math.sin(t * .05) * 60 : 0), L = CFG.link * DPR, L2 = L * L;
  const g = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, `hsl(${hue + 20},60%,9%)`); g.addColorStop(1, '#02030a');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (const p of P) {
    if (CFG.mouse) {
      const dx = mx - p.x, dy = my - p.y, d2 = dx * dx + dy * dy;
      if (d2 < L2 * 2 && d2 > 1) { const f = 30 * DPR / Math.sqrt(d2); p.vx += dx * f * dt * .4; p.vy += dy * f * dt * .4; }
    }
    const sp = Math.hypot(p.vx, p.vy), max = 40 * DPR;
    if (sp > max) { p.vx *= max / sp; p.vy *= max / sp; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    p.x = Math.max(0, Math.min(W, p.x)); p.y = Math.max(0, Math.min(H, p.y));
  }
  x.lineWidth = DPR;
  for (let i = 0; i < P.length; i++) {
    const a = P[i];
    for (let j = i + 1; j < P.length; j++) {
      const b = P[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 > L2) continue;
      const k = 1 - Math.sqrt(d2) / L;
      x.strokeStyle = `hsla(${hue + (a.x / W) * 60},90%,65%,${k * .55})`;
      x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
    }
    if (CFG.mouse) {
      const dx = a.x - mx, dy = a.y - my, d2 = dx * dx + dy * dy;
      if (d2 < L2 * 1.6) { x.strokeStyle = `hsla(${hue + 40},100%,75%,${(1 - Math.sqrt(d2 / (L2 * 1.6))) * .8})`; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(mx, my); x.stroke(); }
    }
  }
  x.globalCompositeOperation = 'lighter';
  for (const p of P) {
    const pulse = .7 + .3 * Math.sin(t * 2 + p.ph);
    x.fillStyle = `hsla(${hue + (p.x / W) * 60},100%,75%,${pulse})`;
    x.beginPath(); x.arc(p.x, p.y, p.r * (1 + pulse * .4), 0, 7); x.fill();
    x.fillStyle = `hsla(${hue + (p.x / W) * 60},100%,60%,.08)`;
    x.beginPath(); x.arc(p.x, p.y, p.r * 6, 0, 7); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
