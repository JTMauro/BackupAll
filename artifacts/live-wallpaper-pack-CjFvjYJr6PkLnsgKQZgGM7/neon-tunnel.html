<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Wormhole</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== SETTINGS — edit here, or add URL params, e.g. neon-tunnel.html?sides=4&speed=1.5 =====
const CFG = {
  fps: 60,
  pace: 0.5,        // overall animation speed: 1 = original, 0.5 = half speed, 0.25 = very calm
  speed: 1,     // flight speed
  sides: 6,     // ring shape: 3 = triangle, 4 = square, 6 = hexagon, 32 = circle
  twist: 1,     // how much the tunnel curves
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CFG) CFG[k] = typeof CFG[k] === 'number' ? +v : v;

// Lively Wallpaper "Customise" panel sends slider changes here
window.livelyPropertyListener = (name, val) => { if (name in CFG) CFG[name] = val; };

const c = document.getElementById('c'), x = c.getContext('2d');
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
let W, H, DPR, F, travel = 0, t = 0, dust = [];
const GAP = 40, N = 46, R = 100, ZMAX = GAP * N;

const offX = Z => (Math.sin(Z * .0021) * 160 + Math.sin(Z * .0047) * 70) * CFG.twist;
const offY = Z => (Math.cos(Z * .0017) * 110 + Math.sin(Z * .0039) * 50) * CFG.twist;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
  F = Math.max(W, H) * .32;
  dust = Array.from({ length: 300 }, () => ({ a: Math.random() * TAU, r: rand(.15, .95), z: Math.random() * ZMAX }));
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
}

function ringPts(Z, z) {
  const k = F / z, cx = W / 2 + (offX(Z) - offX(travel + 30)) * k, cy = H / 2 + (offY(Z) - offY(travel + 30)) * k;
  const rot = Z * .003 + t * .15, n = Math.max(3, CFG.sides | 0), pts = [];
  for (let i = 0; i < n; i++) { const a = rot + i / n * TAU; pts.push([cx + Math.cos(a) * R * k, cy + Math.sin(a) * R * k]); }
  return pts;
}

function frame(dt) {
  t += dt;
  const sp = 260 * CFG.speed * (1 + .35 * Math.sin(t * .2));
  travel += sp * dt;
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = 'rgba(0,0,0,.4)'; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'lighter';
  const first = Math.ceil(travel / GAP) * GAP;
  let prev = null;
  for (let i = N - 1; i >= 0; i--) {
    const Z = first + i * GAP, z = Z - travel; if (z < 8) continue;
    const pts = ringPts(Z, z), fade = Math.pow(1 - z / ZMAX, 1.6), hue = (Z * .12 + t * 25) % 360;
    const lw = Math.max(1, 3.2 * F / z * .06) * DPR;
    for (const pass of [[lw * 5, .1], [lw, .9]]) {
      x.strokeStyle = `hsla(${hue},100%,${pass[1] > .5 ? 65 : 55}%,${pass[1] * fade})`; x.lineWidth = pass[0];
      x.beginPath(); pts.forEach((p, k) => k ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.stroke();
    }
    if (prev) {
      x.strokeStyle = `hsla(${hue + 40},100%,60%,${.25 * fade})`; x.lineWidth = Math.max(1, lw * .5);
      x.beginPath(); for (let k = 0; k < pts.length; k++) { x.moveTo(prev[k][0], prev[k][1]); x.lineTo(pts[k][0], pts[k][1]); } x.stroke();
    }
    prev = pts;
  }
  // light dust streaming past
  for (const d of dust) {
    d.z -= sp * dt * 1.5; if (d.z < 5) { d.z = ZMAX; d.a = Math.random() * TAU; }
    const Z = travel + d.z, k = F / d.z;
    const px = W / 2 + (offX(Z) - offX(travel + 30) + Math.cos(d.a) * R * d.r) * k, py = H / 2 + (offY(Z) - offY(travel + 30) + Math.sin(d.a) * R * d.r) * k;
    const a = Math.min(1, (1 - d.z / ZMAX) * 1.4), s = Math.min(4, k * .02 + .6) * DPR;
    x.fillStyle = `rgba(255,255,255,${a})`; x.fillRect(px - s / 2, py - s / 2, s, s);
  }
  // glow at the far end
  const vx = W / 2 + (offX(travel + ZMAX) - offX(travel + 30)) * F / ZMAX, vy = H / 2 + (offY(travel + ZMAX) - offY(travel + 30)) * F / ZMAX;
  const g = x.createRadialGradient(vx, vy, 0, vx, vy, Math.min(W, H) * .25);
  g.addColorStop(0, `hsla(${(t * 25 + 180) % 360},100%,70%,.12)`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = 'source-over';
}

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / CFG.fps - 1) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt * CFG.pace);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
