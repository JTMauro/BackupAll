<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kessel Run Assets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed WebGL hangar, one glass control rail on the left that collapses to a bottom sheet on phones. */
  :root {
    color-scheme: dark;
    --void: #05070b;          /* scene clear / page */
    --glass: rgba(10, 16, 24, 0.74);
    --line: rgba(150, 190, 230, 0.16);
    --ink: #e4ecf5;
    --dim: #8b9bb0;
    --signal: #ffb347;        /* exhaust amber: the one accent */
    --signal-ink: #1a1006;
    --ok: #63d3a0;
    --font-display: "Chakra Petch", "Rajdhani", "Segoe UI", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .rail {
    position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    width: min(330px, calc(100% - 32px)); max-height: calc(100% - 28px); overflow-y: auto;
    background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 14px;
  }
  .rail h1 { margin: 0; font: 700 22px/1.05 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance; }
  .rail h1 span { color: var(--signal); }
  .sub { margin: 4px 0 0; color: var(--dim); font-size: 12.5px; line-height: 1.45; }
  .label { font: 500 11px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0 0 7px; }
  .ships { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .ships button, .fx button {
    font: 600 13px/1 var(--font-body); color: var(--ink); background: rgba(255,255,255,0.04);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; cursor: pointer; text-align: left;
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0;
  }
  .ships button small { font: 400 11px/1 var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .ships button[aria-pressed="true"] { border-color: var(--signal); background: rgba(255, 179, 71, 0.1); }
  .ships button:hover, .fx button:hover { background: rgba(255,255,255,0.08); }
  .fx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .fx button { justify-content: center; font-size: 12.5px; }
  .fx button.primary { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; font-size: 13px; }
  .row output { font: 500 12px/1 var(--font-mono); color: var(--signal); font-variant-numeric: tabular-nums; }
  .row input { grid-column: 1 / -1; width: 100%; accent-color: var(--signal); }
  .spec { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  .spec dt { color: var(--dim); font-family: var(--font-mono); }
  .spec dd { margin: 0; font-variant-numeric: tabular-nums; }
  .status { font: 400 11.5px/1.4 var(--font-mono); color: var(--dim); }
  .status b { color: var(--ok); font-weight: 500; }
  @media (max-width: 640px) {
    .rail { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-height: 46%; width: calc(100% - 32px); }
  }
  @media (prefers-reduced-motion: reduce) { .rail { backdrop-filter: none; } }
</style>

<canvas id="stage" aria-label="3D preview of the Kessel Run ships, terrain and effects"></canvas>

<aside class="rail" aria-label="Preview controls">
  <div>
    <h1>Kessel Run <span>assets</span></h1>
    <p class="sub">Procedural ships, terrain and effects for Three.js r160. Drag to orbit, scroll to zoom. Everything here is built by <code>kessel-assets.js</code>.</p>
  </div>
  <div>
    <p class="label">Ships</p>
    <div class="ships" id="ships">
      <button type="button" id="ship-lancer" data-ship="lancer" aria-pressed="false">Lancer <small id="tri-lancer">–</small></button>
      <button type="button" id="ship-kestrel" data-ship="kestrel" aria-pressed="false">Kestrel <small id="tri-kestrel">–</small></button>
      <button type="button" id="ship-starflare" data-ship="starflare" aria-pressed="false">Starflare <small id="tri-starflare">–</small></button>
      <button type="button" id="ship-all" data-ship="all" aria-pressed="true">All three <small>pad</small></button>
    </div>
  </div>
  <div class="row">
    <label for="throttle">Throttle</label><output id="throttle-out">0.80</output>
    <input id="throttle" type="range" min="0" max="1.5" step="0.01" value="0.8">
  </div>
  <div class="row">
    <label for="fold">Kestrel fold (0 flight, 1 landed)</label><output id="fold-out">0.00</output>
    <input id="fold" type="range" min="0" max="1" step="0.01" value="0">
  </div>
  <div>
    <p class="label">Effects</p>
    <div class="fx">
      <button type="button" id="fx-boom" class="primary">Explode</button>
      <button type="button" id="fx-laser">Lasers</button>
      <button type="button" id="fx-shield">Shield hit</button>
    </div>
  </div>
  <dl class="spec" id="spec">
    <dt>Length</dt><dd id="spec-len">–</dd>
    <dt>Triangles</dt><dd id="spec-tri">–</dd>
    <dt>Flames · guns</dt><dd id="spec-pts">–</dd>
  </dl>
  <p class="status" id="status">Loading Three.js r160…</p>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as K from './kessel-assets.js';

const $ = (id) => document.getElementById(id);
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 20000);
camera.position.set(-44, 30, 92);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(-20, 4, 0);
controls.maxPolarAngle = Math.PI * 0.49;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.backgroundBlurriness = 0;

// Sky, fog, light
const sunDir = new THREE.Vector3(0.55, 0.32, -0.77).normalize();
const sky = K.createSky(THREE, { sunDirection: sunDir });
scene.add(sky.mesh);
scene.fog = new THREE.FogExp2(sky.horizonColor.clone().multiplyScalar(0.92), 0.00022);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.copy(sunDir).multiplyScalar(260);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 10, far: 700 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbcd2ea, 0x4a4236, 0.25));

// Terrain: canyons radiating from a flat spaceport at the origin (a 3 km patch of the 12 km map)
const SIZE = 3200, SEG = 280;
const tGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
tGeo.rotateX(-Math.PI / 2);
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, y) => {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
const fbm = (x, y) => { let s = 0, a = 0.5; for (let i = 0; i < 6; i++) { s += a * vnoise(x, y); x = x * 2.03 + 11.7; y = y * 2.03 + 5.3; a *= 0.5; } return s; };
const heightAt = (x, z) => {
  const r = Math.hypot(x, z), th = Math.atan2(z, x);
  const hills = Math.pow(fbm(x * 0.0016, z * 0.0016), 1.6) * 760 + fbm(x * 0.008, z * 0.008) * 40;
  const canyon = Math.pow(Math.abs(Math.cos(th * 3 + fbm(x * 0.002, z * 0.002) * 1.4)), 0.35); // 6 canyons
  const floor = -30 + fbm(x * 0.01, z * 0.01) * 10;
  let h = floor + (hills - floor) * canyon;
  const pad = THREE.MathUtils.smoothstep(r, 120, 320);
  return THREE.MathUtils.lerp(0, h, pad);
};
const p = tGeo.attributes.position;
for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
tGeo.computeVertexNormals();
const terrain = new THREE.Mesh(tGeo, K.makeTerrainMaterial(THREE, { sandLevel: -14, snowLevel: 380 }));
terrain.receiveShadow = true;
scene.add(terrain);

const water = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), K.makeWaterMaterial(THREE));
water.rotation.x = -Math.PI / 2;
water.position.y = -19;
scene.add(water);

const lava = new THREE.Mesh(new THREE.CircleGeometry(150, 64), K.makeLavaMaterial(THREE));
lava.rotation.x = -Math.PI / 2;
lava.position.set(-520, heightAt(-520, 260) + 3, 260);
scene.add(lava);

// Spaceport pad
const pad = new THREE.Mesh(new THREE.CylinderGeometry(110, 112, 1.2, 96),
  new THREE.MeshStandardMaterial({ color: 0x3b3f45, roughness: 0.8, metalness: 0.2 }));
pad.position.y = -0.5;
pad.receiveShadow = true;
scene.add(pad);
for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(14, 14.3, 64), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.1, 0.75, 0.25) }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.set((i - 1) * 36, 0.12, 0);
  scene.add(ring);
}
scene.add(K.createCloudLayer(THREE, { altitude: 950, sunDirection: sunDir }));
const planet = K.createPlanet(THREE, { radius: 900 });
planet.object.position.set(-3200, 2600, -6500);
planet.setLight(sunDir);
scene.add(planet.object);

// Ships
const ships = {
  lancer: { s: K.buildLancer(THREE), at: new THREE.Vector3(-36, 6, 0), len: '24 m' },
  kestrel: { s: K.buildKestrel(THREE), at: new THREE.Vector3(0, 3.2, 0), len: '23 m' },
  starflare: { s: K.buildStarflare(THREE), at: new THREE.Vector3(38, 7, 0), len: '28 m' },
};
for (const [key, v] of Object.entries(ships)) {
  v.s.g.traverse((o) => { if (o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = 0.55; });
  v.s.g.position.copy(v.at);
  v.s.g.rotation.y = Math.PI * 0.12;
  scene.add(v.s.g);
  v.tris = K.triangleCount(v.s.g);
  $(`tri-${key}`).textContent = `${(v.tris / 1000).toFixed(1)}k △`;
}
const shield = K.createShield(THREE, { radius: 11, scale: [1, 0.55, 1.45] });
ships.starflare.s.g.add(shield.object);

// Post: bloom tuned like the game (threshold 0.82)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.45, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// UI
let focus = 'all';
const views = {
  all: { cam: new THREE.Vector3(-44, 30, 92), target: new THREE.Vector3(-20, 4, 0) },
  lancer: { cam: new THREE.Vector3(-58, 13, 24), target: new THREE.Vector3(-36, 6, 0) },
  kestrel: { cam: new THREE.Vector3(-20, 11, 28), target: new THREE.Vector3(0, 3, 0) },
  starflare: { cam: new THREE.Vector3(14, 14, 36), target: new THREE.Vector3(38, 7, 0) },
};
let camTween = null;
function setFocus(key) {
  focus = key;
  document.querySelectorAll('#ships button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ship === key)));
  const v = views[key];
  camTween = { from: camera.position.clone(), to: v.cam, tFrom: controls.target.clone(), tTo: v.target, t: 0 };
  if (key === 'all') {
    const total = Object.values(ships).reduce((a, s) => a + s.tris, 0);
    $('spec-len').textContent = '24 m · 23 m · 28 m';
    $('spec-tri').textContent = `${total.toLocaleString()} total`;
    $('spec-pts').textContent = Object.values(ships).map((s) => `${s.s.flames.length}·${s.s.guns.length}`).join('  ');
  } else {
    const s = ships[key];
    $('spec-len').textContent = s.len;
    $('spec-tri').textContent = `${s.tris.toLocaleString()} (limit 60,000)`;
    $('spec-pts').textContent = `${s.s.flames.length} flame${s.s.flames.length > 1 ? 's' : ''} · ${s.s.guns.length} muzzle${s.s.guns.length > 1 ? 's' : ''}`;
  }
}
document.querySelectorAll('#ships button').forEach((b) => b.addEventListener('click', () => setFocus(b.dataset.ship)));
setFocus('all');

let throttle = 0.8;
$('throttle').addEventListener('input', (e) => { throttle = +e.target.value; $('throttle-out').textContent = throttle.toFixed(2); });
$('fold').addEventListener('input', (e) => { ships.kestrel.s.applyFold(+e.target.value); $('fold-out').textContent = (+e.target.value).toFixed(2); });

const live = [];
const v3 = new THREE.Vector3();
function boom() {
  const key = focus === 'all' ? 'lancer' : focus;
  const ex = K.createExplosion(THREE, { size: 9 });
  ex.object.position.copy(controls.target).add(new THREE.Vector3(6, 14, -38));
  scene.add(ex.object);
  live.push({ kind: 'ex', ex });
}
function lasers() {
  for (const v of Object.values(ships)) {
    v.s.g.updateMatrixWorld();
    for (const gp of v.s.guns) {
      const bolt = K.createLaserBolt(THREE, { color: v === ships.starflare ? [0.5, 0.4, 1.0] : [1.0, 0.2, 0.12] });
      bolt.position.copy(v.s.g.localToWorld(v3.copy(gp)));
      bolt.quaternion.copy(v.s.g.quaternion);
      scene.add(bolt);
      live.push({ kind: 'bolt', bolt, dir: new THREE.Vector3(0, 0, -1).applyQuaternion(v.s.g.quaternion), age: 0 });
    }
  }
}
function shieldHit() {
  const g = ships.starflare.s.g;
  const local = new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 0.8, -1).normalize().multiplyScalar(11);
  shield.hit(local, true);
}
$('fx-boom').addEventListener('click', boom);
$('fx-laser').addEventListener('click', lasers);
$('fx-shield').addEventListener('click', shieldHit);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
let autoT = 0, lastFx = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  K.updateKesselAssets(t);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.4);
    const e = camTween.t * camTween.t * (3 - 2 * camTween.t);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.tFrom, camTween.tTo, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  for (const v of Object.values(ships)) {
    const flicker = throttle * (0.94 + 0.06 * Math.sin(t * 31 + v.at.x));
    v.s.flames.forEach((f) => { f.scale.z = Math.max(0.001, flicker); f.visible = throttle > 0.02; });
    v.s.update?.(dt);
    if (!reduce && v !== ships.kestrel) v.s.g.position.y = v.at.y + Math.sin(t * 0.9 + v.at.x) * 0.35;
  }
  shield.update(dt);
  // a little life without clicks
  if (!reduce && !window.__noAutoFx && t > 5 && t - lastFx > 4.5) { lastFx = t; autoT++; (autoT % 3 === 0 ? boom : autoT % 3 === 1 ? shieldHit : lasers)(); }
  for (let i = live.length - 1; i >= 0; i--) {
    const L = live[i];
    if (L.kind === 'ex') {
      if (!L.ex.update(dt, camera)) { scene.remove(L.ex.object); L.ex.dispose(); live.splice(i, 1); }
    } else {
      L.age += dt; L.bolt.position.addScaledVector(L.dir, 260 * dt);
      if (L.age > 1.2) { scene.remove(L.bolt); live.splice(i, 1); }
    }
  }
  composer.render();
});
$('status').innerHTML = `<b>Running</b> · three r${THREE.REVISION} · bloom 0.82 · ACES`;
window.__kessel = { ships: Object.fromEntries(Object.entries(ships).map(([k, v]) => [k, v.tris])), K, scene, renderer };
</script>

</body></html>
