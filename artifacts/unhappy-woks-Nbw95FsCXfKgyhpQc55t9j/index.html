<style>
/* Layout: full-bleed 3D canvas, thin HUD strip on top, modal cards for menus and results. One committed dark look. */
:root{
  --bg:#0e1712;
  --ink:#fff4df;
  --ink-dim:#d9c7a7;
  --panel:rgba(24,20,14,.8);
  --panel-edge:rgba(255,226,170,.18);

  --display:'Luckiest Guy','Arial Black',Impact,sans-serif;

  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}
.overlay,.hud,.ability,.hint{user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none;cursor:grab}
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:6px 14px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;min-width:60px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:800;white-space:nowrap}
.chip b{font-family:var(--display);font-size:24px;line-height:1.05;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.spacer{flex:1}
.btn{pointer-events:auto;font:800 14px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--panel-edge);border-radius:12px;padding:12px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.btn:hover{border-color:var(--amber)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ability{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:10px 14px;max-width:min(320px,calc(100vw - 28px));display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px)}
.sw{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset -4px -5px 0 rgba(0,0,0,.35),0 0 0 3px var(--hood,#333)}
.ability strong{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.03em}
.ability span{display:block;font-size:13px;color:var(--ink-dim);font-weight:600}
.ability.used{opacity:.55}
.hint{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-weight:800;font-size:13px;color:var(--ink-dim);text-shadow:0 1px 3px #000;max-width:46vw;text-align:right}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(10,14,10,.35),rgba(6,8,6,.75));padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:5}
.card{background:linear-gradient(180deg,#2c2418,#1b160f);border:1px solid var(--panel-edge);border-radius:22px;padding:26px 24px 24px;max-width:540px;width:100%;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;max-height:calc(100vh - 40px);overflow:auto}
.card.wide{max-width:780px}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.03em;text-wrap:balance;color:var(--amber);text-shadow:0 3px 0 #6b3a12}
.card h1{font-size:clamp(40px,9vw,64px);line-height:1}
.card h2{font-size:clamp(28px,6vw,42px);line-height:1.05}
.card p{color:var(--ink-dim);font-weight:600;line-height:1.5;margin:12px auto 0;max-width:46ch}
.card .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--moss);font-weight:900;margin-bottom:6px}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 6px}
.roster div{background:rgba(255,255,255,.04);border:1px solid var(--panel-edge);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;align-items:center}

.wcard{border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;cursor:pointer;background:var(--sw);text-shadow:0 1px 3px rgba(0,0,0,.7);font-family:var(--body);text-align:left;position:relative;overflow:hidden}
.wcard:hover{border-color:var(--amber);transform:translateY(-2px)}
.wcard b{font-family:var(--display);font-weight:400;font-size:17px;overflow-wrap:anywhere;letter-spacing:.03em;line-height:1.05}

.lv b{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,30px)}
.lv span{font-size:13px;letter-spacing:1px;color:#5a4a33}
.lv span .on{color:var(--amber)}
.lv:disabled{opacity:.35;cursor:not-allowed}
.float{position:fixed;left:0;top:0;font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 #6b3a12,0 0 10px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;z-index:3}
.float.big{color:var(--amber);font-size:28px}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:8px 12px 10px;backdrop-filter:blur(6px);pointer-events:none;z-index:2;box-sizing:border-box}
#bossbar .bn{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-size:18px;letter-spacing:.03em;color:#ff8a6a}
#bossbar .bn small{font-family:var(--body);font-weight:800;font-size:12px;color:var(--ink-dim);align-self:center}
#bossbar .track{height:12px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,.12)}
#bossbar .fill{height:100%;width:100%;background:linear-gradient(90deg,#ff3a2a,#ffb03a);transition:width .25s ease;border-radius:8px}
.lv.boss{border-color:rgba(255,110,80,.6);background:linear-gradient(180deg,rgba(255,90,60,.22),rgba(255,90,60,.06))}
.lv.boss small{font-size:10px;letter-spacing:.14em;font-weight:900;color:#ff8a6a}

.gang{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px;text-align:left}
.gcard{background:rgba(255,255,255,.04);border:1px solid var(--panel-edge);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}

.tags{display:flex;gap:6px;flex-wrap:wrap}

.pic{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,220,160,.22),rgba(255,220,160,0) 70%)}

.setlist{display:flex;flex-direction:column;gap:14px;margin-top:20px;text-align:left}

.setrow label{font-weight:800;font-size:15px}

.setrow input[type=range]{width:100%;accent-color:#f2a93b;height:28px;min-width:0}
.setrow.toggle{grid-template-columns:1fr auto}
.switch{font:800 14px/1 var(--body);border-radius:999px;padding:10px 16px;border:1px solid var(--panel-edge);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;min-width:84px}

body.trailer .hud,body.trailer .ability,body.trailer .hint,body.trailer #bossbar,body.trailer #demoCap,body.trailer .rotate{display:none!important}
#trCap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);text-align:center;pointer-events:none;z-index:4;padding:0 16px}
#trCap b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,6.4vw,76px);letter-spacing:.04em;color:#fff;text-shadow:0 4px 0 #6b3a12,0 0 30px rgba(0,0,0,.6);line-height:1}

#trLogo b{font-family:var(--display);font-weight:400;font-size:clamp(48px,11vw,150px);line-height:.95;color:var(--amber);letter-spacing:.03em;text-shadow:0 7px 0 #6b3a12,0 0 40px rgba(0,0,0,.6);animation:trpop .6s cubic-bezier(.2,1.6,.4,1) both}

#trLogo small{font-family:var(--body);font-weight:900;font-size:clamp(12px,1.6vw,18px);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);animation:trpop .5s .7s both}
#trSkip{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);z-index:6}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}

.pbtn{border-radius:12px;border:1px solid var(--panel-edge);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font:800 13px/1.1 var(--body);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}

function canvasTex(w,h,draw,srgb=true){

function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

function strokes(x,w,h,n,base,len,ang,spread,alpha){

    '#include <begin_vertex>\n float hh=clamp(position.y/0.6,0.,1.);\n vec3 ip=vec3(0.);\n #ifdef USE_INSTANCING\n ip=vec3(instanceMatrix[3]);\n #endif\n transformed.x+=sin(uWind*1.7+ip.x*.55+ip.z*.35)*.1*hh*hh;\n transformed.z+=cos(uWind*1.3+ip.x*.3)*.05*hh*hh;');};

const TERRAIN_IDS=['forest','ice','desert','station','peaks','lava','swamp','clouds','ocean','temple'];
const texLoader=new THREE.TextureLoader(),terrCache={};
function terrTex(file,srgb,cb){
  if(terrCache[file]){cb(terrCache[file]);return;}
  const url=(window.TERRAIN_PACK&&window.TERRAIN_PACK[file])||('terrain/'+file);
  texLoader.load(url,t=>{if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;terrCache[file]=t;cb(t);},undefined,()=>{});
}

const MODEL_CACHE={};
function b64buf(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function loadModel(name){
  if(MODEL_CACHE[name])return MODEL_CACHE[name];
  return MODEL_CACHE[name]=(window.MODEL_PACK&&window.MODEL_PACK[name]?Promise.resolve(window.MODEL_PACK[name]):fetch('trees/'+name+'.glb.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>j.glb_base64))
    .then(b64=>new Promise((res,rej)=>{if(!THREE.GLTFLoader)return rej(0);new THREE.GLTFLoader().parse(b64buf(b64),'',g=>{
      const root=g.scene;root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const ms=Array.isArray(o.material)?o.material:[o.material];
        ms.forEach(m=>{if(m.map)m.map.anisotropy=maxAniso;if(m.alphaTest>0||m.transparent){m.alphaTest=Math.max(m.alphaTest,.45);m.transparent=false;}});}});
      const box=new THREE.Box3().setFromObject(root);root.userData.h=box.max.y;res(root);},rej);}))
    .catch(()=>null);
}

const FLORA={
  0:[['tree_forest_conifer',16,.85,1.2,[-40,70],[-30,-10],1],['tree_forest_broadleaf',20,.8,1.15,[-40,70],[-26,-9],1],['plant_fern',70,.8,1.5,[-14,46],[-8,-2.2],0],['plant_fern',30,.9,1.6,[-16,-6],[-2,5],0]],

const GIANTS=[[-26,-38,3.2],[-6,-52,4],[12,-34,2.6],[34,-46,3.6],[52,-30,2.4],[70,-55,4.2],[-40,-24,2.2],[44,-70,5]];
function applyTrees(wi){
  const list=(FLORA[wi]||[]).slice();if(wi===0)list.push(['tree_forest_giant',0]);
  if(!list.length)return;
  const names=[...new Set(list.map(l=>l[0]))];
  Promise.all(names.map(loadModel)).then(models=>{
    if(curWorld!==wi)return;const M2={};names.forEach((n,i)=>M2[n]=models[i]);
    if(names.some(n=>!M2[n]))return;           // keep the simple trees if anything failed
    env.traverse(o=>{if(o.userData.ptree)o.visible=false;});
    const r=mulberry(wi*977+5),put=(name,x,z,sc,cast)=>{const m=M2[name].clone();m.position.set(x,0,z);m.rotation.y=r()*6.283;m.scale.setScalar(sc);
      m.traverse(o=>{if(o.isMesh)o.castShadow=!!cast&&z>-22;});env.add(m);};
    for(const L of list){if(!L[1])continue;const [name,n,s0,s1,[x0,x1],[z0,z1],cast]=L;for(let i=0;i<n;i++)put(name,x0+r()*(x1-x0),z0+r()*(z1-z0),s0+r()*(s1-s0),cast);}
    if(wi===0)for(const [x,z,R] of GIANTS)put('tree_forest_giant',x,z,R/1.9,0);
  });
}

const glowTex=canvasTex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);});
const PN=280,pPos=new Float32Array(PN*3),pSeed=[];
for(let i=0;i<PN;i++)pSeed.push([rand(-30,62),rand(0,18),rand(-20,7),Math.random()*100,rand(.6,1.4)]);
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({map:glowTex.t,size:.5,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(pGeo,pMat);pts.frustumCulled=false;scene.add(pts);let pMode='float',baseHemi=.55,flash=0;
function updateParticles(t){
  for(let i=0;i<PN;i++){const s=pSeed[i],o=i*3;let x=s[0],y=s[1],z=s[2];
    if(pMode==='float'){x+=Math.sin(t*.4+s[3])*1.5;y=.6+s[1]*.6+Math.sin(t*.7+s[3]*2)*.6;z+=Math.cos(t*.3+s[3])*1.2;}
    else if(pMode==='snow'){y=18-((t*1.2*s[4]+s[3])%18);x+=Math.sin(t*.8+s[3])*1.2;}
    else if(pMode==='rain'){y=18-((t*16*s[4]+s[3]*3)%18);x-=((t*16*s[4]+s[3]*3)%18)*.25;}
    else if(pMode==='embers'){y=((t*1.6*s[4]+s[3])%16);x+=Math.sin(t*.9+s[3])*1.5;}
    else if(pMode==='dust'){x=-30+((s[0]+30+t*1.5*s[4])%92);y=.3+s[1]*.5+Math.sin(t+s[3])*.3;}
    pPos[o]=x;pPos[o+1]=y;pPos[o+2]=z;}
  pGeo.attributes.position.needsUpdate=true;pMat.opacity=pMode==='float'?.6+Math.sin(t*2)*.3:.8;
}

let curMusic=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function stopMusic(){if(curMusic&&ac){curMusic.gain.setTargetAtTime(0,ac.currentTime,.12);curMusic=null;}}
function celebrate(){
  if(!ok())return;stopMusic();const out=ac.createGain();out.gain.value=1;out.connect(musicBus);curMusic=out;
  if(playSfx('victory',1,1,out))return;
  const b=60/152;

  const pipe=(m,t,d)=>voice({type:'square',f:[[0,mtof(m)],[1,mtof(m)]],dur:d,vol:.025,att:.01,hold:.6,delay:t,out});
  const logd=(m,t,v)=>voice({type:'sine',f:[[0,mtof(m)*1.7],[.12,mtof(m)],[1,mtof(m)*.96]],dur:.32,vol:v||.2,att:.003,hold:.05,delay:t,out});
  const kick=t=>voice({type:'sine',f:[[0,150],[1,42]],dur:.28,vol:.32,att:.003,hold:.05,delay:t,out});

  /* melody in D major pentatonic, 16 beats */
  const mel=[[0,74,.5],[.5,76,.5],[1,78,1],[2,81,.5],[2.5,78,.5],[3,76,1],[4,74,.5],[4.5,76,.5],[5,78,.5],[5.5,81,.5],[6,83,1.5],
             [8,81,.5],[8.5,78,.5],[9,76,.5],[9.5,78,.5],[10,74,1],[11,69,1],[12,74,.5],[12.5,78,.5],[13,81,.5],[13.5,83,.5],[14,86,2]];
  mel.forEach(([bt,m,d])=>{flute(m,bt*b,d*b*.95);pipe(m-12,bt*b,d*b*.9);});
  for(let bar=0;bar<4;bar++){const o=bar*4*b;
    [[0,50],[.75,50],[1.5,57],[2,50],[2.75,54],[3.5,57]].forEach(([bt,m])=>logd(m,o+bt*b));

  const kids=ORDER.slice();

}

const MAXPULL=3,MAXSPEED=25;
let drag=null;const pull=new THREE.Vector3();
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(demo||trailer)return;
  if(state==='aim'&&current){drag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}state='drag';tone(180,240,.12,'sine',.08);}
  else if(state==='fly'&&!abilityUsed&&flying.length)useAbility();
});
cv.addEventListener('pointermove',e=>{
  if(state!=='drag'||!drag)return;
  const px=Math.min(innerHeight*.24,170);
  pull.set(-(e.clientX-drag.x)/px*MAXPULL,(e.clientY-drag.y)/px*MAXPULL,0);
  const L=Math.min(pull.length(),MAXPULL),a=THREE.MathUtils.clamp(Math.atan2(-pull.y,-pull.x),-.3,1.45);
  pull.set(-Math.cos(a)*L,-Math.sin(a)*L,0);
});
function release(){
  if(state!=='drag')return;drag=null;
  if(pull.length()<.45){pull.set(0,0,0);state='aim';return;}
  const v=pull.clone().multiplyScalar(-MAXSPEED/MAXPULL),pos=current.mesh.position.clone();
  const muzzle=bow.localToWorld(new THREE.Vector3(2.55,-.45,0));burst(muzzle,'#ff6040',12,.08,6,{glow:true});playSfx('launch',.9,.95+Math.random()*.1)||tone(1500,180,.22,'square',.07);
  const body=critterBody(current.kid,pos,v);
  const o={kind:'critter',kid:current.kid,body,mesh:current.mesh,dmg:false};
  objects.push(o);W.addBody(body);flying=[o];critterEars(o);SCREAM[o.kid]();
  current=null;pull.set(0,0,0);state='fly';flyT=0;
  
  $('hint').textContent='Tap anywhere to use the power';
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.key==='Escape'&&trailer){endTrailer();return;}if(e.key==='Escape'&&$('setDone')){$('setDone').click();return;}if(e.code==='Space'&&state==='fly'&&!abilityUsed&&flying.length){e.preventDefault();useAbility();}});

function critterEars(o){o.body.addEventListener('collide',e=>{const iv=Math.abs(e.contact.getImpactVelocityAlongNormal());if(iv<4)return;
  if(e.body===groundBody){if(gate('gnd',120))hiss({type:'lowpass',freq:180,dur:.25,vol:Math.min(.45,iv/30)});}
  if(!o.oofed&&gate('oof',150)){o.oofed=true;oof(o.kid);}});}
function useAbility(){
  const o=flying[0];if(!o||o.dead)return;abilityUsed=true;showAbility(o.kid,true);$('hint').textContent='';
  const v=o.body.velocity,p=o.mesh.position.clone();(playSfx(o.kid+'_power')||POWER[o.kid]());
  if(o.kid==='bramble'){const n=Math.hypot(v.x,v.y)||1,sp=Math.max(n*1.7,24);v.set(v.x/n*sp,v.y/n*sp,0);burst(p,'#7dbb5e',12,.12,4);}
  else if(o.kid==='soot'){const sp=Math.hypot(v.x,v.y),a=Math.atan2(v.y,v.x);
    for(const d of [-.24,.24]){const b=critterBody('soot',p,{x:Math.cos(a+d)*sp,y:Math.sin(a+d)*sp});const m=makeCritter('soot');m.position.copy(p);scene.add(m);
      const c={kind:'critter',kid:'soot',body:b,mesh:m,dmg:false};objects.push(c);W.addBody(b);flying.push(c);critterEars(c);}
    poof(p,.5);}
  else if(o.kid==='ash'){o.body.mass=9;o.body.updateMassProperties();v.set(v.x*.25,-30,0);burst(p,'#cfd3d6',10,.1,3);}
  else if(o.kid==='pip'){const R=7;
    for(const t of objects){if(t.dead||t.kind==='critter')continue;const b=t.body,dx=b.position.x-p.x,dy=b.position.y-p.y,d=Math.hypot(dx,dy);
      if(d>R||d<.01)continue;const f=16*(1-d/R)/Math.max(1,b.mass*.6);if(b.wakeUp)b.wakeUp();b.velocity.x+=dx/d*f;b.velocity.y+=dy/d*f+2;b.angularVelocity.z+=rand(-4,4);}
    burst(p,'#7dbb5e',26,.13,9);burst(p,'#c9b8ee',10,.06,6,{glow:true});poof(p,.9);shake=Math.max(shake,.2);}
  else if(o.kid==='thornback'){o.body.mass=14;o.body.updateMassProperties();v.set(26,Math.min(v.y,1),0);burst(p,'#8a4f2a',16,.12,5);shake=Math.max(shake,.3);}
}

/* ================= bruises and health bars ================= */
const dentMat=new THREE.MeshStandardMaterial({color:col('#1e1a18'),roughness:.9,metalness:.3});
const dentGeo=new THREE.SphereGeometry(1,10,8);
const barBg=new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:.75,depthTest:false});
function bruise(o,hit){
  const u=o.mesh.userData,f=Math.max(0,o.hp/o.hpMax);
  if(u.skin){u.skin.color.copy(u.base).lerp(col('#3a2a20'),(1-f)*.7);u.skin.roughness=.35+(1-f)*.5;}
  if(hit&&u.g&&(u.dents||0)<7){u.dents=(u.dents||0)+1;const r=o.size,a=Math.random()*6.283,yy=(Math.random()-.3)*r*.8,rr=Math.sqrt(Math.max(.01,r*r-yy*yy))*.98;
    const d=new THREE.Mesh(dentGeo,dentMat);d.scale.set(r*.18,r*.12,r*.06);d.position.set(Math.cos(a)*rr,yy,Math.sin(a)*rr);d.lookAt(0,yy,0);u.g.add(d);
    burst(o.mesh.position.clone().add(new THREE.Vector3(0,r*.3,0)),'#ffb347',6,.05,4,{glow:true});}
  if(u.antenna&&f<.55)u.antenna.rotation.z=-.2-(1-f)*1.3;
  if(!o.bar){const g=new THREE.Group(),bg=new THREE.Mesh(new THREE.PlaneGeometry(1,.14),barBg),fill=new THREE.Mesh(new THREE.PlaneGeometry(.94,.09),new THREE.MeshBasicMaterial({color:0x7dbb5e,depthTest:false}));
    fill.position.z=.001;bg.renderOrder=20;fill.renderOrder=21;g.add(bg,fill);g.userData.fill=fill;scene.add(g);o.bar=g;}
  const fl=o.bar.userData.fill;fl.scale.x=Math.max(.001,f);fl.position.x=-(1-f)*.47;fl.material.color.copy(col(f>.6?'#7dbb5e':f>.3?'#f2a93b':'#e0533d'));
}
function updateBruised(dt){
  for(const o of objects){if(o.dead||o.kind!=='bot'||o.boss||!o.bar)continue;
    o.bar.position.copy(o.body.position);o.bar.position.y+=o.size*2.1;o.bar.quaternion.copy(camera.quaternion);
    const f=o.hp/o.hpMax;if(f<.5&&Math.random()<dt*(f<.25?7:3))burst(o.mesh.position.clone().add(new THREE.Vector3(rand(-.2,.2),o.size*.8,0)),'#4a4542',1,.22,1.2,{smoke:true});}
}

  if(levelClock<1.3||state==='menu')return;
  const byId=new Map();for(const o of objects)if(!o.dead)byId.set(o.body.id,o);
  const below=new Map(),above=new Map();
  const link=(top,bot)=>{if(!below.has(top))below.set(top,new Set());below.get(top).add(bot);if(!above.has(bot))above.set(bot,new Set());above.get(bot).add(top);};
  for(const c of W.contacts){const a=c.bi,b=c.bj,ny=c.ni.y;if(ny>.45)link(b,a);else if(ny<-.45)link(a,b);}
  const supports=b=>Math.max(1,(below.get(b)||{size:1}).size);
  const memo=new Map();
  const carried=(b,depth)=>{if(memo.has(b))return memo.get(b);let m=b.mass;if(depth<4){const up=above.get(b);if(up)for(const u of up)if(u.mass>0)m+=carried(u,depth+1)/supports(u);}memo.set(b,m);return m;};
  for(const o of objects){
    if(o.dead||o.kind!=='bot'||o.boss)continue;
    const up=above.get(o.body);let load=0;
    if(up)for(const u of up){if(u.mass===0)continue;const uo=byId.get(u.id);if(uo&&uo.kind==='bot')continue;load+=carried(u,0)/supports(u);}
    const lim=CRUSH_KG[o.bk]||1;
    if(load>lim){o.crush=(o.crush||0)+dt;o.hurt=.3;if(o.crush>.25){o.hp-=(load/lim)*dt*2.6*(o.hpMax||1);bruise(o,false);if(o.hp<=0)removeQ.add(o);}}
    else o.crush=Math.max(0,(o.crush||0)-dt*2);
  }
}

/* ================= hover labels: names of Woks and bots under the mouse ================= */
const hoverRay=new THREE.Raycaster(),hoverNdc=new THREE.Vector2();
function hoverTargets(){const list=[];
  queueMeshes.forEach(m=>list.push([m,{kid:m.userData.kid}]));
  if(current)list.push([current.mesh,{kid:current.kid}]);
  for(const o of objects){if(o.dead)continue;if(o.kind==='critter')list.push([o.mesh,{kid:o.kid}]);else if(o.kind==='bot')list.push([o.mesh,{bot:o}]);}
  return list;}
function hoverAt(e){
  const tip=$('tip');
  if(e.pointerType!=='mouse'||state==='menu'||state==='drag'||trailer||!$('ov').hidden||ptrs.size>1){tip.hidden=true;return;}
  const r=cv.getBoundingClientRect();hoverNdc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);hoverRay.setFromCamera(hoverNdc,camera);
  const list=hoverTargets(),hits=hoverRay.intersectObjects(list.map(l=>l[0]),true);
  if(!hits.length){tip.hidden=true;cv.style.cursor='';return;}
  let o=hits[0].object;const roots=new Map(list);while(o&&!roots.has(o))o=o.parent;if(!o){tip.hidden=true;return;}
  const info=roots.get(o);let html;
  if(info.kid){const k=KINDS[info.kid];html=`<b>${k.name}</b>${k.power} · ${k.desc.replace(/^(Tiny|Heavy|Huge)\. /,'')}`;}
  else{const b=info.bot,f=Math.max(0,b.hp/(b.hpMax||1));html=b.boss?`<b>${BOSSES[curWorld].name}</b>Boss · ${Math.ceil(f*100)}% health`:`<b>${b.bk==='sentry'?'Sentry':'Tinkbot'}</b>${Math.ceil(f*100)}% health`;}
  tip.innerHTML=html;tip.hidden=false;cv.style.cursor='help';
  const x=Math.min(e.clientX+16,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-12);tip.style.transform=`translate(${x}px,${y}px)`;
}
let hoverRaf=0,lastHover=null;
cv.addEventListener('pointermove',e=>{lastHover=e;if(!hoverRaf)hoverRaf=requestAnimationFrame(()=>{hoverRaf=0;if(lastHover)hoverAt(lastHover);});});
cv.addEventListener('pointerleave',()=>{$('tip').hidden=true;});
cv.addEventListener('pointerdown',()=>{$('tip').hidden=true;cv.style.cursor='';});

/* ================= view controls ================= */
const ptrs=new Map();let pinch=null,panDrag=null;
const zoomBy=f=>{camZoom=THREE.MathUtils.clamp(camZoom*f,.4,1.9);};
const worldPerPx=()=>2*Math.max(6,camPos.distanceTo(camLook))*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))/innerHeight;
function fitView(){camZoom=1;camPan.set(0,0);}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{if(trailer)return;e.preventDefault();zoomBy(Math.exp(e.deltaY*.0012));},{passive:false});
cv.addEventListener('pointerdown',e=>{
  if(trailer)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.button===1||e.button===2){panDrag={id:e.pointerId,x:e.clientX,y:e.clientY,px:camPan.x,py:camPan.y};e.stopImmediatePropagation();return;}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];
    if(state==='drag'){state='aim';drag=null;pull.set(0,0,0);}
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:camZoom,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,px:camPan.x,py:camPan.y};e.stopImmediatePropagation();}
},true);
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(panDrag&&panDrag.id===e.pointerId){const k=worldPerPx();camPan.set(panDrag.px-(e.clientX-panDrag.x)*k,panDrag.py+(e.clientY-panDrag.y)*k);e.stopImmediatePropagation();return;}
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()],dd=Math.hypot(a.x-b.x,a.y-b.y)||1,k=worldPerPx();
    camZoom=THREE.MathUtils.clamp(pinch.z0*pinch.d0/dd,.4,1.9);camPan.set(pinch.px-((a.x+b.x)/2-pinch.mx)*k,pinch.py+((a.y+b.y)/2-pinch.my)*k);e.stopImmediatePropagation();}
},true);
const ptrUp=e=>{ptrs.delete(e.pointerId);if(panDrag&&panDrag.id===e.pointerId){panDrag=null;e.stopImmediatePropagation();}if(ptrs.size<2&&pinch){pinch=null;e.stopImmediatePropagation();}};
cv.addEventListener('pointerup',ptrUp,true);cv.addEventListener('pointercancel',ptrUp,true);
$('zIn').addEventListener('click',()=>zoomBy(1/1.25));$('zOut').addEventListener('click',()=>zoomBy(1.25));$('zFit').addEventListener('click',fitView);
addEventListener('keydown',e=>{if(trailer||!$('ov').hidden)return;const k=worldPerPx()*60;
  if(e.key==='+'||e.key==='=')zoomBy(1/1.2);else if(e.key==='-'||e.key==='_')zoomBy(1.2);else if(e.key==='0')fitView();
  else if(e.key==='ArrowLeft')camPan.x-=k;else if(e.key==='ArrowRight')camPan.x+=k;else if(e.key==='ArrowUp')camPan.y+=k;else if(e.key==='ArrowDown')camPan.y-=k;else return;e.preventDefault();});

/* ================= camera ================= */
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),tPos=new THREE.Vector3(),tLook=new THREE.Vector3();
let camZoom=1;const camPan=new THREE.Vector2();
function liveExtent(){let r=extent.r,t=extent.t;for(const o of objects){if(o.dead||o.kind==='critter')continue;const p=o.body.position;if(Math.abs(p.x)>85||p.y<-2)continue;const sz=o.size||1;r=Math.max(r,p.x+sz);t=Math.max(t,p.y+sz);}return {r:Math.min(r,80),t:Math.min(t,30)};}
function overview(){
  const a=camera.aspect,t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),lx=liveExtent();
  const L=extent.l-1,R=lx.r+2.5,cx=(L+R)/2,half=(R-L)/2,top=Math.max(7,lx.t+2.5);
  if(a<1){const d=Math.min(Math.max(half*.85/(t*a),top*.62/t),70),vis=d*t*a;return {x:Math.min(cx,L+vis*.95),y:top*.48,d};}
  const d=Math.min(Math.max(half/(t*a),top*.62/t),80);
  return {x:cx,y:top*.48,d};
}
function snapCamera(){const o=overview();camPos.set(o.x-2.5,o.y+3,o.d);camLook.set(o.x,o.y-.6,0);}
function updateCamera(dt){
  if(trailer){trailerCam(dt);return;}
  const ov=overview();let x=ov.x,y=ov.y,d=ov.d;
  if(state==='fly'&&flying[0]&&!flying[0].dead){const p=flying[0].mesh.position;x=THREE.MathUtils.clamp(p.x,ov.x-4,liveExtent().r);y=Math.max(ov.y,p.y*.75+2);d=Math.max(ov.d*.75,18);}
  d=Math.min(110,Math.max(7,d*camZoom));x+=camPan.x;y=Math.max(1.5,y+camPan.y);
  tLook.set(x,y-.6,0);tPos.set(x-2.5,y+3,d);
  const k=1-Math.exp(-dt*2.6);camPos.lerp(tPos,k);camLook.lerp(tLook,k);
  camera.position.copy(camPos);
  if(shake>0&&!reduceMotion){camera.position.x+=rand(-1,1)*shake;camera.position.y+=rand(-1,1)*shake;shake=Math.max(0,shake-dt*1.2);}
  camera.lookAt(camLook);
}

/* ================= loop ================= */
const clock=new THREE.Clock();let time=0;
const pp=new THREE.Vector3();
function frame(){
  const dt=window.__fixedDt||Math.min(clock.getDelta(),1/30);time+=dt;levelClock+=dt;trailerTick(dt);
  demoTick(dt);
  if(state!=='menu'){W.step(1/60,dt,4);crushCheck(dt);updateBruised(dt);}
  for(const o of objects){if(o.dead)continue;const b=o.body;
    b.velocity.z=0;b.position.z=0;b.angularVelocity.x=0;b.angularVelocity.y=0;
    o.mesh.position.copy(b.position);o.mesh.quaternion.copy(b.quaternion);
    if(o.kind!=='critter'&&(b.position.y<-3||Math.abs(b.position.x)>90))removeQ.add(o);
    if(o.boss){const u=o.mesh.userData;u.arms.forEach((a,i)=>a.rotation.z=(i?1:-1)*(.25+Math.sin(time*2.4+i)*.25));if(u.saw)u.saw.rotation.z-=dt*8;
      if(o.hp<o.hpMax*.5&&Math.random()<dt*6)burst(o.mesh.position.clone().add(new THREE.Vector3(rand(-.5,.5),o.size,0)),'#555049',1,.35,1.5,{smoke:true});}
    if(o.kind==='bot'){const u=o.mesh.userData;u.bulbMat.emissiveIntensity=1+Math.max(0,Math.sin(time*5+b.id))*3;
      if(o.hurt>0){o.hurt-=dt;u.eyeMat.emissiveIntensity=Math.random()<.5?.2:4;}else u.eyeMat.emissiveIntensity=(o.hp/(o.hpMax||1))<.35?(Math.sin(time*20)>0?3:.6):3;}
  }
  if(removeQ.size){removeQ.forEach(kill);removeQ.clear();objects=objects.filter(o=>!o.dead);}

  if((state==='aim'||state==='drag')&&queueMeshes.length&&!demo&&Math.random()<dt/6){const j=Math.floor(Math.random()*queueMeshes.length),m=queueMeshes[j];m.userData.gr=.8;grumble(m.userData.kid);}
  queueMeshes.forEach((m,j)=>{const h=m.userData.home,gr=m.userData.gr||0;if(gr>0)m.userData.gr=gr-dt;m.position.x+=(h.x-m.position.x)*Math.min(1,dt*6);m.position.y=h.y+Math.abs(Math.sin(time*3.2+j*1.3))*.22;m.position.z=h.z;m.rotation.set(0,gr>0?Math.sin(time*30)*.15:0,Math.sin(time*2+j)*.08+(gr>0?Math.sin(time*24)*.12:0));});

  /* crossbow aim + string */
  if(state==='drag'&&pull.length()>.01){aimAng=Math.atan2(-pull.y,-pull.x);pow=pull.length()/MAXPULL;}
  else if(state!=='fly')pow=Math.max(0,pow-dt*8);else pow=0;
  bow.rotation.z+=(aimAng-bow.rotation.z)*Math.min(1,dt*14);
  bow.updateMatrixWorld();
  glowRed.emissiveIntensity=1.5+pow*5;
  const nk=bow.localToWorld(_v.set(nockX(),0,0)).clone();
  between(strTop,bow.localToWorld(LIMB_T.clone()),nk);between(strBot,bow.localToWorld(LIMB_B.clone()),nk);
  const r=current?KINDS[current.kid].r:0;
  if(state==='loading'&&current){current.t+=dt/.5;const t=Math.min(1,current.t);seatPos(r,pp);
    current.mesh.position.lerpVectors(current.from,pp,t);current.mesh.position.y+=Math.sin(t*Math.PI)*1.6;current.mesh.rotation.set(0,0,0);
    if(t>=1){state='aim';$('hint').textContent='Drag toward where you want to fire · let go to fire · scroll or pinch to zoom, right-drag or two fingers to pan';}}
  if((state==='aim'||state==='drag'||state==='menu')&&current&&current.t>=1){
    seatPos(r,current.mesh.position);
    current.mesh.rotation.set(0,0,bow.rotation.z*.4+(state==='drag'?0:Math.sin(time*2)*.05));
  }

  const showDots=state==='drag'&&pull.length()>.45,G=W.gravity.y;
  if(showDots){const v=pull.clone().multiplyScalar(-MAXSPEED/MAXPULL),p0=current.mesh.position;
    dots.forEach((d,i)=>{const t=(i+1)*.075,y=p0.y+v.y*t+.5*G*t*t;d.visible=y>0;d.position.set(p0.x+v.x*t,y,0);d.scale.setScalar(1-i/40);});}
  else dots.forEach(d=>d.visible=false);

  if(state==='fly'){flyT+=dt;
    for(const o of flying){if(o.dead)continue;const b=o.body;if(b.position.x>80||b.position.x<-25){o.dead=true;removeBody(b);scene.remove(o.mesh);}}
    const moving=objects.some(o=>!o.dead&&o.kind!=='terrain'&&o.body.velocity.length()>.3);
    if((flyT>2.2&&!moving)||flyT>11)endTurn();
  }

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
    if(p.smoke){p.m.scale.multiplyScalar(1+dt*1.2);p.m.position.addScaledVector(p.v,dt);p.v.multiplyScalar(.92);}
    else{p.v.y-=14*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=p.spin.x*dt;p.m.rotation.y+=p.spin.y*dt;
      if(p.m.position.y<p.m.scale.y/2){p.m.position.y=p.m.scale.y/2;p.v.y*=-.3;p.v.x*=.6;p.v.z*=.6;p.spin.multiplyScalar(.6);}}
    p.m.material.opacity=Math.min(1,p.life*(p.smoke?.8:1.5));
    if(p.life<=0){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);}}

  updateParticles(time);WIND.value=time;
  if(WORLDS[curWorld]&&WORLDS[curWorld].lightning){if(flash<=0&&Math.random()<dt*.12){flash=.35;noise(1.2,.25,90);}
    if(flash>0){flash-=dt;hemi.intensity=baseHemi+(Math.random()<.5?3:1)*Math.max(0,flash)*4;}else hemi.intensity=baseHemi;}
  updateCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* boot */
makePortraits();
startSpec(levelSpec(0),true);
$('loading').remove();
showTitle();
requestAnimationFrame(frame);
})();
</script>

</body></html>
