<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DataDeck Opening</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed night stage. The 3D intro plays on top, then shrinks into a live logo badge in the upper-left
   while the app shell fades in below it. Single dark look by design (a night flight over Cydcor-blue binary). */
:root{
  --night:#05080D; --night-2:#0B1420; --cyd:#00A1E0; --cyd-rgb:0,161,224; --ink:#EAF2F8; --muted:#8FA3B5;
  --panel:rgba(14,22,32,.72); --line:rgba(120,170,210,.18);
  --font:"Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 800px at 30% -10%,var(--night-2),var(--night) 70%);color:var(--ink);font-family:var(--font);overflow:hidden}
#binary{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#stage{position:fixed;inset:0;transform-origin:0 0;will-change:transform}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* app shell that appears once the intro has shrunk away */
.shell{position:fixed;inset:0;pointer-events:none;opacity:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell.on{pointer-events:auto}
.shell .bar{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.shell main{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:16px;
  display:grid;grid-template-columns:240px 1fr;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -16px rgba(0,0,0,.8);min-width:0}
.panel.side{padding:14px;display:grid;align-content:start;gap:10px}
.panel.side .row{height:12px;border-radius:6px;background:rgba(var(--cyd-rgb),.14)}
.panel.side .row:nth-child(3n){width:70%} .panel.side .row:nth-child(4n){width:84%}
.panel.work{padding:clamp(18px,4vw,40px);display:grid;align-content:center;gap:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cyd)}
.work h2{margin:0;font-size:clamp(22px,3.4vw,36px);font-weight:800;letter-spacing:.01em;text-wrap:balance}
.work p{margin:0;color:var(--muted);max-width:60ch;line-height:1.55;font-weight:500}
button{font:700 13px var(--font);color:var(--ink);background:linear-gradient(180deg,#1B2735,#111A25);border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06) inset}
button.primary{background:linear-gradient(180deg,#2BB8EE,var(--cyd) 55%,#0080B4);color:#00131D;border-color:#0080B4;box-shadow:0 2px 0 #005E85,0 8px 18px -6px rgba(var(--cyd-rgb),.7)}
button:active{transform:translateY(2px)}
button:focus-visible{outline:2px solid var(--cyd);outline-offset:2px}
#skip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;opacity:.85}
#skip[hidden]{display:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600;letter-spacing:.06em}
@media (max-width:700px){ .shell main{grid-template-columns:1fr} .panel.side{display:none} }
</style>

<canvas id="binary" aria-hidden="true"></canvas>
<div id="stage" role="img" aria-label="Opening sequence: Cydni flies a Cydcor-blue helicopter across the Cydcor DataDeck title from left to right, turns at the right end, waves, and settles into the logo in the upper-left corner."></div>

    <section class="panel work">
      <span class="eyebrow">Opening sequence · preview</span>
      <h2>The app opens here.</h2>
      <p>This is where the DataDeck workspace appears once the intro is added to the app. Cydni stays in the corner as the live logo, hovering and blinking.</p>
    </section>
  </main>
</div>

<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stageEl = document.getElementById('stage');
const shell = document.getElementById('shell');
const skipBtn = document.getElementById('skip');

/* ================================================================ binary background (Cydcor blue 0s and 1s) */
(function binary(){
  const c = document.getElementById('binary'), g = c.getContext('2d');
  let cols = [], w = 0, h = 0, size = 16, last = 0;
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
    c.width = w*dpr; c.height = h*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    size = w < 700 ? 13 : 16;
    cols = Array.from({ length: Math.ceil(w/size) }, () => ({ y: Math.random()*h, v: .25 + Math.random()*.9, d: Math.random() }));
    g.clearRect(0,0,w,h);
  }
  function frame(t){
    requestAnimationFrame(frame);
    if (t - last < 66) return; last = t;
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,.09)'; g.fillRect(0,0,w,h);
    g.globalCompositeOperation = 'source-over'; g.textBaseline = 'top';
    cols.forEach((col, i) => {
      const fs = size*(.7 + col.d*.6);
      g.font = `${col.d > .6 ? 700 : 500} ${fs}px Consolas, "Cascadia Code", monospace`;
      g.shadowColor = 'rgba(0,161,224,.8)'; g.shadowBlur = col.d > .75 ? 8 : 0;
      g.fillStyle = `rgba(0,161,224,${(.16 + col.d*.38).toFixed(3)})`;
      g.fillText(Math.random() < .5 ? '0' : '1', i*size, col.y);
      if (!reduceMotion) col.y += fs*col.v;
      if (col.y > h + fs){ col.y = -fs*(1 + Math.random()*20); col.d = Math.random(); }
    });
    g.shadowBlur = 0;
  }
  addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
})();

/* ================================================================ renderer / scene */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 400);
const camTarget = new THREE.Vector3(2.5, 0.6, 0);

scene.add(new THREE.HemisphereLight(0xdff3ff, 0x0a1622, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(-8, 22, 18); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fd8ff, 1.8); rim.position.set(12, 10, -16); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.45); fill.position.set(14, -4, 12); scene.add(fill);

/* ================================================================ materials (Cydni's, from CYDNI 3D) */
const M = {
  shell: new THREE.MeshPhysicalMaterial({ color:0xf1f2f3, roughness:0.32, clearcoat:1, clearcoatRoughness:0.18 }),
  ring:  new THREE.MeshPhysicalMaterial({ color:0xc9cbcd, roughness:0.38, clearcoat:0.8, clearcoatRoughness:0.25 }),
  visor: new THREE.MeshPhysicalMaterial({ color:0x1b1c1e, roughness:0.12, metalness:0.1, clearcoat:1, clearcoatRoughness:0.05 }),
  dark:  new THREE.MeshPhysicalMaterial({ color:0x2a2b2d, roughness:0.35, metalness:0.2, clearcoat:0.6 }),
  stick: new THREE.MeshStandardMaterial({ color:0xe6e8ea, roughness:0.3, metalness:0.4 }),
  cyan:  new THREE.MeshPhysicalMaterial({ color:0x0096dc, roughness:0.3, clearcoat:1, clearcoatRoughness:0.12 }),
  eye:   new THREE.MeshStandardMaterial({ color:0x00e1ff, emissive:0x00e1ff, emissiveIntensity:1.5, toneMapped:false }),
  logo:  new THREE.MeshPhysicalMaterial({ color:0x0a0a0a, roughness:0.35, clearcoat:0.7 }),
  metal: new THREE.MeshStandardMaterial({ color:0x9aa3ab, roughness:0.35, metalness:0.85 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0xbfe9ff, roughness:0.04, metalness:0, clearcoat:1, transparent:true, opacity:0.2, depthWrite:false, side:THREE.DoubleSide }),
};

/* ================================================================ helpers */
function stadiumShape(w, h){
  const s = new THREE.Shape(), hw = w/2, hh = h/2;
  if (w >= h){ const r = hh;
    s.moveTo(0, -hh); s.lineTo(hw-r, -hh); s.absarc(hw-r, 0, r, -Math.PI/2, Math.PI/2, false);
    s.lineTo(-hw+r, hh); s.absarc(-hw+r, 0, r, Math.PI/2, Math.PI*1.5, false); s.closePath();
  } else { const r = hw;
    s.moveTo(hw, 0); s.lineTo(hw, hh-r); s.absarc(0, hh-r, r, 0, Math.PI, false);
    s.lineTo(-hw, -hh+r); s.absarc(0, -hh+r, r, Math.PI, Math.PI*2, false); s.closePath(); }
  return s;
}
function slab(w, h, depth, b, segs=10){
  const g = new THREE.ExtrudeGeometry(stadiumShape(w-2*b, h-2*b),
    { depth:Math.max(0.001, depth-2*b), bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:segs, curveSegments:48 });
  g.center(); g.computeVertexNormals(); return g;
}
function mesh(geo, mat, parent, x=0, y=0, z=0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100.06 103"><path d="M51.14,17.19s3.1.02,3.1,2.52c0,2.72-3.1,2.72-3.1,2.72-16.17-.37-30.34,14.89-28.63,30.97.75,16.11,17.65,29.27,32.89,26.3,13.5-2.62,26.63-13.09,27.48-28.43,1.12,15.75-11.530,31.54-28.28,33.76-18.62,2.45-36.92-13.25-37.38-32.030-1.57-18.75,15.11-36.26,33.92-35.81Z"/><path d="M77.23,53.75s-.21,2.43-2.49,2.43-2.61-2.43-2.61-2.43c.25-11.2-10.31-21.02-21.45-19.830-11.16.52-19.22,11.89-18.23,22.79.87,9.5,8.66,18.97,19.7,19.840-11.3,1.02-23.01-7.93-24.83-20.25-1.8-13.7,9.75-27.16,23.56-27.5,13.8-1.15,26.68,11.12,26.34,24.96Z"/><path d="M63.75,45.63s1.97,2.35.33,3.76c-1.63,1.42-3.42-.67-3.42-.67-4.43-4.63-12.670-4.33-16.7.65-4.3,4.72-3.22,13.83,1.19,17.97,4.02,3.77,7.030,4.52,10.29,4.77-4.14,1.17-8.94-.38-12.8-3.11-6.91-5.3-7.76-16.45-1.75-22.76,5.63-6.66,16.85-6.93,22.86-.61Z"/></svg>`;
const logoShapes = [];
new SVGLoader().parse(LOGO_SVG).paths.forEach(p => SVGLoader.createShapes(p).forEach(s => logoShapes.push(s)));

/* ================================================================ Cydni (built exactly as in CYDNI 3D, without the folder and sign) */
function buildCydni(){
  const robot = new THREE.Group();
  const BODY_ZS = 0.72;
  const bodyR = y => 1.39 + (y - 0.95) / 5.7 * 1.16;
  const prof = [];
  for (let i=0;i<=16;i++){ const a=i/16*Math.PI/2; prof.push(new THREE.Vector2(Math.max(0.001,1.39*Math.sin(a)), 0.95-0.95*Math.cos(a))); }
  for (let i=1;i<=12;i++){ const y=0.95+i/12*5.7; prof.push(new THREE.Vector2(bodyR(y), y)); }
  for (let i=1;i<=18;i++){ const a=i/18*Math.PI/2; prof.push(new THREE.Vector2(1.45+1.1*Math.cos(a), 6.65+1.15*Math.sin(a))); }
  prof.push(new THREE.Vector2(0.001, 7.8));
  mesh(new THREE.LatheGeometry(prof, 96), M.shell, robot).scale.z = BODY_ZS;
  { // chest swirl bent onto the body
    const LOGO_Y = 5.9, S = 0.0276;
    logoShapes.forEach(shape => {
      const g = new THREE.ExtrudeGeometry(shape, { depth:5, bevelEnabled:true, bevelThickness:1, bevelSize:0.6, bevelSegments:3, curveSegments:20 });
      g.translate(-50, -52, 0); g.scale(S, -S, S);
      const pos = g.attributes.position;
      for (let i=0;i<pos.count;i+=3) for (let c=0;c<3;c++){ const a = pos.array[(i+1)*3+c]; pos.array[(i+1)*3+c] = pos.array[(i+2)*3+c]; pos.array[(i+2)*3+c] = a; }
      for (let i=0;i<pos.count;i++){ const x = pos.getX(i), y = pos.getY(i), R = bodyR(LOGO_Y + y);
        pos.setZ(i, pos.getZ(i) + BODY_ZS*Math.sqrt(Math.max(0, R*R - x*x)) - 0.05); }
      g.deleteAttribute('normal'); g.deleteAttribute('uv'); g.computeVertexNormals();
      mesh(g, M.logo, robot, 0, LOGO_Y, 0);
    });
  }
  function finShape(k){
    const s = new THREE.Shape(); s.moveTo(0, 0);
    s.bezierCurveTo(0.62*k, -0.08, 0.52*k, -0.86, 0.42*k, -1.6);
    s.bezierCurveTo(0.22*k, -2.85, -0.28*k, -3.95, -0.82*k, -4.56); s.lineTo(0, 0); return s;
  }
  function makeArm(side){
    const pivot = new THREE.Group(); pivot.position.set(2.4*side, 7.0, -0.05); robot.add(pivot);
    const g = new THREE.ExtrudeGeometry(finShape(side), { depth:0.75, bevelEnabled:true, bevelThickness:0.2, bevelSize:0.16, bevelSegments:6, curveSegments:32 });
    g.translate(0, 0, -0.375); g.computeVertexNormals(); mesh(g, M.cyan, pivot); return pivot;
  }
  const armL = makeArm(-1), armR = makeArm(1);
  mesh(new THREE.CylinderGeometry(0.52, 0.56, 1.0, 40), M.dark, robot, 0, 7.98, 0);
  const head = new THREE.Group(); head.position.set(0, 10.43, 0); robot.add(head);
  mesh(slab(7.32, 4.5, 4.2, 0.7), M.ring, head);
  mesh(slab(6.66, 3.84, 2.4, 0.22), M.shell, head, 0, 0, 1.11);
  mesh(slab(5.04, 2.22, 0.5, 0.16), M.visor, head, 0, 0, 2.32);
  for (const s of [-1, 1]){ const e = mesh(slab(2.0, 1.62, 0.8, 0.2), M.cyan, head, 3.72*s, 0, 0); e.rotation.y = Math.PI/2; }
  mesh(new RoundedBoxGeometry(2.36, 0.62, 1.8, 6, 0.22), M.dark, head, 0, 2.38, 0);
  mesh(new THREE.SphereGeometry(0.38, 40, 20, 0, Math.PI*2, 0, Math.PI/2), M.dark, head, 0, 2.62, 0);
  mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.95, 20), M.stick, head, 0, 3.3, 0);
  mesh(new THREE.SphereGeometry(0.37, 40, 24), M.cyan, head, 0, 3.94, 0);
  function domeGeo(){
    const s = new THREE.Shape();
    s.moveTo(0.39, 0); s.absarc(0, 0, 0.39, 0, Math.PI, false);
    s.lineTo(-0.39, -0.14); s.quadraticCurveTo(-0.39, -0.26, -0.27, -0.26);
    s.lineTo(0.27, -0.26); s.quadraticCurveTo(0.39, -0.26, 0.39, -0.14); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth:0.05, bevelEnabled:true, bevelThickness:0.03, bevelSize:0.025, bevelSegments:3, curveSegments:24 });
    g.translate(0, -0.06, 0); return g;
  }
  const arcGeo = () => new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.36,-0.16,0), new THREE.Vector3(0,0.42,0), new THREE.Vector3(0.36,-0.16,0)), 24, 0.085, 10, false);
  const eyesRoot = new THREE.Group(); eyesRoot.position.set(0, 0, 2.6); head.add(eyesRoot);
  const faces = {};
  function face(name, mk){ const g = new THREE.Group(); const l = new THREE.Mesh(mk(), M.eye); l.position.x = -1.1;
    const r = new THREE.Mesh(mk(), M.eye); r.position.x = 1.1; g.add(l, r); g.visible = false; eyesRoot.add(g); faces[name] = g; }
  face('normal', domeGeo); face('happy', arcGeo);
  faces.normal.visible = true;
  return { robot, armL, armR, head, eyesRoot, faces };
}

/* ================================================================ helicopter (nose toward +z) */
const BLUE = new THREE.MeshPhysicalMaterial({ color:0x0089c8, roughness:0.4, metalness:0.05, clearcoat:0.6, clearcoatRoughness:0.25, envMapIntensity:0.35 });
const WHITE = M.shell;
const BODY = BLUE;   // airframe in Cydcor blue; WHITE is used for trim
const heli = new THREE.Group(); scene.add(heli);
const airframe = new THREE.Group(); heli.add(airframe);
{
  // lower hull: bottom half of an ellipsoid (open top), the cockpit tub
  const hull = mesh(new THREE.SphereGeometry(1, 64, 32, 0, Math.PI*2, Math.PI*0.42, Math.PI*0.58), BODY, airframe, 0, -0.1, 0.2);
  hull.scale.set(1.55, 1.45, 2.5); hull.material = BODY;
  // blue belly stripe
  const stripe = mesh(new THREE.TorusGeometry(1, 0.06, 12, 80), WHITE, airframe, 0, -0.42, 0.2);
  stripe.rotation.x = Math.PI/2; stripe.scale.set(1.5, 2.43, 1);
  // engine cowling behind the cockpit
  mesh(new RoundedBoxGeometry(2.1, 1.35, 2.4, 6, 0.55), BODY, airframe, 0, 0.55, -1.25);
  mesh(new RoundedBoxGeometry(1.2, 0.35, 1.5, 4, 0.15), M.dark, airframe, 0, 1.3, -1.2);
  // canopy: upper half dome over the front
  const canopy = mesh(new THREE.SphereGeometry(1, 64, 32, 0, Math.PI*2, 0, Math.PI*0.5), M.glass, airframe, 0, 0.05, 0.75);
  canopy.scale.set(1.6, 1.7, 1.85); canopy.renderOrder = 2;
  // canopy frame ring
  const frame = mesh(new THREE.TorusGeometry(1, 0.05, 10, 80), M.dark, airframe, 0, 0.05, 0.75);
  frame.rotation.x = Math.PI/2; frame.scale.set(1.6, 1.85, 1);
  // tail boom
  const boom = mesh(new THREE.CylinderGeometry(0.16, 0.42, 5.2, 24), BODY, airframe, 0, 0.35, -4.4);
  boom.rotation.x = Math.PI/2;
  const boomStripe = mesh(new THREE.CylinderGeometry(0.2, 0.31, 1.6, 24), WHITE, airframe, 0, 0.35, -4.9);
  boomStripe.rotation.x = Math.PI/2;
  // tail fin + stabilizer
  const fin = new THREE.Shape(); fin.moveTo(0, 0); fin.lineTo(0.9, 0); fin.lineTo(0.55, 1.5); fin.lineTo(0.05, 1.5); fin.closePath();
  const finGeo = new THREE.ExtrudeGeometry(fin, { depth:0.12, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.04, bevelSegments:3 });
  finGeo.translate(0, 0, -0.06);
  const finMesh = mesh(finGeo, WHITE, airframe, 0, 0.35, -7.1); finMesh.rotation.y = -Math.PI/2;
  mesh(new RoundedBoxGeometry(2.0, 0.08, 0.55, 2, 0.03), WHITE, airframe, 0, 0.4, -6.6);
  // skids
  for (const s of [-1, 1]){
    const skid = mesh(new THREE.CylinderGeometry(0.07, 0.07, 4.4, 12), M.metal, airframe, 1.15*s, -1.75, 0.1); skid.rotation.x = Math.PI/2;
    const tip = mesh(new THREE.TorusGeometry(0.28, 0.07, 10, 16, Math.PI/2), M.metal, airframe, 1.15*s, -1.47, 2.3); tip.rotation.y = Math.PI/2; tip.rotation.z = -Math.PI/2;
    for (const z of [-0.9, 1.0]){ const strut = mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.0, 10), M.metal, airframe, 1.0*s, -1.3, z); strut.rotation.z = 0.25*s; }
  }
  // Cydcor swirl on both doors, in white
  const DECAL = new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0.3, clearcoat:1, side:THREE.DoubleSide });
  for (const s of [-1, 1]){
    const decal = new THREE.Group(); decal.position.set(1.43*s, -0.62, 0.15); decal.rotation.y = s*Math.PI/2; airframe.add(decal);
    logoShapes.forEach(shape => {
      const g = new THREE.ExtrudeGeometry(shape, { depth:1.5, bevelEnabled:false, curveSegments:18 });
      g.translate(-50, -52, 0); g.scale(0.0125, -0.0125, 0.0125); g.computeVertexNormals();
      mesh(g, DECAL, decal);
    });
  }
}
// CYDCOR wordmark along both sides of the engine housing
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 200; const g = c.getContext('2d');
  const paint = () => {
    g.clearRect(0, 0, c.width, c.height);
    g.font = '800 132px "Montserrat", "Segoe UI", system-ui, sans-serif'; g.fillStyle = '#ffffff'; g.textBaseline = 'middle';
    const word = 'CYDCOR', gap = 34; let total = gap*(word.length - 1); const ws = [...word].map(ch => { const w = g.measureText(ch).width; total += w; return w; });
    let x = (c.width - total)/2; [...word].forEach((ch, i) => { g.fillText(ch, x, c.height/2 + 6); x += ws[i] + gap; });
  };
  paint();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  document.fonts?.load('800 100px Montserrat').then(() => { paint(); tex.needsUpdate = true; }).catch(() => {});
  const mat = new THREE.MeshStandardMaterial({ map:tex, transparent:true, roughness:0.35, metalness:0, alphaTest:0.05 });
  for (const s of [-1, 1]){
    const word = mesh(new THREE.PlaneGeometry(2.0, 0.39), mat, airframe, 1.062*s, 0.5, -1.3);
    word.rotation.y = s*Math.PI/2;   // reads left-to-right from either side
  }
}

// main rotor
const mast = mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.75, 16), M.metal, heli, 0, 1.75, -0.6);
const rotor = new THREE.Group(); rotor.position.set(0, 2.15, -0.6); heli.add(rotor);
mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 20), M.dark, rotor);
for (let i=0;i<2;i++){ const b = mesh(new RoundedBoxGeometry(0.42, 0.06, 7.2, 2, 0.03), M.dark, rotor); b.rotation.y = i*Math.PI/2; }
const blurTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const r = g.createRadialGradient(128,128,10,128,128,128); r.addColorStop(0,'rgba(200,230,255,0.0)'); r.addColorStop(0.15,'rgba(200,230,255,0.18)');
  r.addColorStop(0.85,'rgba(200,230,255,0.22)'); r.addColorStop(1,'rgba(200,230,255,0)'); g.fillStyle = r; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); })();
const blurDisc = mesh(new THREE.CircleGeometry(3.7, 64), new THREE.MeshBasicMaterial({ map:blurTex, transparent:true, depthWrite:false, side:THREE.DoubleSide }), heli, 0, 2.17, -0.6);
blurDisc.rotation.x = -Math.PI/2; blurDisc.renderOrder = 3;
// tail rotor
const tailRotor = new THREE.Group(); tailRotor.position.set(0.2, 1.15, -6.75); heli.add(tailRotor);
for (let i=0;i<2;i++){ const b = mesh(new RoundedBoxGeometry(0.06, 1.7, 0.18, 2, 0.02), M.dark, tailRotor); b.rotation.x = i*Math.PI/2; }

// Cydni in the pilot seat
const pilot = buildCydni();
pilot.robot.scale.setScalar(0.21);
pilot.robot.position.set(0, -1.45, 0.85);
airframe.add(pilot.robot);
pilot.armL.rotation.z = -0.35; pilot.armR.rotation.z = 0.35;   // hands forward on the controls
pilot.armL.rotation.x = -0.9; pilot.armR.rotation.x = -0.9;

heli.scale.setScalar(0.95);

/* ================================================================ title: CYDCOR / DataDeck */
const title = new THREE.Group(); scene.add(title);
const TW = 20, TH = 6.2;
function titleCanvas(){
  const W = 2400, H = Math.round(W*TH/TW), c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), fam = '"Montserrat", "Segoe UI", system-ui, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  // CYDCOR, letter-spaced
  g.font = `800 ${H*0.17}px ${fam}`; g.fillStyle = '#00A1E0';
  const word = 'CYDCOR', spacing = H*0.07; let total = 0; const ws = [...word].map(ch => { const w = g.measureText(ch).width; total += w; return w; });
  total += spacing*(word.length - 1); let x = W/2 - total/2;
  [...word].forEach((ch, i) => { g.textAlign = 'left'; g.fillText(ch, x, H*0.2); x += ws[i] + spacing; });
  // DataDeck, big, white with a cool gradient
  g.textAlign = 'center';
  let size = H*0.56; g.font = `900 ${size}px ${fam}`;
  const mw = g.measureText('DataDeck').width; if (mw > W*0.94){ size *= W*0.94/mw; g.font = `900 ${size}px ${fam}`; }
  const grad = g.createLinearGradient(0, H*0.35, 0, H*0.95); grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(1, '#BFE6FA');
  g.shadowColor = 'rgba(0,161,224,0.85)'; g.shadowBlur = H*0.06;
  g.fillStyle = grad; g.fillText('DataDeck', W/2, H*0.64);
  g.shadowBlur = 0;
  return c;
}
const titleTex = new THREE.CanvasTexture(titleCanvas()); titleTex.colorSpace = THREE.SRGBColorSpace; titleTex.anisotropy = 8;
const titleMat = new THREE.MeshBasicMaterial({ map:titleTex, transparent:true, toneMapped:false, depthWrite:true, alphaTest:0.02 });
const titleMesh = mesh(new THREE.PlaneGeometry(TW, TH), titleMat, title);
// a faint 3D underside: the same lettering set back and darkened, so the title reads as a solid sign
const backMat = new THREE.MeshBasicMaterial({ map:titleTex, transparent:true, color:0x0b4a6a, depthWrite:true, alphaTest:0.02, toneMapped:false });
for (let i=1;i<=6;i++) mesh(new THREE.PlaneGeometry(TW, TH), backMat, title, 0, -i*0.012, -i*0.06);
document.fonts?.load('900 100px Montserrat').then(() => document.fonts.load('800 100px Montserrat')).then(() => {
  titleTex.image = titleCanvas(); titleTex.needsUpdate = true; }).catch(() => {});

/* ================================================================ flight path */
const path = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-21, 0.3, 7.5),
  new THREE.Vector3(-9, 0.7, 8),        // across the front of the title, at letter height
  new THREE.Vector3(2, 0.4, 8),
  new THREE.Vector3(12, 0.8, 7),
  new THREE.Vector3(16, 1.1, 4),        // turning at the right end
  new THREE.Vector3(17, 1.0, 0.3),
  new THREE.Vector3(15.2, 0.6, -0.9),
  new THREE.Vector3(14.2, 0.4, 0.4),    // settles beside the title, not on top
], false, 'centripetal', 0.5);

const HOVER = new THREE.Vector3(14.2, 0.4, 0.4);
const T = { title:[0.6, 1.8], fly:[0.1, 5.4], turn:[5.2, 6.1], wave:[5.8, 7.4], shrink:7.6, done:8.9 };
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const clamp01 = x => Math.min(1, Math.max(0, x));
const span = (t, [a, b]) => clamp01((t - a)/(b - a));

/* ================================================================ sizing */
function fitCamera(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  // keep the whole title (plus a margin) inside the frame on narrow screens
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const needW = 44/2 / (Math.tan(vFov/2)*camera.aspect);   // title plus the helicopter hovering at its right
  const needH = 13/2 / Math.tan(vFov/2);
  const d = Math.max(44, needW, needH);
  camera.position.set(camTarget.x, 1.6, d); camera.lookAt(camTarget); camera.updateProjectionMatrix();
}
addEventListener('resize', () => { fitCamera(); if (phase === 'badge') placeBadge(false); });
fitCamera();

/* ================================================================ badge: map the title + helicopter onto the upper-left corner */
let phase = 'intro';
let badgeTarget = null, shrinkStart = null;
const easeIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
function applyBadge(e){
  const { tx, ty, s } = badgeTarget;
  stageEl.style.transform = `translate(${tx*e}px, ${ty*e}px) scale(${1 + (s - 1)*e})`;
}
const box = new THREE.Box3(), v = new THREE.Vector3();
function screenBounds(){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const add = obj => {
    box.setFromObject(obj);
    for (let i=0;i<8;i++){
      v.set(i&1 ? box.max.x : box.min.x, i&2 ? box.max.y : box.min.y, i&4 ? box.max.z : box.min.z).project(camera);
      const x = (v.x + 1)/2*innerWidth, y = (1 - v.y)/2*innerHeight;
      minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
  };
  add(titleMesh); add(airframe);
  // rotor disc reaches beyond the airframe
  return { minX: minX - 8, minY: minY - 14, maxX: maxX + 10, maxY: maxY + 6 };
}
function placeBadge(animate){
  scene.updateMatrixWorld(true);
  const b = screenBounds();
  const targetW = Math.min(340, Math.max(200, innerWidth*0.26));
  const s = targetW / (b.maxX - b.minX);
  const insetL = Math.max(16, parseFloat(getComputedStyle(document.documentElement).paddingLeft) || 0);
  const tx = insetL - b.minX*s, ty = 14 - b.minY*s;
  badgeTarget = { tx, ty, s };
  if (animate) shrinkStart = performance.now()/1000;
  else { shrinkStart = null; applyBadge(1); shell.style.opacity = 1; }
  // the app content starts below the badge
  const badgeBottom = 14 + (b.maxY - b.minY)*s + 14;
  document.getElementById('main').style.top = `${Math.max(badgeBottom, 64)}px`;
}

/* ================================================================ animation */
const clock = new THREE.Clock();
let t0 = performance.now()/1000, rotorSpeed = 0;
const tan = new THREE.Vector3(), tanNext = new THREE.Vector3(), pos = new THREE.Vector3();
let lastYaw = 0, roll = 0, pitch = 0;

function setFace(name){ for (const k in pilot.faces) pilot.faces[k].visible = (k === name); }

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now()/1000 - t0;
  const now = performance.now()/1000;

  // rotors
  rotorSpeed = Math.min(1, rotorSpeed + dt*1.5);
  rotor.rotation.y += dt*28*rotorSpeed;
  tailRotor.rotation.x += dt*42*rotorSpeed;
  blurDisc.material.opacity = 0.9*rotorSpeed;

  // title appears: fade + rise + glow pulse
  const ta = easeOut(span(t, T.title));
  titleMat.opacity = ta; backMat.opacity = ta*0.9;
  title.position.y = -0.8*(1 - ta); title.scale.setScalar(0.9 + 0.1*ta);
  // a glow pulse runs through the letters as the title lands
  const sw = span(t, [T.title[0] + 0.4, T.title[1] + 0.8]);
  titleMat.color.setScalar(1 + 0.45*Math.sin(sw*Math.PI));

  // flight
  const fu = span(t, T.fly);
  if (fu < 1){
    const u = 0.45*fu + 0.55*ease(fu);   // keeps moving from the first frame, eases into the hover
    path.getPointAt(u, pos); path.getTangentAt(u, tan); path.getTangentAt(Math.min(1, u + 0.02), tanNext);
    heli.position.copy(pos);
    const yaw = Math.atan2(tan.x, tan.z), yawNext = Math.atan2(tanNext.x, tanNext.z);
    let dy = yawNext - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    roll = THREE.MathUtils.lerp(roll, THREE.MathUtils.clamp(-dy*9, -0.7, 0.7), 1 - Math.pow(0.02, dt));
    pitch = THREE.MathUtils.lerp(pitch, 0.18 * (1 - fu*0.7), 1 - Math.pow(0.05, dt));
    lastYaw = yaw;
    heli.rotation.set(pitch, yaw, roll, 'YXZ');
  } else {
    // hover: turn to face the camera, settle level, bob gently
    const k = ease(span(t, T.turn));
    let yaw = THREE.MathUtils.lerp(lastYaw, Math.round(lastYaw/(Math.PI*2))*Math.PI*2, k);
    roll = THREE.MathUtils.lerp(roll, 0, 1 - Math.pow(0.01, dt));
    pitch = THREE.MathUtils.lerp(pitch, -0.03, 1 - Math.pow(0.02, dt));
    heli.rotation.set(pitch, yaw + Math.sin(now*0.8)*0.04, roll + Math.sin(now*1.1)*0.025, 'YXZ');
    heli.position.set(HOVER.x, HOVER.y + Math.sin(now*1.6)*0.18, HOVER.z);
  }

  // Cydni: looks around while flying, then a happy wave
  const wv = span(t, T.wave);
  if (wv > 0 && wv < 1){
    setFace('happy');
    pilot.armR.rotation.x = THREE.MathUtils.lerp(pilot.armR.rotation.x, 0, 1 - Math.pow(0.001, dt));
    pilot.armR.rotation.z = 2.5 + Math.sin(now*9)*0.35;
    pilot.head.rotation.z = -0.08;
  } else {
    if (wv >= 1) setFace('normal');
    pilot.armR.rotation.z = THREE.MathUtils.lerp(pilot.armR.rotation.z, 0.35, 1 - Math.pow(0.002, dt));
    pilot.armR.rotation.x = THREE.MathUtils.lerp(pilot.armR.rotation.x, -0.9, 1 - Math.pow(0.002, dt));
    pilot.head.rotation.z = THREE.MathUtils.lerp(pilot.head.rotation.z, 0, 1 - Math.pow(0.01, dt));
    pilot.head.rotation.y = fu < 1 ? Math.sin(now*1.3)*0.25 : THREE.MathUtils.lerp(pilot.head.rotation.y, 0, 1 - Math.pow(0.01, dt));
  }
  // blink
  const bl = (now % 3.7);
  pilot.eyesRoot.scale.y = bl < 0.14 ? Math.max(0.08, Math.abs(bl - 0.07)/0.07) : 1;

  // shrink into the corner
  if (phase === 'intro' && t >= T.shrink) finishIntro(true);
  if (shrinkStart !== null){
    const k = clamp01((now - shrinkStart)/1.25);
    applyBadge(easeIO(k));
    shell.style.opacity = clamp01((now - shrinkStart - 0.35)/0.9);
    if (k >= 1 && now - shrinkStart > 1.25) shrinkStart = null;
  }

  renderer.render(scene, camera);
}

function finishIntro(animate){
  phase = 'badge';
  skipBtn.hidden = true;
  placeBadge(animate);
  shell.classList.add('on'); shell.setAttribute('aria-hidden', 'false');
}
function startIntro(){
  phase = 'intro'; t0 = performance.now()/1000; rotorSpeed = 0.3; roll = 0; pitch = 0;
  shrinkStart = null; stageEl.style.transform = ''; shell.style.opacity = 0;
  shell.classList.remove('on'); shell.setAttribute('aria-hidden', 'true');
  skipBtn.hidden = false; setFace('normal');
}
function skipToEnd(){
  t0 = performance.now()/1000 - T.done; lastYaw = 0;
  heli.position.copy(HOVER); heli.rotation.set(-0.03, 0, 0);
  titleMat.opacity = 1; finishIntro(false);
}
skipBtn.addEventListener('click', skipToEnd);
document.getElementById('replay').addEventListener('click', startIntro);
addEventListener('keydown', e => { if (e.key === 'Escape' && phase === 'intro') skipToEnd(); });

document.getElementById('loading').remove();
if (reduceMotion){ skipToEnd(); } else { startIntro(); }
requestAnimationFrame(frame);
</script>
