<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CydniTime Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: a modern living room with one slim flatscreen on a walnut console. The TV swings in edge-on, wakes up, and moves in close (bezel only) whenever a game is playing. */
:root{
  --wall:#ebe8f0; --wall2:#d8d3e2; --floor:#cdb79c; --floor2:#b49b7e; --console:#8a5a3c; --console2:#6a4128;
  --tv:#0f0f14; --tv-edge:#2c2c36; --tv-hi:#3a3a46; --glass:#030306; --ink:#2a2233; --ink-soft:#6b6478;
  --screen-ink:#f7f3ff; --cyan:#4ff3ff; --gold:#ffd34d; --pink:#ff6fb5; --danger:#ff5d5d; --trim:#ff7a2f; --trim-dark:#c95518;
  --glow:rgba(79,200,255,.38); --remote:#1d1c25; --remote-ink:#f2eefa; --remote-btn:#2e2c3a; --kbd:#ffffff; --kbd-edge:#cfc8da;
  --font-display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-tv:"VT323","Courier New",ui-monospace,monospace;
  --pad-bg:#1d1c25; --pad-btn:#2e2c3a; --pad-ink:#fff7ee;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#191722; --wall2:#0d0c13; --floor:#2c231b; --floor2:#1d1712; --console:#4d3123; --console2:#2f1d13;
  --ink:#efe6ff; --ink-soft:#a79fb8; --glow:rgba(79,200,255,.26); --remote:#26242f; --remote-btn:#363340; --kbd:#2e2c3a; --kbd-edge:#151419;
  --pad-bg:#111018; --pad-btn:#2c2a36; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#191722; --wall2:#0d0c13; --floor:#2c231b; --floor2:#1d1712; --console:#4d3123; --console2:#2f1d13;
  --ink:#efe6ff; --ink-soft:#a79fb8; --glow:rgba(79,200,255,.26); --remote:#26242f; --remote-btn:#363340; --kbd:#2e2c3a; --kbd-edge:#151419;
  --pad-bg:#111018; --pad-btn:#2c2a36; color-scheme:dark}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--font-display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#room{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 30%,var(--wall),var(--wall2));overflow:hidden}
#room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(var(--floor),var(--floor2));box-shadow:0 -1px 0 rgba(0,0,0,.08)}
#stage{position:absolute;left:0;top:0;width:828px;height:610px;transform-origin:0 0;perspective:2200px;perspective-origin:414px 239px;z-index:2}
#stage.anim{transition:transform .95s cubic-bezier(.65,0,.25,1)}
#glow{position:absolute;left:-120px;top:-110px;width:1068px;height:698px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);opacity:0;transition:opacity 1.2s;pointer-events:none}
body.on #glow{opacity:1}
#console{position:absolute;left:34px;top:540px;width:760px;height:70px;border-radius:8px;background:linear-gradient(var(--console),var(--console2));box-shadow:0 22px 34px -16px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.12)}
#console::before{content:"";position:absolute;left:253px;right:253px;top:10px;bottom:10px;border-left:2px solid rgba(0,0,0,.18);border-right:2px solid rgba(0,0,0,.18)}
#console::after{content:"";position:absolute;left:40px;right:40px;bottom:-14px;height:14px;background:linear-gradient(90deg,var(--console2) 0 14px,transparent 14px calc(100% - 14px),var(--console2) calc(100% - 14px))}
#tv{position:absolute;left:0;top:0;width:828px;height:478px;transform-style:preserve-3d;transform-origin:414px 239px 20px;
  transform:rotateY(78deg) rotateX(-2deg);transition:transform 1.6s cubic-bezier(.2,.85,.25,1.04)}
#tv.front{transform:rotateY(0deg) rotateX(0deg)}
.face{position:absolute}
#front{left:0;top:0;width:828px;height:478px;transform:translateZ(40px);border-radius:10px;
  background:linear-gradient(180deg,var(--tv-hi),var(--tv) 6%,var(--tv) 94%,#1b1b22);box-shadow:0 0 0 1.5px var(--tv-edge),0 40px 70px -30px rgba(0,0,0,.55)}
#leftFace{left:0;top:3px;width:40px;height:472px;transform-origin:left center;transform:rotateY(-90deg);border-radius:4px;background:linear-gradient(90deg,#24242c,#15151a)}
#leftFace::after{content:"";position:absolute;left:12px;top:170px;width:16px;height:8px;border-radius:2px;background:#050507;box-shadow:0 20px 0 #050507,0 40px 0 #050507,0 60px 0 #050507}
#rightFace{right:0;top:3px;width:40px;height:472px;transform-origin:right center;transform:rotateY(90deg);border-radius:4px;background:linear-gradient(90deg,#15151a,#24242c)}
#topFace{left:3px;top:0;width:822px;height:40px;transform-origin:center top;transform:rotateX(90deg);border-radius:4px;background:#22222a}
#stand{position:absolute;left:50%;top:478px;width:66px;height:52px;margin-left:-33px;background:linear-gradient(90deg,#1a1a20,#34343e 50%,#1a1a20);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
#standBase{position:absolute;left:50%;top:528px;width:300px;height:12px;margin-left:-150px;border-radius:6px 6px 3px 3px;background:linear-gradient(#3a3a44,#16161b)}
#brand{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:8.5px;font-weight:600;letter-spacing:.42em;color:#8d8c99;line-height:12px}
#led{position:absolute;right:24px;bottom:4px;width:5px;height:5px;border-radius:50%;background:#c2263a;box-shadow:0 0 6px #ff3048}
#led.on{background:#e8f7ff;box-shadow:0 0 6px #bfefff}
#screenWrap{position:absolute;left:14px;top:14px;width:800px;height:450px;border-radius:3px;overflow:hidden;background:var(--glass)}
#screen{position:relative;width:800px;height:450px;overflow:hidden;background:var(--glass);color:var(--screen-ink);font-family:var(--font-display)}
#gl{position:absolute;inset:0;width:800px;height:450px;display:block;opacity:0;transition:opacity .6s}
#screen.on #gl{opacity:1}
#wake{position:absolute;inset:0;z-index:26;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(140,230,255,.9),rgba(40,60,120,.4) 45%,transparent 75%);opacity:0}
#wake.go{animation:wake .9s ease-out forwards}
@keyframes wake{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
#glare{position:absolute;inset:0;pointer-events:none;z-index:31;background:linear-gradient(118deg,rgba(255,255,255,.075),rgba(255,255,255,.02) 32%,transparent 33%)}

/* HUD */
.hide{display:none!important}
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
#logo{position:absolute;left:14px;top:10px;background:rgba(10,8,20,.45);padding:3px 12px 3px 6px;border-radius:999px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:26px;letter-spacing:.01em;z-index:12;
  transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .4s;transform-origin:left top;text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none}
#logo.center{transform:translate(190px,150px) scale(2.3)}
#logo.gone{opacity:0}
#logo .c{color:#fff} #logo .t{color:var(--trim)}
#logo svg{width:28px;height:28px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
#logo .hand{transform-origin:12px 12px;animation:tick 2s steps(12) infinite}
@keyframes tick{to{transform:rotate(360deg)}}
#hudR{position:absolute;right:16px;top:10px;background:rgba(10,8,20,.5);padding:6px 10px 4px;border-radius:14px;text-align:right;font-family:var(--font-tv);font-size:26px;line-height:.95;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#hudR .lv{color:var(--gold)} #hudR .lives{color:var(--pink);letter-spacing:2px}
#hudBottom{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:5px}
#hudStatus{font-family:var(--font-tv);font-size:25px;background:rgba(10,8,20,.55);padding:2px 14px;border-radius:12px;white-space:nowrap;max-width:720px;overflow:hidden;text-overflow:ellipsis}
#meter{width:230px;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#meter i{display:block;height:100%;width:0;background:var(--cyan);border-radius:6px;transition:width .12s}
#meter.danger i{background:var(--danger)}
#banner{position:absolute;left:0;right:0;top:112px;text-align:center;z-index:14;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.9)}
#banner.show{opacity:1;transform:scale(1)}
#banner h2{margin:0;font-size:52px;font-weight:700;color:#fff;text-shadow:0 4px 0 var(--trim-dark),0 8px 20px rgba(0,0,0,.6);text-wrap:balance}
#banner h3{margin:2px 0 0;font-size:26px;font-weight:600;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.7)}
#banner p{margin:10px auto 0;max-width:600px;font-family:var(--font-tv);font-size:24px;line-height:1.05;background:rgba(10,8,20,.6);padding:6px 12px;border-radius:12px}
#banner.boss h2{color:#ffe1f0;text-shadow:0 4px 0 #8a1f5a,0 0 30px rgba(255,80,160,.7)}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:14;font-weight:600;font-size:24px;color:#fff;background:rgba(20,14,40,.7);padding:4px 16px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1}

/* overlays (menu, pause, game over, power-off) */
.overlay{position:absolute;inset:0;z-index:16}
#menu{padding:58px 20px 0;box-sizing:border-box}
#menu h1{margin:0 0 8px;font-size:22px;font-weight:600;color:var(--cyan);font-family:var(--font-tv);font-size:28px;letter-spacing:.06em}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:760px}
.card{display:grid;grid-template-columns:50px 1fr;align-items:start;gap:10px;background:rgba(18,14,36,.78);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 10px 8px 8px;cursor:pointer;color:inherit;font:inherit;text-align:left;min-height:128px;box-sizing:border-box}
.card .info{min-width:0}
.card:focus-visible,.card.sel{border-color:var(--gold);background:rgba(40,28,80,.9);outline:none;transform:translateY(-2px)}
.card{transition:transform .15s,background .15s}
.card .ch{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-tv);font-size:24px;line-height:.8;color:#140f22;font-weight:700}
.card .ch small{display:block;font-size:15px}
.card b{display:block;font-size:21px;font-weight:700;line-height:1.05}
.card span{display:block;font-size:14.5px;color:#cfc6e6;line-height:1.15}
.card .best{font-family:var(--font-tv);font-size:20px;color:var(--gold);line-height:1;margin-top:4px;display:flex;align-items:center;gap:8px}
.card .cont{pointer-events:auto;font:inherit;font-size:14px;font-weight:600;background:var(--trim);color:#fff;border:0;border-radius:999px;padding:2px 9px;cursor:pointer}
#menuHint{position:absolute;left:24px;right:24px;bottom:12px;font-family:var(--font-tv);font-size:21px;color:#cfc6e6;text-align:center;line-height:1}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(16,12,34,.9);border:2px solid rgba(255,255,255,.15);border-radius:24px;padding:22px 30px;text-align:center;min-width:300px}
.panel h2{margin:0 0 6px;font-size:40px;color:#fff}
.panel p{margin:0 0 14px;font-family:var(--font-tv);font-size:25px;color:#e3dcf5;line-height:1.05}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:20px;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;background:var(--cyan);color:#0b1830}
.btn.alt{background:#4a4060;color:#fff}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#offScreen{display:grid;place-items:center;background:linear-gradient(118deg,#15151d,#050508 38%,#050508);color:#8d8c99;font-size:20px}
#offScreen.hide{display:none}
#offScreen .dot{width:6px;height:6px;border-radius:50%;background:#333;box-shadow:0 0 0 0 transparent}

/* remote bar */
#remote{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:4;width:46px;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:9px 0 12px;border-radius:23px;background:linear-gradient(90deg,#2c2a37,var(--remote) 45%,#14131a);box-shadow:0 16px 30px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14),inset -2px 0 0 rgba(0,0,0,.35);
  transition:opacity .45s,transform .45s}
#remote::before{content:"";width:4px;height:4px;border-radius:50%;background:#c2263a;box-shadow:0 0 6px #ff3048}
body.on #remote::before{background:#e8f7ff;box-shadow:0 0 6px #bfefff}
#remote button,.rdpad i,.rab i{font:inherit;font-style:normal;color:var(--remote-ink);border:0;cursor:pointer;display:grid;place-items:center;line-height:1;
  background:linear-gradient(180deg,#4a4757,#2b2935);box-shadow:0 2px 0 #0b0a0f,0 3px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .06s,box-shadow .06s}
#remote button{width:26px;height:26px;border-radius:50%;font-size:10px}
#remote button.sm{width:20px;height:20px;font-size:9px}
#remote button:active,.rdpad i:active,.rab i:active,.rdpad i.down,.rab i.down{transform:translateY(2px);box-shadow:0 0 0 #0b0a0f,0 1px 1px rgba(0,0,0,.4),inset 0 1px 2px rgba(0,0,0,.4)}
#remote button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#remote #rPlay{width:30px;height:30px;font-size:12px;background:linear-gradient(180deg,#ff9a5a,var(--trim));color:#fff;box-shadow:0 2px 0 var(--trim-dark),0 3px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
#remote #rPause{font-size:8px;letter-spacing:-1px}
body:not(.on) #rPlay{animation:rpulse 1.6s ease-in-out infinite}
@keyframes rpulse{50%{box-shadow:0 2px 0 var(--trim-dark),0 0 0 5px rgba(255,122,47,.3)}}
#rPower.on{color:#7dffb0}
.rdpad{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(3,12px);gap:1px;margin-top:4px;padding:3px;border-radius:50%;background:radial-gradient(circle,#1a1920 60%,#0e0d12)}
.rdpad i{font-size:6px;border-radius:3px}
.rdpad .u{grid-column:2;grid-row:1}.rdpad .l{grid-column:1;grid-row:2}.rdpad .c{grid-column:2;grid-row:2;border-radius:50%;background:linear-gradient(180deg,#3a3846,#24232d)}.rdpad .r{grid-column:3;grid-row:2}.rdpad .d{grid-column:2;grid-row:3}
.rab{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.rab i{width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:700;color:#fff}
.rab .a{background:linear-gradient(180deg,#ff9a5a,var(--trim));box-shadow:0 2px 0 var(--trim-dark),0 3px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.rab .b{background:linear-gradient(180deg,#6cc8e2,#2f93b3);box-shadow:0 2px 0 #1d6278,0 3px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
body.zoom #remote{opacity:0;pointer-events:none;transform:translate(40px,-50%)}
body.zoom #help{opacity:0;pointer-events:none}

/* start prompt + touch pad below the TV */
#pad{position:absolute;left:0;right:0;bottom:0;z-index:3;display:none;justify-content:space-between;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:var(--pad-bg);border-radius:22px 22px 0 0}
#pad.show{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pbtn{border:0;border-radius:14px;background:var(--pad-btn);color:var(--pad-ink);font:inherit;font-size:22px;font-weight:700;touch-action:none;-webkit-tap-highlight-color:transparent}
.pbtn.down{filter:brightness(1.5)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.mid .pbtn{font-size:13px;padding:8px 10px;letter-spacing:.08em}
.ab{display:flex;gap:12px;align-items:center}
.ab .pbtn{width:70px;height:70px;border-radius:50%;font-size:26px}
.ab .a{background:var(--trim);color:#fff}.ab .b{background:#3aa9c9;color:#fff}
#help{position:absolute;left:0;right:0;bottom:8px;z-index:3;transition:opacity .45s;text-align:center;font-size:14px;color:var(--ink-soft);margin:0;padding:0 16px}
#help kbd{font-family:var(--font-tv);font-size:17px;background:var(--kbd);color:var(--ink);border-radius:5px;padding:0 6px;box-shadow:0 2px 0 var(--kbd-edge)}
body.touch #help{display:none}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.ab{gap:8px}.ab .pbtn{width:58px;height:58px}.mid .pbtn{font-size:11px;padding:7px 8px}}
@media (prefers-reduced-motion: reduce){#tv,#stage.anim{transition-duration:.01s}body:not(.on) #rPlay{animation:none}#logo .hand{animation:none}}
</style>

<div id="room">
  <div id="stage">
    <div id="glow"></div>
    <div id="console"></div>
    <div id="tv">
      <div class="face" id="topFace"></div>
      <div class="face" id="leftFace"></div>
      <div class="face" id="rightFace"></div>
      <div class="face" id="front">
        <div id="stand"></div><div id="standBase"></div>
        <div id="screenWrap"><div id="screen">
          <canvas id="gl" width="800" height="450"></canvas>
          <div id="wake"></div>
          <div id="hud">
            <div id="logo" class="gone" aria-label="CydniTime">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#4ff3ff" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="7.2" fill="#0d1b2e"/><g class="hand"><rect x="11.1" y="6" width="1.8" height="6.6" rx=".9" fill="#ff7a2f"/></g><rect x="11.2" y="11.2" width="5" height="1.6" rx=".8" fill="#fff"/></svg>
              <span><span class="c">Cydni</span><span class="t">Time</span></span>
            </div>
            <div id="hudR" class="hide"><div id="hudGame"></div><div class="lv" id="hudLevel"></div><div id="hudScore"></div><div class="lives" id="hudLives"></div></div>
            <div id="hudBottom" class="hide"><div id="hudStatus"></div><div id="meter"><i></i></div></div>
          </div>
          <div id="banner"><h2></h2><h3></h3><p></p></div>
          <div id="toast"></div>
          <div id="menu" class="overlay hide">
            <h1>PICK A CHANNEL</h1>
            <div id="cards"></div>
            <div id="menuHint">Arrows choose · Enter or Z plays · P pauses</div>
          </div>
          <div id="pausePanel" class="overlay hide"><div class="panel"><h2>Paused</h2><p id="pauseInfo"></p><div class="row">
            <button class="btn" id="bResume">Resume</button><button class="btn alt" id="bRestart">Restart level</button><button class="btn alt" id="bMenu">Channels</button></div></div></div>
          <div id="overPanel" class="overlay hide"><div class="panel"><h2>Game over</h2><p id="overInfo"></p><div class="row">
            <button class="btn" id="bRetry">Play again</button><button class="btn alt" id="bOverMenu">Channels</button></div></div></div>
          <div id="offScreen" class="overlay"></div>
          <div id="glare"></div>
        </div></div>
        <div id="brand">CYDNI</div><div id="led"></div>
      </div>
    </div>
  </div>
  <div id="remote" aria-label="Remote">
    <button id="rPower" class="sm" aria-label="Power" title="Power">⏻</button>
    <button id="rPlay" aria-label="Play" title="Play">▶</button>
    <button id="rPause" aria-label="Pause" title="Pause">❚❚</button>
    <button id="rMenu" aria-label="Channels" title="Channels">☰</button>
    <button id="rSound" aria-label="Sound" title="Sound on/off">♪</button>
    <div class="rdpad" aria-hidden="true"><i class="u">▲</i><i class="l">◀</i><i class="c"></i><i class="r">▶</i><i class="d">▼</i></div>
    <div class="rab" aria-hidden="true"><i class="b">B</i><i class="a">A</i></div>

<script>

/* ================= audio ================= */
const Snd={ctx:null,master:null,on:true,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=.4;this.master.connect(this.ctx.destination)}catch(e){this.ctx=null}},

/* ================= three helpers ================= */
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.05,flatShading:true},o));

function baseScene({top,bottom,fog,stars=false,fov=50,light=1,hemi=.85,sun=0xffffff}){
  const scene=new THREE.Scene();scene.background=new THREE.Color(bottom);
  if(fog)scene.fog=new THREE.Fog(bottom,fog[0],fog[1]);
  const g=new THREE.SphereGeometry(300,24,14),pos=g.attributes.position,col=[],t=new THREE.Color(top),b=new THREE.Color(bottom);
  for(let i=0;i<pos.count;i++){const k=clamp((pos.getY(i)/300+.15)/.9,0,1);const c=b.clone().lerp(t,k);col.push(c.r,c.g,c.b)}

  const sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));sky.renderOrder=-2;scene.add(sky);
  if(stars){const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<300;i++){const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*.45;sp.push(250*Math.sin(ph)*Math.cos(th),250*Math.cos(ph)+10,250*Math.sin(ph)*Math.sin(th))}
    sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));const st=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false}));sky.add(st)}
  scene.add(new THREE.HemisphereLight(0xe8f0ff,0x5a4a6a,hemi));
  const d=new THREE.DirectionalLight(sun,light);d.position.set(5,10,8);scene.add(d);
  const cam=new THREE.PerspectiveCamera(fov,16/9,.1,700);

}
function disposeScene(scene){scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}})}

/* confetti / sparkle particles */
function makeFX(scene){
  const geo=new THREE.PlaneGeometry(.16,.1),cols=[0xff6fb5,0xffd34d,0x4ff3ff,0x8cff7a,0xffffff,0xff9a3c,0xb08cff];
  const mats=cols.map(c=>Basic(c,{side:THREE.DoubleSide}));const pool=[];
  return{burst(p,n=20,sp=4,colors){for(let i=0;i<n;i++){let q=pool.find(o=>!o.alive);if(!q){if(pool.length>260)return;q={m:mesh(geo,mats[0]),v:V3(),alive:false};scene.add(q.m);pool.push(q)}
      q.m.material=colors?Basic(pick(colors),{side:THREE.DoubleSide}):pick(mats);q.alive=true;q.life=.8+Math.random()*.7;q.m.visible=true;q.m.position.copy(p);q.v.set(rand(-1,1)*sp,rand(.4,1.4)*sp,rand(-1,1)*sp);q.m.rotation.set(rand(0,6),rand(0,6),0);q.m.scale.setScalar(1)}},
    update(dt){for(const q of pool){if(!q.alive)continue;q.v.y-=7*dt;q.v.multiplyScalar(1-1.2*dt);q.m.position.addScaledVector(q.v,dt);q.m.rotation.x+=dt*8;q.m.rotation.y+=dt*6;q.life-=dt;if(q.life<.3)q.m.scale.setScalar(Math.max(.01,q.life/.3));if(q.life<=0){q.alive=false;q.m.visible=false}}}};
}

/* ================= Cydni the bot ================= */
function makeBot(){
  const root=new THREE.Group(),inner=new THREE.Group();root.add(inner);
  const white=new THREE.MeshStandardMaterial({color:0xf4f7fb,roughness:.28,metalness:.05});
  const accent=new THREE.MeshStandardMaterial({color:0xff7a2f,roughness:.35});
  const dark=new THREE.MeshStandardMaterial({color:0x0d1b2e,roughness:.12,metalness:.35});
  const glow=Basic(0x4ff3ff);
  /* head */
  const head=new THREE.Group();head.position.y=.2;head.scale.setScalar(.66);inner.add(head);
  const skull=mesh(new THREE.SphereGeometry(.5,32,24),white);skull.scale.set(1,.94,1);head.add(skull);
  head.add(mesh(new THREE.SphereGeometry(.513,32,16,Math.PI/2-.95,1.9,Math.PI/2-.55,1.0),dark));
  const eg=new THREE.SphereGeometry(1,14,10);
  const eyes=[-1,1].map(s=>{const e=mesh(eg,glow,s*.14,.06,.475);e.scale.set(.066,.1,.04);head.add(e);return e});
  const smile=mesh(new THREE.TorusGeometry(.075,.015,6,16,Math.PI),glow,0,-.075,.497);smile.rotation.z=Math.PI;head.add(smile);
  head.add(mesh(new THREE.CylinderGeometry(.016,.016,.22,6),white,0,.55,0));
  const tip=mesh(new THREE.SphereGeometry(.058,12,10),accent,0,.68,0);head.add(tip);
  [-1,1].forEach(s=>{const p=mesh(new THREE.CylinderGeometry(.12,.12,.08,20),accent,s*.49,.02,0);p.rotation.z=Math.PI/2;head.add(p)});
  /* neck + torso */
  inner.add(mesh(new THREE.CylinderGeometry(.065,.085,.12,14),dark,0,-.13,0));
  const torso=mesh(new THREE.SphereGeometry(.26,26,20),white,0,-.34,0);torso.scale.set(1,1.1,.86);inner.add(torso);
  const belt=mesh(new THREE.TorusGeometry(.238,.028,8,28),accent,0,-.42,0);belt.rotation.x=Math.PI/2;belt.scale.set(1,.86,1);inner.add(belt);
  const chest=mesh(new THREE.CircleGeometry(.062,20),glow,0,-.27,.215);chest.rotation.x=-.25;inner.add(chest);
  inner.add(rot(mesh(new THREE.TorusGeometry(.075,.014,6,20),accent,0,-.27,.212),'x',-.25));
  /* arms */
  const arms=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(s*.25,-.22,0);inner.add(a);
    a.add(mesh(new THREE.SphereGeometry(.062,12,10),accent,0,0,0));
    const up=mesh(new THREE.CylinderGeometry(.042,.036,.22,10),white,0,-.13,0);a.add(up);
    a.add(rot(mesh(new THREE.TorusGeometry(.042,.013,6,14),accent,0,-.23,0),'x',Math.PI/2));
    a.add(mesh(new THREE.SphereGeometry(.07,12,10),white,0,-.29,.01));
    a.userData.s=s;return a});
  /* hover base */
  inner.add(mesh(new THREE.CylinderGeometry(.17,.1,.12,22),dark,0,-.6,0));
  const ring=mesh(new THREE.TorusGeometry(.13,.028,8,22),glow,0,-.67,0);ring.rotation.x=Math.PI/2;inner.add(ring);
  const flame=mesh(new THREE.ConeGeometry(.12,.3,16,1,true),Basic(0x4ff3ff,{transparent:true,opacity:.35,depthWrite:false}),0,-.82,0);flame.rotation.x=Math.PI;inner.add(flame);
  root.userData={inner,head,eyes,arms,flame,tip,glow,t:Math.random()*9,blink:2,spin:0,moodT:0,wave:0};
  return root;
}
function updateBot(b,dt){const u=b.userData;u.t+=dt;u.inner.position.y=Math.sin(u.t*3)*.05;
  u.arms.forEach((a,i)=>{a.rotation.z=a.userData.s*(.22+Math.sin(u.t*3+i*1.5)*.08);a.rotation.x=Math.sin(u.t*2+i)*.12});
  if(u.wave>0){u.wave-=dt;u.arms[1].rotation.z=2.5+Math.sin(u.t*14)*.35}
  u.head.rotation.z=Math.sin(u.t*1.3)*.05;
  u.flame.scale.y=.8+Math.sin(u.t*31)*.2;u.blink-=dt;if(u.blink<0)u.blink=2+Math.random()*3;
  const s=u.blink<.12?.15:1;u.eyes.forEach(e=>e.scale.y=.1*s);
  if(u.spin>0){u.spin-=dt;u.inner.rotation.y+=dt*16}else u.inner.rotation.y*=.85;
  if(u.moodT>0){u.moodT-=dt;if(u.moodT<=0)u.glow.color.setHex(0x4ff3ff)}}
function botMood(b,color,t=1){b.userData.glow.color.setHex(color);b.userData.moodT=t}

/* ================= generic little person ================= */
function makePerson(color){const g=new THREE.Group();const skin=M(pick([0xf1c27d,0xc68642,0x8d5524,0xffdbac,0xe0ac69]));
  g.add(mesh(new THREE.CylinderGeometry(.17,.22,.62,10),M(color),0,.31,0));g.add(mesh(new THREE.SphereGeometry(.17,12,10),skin,0,.78,0));
  const arm=mesh(new THREE.BoxGeometry(.08,.4,.08),M(color),.24,.62,0);arm.geometry.translate(0,.18,0);arm.position.y=.5;g.add(arm);g.userData.arm=arm;return g}

/* =====================================================================
   GAME 1: BOOP!
   ===================================================================== */
function createBoop(level,api){
  const n=level,boss=n%10===0,tier=Math.floor((n-1)/10),rng=mulberry32(level*7919+13);
  const {scene,cam}=baseScene({top:0x40308e,bottom:0x0d0a26,fog:[26,55],stars:true,fov:42,light:.25,hemi:.6});
  cam.position.set(4.6,4.6,15.6);cam.lookAt(.2,-2.7,2.4);
  const sun=new THREE.DirectionalLight(0xfff4e6,1.05);sun.position.set(-4,10,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.002;
  Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40});sun.target.position.set(0,-2.6,2.6);scene.add(sun);scene.add(sun.target);
  const rim=new THREE.DirectionalLight(0x8fb4ff,.35);rim.position.set(6,2,-4);scene.add(rim);
  const fx=makeFX(scene);const ROWS=7,H=.85,XS=.62;
  const PALS=[[0x41e2c0,0xffcc4d],[0xff7ab8,0x9be36b],[0x6cb6ff,0xffad5c],[0xc58cff,0x5ff0d4],[0xffe066,0xff7a7a]];
  const pal=PALS[(n-1)%PALS.length];const DULL=0x4b4573;
  const P=(r,c)=>V3((2*c-r)*XS,-r*H,r*H);
  const pDouble=n>=3?Math.min(.55,(n-2)*.07)+(boss?.1:0):0, pCycle=n>=6?Math.min(.3,(n-5)*.035):0,
        pSlip=n>=4?Math.min(.18,(n-3)*.03):0, pVanish=n>=12?Math.min(.22,(n-11)*.02):0;
  const bodyGeo=new THREE.BoxGeometry(1.16,.9,.9),topGeo=new THREE.BoxGeometry(1.12,.08,.86),insetGeo=new THREE.BoxGeometry(.56,.09,.4),ringGeo=new THREE.TorusGeometry(.3,.035,6,24);
  const sideMat=M(0x2a2550),slipMat=M(0x8fe3ff,{metalness:.5,roughness:.15}),ringMat=Basic(0xffffff),insetMat=M(0x2a2550),vanMat=M(0x5a3a6e);
  const grid=[],cubes=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<=r;c++){
    const p=P(r,c),g=new THREE.Group();g.position.copy(p);scene.add(g);
    const cube={r,c,p,g,state:0,target:1,cycle:false,slip:false,vanish:false,sunk:false,vt:rng()*6,bump:0};
    if(r||c){if(rng()<pDouble)cube.target=2;if(rng()<pCycle)cube.cycle=true;if(rng()<pSlip)cube.slip=true;else if(rng()<pVanish)cube.vanish=true}
    g.add(mesh(bodyGeo,cube.slip?slipMat:cube.vanish?vanMat:sideMat,0,-.53,0));
    cube.topMat=M(DULL);cube.top=mesh(topGeo,cube.topMat,0,-.04,0);g.add(cube.top);
    if(cube.target===2){cube.inset=mesh(insetGeo,insetMat,0,-.03,0);g.add(cube.inset)}
    if(cube.cycle){const ring=mesh(ringGeo,ringMat,0,.01,0);ring.rotation.x=Math.PI/2;g.add(ring)}
    grid[r][c]=cube;cubes.push(cube)}}
  const at=(r,c)=>(r>=0&&r<ROWS&&c>=0&&c<=r)?grid[r][c]:null;
  function paint(cube){const lit=cube.state>=cube.target;const col=lit?pal[0]:cube.state>0?pal[1]:DULL;cube.topMat.color.setHex(col);cube.topMat.emissive.setHex(lit?pal[0]:0);cube.topMat.emissiveIntensity=lit?.35:0;if(cube.inset)cube.inset.visible=cube.state===0}
  const PENT=[0,2,4,7,9,12,14,16,19,21];const mel=[];{let i=4;for(let k=0;k<48;k++){i=clamp(i+[-2,-1,1,1,2][Math.floor(rng()*5)],0,9);mel.push(PENT[i])}}let mi=0;

  const bot=makeBot();bot.scale.setScalar(1.05);scene.add(bot);
  cubes.forEach(c=>c.g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}}));
  bot.traverse(o=>{if(o.isMesh&&!o.material.transparent)o.castShadow=true});
  const B={r:0,c:0,hop:null,fall:false,fv:0,inv:0,queue:null,next:null};const STAND=.7;
  /* floating key badges show where each arrow key hops */
  function keyTex(rt){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();x.arc(48,48,42,0,7);x.fill();x.lineWidth=6;x.strokeStyle='rgba(20,16,50,.35)';x.stroke();
    x.translate(48,48);x.rotate(rt);x.fillStyle='#1b1640';x.beginPath();x.moveTo(0,-30);x.lineTo(24,-2);x.lineTo(9,-2);x.lineTo(9,28);x.lineTo(-9,28);x.lineTo(-9,-2);x.lineTo(-24,-2);x.closePath();x.fill();return new THREE.CanvasTexture(c)}
  const badges={};[['up',0],['right',Math.PI/2],['down',Math.PI],['left',-Math.PI/2]].forEach(([d,r])=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:keyTex(r),depthTest:false,transparent:true,opacity:.9}));sp.scale.setScalar(.5);sp.renderOrder=5;sp.visible=false;scene.add(sp);badges[d]=sp});
  let pend=null,pendT=0;
  const COMBO={upleft:'left',upright:'up',downleft:'down',downright:'right'};
  function comboOf(k){const vert=k==='up'||k==='down';for(const o of vert?['left','right']:['up','down']){if(Input.down[o]||pend===o){return COMBO[(vert?k:o)+(vert?o:k)]}}return null}
  const place=()=>bot.position.copy(P(B.r,B.c)).add(V3(0,STAND,0));place();
  let chain=0,moves=0,time=0,rewinds=1,freezeT=0,done=false,cycleToastT=0;const history=[];
  const mult=()=>1+Math.min(4,Math.floor(chain/5));

  function visit(cube,from){history.push({r:from.r,c:from.c,cube,prev:cube.state});if(history.length>40)history.shift();
    Snd.note(mel[mi++%mel.length]);cube.bump=.12;
    if(cube.state<cube.target){cube.state++;chain++;api.addScore(25*mult());if(cube.state>=cube.target)fx.burst(cube.p.clone().add(V3(0,.2,0)),8,2.2,[pal[0],0xffffff])}
    else if(cube.cycle){cube.state=0;chain=0;Snd.sfx('undo');if(cycleToastT<=0){api.toast('That cube cycled back!');cycleToastT=4}}
    paint(cube);checkDone()}
  paint(grid[0][0]);
  visit(grid[0][0],{r:0,c:0});history.length=0;

  function checkDone(){if(done)return;if(cubes.every(c=>c.state>=c.target)){done=true;
      Snd.arp(mel.slice(0,16),.07);fx.burst(V3(0,-1,2),60,5);
      const bonus=Math.max(0,Math.round((50+n*2-time)*12))+(moves<=cubes.length*1.5?500:0)+(boss?2000:0);
      api.complete(bonus,'Board lit! Song complete.')}}
  const DIRS={up:[-1,0],right:[1,1],down:[1,0],left:[-1,-1]};
  function placeBadges(show){for(const d in DIRS){const sp=badges[d];sp.visible=show;if(!show)continue;const [dr,dc]=DIRS[d];const q=at(B.r+dr,B.c+dc);const p=P(B.r+dr,B.c+dc);
    sp.position.set(p.x,(q?q.g.position.y:p.y)+.42+Math.sin(time*5+dr)*.04,p.z);sp.material.color.setHex(q&&!q.sunk?0xffffff:0xff6b6b);sp.material.opacity=q&&!q.sunk?.92:.6}}

  const R=9+Math.min(4,Math.floor(n/5));

      if(freezeT<=0){spawnT-=dt;const live=climbers.filter(c=>c.state!=='tumble'&&!c.big).length;if(spawnT<=0&&live<maxC){spawnT=spawnEvery*rand(.8,1.2);spawnClimber(false)}}
      for(let i=climbers.length-1;i>=0;i--){const c=climbers[i];const frozen=freezeT>0&&c.state!=='tumble';
        if(c.state==='tumble'){c.vy-=16*dt;c.y+=c.vy*dt;c.x+=c.tvx*dt;c.m.rotation.z+=dt*10;c.m.position.set(c.x,c.y,.3);if(c.y<-3){if(c.respawn){c.k=0;c.x=pd(0)<0?5.8:-5.8;c.y=surf(0,c.x);c.state='walk';c.m.rotation.z=0;pickLadder(c)}else{scene.remove(c.m);climbers.splice(i,1)}}continue}
        if(frozen){c.m.position.set(c.x,c.y+Math.sin(time*30)*.02,.1);continue}
        c.jumpCD-=dt;
        if(c.state==='walk'||c.state==='jump'){
          if(c.k>=NP){const dir=Math.sign(gb.position.x-c.x);c.x+=dir*c.speed*dt;c.y=NP*LH;if(Math.abs(c.x-gb.position.x)<.6&&!ended){Snd.sfx('hurt');gb.scale.setScalar(.8);scene.remove(c.m);climbers.splice(i,1);
              if(c.big){if(!api.hurt('The Captain grabbed your battery!'))return;spawnClimberBigReset()}else if(!api.hurt('A Scrambler grabbed your battery!'))return;continue}}
          else{if(!c.lad)pickLadder(c);const tx=c.lad?c.lad.x:0;const dir=Math.sign(tx-c.x);c.x+=dir*c.speed*dt;if(Math.abs(tx-c.x)<.08){c.x=tx;c.state='climb';c.cp=0}
            if(c.state==='jump'){c.jv-=22*dt;c.jy+=c.jv*dt;if(c.jy<=0){c.jy=0;c.state='walk'}}
            c.y=surf(c.k,c.x)+(c.jy||0);c.m.rotation.y=dir>0?Math.PI/2:-Math.PI/2;
            /* jump over incoming balls */
            if(c.state==='walk'&&c.jumpCD<=0)for(const b of balls){if(!b.falling&&b.k===c.k&&Math.sign(c.x-b.x)===Math.sign(b.vx)&&Math.abs(c.x-b.x)<1.3&&Math.abs(c.x-b.x)>.7){c.jumpCD=1;if(Math.random()<pJump*(c.big?1.6:1)){c.state='jump';c.jv=7.5;c.jy=0}break}}}}
        if(c.state==='climb'){c.cp+=c.climb*dt/(c.lad.y1-c.lad.y0);c.y=lerp(c.lad.y0,c.lad.y1,Math.min(1,c.cp));c.m.rotation.y=Math.PI;
          if(c.cp>=1){c.k++;c.state='walk';c.y=surf(c.k,c.x);c.lad=null;if(c.k<NP)pickLadder(c)}}
        c.m.position.set(c.x,c.y,c.state==='climb'?.55:.1);
        /* collisions */
        for(const b of balls){const hitR=b.r+(c.big?.55:.3);
          if(c.state==='climb'){if(Math.abs(b.x-c.x)<hitR&&Math.abs(b.y-(c.y+.4))<hitR+.2){bonk(c,b);break}}
          else if(c.state!=='jump'||(c.jy||0)<b.r*1.5){if((b.k===c.k||b.falling)&&Math.abs(b.x-c.x)<hitR&&Math.abs(b.y-(c.y+.35))<hitR+.3){bonk(c,b);if(b.big)continue;break}}}
        if(ended)return}
      gb.scale.lerp(V3(1,1,1),dt*3);
      /* power-up balloon */
      if(!pup){pupT-=dt;if(pupT<=0){pupT=rand(10,15);const type=Math.random()<.6?'mega':'freeze';const m=new THREE.Group();m.add(mesh(new THREE.SphereGeometry(.4,14,12),M(type==='mega'?0xff6fb5:0x8fe8ff,{flatShading:false})));m.add(mesh(new THREE.OctahedronGeometry(.18),Basic(0xffffff),0,-.6,0));scene.add(m);pup={type,m,x:rand(-4.5,4.5),y:-1}}}
      else if(Math.abs(pup.y-(NP*LH+.6))<.7&&Math.abs(pup.x-B.x)<.8){Snd.sfx('power');if(pup.type==='mega'){mega++;api.toast('MEGA ball! Press X')}else{freezeT=4;api.toast('Freeze! Scramblers stopped')}fx.burst(pup.m.position,16,3);scene.remove(pup.m);pup=null}
      api.status(boss?`Captain hits ${captain?3-captain.hp:0}/3  ·  Balls ${supply}  ·  Mega ${mega}`:`Bounced ${bonked}/${need}  ·  Balls ${supply}  ·  Mega ${mega}${freezeT>0?'  ·  ❄':''}`);api.meter(boss?(captain?(3-captain.hp)/3:1):bonked/need)}};
  function spawnClimberBigReset(){captain.hp=Math.max(1,captain.hp);captain.k=0;captain.x=5.8;captain.y=surf(0,5.8);captain.state='walk';pickLadder(captain);scene.add(captain.m);climbers.push(captain)}
}

/* ================= game list ================= */
const GAMES=[
  {id:'boop',name:'BOOP!',tag:'Hop the cube pyramid and light it all',color:'#41e2c0',create:createBoop,boss:'The Gloom Cloud',bossTip:'It hops around un-lighting your cubes. Stay out of its way!'},
  {id:'rain',name:'MAKE IT RAIN!',tag:'Toss cash to porches, windows & tip jars',color:'#8cff7a',create:createRain,boss:'The Gala Parade Float',bossTip:'Land tips in the float’s top hat before the street ends.'},
  {id:'block',name:'BOT ON THE BLOCK',tag:'Collect batteries, power the neighborhood',color:'#ffd34d',create:createBlock,boss:'Rush Hour Bus',bossTip:'A bus chases you through the maze. Power the clock tower!'},
  {id:'deliv',name:'SPECIAL DELIVERY',tag:'Balance a wobbly package to the door',color:'#ffb3c6',create:createDelivery,boss:'The Wedding Cake Gauntlet',bossTip:'Five tiers, spinning foam noodles. Keep it steady.'},
  {id:'cloud',name:'CLOUD HOPPER',tag:'Cross sky lanes to the charging pads',color:'#7fd4ff',create:createCloud,boss:'The Static Storm',bossTip:'Yellow lanes get zapped. Hop clear when they flash!'},
  {id:'tower',name:'TOWER TOPPER',tag:'Roll balls down at climbing Scramblers',color:'#ff9a3c',create:createTower,boss:'The Scrambler Captain',bossTip:'Big, fast and jumpy. Bonk it three times!'}];

/* ================= renderer ================= */
const canvas=$('#gl');
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap}catch(e){renderer=null}
let curScene=null,curCam=null;

/* ================= app state ================= */
const App={menuBX:4.05,menuBY:1.85,state:'off',def:null,game:null,level:1,score:0,lives:3,timer:0,sel:0,menu:null,booting:false,overDelay:0,startLevel:1};
const ui={banner:$('#banner'),toast:$('#toast'),status:$('#hudStatus'),meter:$('#meter'),menu:$('#menu'),pause:$('#pausePanel'),over:$('#overPanel'),hudR:$('#hudR'),hudB:$('#hudBottom'),logo:$('#logo')};
let toastT=0;
function toast(msg){ui.toast.textContent=msg;ui.toast.classList.add('show');toastT=1.8}
function banner(h2,h3='',p='',boss=false){ui.banner.querySelector('h2').textContent=h2;ui.banner.querySelector('h3').textContent=h3;const pe=ui.banner.querySelector('p');pe.textContent=p;pe.style.display=p?'':'none';ui.banner.classList.toggle('boss',boss);ui.banner.classList.add('show')}
function hideBanner(){ui.banner.classList.remove('show')}
function hud(){$('#hudGame').textContent=App.def?App.def.name:'';$('#hudLevel').textContent=`LEVEL ${App.level}`;$('#hudScore').textContent=String(App.score).padStart(6,'0');$('#hudLives').textContent='♥'.repeat(Math.max(0,App.lives))}
const api={
  addScore(v){App.score+=Math.round(v);hud()},
  toast,
  status(t){if(ui.status.textContent!==t)ui.status.textContent=t},
  meter(v,danger=false){ui.meter.firstElementChild.style.width=(clamp(v,0,1)*100)+'%';ui.meter.classList.toggle('danger',!!danger)},
  hurt(msg){if(App.state!=='play')return false;App.lives--;hud();Snd.sfx('hurt');if(App.lives<=0){gameOver(msg);return false}toast(msg);return true},
  fail(msg){if(App.state!=='play')return;App.lives--;hud();Snd.sfx('hurt');if(App.lives<=0){gameOver(msg);return}App.state='retry';App.timer=2.4;banner('Try again',msg,`${App.lives} ${App.lives===1?'life':'lives'} left`)},
  complete(bonus,msg){if(App.state!=='play')return;App.score+=Math.round(bonus);App.state='clear';App.timer=2.8;Snd.sfx('clear');
    const r=rec(App.def.id);const isBoss=App.level%10===0;
    if(isBoss){App.lives=Math.min(5,App.lives+1);r.cp=Math.max(r.cp,App.level+1)}
    r.best=Math.max(r.best,App.level);r.hi=Math.max(r.hi,App.score);persist();hud();
    banner(isBoss?'BOSS BEATEN!':'LEVEL CLEAR!',msg,`Bonus +${Math.round(bonus)}${isBoss?` · Extra life · Checkpoint saved at level ${App.level+1}`:''}`,isBoss)}
};
function disposeGame(){if(App.game){disposeScene(App.game.scene);App.game=null}}
function loadLevel(level){disposeGame();App.level=level;hideBanner();
  try{App.game=App.def.create(level,api)}catch(e){console.error(e);toast('That level failed to load');return toMenu()}
  curScene=App.game.scene;curCam=App.game.cam;App.state='intro';App.timer=boss(level)?3.4:2.6;hud();api.meter(0);ui.status.textContent='';
  App.game.update(0,false);
  if(boss(level)){Snd.sfx('boss');banner(`BOSS · LEVEL ${level}`,App.def.boss,App.def.bossTip+'\n'+App.game.hint,true)}
  else banner(`${App.def.name}`,`Level ${level}${App.game.intro?' · '+App.game.intro:''}`,App.game.hint)}
const boss=l=>l%10===0;
function startRun(i,level){Snd.init();const def=GAMES[i];App.def=def;App.score=0;App.lives=3;App.startLevel=level;
  ui.menu.classList.add('hide');ui.over.classList.add('hide');ui.pause.classList.add('hide');ui.hudR.classList.remove('hide');ui.hudB.classList.remove('hide');
  if(App.menu){disposeScene(App.menu.scene);App.menu=null}setZoom(true);loadLevel(level)}
function gameOver(msg){App.state='overwait';App.overDelay=1.3;const r=rec(App.def.id);r.hi=Math.max(r.hi,App.score);r.best=Math.max(r.best,App.level-1);persist();
  $('#overInfo').innerHTML='';const p=$('#overInfo');p.append(msg,document.createElement('br'),`Score ${App.score} · reached level ${App.level}`,document.createElement('br'),`High score ${r.hi}`);
  $('#bRetry').textContent=r.cp>1?`Play from level ${r.cp}`:'Play again'}
function pause(){if(App.state!=='play'&&App.state!=='intro')return;App.prev=App.state;App.state='paused';$('#pauseInfo').textContent=`${App.def.name} · Level ${App.level}`;ui.pause.classList.remove('hide');setTimeout(()=>$('#bResume').focus(),0)}
function resume(){if(App.state!=='paused')return;App.state=App.prev||'play';ui.pause.classList.add('hide');Input.down={}}
function toMenu(){setZoom(false);disposeGame();App.def=null;ui.pause.classList.add('hide');ui.over.classList.add('hide');hideBanner();ui.hudR.classList.add('hide');ui.hudB.classList.add('hide');buildMenu();App.state='menu';ui.menu.classList.remove('hide')}

/* ================= menu ================= */
function makeMenuScene(){const {scene,cam}=baseScene({top:0x3b2a86,bottom:0x0d0a26,stars:true,fov:45});cam.position.set(0,.3,6.2);cam.lookAt(0,.1,0);
  const BX=App.menuBX,BY=App.menuBY;const bot=makeBot();bot.position.set(BX,BY,0);bot.scale.setScalar(.78);scene.add(bot);
  const ring=mesh(new THREE.TorusGeometry(.5,.035,8,40),Basic(0x4ff3ff,{transparent:true,opacity:.5}),BX,BY-.4,0);ring.rotation.x=Math.PI/2;scene.add(ring);
  const fx=makeFX(scene);const orbs=[];for(let i=0;i<6;i++){const m=mesh(new THREE.OctahedronGeometry(.13),Basic(new THREE.Color(GAMES[i].color).getHex()),0,0,0);scene.add(m);orbs.push(m)}
  let t=0;return{scene,cam,bot,fx,update(dt){t+=dt;updateBot(bot,dt);fx.update(dt);bot.rotation.y=Math.sin(t*.7)*.35-.25;ring.rotation.z+=dt;ring.scale.setScalar(1+Math.sin(t*2)*.05);
    orbs.forEach((o,i)=>{const a=t*.8+i/6*Math.PI*2;o.position.set(BX+Math.cos(a)*.85,BY+Math.sin(a*1.3)*.15,Math.sin(a)*.85);o.rotation.y+=dt*2;o.scale.setScalar(i===App.sel?1.3:.7)});
    if(App.booting){bot.position.x=lerp(bot.position.x,App.bootX,dt*2.5);bot.position.y=lerp(bot.position.y,App.bootY,dt*2.5);bot.scale.setScalar(lerp(bot.scale.x,App.bootS,dt*2.5))}}}}
function buildMenu(){if(!App.menu)App.menu=makeMenuScene();curScene=App.menu.scene;curCam=App.menu.cam;
  const box=$('#cards');box.innerHTML='';GAMES.forEach((g,i)=>{const r=rec(g.id);const b=document.createElement('button');b.className='card'+(i===App.sel?' sel':'');b.id='card-'+g.id;
    b.innerHTML=`<div class="ch" style="background:${g.color}"><div>CH<small>${i+1}</small></div></div><div class="info"><b></b><span></span><div class="best"></div></div>`;
    b.querySelector('b').textContent=g.name;b.querySelector('span').textContent=g.tag;const best=b.querySelector('.best');best.textContent=r.best?`BEST LV ${r.best}`:'NEW';
    if(r.cp>1){const c=document.createElement('button');c.className='cont';c.textContent=`▶ Lv ${r.cp}`;c.addEventListener('click',e=>{e.stopPropagation();startRun(i,r.cp)});best.append(c)}
    b.addEventListener('click',()=>{App.sel=i;startRun(i,1)});b.addEventListener('mouseenter',()=>{App.sel=i;markSel()});box.append(b)})}
function markSel(){document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('sel',i===App.sel))}

/* ================= boot sequence ================= */
function wake(){const w=$('#wake');w.className='';void w.offsetWidth;w.classList.add('go')}
function powerOn(){if(App.state!=='off'||App.booting)return;Snd.init();App.booting=true;
  const tv=$('#tv');const already=tv.classList.contains('front');tv.classList.add('front');const T=already?0:1550;
  setTimeout(()=>{$('#rPower').classList.add('on');$('#led').classList.add('on');$('#offScreen').classList.add('hide');document.body.classList.add('on');wake();Snd.tone(220,.6,'sine',.12,2)},T);
  setTimeout(()=>{$('#screen').classList.add('on');App.bootX=0;App.bootY=-.45;App.bootS=1.2;App.menu=makeMenuScene();App.menu.bot.position.set(-7,-.45,0);curScene=App.menu.scene;curCam=App.menu.cam;App.state='boot';
    ui.logo.classList.remove('gone');ui.logo.classList.add('center');Snd.sfx('boot');App.menu.bot.userData.wave=2},T+450);
  setTimeout(()=>{ui.logo.classList.remove('center');App.bootX=App.menuBX;App.bootY=App.menuBY;App.bootS=.78;App.menu.fx.burst(V3(0,0,0),40,2.5)},T+2100);
  setTimeout(()=>{App.booting=false;toMenu();const c=document.querySelector('.card.sel');if(c)c.focus({preventScroll:true})},T+2800)}
function powerOff(){if(App.state==='off'||App.booting)return;disposeGame();if(App.menu){disposeScene(App.menu.scene);App.menu=null}
  ['#menu','#pausePanel','#overPanel','#hudR','#hudBottom'].forEach(s=>$(s).classList.add('hide'));hideBanner();ui.logo.classList.add('gone');
  $('#screen').classList.remove('on');document.body.classList.remove('on');setZoom(false);
  setTimeout(()=>{curScene=null;$('#offScreen').classList.remove('hide');$('#rPower').classList.remove('on');$('#led').classList.remove('on');App.state='off'},600)}

/* ================= main loop ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(toastT>0){toastT-=dt;if(toastT<=0)ui.toast.classList.remove('show')}
  if(Input.was('pause')){if(App.state==='play'||App.state==='intro')pause();else if(App.state==='paused')resume()}
  switch(App.state){
    case'boot':App.menu&&App.menu.update(dt);break;
    case'menu':App.menu.update(dt);
      if(Input.was('up')){App.sel=(App.sel+GAMES.length-1)%GAMES.length;markSel();Snd.sfx('click')}
      if(Input.was('down')){App.sel=(App.sel+1)%GAMES.length;markSel();Snd.sfx('click')}
      if(Input.was('enter')||Input.was('a'))startRun(App.sel,1);break;
    case'intro':App.game.update(dt,false);App.timer-=dt;if(App.timer<=0||(App.timer<1.6&&(Input.was('a')||Input.was('enter')))){App.state='play';hideBanner();Input.pressed.clear()}break;
    case'play':App.game.update(dt,true);break;
    case'clear':App.game.update(dt,false);App.timer-=dt;if(App.timer<=0)loadLevel(App.level+1);break;
    case'retry':App.game.update(dt,false);App.timer-=dt;if(App.timer<=0)loadLevel(App.level);break;
    case'overwait':App.game.update(dt,false);App.overDelay-=dt;if(App.overDelay<=0){App.state='over';Snd.sfx('over');ui.over.classList.remove('hide');setTimeout(()=>$('#bRetry').focus(),0)}break;
    case'over':case'paused':break;
  }
  if(renderer&&curScene&&curCam){const sky=curScene.userData.sky;if(sky)sky.position.copy(curCam.position);renderer.render(curScene,curCam)}
  Input.end();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ================= wiring ================= */
function playBtn(){Snd.init();Snd.sfx('click');if(App.state==='off')powerOn();else if(App.state==='menu')startRun(App.sel,1);else if(App.state==='paused')resume();else if(App.state==='over')$('#bRetry').click();else if(App.state==='intro'){App.timer=0}}
$('#rPlay').addEventListener('click',playBtn);
$('#rPause').addEventListener('click',()=>{Snd.init();Snd.sfx('click');if(App.state==='play'||App.state==='intro')pause();else if(App.state==='paused')resume()});
document.querySelectorAll('.rdpad i,.rab i').forEach(el=>el.addEventListener('pointerdown',()=>{Snd.init();Snd.sfx('click')}));
$('#rPower').addEventListener('click',()=>{Snd.init();App.state==='off'?powerOn():powerOff()});
$('#offScreen').addEventListener('click',playBtn);
function channelKnob(){Snd.init();Snd.sfx('click');if(App.state==='off'){powerOn();return}
  if(App.state==='menu'){App.sel=(App.sel+1)%GAMES.length;markSel()}else if(App.state==='play'||App.state==='intro')pause();else if(App.state==='paused'||App.state==='over'||App.state==='clear'||App.state==='retry')toMenu()}
$('#rMenu').addEventListener('click',channelKnob);
function soundToggle(){Snd.init();const on=Snd.toggle();toast(on?'Sound on':'Sound off');$('#rSound').style.opacity=on?1:.5}
$('#rSound').addEventListener('click',soundToggle);
$('#bResume').addEventListener('click',resume);
$('#bRestart').addEventListener('click',()=>{ui.pause.classList.add('hide');loadLevel(App.level)});
$('#bMenu').addEventListener('click',toMenu);
$('#bRetry').addEventListener('click',()=>{const i=GAMES.indexOf(App.def);const r=rec(App.def.id);startRun(i,r.cp)});
$('#bOverMenu').addEventListener('click',toMenu);

document.querySelectorAll('#pad [data-k]').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();b.setPointerCapture&&b.setPointerCapture(e.pointerId);b.classList.add('down');Input.press(k);if(k==='a'&&App.state==='menu')startRun(App.sel,1)});
  const up=()=>{b.classList.remove('down');Input.release(k)};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});

/* ================= layout fit ================= */
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(touch){document.body.classList.add('touch')}
let zoomed=false;
function setZoom(z){if(zoomed===z)return;zoomed=z;fit()}
function fit(){const vw=innerWidth,vh=innerHeight;const padH=0;
  document.body.classList.toggle('zoom',zoomed);const st=$('#stage');let s,x,y;
  if(zoomed){const availH=vh-padH;const m=Math.max(3,Math.min(vw,availH)*.008);s=Math.min((vw-2*m)/(828*1.02),(availH-2*m)/(478*1.02),4);x=vw/2-414*s;y=availH/2-239*s}
  else{const remW=66,helpH=touch?0:30;const availW=vw-remW-16,availH=vh-padH-helpH;s=Math.max(.2,Math.min((availW-16)/(828*1.04),(availH-24)/(610*1.04),1.5));x=16+(availW-16-828*s)/2;y=Math.max(12,(availH-610*s)/2+6)}
  st.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  if(renderer){renderer.setPixelRatio(Math.min(2.5,(devicePixelRatio||1)*s));renderer.setSize(800,450,false)}}
addEventListener('resize',fit);fit();requestAnimationFrame(()=>$('#stage').classList.add('anim'));
if(!renderer){$('#offScreen').textContent='WebGL is unavailable in this browser.';}
</script>
