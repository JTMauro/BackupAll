<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MiVida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a tabletop with raised slabs — sidebar slab + main slab; tasks are extruded blocks on a tilted 3D plane. */
:root{
  --bg:#E3E6EB; --bg-2:#D6DAE1; --surface:#F7F8FA; --surface-2:#ECEFF3; --surface-3:#DFE3EA;
  --ink:#18202D; --muted:#5A6476; --faint:#8A93A3; --line:rgba(24,32,45,.11); --line-2:rgba(24,32,45,.2);
  --accent:#EC5B26; --accent-ink:#FFFFFF; --accent-soft:rgba(236,91,38,.13);
  --good:#15946D; --warn:#C98309; --bad:#D63A4E; --info:#2F6FDB;
  --shadow-rgb:38,50,74; --edge:rgba(24,32,45,.18); --hi:rgba(255,255,255,.85);
  --grid-off:rgba(24,32,45,.045); --grid-line:rgba(24,32,45,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
  --slab: 0 1px 0 var(--hi) inset, 0 -1px 0 rgba(0,0,0,.04) inset, 0 2px 0 var(--edge), 0 18px 40px -18px rgba(var(--shadow-rgb),.45), 0 4px 10px -4px rgba(var(--shadow-rgb),.18);
  --key: 0 1px 0 var(--hi) inset, 0 2px 0 var(--edge), 0 4px 8px -3px rgba(var(--shadow-rgb),.35);
  --key-down: 0 1px 0 var(--edge) inset, 0 1px 2px rgba(var(--shadow-rgb),.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1117; --bg-2:#0A0C11; --surface:#1A1F28; --surface-2:#222833; --surface-3:#2C3340;
  --ink:#E9EDF3; --muted:#9AA4B6; --faint:#6B7486; --line:rgba(233,237,243,.09); --line-2:rgba(233,237,243,.18);
  --accent:#FF7442; --accent-ink:#1A0D07; --accent-soft:rgba(255,116,66,.16);
  --good:#36C795; --warn:#F2B341; --bad:#FF6478; --info:#6CA2FF;
  --shadow-rgb:0,0,0; --edge:rgba(0,0,0,.55); --hi:rgba(255,255,255,.07);
  --grid-off:rgba(0,0,0,.22); --grid-line:rgba(233,237,243,.06);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1117; --bg-2:#0A0C11; --surface:#1A1F28; --surface-2:#222833; --surface-3:#2C3340;
  --ink:#E9EDF3; --muted:#9AA4B6; --faint:#6B7486; --line:rgba(233,237,243,.09); --line-2:rgba(233,237,243,.18);
  --accent:#FF7442; --accent-ink:#1A0D07; --accent-soft:rgba(255,116,66,.16);
  --good:#36C795; --warn:#F2B341; --bad:#FF6478; --info:#6CA2FF;
  --shadow-rgb:0,0,0; --edge:rgba(0,0,0,.55); --hi:rgba(255,255,255,.07);
  --grid-off:rgba(0,0,0,.22); --grid-line:rgba(233,237,243,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;
  background-image:radial-gradient(1200px 600px at 20% -10%, var(--surface-2), transparent 60%), radial-gradient(900px 500px at 110% 110%, var(--bg-2), transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app frame ---------- */
.app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr);gap:14px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px}
.slab{background:var(--surface);border-radius:18px;box-shadow:var(--slab)}
.side{display:flex;flex-direction:column;gap:14px;padding:16px 12px;overflow:auto;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}

.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 6px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;display:block;line-height:1}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.cube{width:34px;height:34px;position:relative;transform-style:preserve-3d;transform:rotateX(-28deg) rotateY(45deg) translateZ(-6px);margin:4px 6px 4px 4px;flex:none}
.cube i{position:absolute;inset:0;width:22px;height:22px;left:6px;top:6px;border-radius:3px}
.cube i:nth-child(1){background:var(--accent);transform:translateZ(11px)}
.cube i:nth-child(2){background:color-mix(in srgb,var(--accent) 70%,#000);transform:rotateY(90deg) translateZ(11px)}
.cube i:nth-child(3){background:color-mix(in srgb,var(--accent) 60%,#fff);transform:rotateX(90deg) translateZ(11px)}

.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:10px;text-align:left;color:var(--muted);font-weight:600}
.nav button svg{width:18px;height:18px;flex:none}
.nav button kbd{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line-2);border-radius:5px;padding:0 5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface-2);color:var(--ink);box-shadow:var(--key)}
.nav button[aria-current="true"] svg{color:var(--accent)}
.side h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;padding:0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.side h3 button{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.side h3 button:hover{background:var(--surface-2)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.plist button{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:6px 10px;border-radius:9px;text-align:left}
.plist button:hover{background:var(--surface-2)}
.plist button[aria-pressed="true"]{background:var(--accent-soft)}
.plist .dot{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,#000);flex:none}
.plist .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.side-foot{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* mini month */
.mini{padding:0 4px}
.mini-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;font-weight:700;font-size:13px}
.mini-head button{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:6px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini-grid .dow{font-size:10px;color:var(--faint);font-weight:700;padding-bottom:2px}
.mini-grid button{border:0;background:transparent;border-radius:7px;padding:4px 0 6px;font-size:12px;font-family:var(--f-mono);position:relative;color:var(--ink)}
.mini-grid button.out{color:var(--faint)}
.mini-grid button:hover{background:var(--surface-2)}
.mini-grid button.inweek{background:var(--surface-2)}
.mini-grid button.today{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.mini-grid button i{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:4px;height:4px;border-radius:2px;background:var(--muted);opacity:.7}
.mini-grid button i.h{background:var(--warn);opacity:1}
.mini-grid button i.x{background:var(--bad);opacity:1}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--surface-2);color:var(--ink);padding:8px 12px;border-radius:10px;font-weight:600;box-shadow:var(--key);transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:active,.btn[aria-pressed="true"]{transform:translateY(2px);box-shadow:var(--key-down)}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{padding:8px;width:36px;height:36px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 color-mix(in srgb,var(--accent) 55%,#000),0 8px 16px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.primary:active{box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.seg{display:inline-flex;background:var(--surface-3);padding:3px;border-radius:11px;gap:2px;box-shadow:0 1px 2px rgba(var(--shadow-rgb),.15) inset}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--key)}
.datenav{display:flex;align-items:center;gap:6px}
.datelabel{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.015em;min-width:0;white-space:nowrap;margin-left:4px}
.datelabel small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px;letter-spacing:0}
.qa{flex:1 1 320px;min-width:0;position:relative}
.qa-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 6px 0 12px;box-shadow:0 2px 3px rgba(var(--shadow-rgb),.16) inset, 0 1px 0 var(--hi)}
.qa-box svg{width:16px;height:16px;color:var(--accent);flex:none}
.qa input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;outline:none}
.qa-chips{position:absolute;left:0;right:0;top:calc(100% + 6px);display:flex;flex-wrap:wrap;gap:5px;z-index:30;padding:8px;background:var(--surface);border-radius:12px;box-shadow:var(--slab)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--surface-3);color:var(--ink);white-space:nowrap}
.chip .k{color:var(--muted);font-weight:500}
.chip.c{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink)}
.chip.c::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}
.top-actions{display:flex;gap:6px;align-items:center}
.menu-btn{display:none}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 14px 0;padding:9px 12px;border-radius:11px;background:var(--accent-soft);font-size:13px}
.banner b{font-weight:700}

/* ---------- view container ---------- */
.view{flex:1;min-height:0;overflow:auto;position:relative}
.pad{padding:16px}
.h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px}

/* ---------- 3D task block ---------- */
.blk{--c:#3E8EF7;--ink-on:#fff;position:absolute;border-radius:9px;padding:5px 8px 6px;overflow:hidden;color:var(--ink-on);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 82%,#fff) 0%,var(--c) 38%,color-mix(in srgb,var(--c) 90%,#000) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,
    0 1px 0 color-mix(in srgb,var(--c) 62%,#000),0 2px 0 color-mix(in srgb,var(--c) 58%,#000),0 3px 0 color-mix(in srgb,var(--c) 54%,#000),0 4px 0 color-mix(in srgb,var(--c) 48%,#000),
    0 6px 6px -1px rgba(var(--shadow-rgb),.28),0 16px 22px -8px rgba(var(--shadow-rgb),.45);
  transform:translateZ(6px);transition:transform .16s ease, box-shadow .16s ease, opacity .2s;cursor:grab;touch-action:none;user-select:none;font-size:12.5px;line-height:1.25}
.blk:hover{transform:translateZ(18px) translateY(-2px);z-index:5}
.blk.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:6}
.blk .t{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .m{font-family:var(--f-mono);font-size:10.5px;opacity:.88;display:flex;gap:6px;align-items:center;white-space:nowrap}
.blk.tall .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk.done{opacity:.55;filter:saturate(.5)}
.blk.done .t{text-decoration:line-through}
.blk.ghost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,transparent) 0 6px,color-mix(in srgb,var(--c) 10%,transparent) 6px 12px);color:var(--ink);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent) inset;transform:none;cursor:pointer}
.blk.conflict::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(45deg,var(--bad) 0 4px,#fff 4px 7px)}
.blk .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk .rs::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:rgba(255,255,255,.55)}
.blk .pri{display:inline-block;width:7px;height:7px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.blk.lift{transform:translateZ(40px) scale(1.02);z-index:20;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 color-mix(in srgb,var(--c) 48%,#000),0 30px 40px -10px rgba(var(--shadow-rgb),.55);transition:none}
.blk .ic{width:11px;height:11px;flex:none;opacity:.9}

/* ---------- calendar ---------- */
.cal{display:flex;flex-direction:column;min-height:100%}
.cal-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px 4px}
.tilt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.tilt input{width:110px;accent-color:var(--accent)}
.tray{display:flex;gap:8px;align-items:center;padding:8px 16px 10px;overflow-x:auto;min-height:52px}
.tray .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap}
.tchip{--c:#888;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;background:var(--surface);white-space:nowrap;font-weight:600;font-size:12.5px;cursor:grab;touch-action:none;user-select:none;border:0;
  box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 6px 12px -6px rgba(var(--shadow-rgb),.4)}
.tchip::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.tchip .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.tchip.risk{box-shadow:0 0 0 1.5px var(--bad) inset,0 2px 0 var(--edge)}
.floater{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05);box-shadow:0 22px 40px -10px rgba(var(--shadow-rgb),.55)!important}

.cal-scroll{flex:1;overflow:auto;position:relative;padding:4px 16px 40px}
.stage{perspective:1700px;perspective-origin:50% 0%;min-width:var(--minw,0px)}
.plane{transform-style:preserve-3d;transform-origin:50% 0%;transform:rotateX(var(--tilt,18deg));transition:transform .4s cubic-bezier(.2,.8,.2,1);
  background:var(--surface);border-radius:16px;box-shadow:0 2px 0 var(--edge),0 40px 60px -30px rgba(var(--shadow-rgb),.5),0 0 0 1px var(--line);position:relative}
.cal-head{transform:translateZ(16px);box-shadow:0 1px 0 var(--line),0 14px 20px -16px rgba(var(--shadow-rgb),.4);display:grid;grid-template-columns:56px repeat(var(--days),minmax(0,1fr));position:sticky;top:0;z-index:12;background:var(--surface);border-radius:16px 16px 0 0;border-bottom:1px solid var(--line)}
.dh{padding:10px 8px 8px;display:flex;flex-direction:column;gap:5px;min-width:0;border-left:1px solid var(--line)}
.dh .row{display:flex;align-items:baseline;gap:6px}
.dh .dn{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dh .dd{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.dh.today .dd{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 7px;box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.dh.off{background:var(--grid-off)}
.load{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;box-shadow:0 1px 1px rgba(var(--shadow-rgb),.2) inset}
.load i{display:block;height:100%;border-radius:3px;background:var(--good)}
.load i.h{background:var(--warn)} .load i.x{background:var(--bad)}
.dh .lt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.dh .flags{display:flex;gap:4px;flex-wrap:wrap}
.flag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-body{display:grid;grid-template-columns:56px repeat(var(--days),minmax(0,1fr));position:relative;transform-style:preserve-3d}
.gut{position:relative}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.col{position:relative;border-left:1px solid var(--line);transform-style:preserve-3d}
.col.off{background:var(--grid-off)}
.slot{height:calc(var(--hh)/4);border-top:1px solid transparent}
.slot.hr{border-top-color:var(--grid-line)}
.slot.nw{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--grid-off) 7px 9px)}
.slot.hot{background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent) inset}
.now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:8;transform:translateZ(2px);pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lunch{position:absolute;left:0;right:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--grid-off) 6px 8px);border-block:1px dashed var(--line-2)}
.lunch span{position:absolute;right:6px;top:2px;font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.dragging .blk{pointer-events:none}
.tray.hot{background:var(--accent-soft);border-radius:12px}
.preview-blk{position:absolute;border-radius:9px;border:2px dashed var(--accent);background:var(--accent-soft);pointer-events:none;z-index:15;transform:translateZ(3px)}

/* ---------- board / matrix cards ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;padding:16px;align-items:start;min-width:min-content}
.board-wrap{overflow-x:auto;height:100%}
.lane{background:var(--surface-2);border-radius:16px;padding:12px;min-height:200px;box-shadow:0 2px 4px rgba(var(--shadow-rgb),.14) inset, 0 1px 0 var(--hi);display:flex;flex-direction:column;gap:10px;perspective:900px}
.lane.hot{box-shadow:0 0 0 2px var(--accent) inset}
.lane-h{display:flex;align-items:center;gap:8px;padding:2px 4px}
.lane-h b{font-family:var(--f-display);font-size:15px}
.lane-h .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface);border-radius:6px;padding:1px 6px}
.lane-h .bar{width:10px;height:10px;border-radius:3px;background:var(--c)}
.card{--c:#888;position:relative;background:var(--surface);border-radius:12px;padding:11px 12px 10px 14px;cursor:grab;touch-action:none;user-select:none;
  box-shadow:0 1px 0 var(--hi) inset,0 2px 0 var(--edge),0 3px 0 rgba(var(--shadow-rgb),.12),0 12px 20px -10px rgba(var(--shadow-rgb),.45);
  transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .18s ease, box-shadow .18s;display:grid;gap:6px;transform-style:preserve-3d}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.card:hover{box-shadow:0 1px 0 var(--hi) inset,0 2px 0 var(--edge),0 22px 30px -12px rgba(var(--shadow-rgb),.5)}
.card .t{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.card.done .t{text-decoration:line-through;color:var(--muted)}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.card .meta .mono{font-size:11px}
.prog{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}
.pill{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.02em}
.p1{background:color-mix(in srgb,var(--bad) 17%,transparent);color:var(--bad)}
.p2{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.p3{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.p4{background:var(--surface-3);color:var(--muted)}
.pill.late{background:var(--bad);color:#fff}
.pill.risk{background:color-mix(in srgb,var(--bad) 17%,transparent);color:var(--bad)}
.pill.blocked{background:var(--surface-3);color:var(--ink)}
.drop-ghost{opacity:.35}

.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px}
.quad .lane-h small{color:var(--muted);font-weight:500;font-size:12px}
.quad .lane-h .ax{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-left:auto;font-weight:700}

/* ---------- timeline ---------- */
.tl-wrap{overflow:auto;height:100%;padding:16px}
.tl{position:relative;min-width:900px;background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 2px 0 var(--edge),0 30px 50px -30px rgba(var(--shadow-rgb),.5)}
.tl-head{display:grid;grid-template-columns:200px repeat(var(--n),1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:4;border-radius:16px 16px 0 0}
.tl-head div{padding:8px 4px;text-align:center;font-size:11px;color:var(--muted);border-left:1px solid var(--line)}
.tl-head div b{display:block;font-family:var(--f-display);font-size:15px;color:var(--ink)}
.tl-head div.today b{color:var(--accent)}
.tl-head div.off{background:var(--grid-off)}
.tl-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--line);min-height:40px}
.tl-row .nm{padding:8px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.tl-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row .nm .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.tl-grp{padding:10px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);background:var(--surface-2)}
.tl-track{position:relative;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--n)) 100%}
.tl-bar{--c:#888;position:absolute;top:8px;height:24px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:700;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;user-select:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 88%,#000));
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 0 color-mix(in srgb,var(--c) 55%,#000),0 3px 0 color-mix(in srgb,var(--c) 48%,#000),0 10px 14px -6px rgba(var(--shadow-rgb),.5)}
.tl-bar.done{opacity:.5}
.tl-bar.ms{width:18px!important;padding:0;border-radius:4px;transform:rotate(45deg) scale(.75)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:3;pointer-events:none}
.tl-svg{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}

/* ---------- agenda ---------- */
.agenda{max-width:880px;margin:0 auto;padding:16px;display:grid;gap:18px}
.ag-sec h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px}
.ag-sec h4 .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.ag-sec.overdue h4{color:var(--bad)}
.ag-list{display:grid;gap:8px}
.row-task{--c:#888;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;
  box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 8px 16px -10px rgba(var(--shadow-rgb),.4);cursor:pointer}
.row-task:hover{background:var(--surface-2)}
.row-task .main-t{min-width:0}
.row-task .t{font-weight:600;overflow-wrap:anywhere}
.row-task.done .t{text-decoration:line-through;color:var(--muted)}
.row-task .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.row-task .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.check{width:22px;height:22px;border-radius:7px;border:0;background:var(--surface-2);box-shadow:0 0 0 2px var(--c) inset,0 2px 0 var(--edge);display:grid;place-items:center;padding:0;flex:none}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
.check.on{background:var(--c)}
.check.on svg{opacity:1}
.check:active{transform:translateY(1px)}

/* ---------- focus ---------- */
.focus{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;padding:20px;align-items:start;max-width:1100px;margin:0 auto}
.dial-wrap{display:grid;place-items:center;padding:20px 0;perspective:1000px}
.dial{width:min(360px,78vw);aspect-ratio:1;border-radius:50%;position:relative;transform:rotateX(14deg);transform-style:preserve-3d;
  background:radial-gradient(circle at 35% 30%,var(--surface),var(--surface-3));
  box-shadow:0 2px 0 var(--hi) inset,0 -6px 14px rgba(var(--shadow-rgb),.15) inset,0 8px 0 var(--edge),0 12px 0 rgba(var(--shadow-rgb),.12),0 50px 60px -20px rgba(var(--shadow-rgb),.55);max-width:100%}
.dial .ring{position:absolute;inset:18px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p,0)*1turn),var(--surface-3) 0);
  -webkit-mask:radial-gradient(circle,transparent 61%,#000 62%);mask:radial-gradient(circle,transparent 61%,#000 62%);filter:drop-shadow(0 3px 2px rgba(var(--shadow-rgb),.35));transform:translateZ(10px)}
.dial .face{position:absolute;inset:25%;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--surface);transform:translateZ(24px);
  box-shadow:0 1px 0 var(--hi) inset,0 6px 0 var(--edge),0 20px 30px -10px rgba(var(--shadow-rgb),.5)}
.dial .tm{font-family:var(--f-mono);font-size:clamp(30px,7vw,46px);font-weight:600;letter-spacing:-.03em;line-height:1}
.dial .md{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.ticks{position:absolute;inset:6px;border-radius:50%;transform:translateZ(4px)}
.ticks i{position:absolute;left:50%;top:0;width:2px;height:8px;margin-left:-1px;background:var(--line-2);transform-origin:50% calc(min(360px,78vw)/2 - 6px)}
.focus-ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.panel{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 20px 30px -18px rgba(var(--shadow-rgb),.45)}
.panel h4{margin:0 0 10px;font-family:var(--f-display);font-size:16px}
.sessions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sessions i{width:16px;height:16px;border-radius:5px;background:var(--surface-3);box-shadow:0 2px 0 var(--edge)}
.sessions i.on{background:var(--accent)}

/* ---------- insights ---------- */
.ins{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px;min-height:100%}
.scene{position:relative;border-radius:18px;overflow:hidden;min-height:440px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 30px 50px -30px rgba(var(--shadow-rgb),.5);touch-action:none}
.scene canvas{display:block;width:100%;height:100%;cursor:grab}
.scene-cap{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none}
.scene-cap > *{pointer-events:auto}
.legend{display:flex;gap:6px;flex-wrap:wrap;position:absolute;left:14px;bottom:12px;right:14px}
.stats{display:grid;gap:12px;align-content:start}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 10px 20px -14px rgba(var(--shadow-rgb),.5)}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat .d{font-size:12px;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spark{display:flex;align-items:flex-end;gap:4px;height:56px;margin-top:8px}
.spark i{flex:1;background:var(--surface-3);border-radius:3px 3px 1px 1px;box-shadow:0 2px 0 var(--edge);min-height:3px;position:relative}
.spark i.on{background:var(--good)}
.spark i.t{background:var(--accent)}

/* ---------- drawer (editor) ---------- */
.scrim{position:fixed;inset:0;background:rgba(var(--shadow-rgb),.28);z-index:90;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:100;background:var(--surface);overflow:auto;
  padding:18px max(18px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px));
  box-shadow:-2px 0 0 var(--edge),-30px 0 60px -20px rgba(var(--shadow-rgb),.5);display:flex;flex-direction:column;gap:14px;animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dr-head{display:flex;align-items:flex-start;gap:8px}
.dr-title{flex:1;border:0;background:transparent;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.015em;outline:none;padding:4px 0;min-width:0;resize:none;line-height:1.2}
.dr-title:focus{box-shadow:0 2px 0 var(--accent)}
.fld{display:grid;gap:5px}
.fld > label,.fld > .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.inp{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:9px 11px;box-shadow:0 2px 3px rgba(var(--shadow-rgb),.14) inset,0 1px 0 var(--hi);outline:none;min-width:0}
.inp:focus{box-shadow:0 0 0 2px var(--accent) inset}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.durs{display:flex;flex-wrap:wrap;gap:5px}
.durs button{border:0;background:var(--surface-2);border-radius:8px;padding:5px 9px;font-family:var(--f-mono);font-size:12px;box-shadow:var(--key)}
.durs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--key-down)}
.subs{display:grid;gap:4px}
.sub-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px}
.sub-row:hover{background:var(--surface-2)}
.sub-row input[type=text]{flex:1;border:0;background:transparent;outline:none;min-width:0;padding:3px 0}
.sub-row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.sub-row .x{border:0;background:transparent;color:var(--faint);padding:2px 6px;border-radius:6px}
.sub-row .x:hover{color:var(--bad)}
.dep-list{display:flex;flex-wrap:wrap;gap:6px}
.dep{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border-radius:7px;background:var(--surface-2);font-size:12.5px;font-weight:600}
.dep button{border:0;background:transparent;color:var(--faint);padding:0 4px}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,transparent);font-size:13px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:start center;padding:10vh 16px 16px;background:rgba(var(--shadow-rgb),.32);backdrop-filter:blur(3px)}
.modal-card{width:min(620px,100%);max-height:80vh;overflow:auto;background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--slab),0 40px 80px -20px rgba(var(--shadow-rgb),.6);display:grid;gap:14px;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-card h3{margin:0;font-family:var(--f-display);font-size:20px}
.pal-in{font-size:16px;padding:12px 14px}
.pal-list{display:grid;gap:2px;max-height:50vh;overflow:auto}
.pal-list button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:9px}
.pal-list button.on,.pal-list button:hover{background:var(--surface-2)}
.pal-list button kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.pal-list .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 11px 2px}
.ai-out{white-space:pre-wrap;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:12px 14px;min-height:60px}
.ai-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.kb{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kb kbd{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 7px;box-shadow:0 2px 0 var(--edge);justify-self:start}

/* ---------- toasts / tooltip ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:300;display:grid;gap:8px;justify-items:center;width:min(520px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 20px 40px -10px rgba(var(--shadow-rgb),.6);font-weight:500;animation:pop .2s ease;max-width:100%}
.toast button{border:0;background:rgba(255,255,255,.14);color:inherit;padding:5px 10px;border-radius:8px;font-weight:700}
.toast.bad{background:var(--bad);color:#fff}
.tip{position:fixed;z-index:250;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 10px 20px -6px rgba(var(--shadow-rgb),.5)}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:40px 16px;color:var(--muted)}
.empty b{font-family:var(--f-display);font-size:18px;color:var(--ink)}
.confetti{position:fixed;width:9px;height:12px;z-index:400;pointer-events:none;border-radius:2px}

/* ---------- photo library ---------- */
.ph{padding:16px;display:grid;gap:16px;align-content:start}
.ph-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph-fic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 color-mix(in srgb,var(--accent) 55%,#000);flex:none}
.ph-fic svg{width:24px;height:24px}
.ph-acts{display:flex;gap:6px;flex-wrap:wrap}
.ph-note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 12px;line-height:1.5}
.ph-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph-tools .inp{width:auto;flex:1 1 180px}
.ph-tools select.inp{flex:0 1 230px}
.ph-tools .tilt input{width:90px}
.ph-grp h4{margin:0 0 8px;font-family:var(--f-display);font-size:16px;display:flex;gap:8px;align-items:center}
.ph-grp h4 .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts,150px),1fr));gap:10px;perspective:900px}
.ph-tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface-3);cursor:pointer;
  box-shadow:0 1px 0 var(--hi) inset,0 2px 0 var(--edge),0 12px 18px -12px rgba(var(--shadow-rgb),.5);transition:transform .16s ease,box-shadow .16s}
.ph-tile:hover{transform:translateY(-3px) rotateX(5deg);box-shadow:0 2px 0 var(--edge),0 22px 28px -12px rgba(var(--shadow-rgb),.55);z-index:2}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.ph-tile img.ld,.ph-mini-b img.ld{opacity:1}
.ph-badge{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;display:inline-flex;gap:4px;align-items:center}
.ph-badge .ic{width:11px;height:11px}
.ph-tile.on{outline:3px solid var(--accent);outline-offset:-3px}
.ph-tile.on::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.ph-tile.has{opacity:.45}
.ph-strip{display:flex;flex-wrap:wrap;gap:10px}
.ph-mini{position:relative;width:72px;height:72px}
.ph-mini-b{width:100%;height:100%;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--surface-3);box-shadow:0 2px 0 var(--edge);position:relative;display:block}
.ph-mini-b img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.ph-miss{position:absolute;inset:0;display:none;place-items:center;font-size:10px;padding:4px;color:var(--muted);overflow:hidden;word-break:break-all;text-align:center;line-height:1.2}
.ph-mini.missing .ph-miss{display:grid}
.ph-mini .x{position:absolute;right:-7px;top:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:11px;padding:0;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.flag.phc{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.flag.phc .ic{width:11px;height:11px}
#view.ph-dropping{box-shadow:0 0 0 3px var(--accent) inset;background:var(--accent-soft)}
.lb{position:fixed;inset:0;z-index:160;display:grid;grid-template-columns:minmax(0,1fr) 340px;background:rgba(8,10,14,.93);backdrop-filter:blur(4px);animation:pop .16s ease}
.lb-stage{position:relative;display:grid;place-items:center;padding:24px 70px;min-height:0;min-width:0}
.lb-stage img{max-width:100%;max-height:calc(100vh - 48px);object-fit:contain;border-radius:10px;box-shadow:0 30px 60px -20px #000}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center}
.lb-nav:hover{background:rgba(255,255,255,.26)}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}

  if (cluster.length) flush();

}

function icsEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ldt = s => s.replace(/[-:]/g, "") + "00";
  const rr = { daily: "FREQ=DAILY", weekdays: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR", weekly: "FREQ=WEEKLY", biweekly: "FREQ=WEEKLY;INTERVAL=2", monthly: "FREQ=MONTHLY" };
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MiVida//Scheduler//EN", "CALSCALE:GREGORIAN"];
  for (const t of allTasks()) {
    const desc = [t.notes, t.subtasks.map(s => `${s.done ? "[x]" : "[ ]"} ${s.t}`).join("\n")].filter(Boolean).join("\n\n");
    if (t.start) {
      const e = new Date(fromDk(startDk(t.start)).getTime() + (startMin(t.start) + t.dur) * 6e4);
      L.push("BEGIN:VEVENT", `UID:${t.id}@blockwise`, `DTSTAMP:${stamp}`, `DTSTART:${ldt(t.start)}`, `DTEND:${ldt(dk(e) + "T" + pad2(e.getHours()) + ":" + pad2(e.getMinutes()))}`, `SUMMARY:${icsEsc(t.title)}`, `CATEGORIES:${icsEsc(proj(t.project).name)}`, `PRIORITY:${[1, 3, 5, 9][t.priority - 1]}`);
      if (desc) L.push(`DESCRIPTION:${icsEsc(desc)}`); if (t.repeat && !isDone(t)) L.push(`RRULE:${rr[t.repeat]}`);
      if (isDone(t)) L.push("STATUS:CONFIRMED"); L.push("END:VEVENT");
    } else {
      L.push("BEGIN:VTODO", `UID:${t.id}@blockwise`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(t.title)}`, `PRIORITY:${[1, 3, 5, 9][t.priority - 1]}`, `STATUS:${isDone(t) ? "COMPLETED" : "NEEDS-ACTION"}`);
      if (t.due) L.push(`DUE;VALUE=DATE:${t.due.replace(/-/g, "")}`); if (desc) L.push(`DESCRIPTION:${icsEsc(desc)}`); L.push("END:VTODO");
    }
  }
  L.push("END:VCALENDAR"); return L.join("\r\n");
}

function scheduleDigest(days = 1) {

  const late = allTasks().filter(overdue).map(t => `${t.title} (P${t.priority}${t.due ? ", due " + t.due : ""})`);
  const uns = allTasks().filter(t => !isDone(t) && !t.start).map(t => `${t.title} (P${t.priority}, ${fmtDur(t.dur)}${t.due ? ", due " + t.due : ""})`);
  return `${out.join("\n")}\nOverdue: ${late.join("; ") || "none"}\nUnscheduled: ${uns.join("; ") || "none"}\nWork hours ${fmtMin(S.settings.workStart)}–${fmtMin(S.settings.workEnd)}.`;
}

/* ================= folder libraries (Photos + Music) =================
   Each library points at a folder on the PC (it can sit inside Google Drive or OneDrive).
   With the File System Access API the folder link is remembered (IndexedDB) and MiVida can add files to it.
   Where that API is blocked (for example inside the claude.ai page), the folder is loaded for this visit only. */
const LIB_MAX = 5000;
const DESC_FILE = "mivida-photos.json";
const EXT = { photos: /\.(jpe?g|png|gif|webp|bmp|avif)$/i, music: /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm)$/i };
const mkLib = (kind, label) => ({ kind, label, handle: null, name: "", status: "none", mode: "", canWrite: false, items: [], byPath: new Map(), found: 0, tok: 0 });
const P = Object.assign(mkLib("photos", "Photos"), { byDay: new Map(), desc: {}, filter: { folder: "", q: "", day: null, linked: false, mem: false }, size: lsGet("mivida:phSize") || 150, shown: 400, cur: [] });
const M = Object.assign(mkLib("music", "Music"), { filter: { folder: "", q: "", list: "" }, shown: 500, cur: [] });
const LIBS = { photos: P, music: M };
const fsaOK = () => typeof window.showDirectoryPicker === "function";
const EMBEDDED = (() => { try { return window.self !== window.top; } catch { return true; } })();

const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => { const r = indexedDB.open("mivida-folders" + (MV_PROFILE ? "-" + MV_PROFILE : ""), 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => { const tx = db.transaction("kv", mode); const req = fn(tx.objectStore("kv")); tx.oncomplete = () => res(req.result); tx.onerror = () => rej(tx.error); }));
  return { get: k => run("readonly", s => s.get(k)).catch(() => null), set: (k, v) => run("readwrite", s => s.put(v, k)).catch(() => null), del: k => run("readwrite", s => s.delete(k)).catch(() => null) };
})();

function libChanged(L) {

const WELL_KNOWN = { photos: "pictures", music: "music" };
async function libConnect(L, useDefault) {
  if (fsaOK()) {
    /* "Use my Pictures/Music folder": open the picker inside that standard folder (one click on "Select Folder").
       Otherwise reopen where this library was last picked, falling back to the standard folder. */
    const opts = useDefault ? { startIn: WELL_KNOWN[L.kind], mode: "readwrite" } : { id: "mivida-" + L.kind, startIn: WELL_KNOWN[L.kind], mode: "readwrite" };
    try { const h = await window.showDirectoryPicker(opts); await libUseHandle(L, h); return; }
    catch (e) { if (e?.name === "AbortError") return; }
  }
  libPickSnapshot(L);
}
function libPickSnapshot(L) {
  const i = document.createElement("input"); i.type = "file"; i.multiple = true; i.webkitdirectory = true; i.hidden = true; i.dataset.lib = L.kind;
  document.body.append(i);
  i.onchange = () => { libLoadSnapshot(L, [...i.files]); i.remove(); };
  i.click();

async function libUseHandle(L, h) {
  L.handle = h; L.name = h.name; L.mode = "fs"; idb.set(L.kind, h);
  let perm = "granted";
  try { perm = await h.queryPermission({ mode: "readwrite" }); if (perm !== "granted") perm = await h.requestPermission({ mode: "readwrite" }); } catch {}
  L.canWrite = perm === "granted";
  await libScan(L);
}
async function libRestore(L) {
  if (!fsaOK()) return;
  L.restoring = true; const h = await idb.get(L.kind); L.restoring = false;
  if (!h || typeof h.queryPermission !== "function") { if (S.view === L.kind) libFirstAsk(L); return; }
  L.handle = h; L.name = h.name; L.mode = "fs";
  let p = "prompt"; try { p = await h.queryPermission({ mode: "readwrite" }); } catch {}
  if (p === "granted") { L.canWrite = true; return libScan(L); }
  L.status = "ask"; libChanged(L);
}
async function libAllow(L) {
  if (!L.handle) return libConnect(L);
  try { const p = await L.handle.requestPermission({ mode: "readwrite" }); L.canWrite = p === "granted"; if (p === "granted") await libScan(L); else toast(`Access to ${L.name} wasn't allowed.`); }
  catch { toast(`Couldn't reach ${L.name}. Choose the folder again.`, { bad: true }); }
}

async function exifDate(file) {

/* ---------- music metadata ---------- */
async function audioMeta(f, it) {
  const base = it.name.replace(/\.[^.]+$/, "").replace(/^\d{1,3}[\s._-]+/, "").trim();
  let title = base || it.name, artist = "", album = it.folder.split("/").pop() || "";
  const m = base.match(/^(.+?)\s+-\s+(.+)$/); if (m) { artist = m[1]; title = m[2]; }
  try { const t = await id3(f); if (t.TIT2) title = t.TIT2; if (t.TPE1) artist = t.TPE1; if (t.TALB) album = t.TALB; } catch {}
  return { title: title.slice(0, 200), artist: artist.slice(0, 200), album: album.slice(0, 200) };
}
async function id3(f) {
  const out = {}; if (!/\.mp3$/i.test(f.name)) return out;
  const b = new Uint8Array(await f.slice(0, 262144).arrayBuffer());
  if (b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33) return out;
  const ver = b[3], syn = (o) => (b[o] & 127) << 21 | (b[o + 1] & 127) << 14 | (b[o + 2] & 127) << 7 | (b[o + 3] & 127);
  const end = Math.min(10 + syn(6), b.length); let o = 10;

  if (b[5] & 0x40) o += ver === 4 ? syn(10) : ((b[10] << 24 | b[11] << 16 | b[12] << 8 | b[13]) >>> 0) + 4;
  while (o + 10 < end) {
    const id = String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]); if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const sz = ver === 4 ? syn(o + 4) : ((b[o + 4] << 24 | b[o + 5] << 16 | b[o + 6] << 8 | b[o + 7]) >>> 0);
    if (sz <= 0 || o + 10 + sz > end) break;
    if (id === "TIT2" || id === "TPE1" || id === "TALB") out[id] = id3text(b.subarray(o + 11, o + 10 + sz), b[o + 10]);
    o += 10 + sz;
  }

}

  try {
    let lbl = enc === 3 ? "utf-8" : enc === 2 ? "utf-16be" : enc === 1 ? "utf-16le" : "windows-1252";
    if (enc === 1 && d[0] === 0xFE && d[1] === 0xFF) { lbl = "utf-16be"; d = d.subarray(2); } else if (enc === 1 && d[0] === 0xFF && d[1] === 0xFE) d = d.subarray(2);
    return new TextDecoder(lbl).decode(d).replace(/\0/g, " ").trim();
  } catch { return ""; }
}

function goLocal() { S.store = "local"; S.loaded = true; if (S.firstRun) saveLocal(); renderAll(); }
function subscribeDb() {
  let sDone = false, tDone = false, sExists = false, decided = false, lastSnap = null;
  const timer = setTimeout(() => { if (!decided) { toast("Can't reach your saved tasks yet. Showing the copy in this browser."); S.loaded = true; renderSideFoot(); } }, 10000);
  const apply = () => {
    if (!lastSnap) return;
    const m = new Map(); lastSnap.docs.forEach(d => { if (d.exists) { const n = normTask({ ...clone(d.data()), id: d.id }); m.set(n.id, n); } });
    S.tasks = m; saveLocal();

  };
  const decide = async () => {
    if (decided || !sDone || !tDone) return; decided = true; clearTimeout(timer); S.loaded = true;

      // first visit with this account: move what's on screen (local data or examples) into the account
      S.store = "db"; const ids = allTasks().map(t => t.id);
      wq.pending.set("settings", clone(S.settings)); pump("settings");
      for (const id of ids) persistTask(id);
      renderAll();
    } else { S.store = "db"; apply(); }
  };
  const fail = e => { clearTimeout(timer); if (e?.code === "revoked" || !decided) { S.store = "local"; S.loaded = true; renderAll(); } };
  settingsRef().onSnapshot(snap => {
    if (snap.metadata.fromCache && !sDone && !snap.exists) return;
    if (!snap.metadata.fromCache) sDone = true;
    sExists = sExists || snap.exists;
    if (snap.exists && !snap.metadata.hasPendingWrites) { S.settings = { ...clone(DEFAULT_SETTINGS), ...clone(snap.data()) }; if (!S.navigated) S.view = homeView(); if (decided) renderAll(); }
    decide();
  }, fail);
  settingsRef().collection("tasks").onSnapshot(snap => {
    lastSnap = snap;
    if (!snap.metadata.fromCache) tDone = true;
    if (decided) apply(); else if (!snap.empty) { S.store = "db"; apply(); }
    decide();
  }, fail);
}
boot();
