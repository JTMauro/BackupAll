<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Architect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: studio chrome — header + tool rail across the top, shape library left, infinite canvas center, inspector right, page tabs along the bottom */
:root{
  --bg:#E8ECF0; --panel:#FFFFFF; --panel-2:#F4F6F8; --panel-3:#EBEFF3; --line:#D6DDE4; --line-2:#C3CCD6;
  --fg:#111821; --fg-2:#2E3945; --muted:#5A6672; --accent:#00A1E0; --accent-2:#0086BC; --accent-soft:#D9F1FB; --on-accent:#00141F;
  --canvas:#F5F7F9; --grid:#C9D2DB; --grid-major:#B3BEC9; --sel:#00A1E0; --guide:#FF3D7F;
  --danger:#C7322B; --ok:#16855A; --warn:#B36B00; --shadow:0 12px 32px rgba(17,24,33,.16); --shadow-sm:0 2px 8px rgba(17,24,33,.10);
  --f-display:"Montserrat","Segoe UI",system-ui,sans-serif; --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F14; --panel:#141A21; --panel-2:#1A2129; --panel-3:#212A34; --line:#28323D; --line-2:#36414E;
  --fg:#E7EDF3; --fg-2:#C3CDD7; --muted:#8E9BA8; --accent:#18B4F0; --accent-2:#4CC6F5; --accent-soft:#0F3445; --on-accent:#00141F;
  --canvas:#0F141A; --grid:#232C36; --grid-major:#2E3946; --sel:#18B4F0; --guide:#FF5C93;
  --danger:#F0645B; --ok:#3CC48A; --warn:#F0A63C; --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F14; --panel:#141A21; --panel-2:#1A2129; --panel-3:#212A34; --line:#28323D; --line-2:#36414E;
  --fg:#E7EDF3; --fg-2:#C3CDD7; --muted:#8E9BA8; --accent:#18B4F0; --accent-2:#4CC6F5; --accent-soft:#0F3445; --on-accent:#00141F;
  --canvas:#0F141A; --grid:#232C36; --grid-major:#2E3946; --sel:#18B4F0; --guide:#FF5C93;
  --danger:#F0645B; --ok:#3CC48A; --warn:#F0A63C; --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:52px 44px minmax(0,1fr) 34px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}

/* header */
header.top{display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.cydni-slot{width:46px;height:46px;flex:none;position:relative;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.cydni-slot:hover{background:var(--panel-2)}
.cydni-slot canvas{width:46px!important;height:46px!important;display:block}
.cydni-slot svg.fallback{width:36px;height:36px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:8px;min-width:0}
.brand .wm{font:900 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand .wm b{color:var(--accent);font-weight:900}
.brand .by{font:600 9.5px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.doc-title{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font-weight:600;font-size:14px;min-width:60px;max-width:260px;width:22ch}
.doc-title:hover{border-color:var(--line)} .doc-title:focus{border-color:var(--accent);outline:none;background:var(--panel-2)}
.save-state{font-size:11px;color:var(--muted);white-space:nowrap}
nav.menus{display:flex;gap:1px;margin-left:6px}
nav.menus>button{background:none;border:0;border-radius:6px;padding:6px 9px;font-weight:500;color:var(--fg-2)}
nav.menus>button:hover,nav.menus>button[aria-expanded="true"]{background:var(--panel-3);color:var(--fg)}
.spacer{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;font-weight:600;white-space:nowrap;min-height:32px}
.hbtn:hover{background:var(--panel-2)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hbtn.primary:hover{background:var(--accent-2)}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:none;border-radius:7px;color:var(--fg-2)}
.ibtn:hover{background:var(--panel-3);color:var(--fg)}
.ibtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 12px var(--f-display);border:0}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tsep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.tsel{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;font-size:12px}
.tnum{width:52px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums}
.swatch-btn{width:32px;height:32px;border:0;background:none;border-radius:7px;display:grid;place-items:center;position:relative}
.swatch-btn:hover{background:var(--panel-3)}
.swatch-btn i{display:block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line-2)}
.swatch-btn i.stroke{background:none!important;border-width:3px}
.mob-only{display:none}

/* main */
main.work{display:grid;grid-template-columns:264px minmax(0,1fr) 292px;min-height:0;position:relative}
aside{background:var(--panel);min-height:0;display:flex;flex-direction:column}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;flex:none}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 6px 8px;font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;min-height:0}
.search{margin:10px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:0 8px}
.search input{border:0;background:none;padding:7px 0;flex:1;min-width:0;outline:none}
.lib-cat{border-bottom:1px solid var(--line)}
.lib-cat>button{width:100%;display:flex;align-items:center;gap:6px;background:none;border:0;padding:9px 12px;font-weight:600;font-size:12px;text-align:left}
.lib-cat>button .chev{transition:transform .15s;margin-left:auto}
.lib-cat[data-open="false"]>button .chev{transform:rotate(-90deg)}
.lib-cat[data-open="false"] .lib-grid{display:none}
.lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:2px 10px 12px}
.lib-item{aspect-ratio:1;border:1px solid transparent;border-radius:7px;background:none;display:grid;place-items:center;padding:6px;cursor:grab;color:var(--fg-2)}
.lib-item:hover{background:var(--panel-2);border-color:var(--line)}
.lib-item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lib-item{min-width:0}
.lib-item svg{width:100%;height:100%;display:block;overflow:visible}
.tpl-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:10px}
.tpl{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:10px;text-align:left;display:flex;gap:10px;align-items:center}
.tpl:hover{border-color:var(--accent)}
.tpl .tpl-ic{width:38px;height:38px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tpl b{display:block;font-size:12.5px} .tpl span{font-size:11px;color:var(--muted)}
.layer{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 12px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;min-height:32px}
.layer:hover{background:var(--panel-2)}
.layer[aria-selected="true"]{background:var(--accent-soft)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ibtn{width:24px;height:24px}
.layer.hidden-item .nm{opacity:.45;text-decoration:line-through}

/* canvas */
.stage{position:relative;overflow:hidden;background:var(--canvas);min-width:0;touch-action:none;outline:none}
.stage svg.board{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.stage.tool-hand,.stage.panning{cursor:grab} .stage.panning:active{cursor:grabbing}
.stage.tool-draw{cursor:crosshair}
.stage.tool-text{cursor:text}
.minimap{position:absolute;right:12px;bottom:12px;width:184px;height:124px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer}
.minimap canvas{width:100%;height:100%;display:block}
.zoombox{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-sm);padding:3px}
.zoombox output{min-width:48px;text-align:center;font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);text-align:center}
.empty-hint div{max-width:340px}
.empty-hint b{display:block;font:800 18px var(--f-display);color:var(--fg-2);margin-bottom:6px}
#editor{position:absolute;z-index:20;resize:none;border:2px solid var(--sel);border-radius:4px;background:rgba(255,255,255,.96);color:#111;padding:4px;outline:none;overflow:hidden;line-height:1.25}
.quickpick{position:absolute;z-index:30;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px}
.quickpick input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel-2);outline:none}
.quickpick .qp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-top:6px;max-height:220px;overflow:auto}

/* inspector */
.insp{padding:4px 0 24px}
.sec{border-bottom:1px solid var(--line);padding:10px 12px 12px}
.sec h4{margin:0 0 8px;font:700 10.5px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-width:0}
.row>label{width:64px;flex:none;color:var(--muted);font-size:12px}
.row input[type=text],.row input[type=number],.row select,.row textarea{flex:1;min-width:0;height:28px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:0 7px;font-size:12px}
.row textarea{height:auto;min-height:70px;padding:6px 7px;font-family:var(--f-mono);font-size:11.5px;resize:vertical}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel-2);flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 .f{display:flex;flex-direction:column;gap:2px}
.grid4 .f span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid4 input{width:100%;height:28px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:0 6px;font:12px var(--f-mono);font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.swatches button{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.18);padding:0}
.swatches button.none{background:linear-gradient(135deg,#fff 45%,#e33 45%,#e33 55%,#fff 55%)}
.seg{display:flex;background:var(--panel-3);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:5px;padding:5px 6px;font-size:11.5px;font-weight:600;color:var(--fg-2);min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow-sm)}
.fxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fxgrid button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 4px 5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.fxgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fxgrid svg{width:40px;height:26px}
.btnrow{display:flex;flex-wrap:wrap;gap:4px}
.btnrow .ibtn{border:1px solid var(--line);width:34px;height:30px}
.sbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600}
.sbtn:hover{border-color:var(--line-2);background:var(--panel-3)}
.sbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sbtn.danger{color:var(--danger)}
.muted{color:var(--muted)} .small{font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr 1fr 24px;gap:4px;margin-bottom:4px}
.kv input{height:26px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:0 6px;font-size:12px;min-width:0}

/* footer */
footer.pages{display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border-top:1px solid var(--line);min-width:0}
.ptabs{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:thin;flex:1}
.ptab{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.ptab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.status{font:11px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* menus, dialogs, toasts */
.menu{position:fixed;z-index:200;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;max-height:calc(100% - 70px);overflow:auto}
.menu button{width:100%;display:flex;align-items:center;gap:9px;border:0;background:none;border-radius:6px;padding:6px 9px;text-align:left;font-size:12.5px}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft)}
.menu button:disabled{opacity:.4}
.menu button kbd{margin-left:auto;font:11px var(--f-mono);color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mh{font:700 10px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 9px 3px}
.scrim{position:fixed;inset:0;z-index:300;background:rgba(5,9,14,.48);display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;min-height:0}
.dialog.wide{width:min(980px,100%)}
.dialog>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dialog>header h2{margin:0;font:800 16px var(--f-display);letter-spacing:.01em;flex:1}
.dialog .body{padding:16px;overflow:auto;min-height:0}
.dialog>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:12px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:8px 10px;outline:none}
.field textarea{font-family:var(--f-mono);font-size:12px;min-height:150px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.check{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.check input{margin-top:2px;accent-color:var(--accent);width:16px;height:16px}
.check small{display:block;color:var(--muted)}
.set-group{margin-bottom:18px}
.set-group h3{font:800 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--accent)}
.toast-wrap{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);font-size:12.5px;max-width:90vw}
.toast.err{background:var(--danger);color:#fff}
.doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.doccard{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.doccard:hover{border-color:var(--accent)}
.doccard .th{aspect-ratio:16/10;background:var(--canvas);display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden}
.doccard .th img{width:100%;height:100%;object-fit:contain}
.doccard .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.doccard .meta b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doccard .meta span{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--panel-3);color:var(--fg-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.grid td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;font-size:15px;outline:none}
.cmdk .list{max-height:50vh;overflow:auto;padding:6px}
.cmdk .list button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;border-radius:7px;padding:8px 10px;text-align:left}
.cmdk .list button[aria-selected="true"]{background:var(--accent-soft)}
.cmdk .list kbd{margin-left:auto;font:11px var(--f-mono);color:var(--muted)}

.flow{stroke-dasharray:7 6;animation:flowdash 1s linear infinite}@keyframes flowdash{to{stroke-dashoffset:-13}}
.ln .hit{cursor:pointer} .hdl{cursor:pointer}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
.ruler{position:absolute;z-index:6;pointer-events:auto}
.ruler.rx{left:20px;top:0;right:0;height:20px;width:calc(100% - 20px);cursor:row-resize;border-bottom:1px solid var(--line)}
.ruler.ry{left:0;top:20px;bottom:0;width:20px;height:calc(100% - 20px);cursor:col-resize;border-right:1px solid var(--line)}
#cursors{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:14}

const hist = { undo: [], redo: [] };

function checkpoint() { hist.undo.push(snapshot()); if (hist.undo.length > 250) hist.undo.shift(); hist.redo.length = 0; updateUndoButtons(); }
function restore(s) { const o = JSON.parse(s); doc.pages = o.pages; doc.page = clamp(o.page, 0, o.pages.length - 1); doc.title = o.title; if (o.symbols) doc.symbols = o.symbols; if (o.vars) doc.vars = o.vars; reindex(); sel = new Set([...sel].filter(id => IDX.has(id))); }
function undo() { if (!hist.undo.length) return; hist.redo.push(snapshot()); restore(hist.undo.pop()); afterHistory(); }
function redo() { if (!hist.redo.length) return; hist.undo.push(snapshot()); restore(hist.redo.pop()); afterHistory(); }

/* ---------- geometry helpers ---------- */
function bboxOf(it) {
  if (it.type === 'line') { const g = lineGeom(it); if (!g) return { x: 0, y: 0, w: 0, h: 0 }; const xs = g.all.map(p => p.x), ys = g.all.map(p => p.y); const x = Math.min(...xs), y = Math.min(...ys); return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y }; }
  if (!it.rot) return { x: it.x, y: it.y, w: it.w, h: it.h };
  const cx = it.x + it.w / 2, cy = it.y + it.h / 2, a = it.rot * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  const W = it.w * c + it.h * s, H = it.w * s + it.h * c; return { x: cx - W / 2, y: cy - H / 2, w: W, h: H };
}
function unionBox(list) { if (!list.length) return null; let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity; for (const it of list) { const b = bboxOf(it); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); } return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }; }
function rotPt(px, py, cx, cy, deg) { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), dx = px - cx, dy = py - cy; return { x: cx + dx * c - dy * s, y: cy + dx * s + dy * c }; }
const center = it => ({ x: it.x + it.w / 2, y: it.y + it.h / 2 });
function containsBox(outer, inner) { return inner.x >= outer.x - .5 && inner.y >= outer.y - .5 && inner.x + inner.w <= outer.x + outer.w + .5 && inner.y + inner.h <= outer.y + outer.h + .5; }

/* text measuring + wrapping */
const _mc = document.createElement('canvas').getContext('2d');
function fontStr(s, size) { return `${s.italic ? 'italic ' : ''}${s.bold ? 700 : 400} ${size || s.fontSize}px "${s.font}", "IBM Plex Sans", Arial, sans-serif`; }
function wrapText(text, s, maxW) {
  _mc.font = fontStr(s); const out = [];
  for (const para of String(text ?? '').split('\n')) {
    if (maxW <= 4) { out.push(para); continue; }
    const words = para.split(/(\s+)/); let line = '';
    for (const w of words) {
      const test = line + w;
      if (_mc.measureText(test).width > maxW && line.trim()) { out.push(line.trimEnd()); line = w.trimStart(); }
      else line = test;
      while (_mc.measureText(line).width > maxW && line.length > 1) { let k = line.length - 1; while (k > 1 && _mc.measureText(line.slice(0, k)).width > maxW) k--; out.push(line.slice(0, k)); line = line.slice(k); }
    }
    out.push(line);
  }
  return out;
}
function textW(str, s) { _mc.font = fontStr(s); return _mc.measureText(str).width; }

function rr(w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); if (!r) return `M0,0H${w}V${h}H0Z`; return `M${r},0H${w - r}A${r},${r} 0 0 1 ${w},${r}V${h - r}A${r},${r} 0 0 1 ${w - r},${h}H${r}A${r},${r} 0 0 1 0,${h - r}V${r}A${r},${r} 0 0 1 ${r},0Z`; }
function rrAt(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); return `M${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h - r}A${r},${r} 0 0 1 ${x + w - r},${y + h}H${x + r}A${r},${r} 0 0 1 ${x},${y + h - r}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}Z`; }
const ell = (w, h, x = 0, y = 0) => `M${x},${y + h / 2}A${w / 2},${h / 2} 0 1 0 ${x + w},${y + h / 2}A${w / 2},${h / 2} 0 1 0 ${x},${y + h / 2}Z`;

  const ids = new Map(); let n = 0; const nid = id => { if (!ids.has(id)) ids.set(id, 'N' + (++n)); return ids.get(id); };
  const lines = ['flowchart TD'];
  for (const it of pg.items) if (it.type === 'shape' && !SHAPES[it.shape]?.container && it.shape !== 'text') { const [o, c] = shp[it.shape] || ['[', ']']; lines.push(`  ${nid(it.id)}${o}"${(it.text || SHAPES[it.shape]?.name || '').replace(/"/g, "'").replace(/\n/g, '<br>')}"${c}`); }
  for (const l of pg.items) if (l.type === 'line' && l.a.id && l.b.id && ids.has(l.a.id) && ids.has(l.b.id)) lines.push(`  ${nid(l.a.id)} ${sty(l).dash ? '-.->' : '-->'}${l.text ? `|${l.text.replace(/\|/g, '/')}|` : ''} ${nid(l.b.id)}`);
  return lines.join('\n');
}

function aiPrompt(req, kind) {
  return `You design diagrams for a diagramming app. Return ONLY a JSON object, no prose, with this shape:

        catch (e) { st.textContent = e?.message || 'Claude could not read the page.'; }

    }

    Repo.mode = 'server'; Repo.server = window.ARCHITECT_SERVER;

    return false;
  }
  try {
    if (window.claude?.use) {
      const [db, ucap] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (db && ucap) {
        const id = await ucap.id();
        if (id) {
          Repo.mode = 'cloud'; Repo.db = db; Repo.ucap = ucap; Repo.uid = id;
          try { const me = await ucap.me(); Repo.user = { id, name: me?.name || '' }; } catch { Repo.user = { id, name: '' }; }
          try { Repo.isEditor = !!(await ucap.canEdit()); } catch { Repo.isEditor = false; }
          try { const w = await ucap.can?.('data.write'); Repo.canWrite = w !== false; } catch { Repo.canWrite = true; }
          window.claude.use('sample').then(s => { Repo.sample = s; }).catch(() => { });
          if (Repo.canWrite) db.doc('members/' + id).set({ lastSeen: Date.now() }).catch(() => { Repo.canWrite = false; });
        }
      }
    }
  } catch (e) { console.warn('cloud storage unavailable', e); }
  return true;
}

  q = q.toLowerCase(); const hits = [];

  if (Repo.mode === 'server') return (await api('GET', '/api/search?q=' + encodeURIComponent(q))).hits;
  const list = await Repo.list(Repo.mode === 'cloud' ? undefined : 'mine');
  for (const x of list.slice(0, 80)) { if ((x.title || '').toLowerCase().includes(q)) { hits.push({ id: x.id, title: x.title, scope: x.scope, page: '', snip: 'Name matches' }); continue; } try { const r = await Repo.load(x.id, x.scope); scan(r.doc, x.id, x.title, x.scope); } catch { } }

function wireTpl(name, desc, W, H, blocks) { T2.push({ name, desc, cat: 'Wireframes', icon: 'grid', build: () => { const f = S('frame', 0, 0, name, { w: W, h: H, style: { fill: '#FFFFFF', fx: 'shadow' } }); const its = [f]; let y = 0; const g = W > 600 ? 24 : 16; for (const [kind, h, txt] of blocks) { const st = { fx: 'flat', fill: '#EEF1F4', stroke: '#C9D1DA' }; if (kind === 'nav') { its.push(S('rect', 0, y, '', { w: W, h, style: { ...st, fill: '#F7F8FA' } })); its.push(S('text', g, y, txt || 'Logo', { w: 140, h, style: { fontSize: 16, bold: true, align: 'left', fx: 'flat' } })); if (W > 600) its.push(S('text', W - 420, y, 'Product   Pricing   About   Sign in', { w: 400, h, style: { fontSize: 14, align: 'right', fx: 'flat' } })); }
  else if (kind === 'hero') { its.push(S('heading', g, y + 20, txt || 'Headline that explains the value', { w: W - g * 2, h: 60, style: { fontSize: W > 600 ? 40 : 26, align: W > 600 ? 'center' : 'left', fx: 'flat' } })); its.push(S('roundrect', W / 2 - 90, y + h - 70, 'Get started', { w: 180, h: 48, style: { fill: '#0D99FF', stroke: 'none', color: '#FFFFFF', fx: 'flat', bold: true, radius: 24 } })); }
  else if (kind === 'img') its.push(S('image', g, y, '', { w: W - g * 2, h: h - g }));
  else if (kind === 'cards') { const n = W > 600 ? 3 : 1, cw = (W - g * (n + 1)) / n; for (let i = 0; i < n; i++) { its.push(S('roundrect', g + i * (cw + g), y, txt || 'Card title\nShort description', { w: cw, h: h - g, style: { ...st, fill: '#FFFFFF', valign: 'bottom', radius: 12 } })); } }
  else if (kind === 'input') its.push(S('roundrect', g, y, txt || 'Email', { w: W - g * 2, h: h - 12, style: { ...st, fill: '#FFFFFF', align: 'left', color: '#8A96A3', radius: 8 } }));
  else if (kind === 'button') its.push(S('roundrect', g, y, txt || 'Continue', { w: W - g * 2, h: h - 12, style: { fill: '#0D99FF', stroke: 'none', color: '#FFFFFF', bold: true, fx: 'flat', radius: 8 } }));
  else if (kind === 'title') its.push(S('heading', g, y, txt, { w: W - g * 2, h, style: { fontSize: 24, align: 'left', fx: 'flat' } }));
  else if (kind === 'text') its.push(S('text', g, y, txt, { w: W - g * 2, h, style: { fontSize: 14, align: 'left', valign: 'top', color: '#5A6672', fx: 'flat' } }));
  else if (kind === 'list') for (let i = 0; i < Math.floor(h / 64); i++) { its.push(S('ellipse', g, y + i * 64 + 8, '', { w: 44, h: 44, style: st })); its.push(S('text', g + 60, y + i * 64 + 8, (txt || 'List item') + ' ' + (i + 1) + '\nSecondary line', { w: W - g * 2 - 60, h: 44, style: { fontSize: 13, align: 'left', fx: 'flat' } })); }
  else if (kind === 'side') { its.push(S('rect', 0, y, '', { w: 220, h: H - y, style: { ...st, fill: '#F7F8FA' } })); its.push(S('text', 20, y + 20, 'Dashboard\nReports\nCustomers\nSettings', { w: 180, h: 140, style: { fontSize: 14, align: 'left', valign: 'top', fx: 'flat' } })); }

  else if (kind === 'chart') its.push(S('chart', 240 + g, y, '', { w: W - 240 - g * 2, h: h - g }));

function playIntro(force) { if (window.__cydni?.play) window.__cydni.play(force); else { window.__introQueued = true; showIntroShell(); } }
function skipIntro() { if (window.__cydni?.skip) window.__cydni.skip(); else { $('.intro')?.remove(); } }
function introWanted() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  if (settings.intro === 'never') return false;
  if (settings.intro === 'daily') { const today = new Date().toDateString(); if (settings.lastIntro === today) return false; }
  return true;
}
function showIntroShell() {

}
