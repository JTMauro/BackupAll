  now() { return this.s.t; }\n  refresh() { this.snap = this.s.snapshot(); this.fire(\"change\"); this.save(); }\n  async saveJob(j) { const n = this.s.upsert(j); this.refresh(); return n; }\n  async deleteJob(id) { this.s.remove(id); this.refresh(); }\n  async runNow(id) { const r = this.s.runNow(id); this.refresh(); return r; }\n  async cancel(id) { this.s.cancel(id); this.refresh(); }\n  async setOn(on) { const r = this.s.setOn(on); this.refresh(); return r; }\n  async saveSettings(st) { this.s.setSettings(st); this.refresh(); }\n  async testTrigger(jid, tid) { const j = this.s.jobs.get(jid), t = j?.triggers.find(t => t.id === tid); if (!t) return; this.s.fire(j, `test of ${t.type} trigger`, this.s.t, { force: true, meta: t.type === \"file\" ? { file: t.path } : null }); this.refresh(); }\n  async log(r) { return demoLog(r, this.s.jobs.get(r.j), this.s.t); }\n  async clearHistory() { this.s.runs = this.s.runs.filter(r => [\"queued\", \"running\", \"waiting\"].includes(r.s)); this.s.alerts = []; this.refresh(); }\n  async exportAll() { return { app: \"cronyard\", version: \"1.0.0\", exported: new Date().toISOString(), settings: this.s.settings, jobs: [...this.s.jobs.values()] }; }\n  async importJobs(list) { list.forEach(j => this.s.upsert(j)); this.refresh(); return list.length; }\n  setSpeed(x) { this.speed = x; this.save(); this.fire(\"change\"); }\n  setEnv(k, v) { this.s.env = { ...this.s.env, [k]: v }; this.s.changed(); this.refresh(); }\n  syncNow() { const from = this.s.t, to = Date.now(); if (to > from) { this.s.tick(to); } else { this.s.t = to; this.s.invalidate(); } this.refresh(); }\n  fireFile(path) { const n = this.s.fireEvent(\"file\", t => t.path === path, { file: path.replace(/\\*.*$/, \"\") + \"incoming-\" + Math.floor(Math.random() * 1e4) + \".pdf\" }); this.refresh(); return n; }\n  fireHook(name) { const n = this.s.fireEvent(\"webhook\", t => t.hook === name, { payload: { demo: true } }); this.refresh(); return n; }\n  restart() { const r = this.s.catchUp(this.s.t - 1000, this.s.t, \"restarting\"); this.s.fireEvent(\"startup\"); this.refresh(); return r; }\n  reset(seedFn) { localStorage.removeItem(\"cronyard:demo:v2\"); this.sim = new SimExecutor(); this.s.exec = this.sim; this.speed = 1; this.seed(seedFn); this.refresh(); }\n}\n\n/* Server: talks to a running Cronyard service over HTTP + Server-Sent Events. */\nclass RemoteAPI extends Hub {\n  constructor(hello) { super(); this.mode = \"server\"; this.hello = hello; this.offset = 0; this.snap = null; this.speed = 1; }\n  async req(method, path, body) {\n    const r = await fetch(path, { method, headers: body ? { \"Content-Type\": \"application/json\" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: \"same-origin\" });\n    let d = null; try { d = await r.json(); } catch {}\n    if (!r.ok) throw Object.assign(new Error(d?.error || `Request failed (${r.status})`), { status: r.status });\n    return d;\n  }\n  connect() {\n    return new Promise((resolve, reject) => {\n      let first = true;\n      const open = () => {\n        this.es = new EventSource(\"api/events\");\n        this.es.addEventListener(\"state\", e => { const s = JSON.parse(e.data); this.offset = s.now - Date.now(); this.snap = s; this.online = true; this.fire(\"change\"); if (first) { first = false; resolve(); } });\n        this.es.addEventListener(\"alert\", e => this.fire(\"alert\", JSON.parse(e.data)));\n        this.es.onerror = () => { if (this.online) { this.online = false; this.fire(\"offline\"); } if (first) { first = false; reject(new Error(\"Couldn't open the live connection\")); } };\n      };\n      open();\n      setInterval(() => this.fire(\"clock\"), 500);\n    });\n  }\n  now() { return Date.now() + this.offset; }\n  _local(fn) { if (this.snap) { fn(this.snap); this.fire(\"change\"); } }\n  async saveJob(j) { const n = await this.req(\"PUT\", `api/jobs/${encodeURIComponent(j.id)}`, j); this._local(s => { const i = s.jobs.findIndex(x => x.id === n.id); if (i >= 0) s.jobs[i] = n; else s.jobs.push(n); }); return n; }\n  async deleteJob(id) { await this.req(\"DELETE\", `api/jobs/${encodeURIComponent(id)}`); this._local(s => { s.jobs = s.jobs.filter(j => j.id !== id); }); }\n  async runNow(id) { return this.req(\"POST\", `api/jobs/${encodeURIComponent(id)}/run`); }\n  async cancel(id) { return this.req(\"POST\", `api/runs/${encodeURIComponent(id)}/cancel`); }\n  async setOn(on) { return (await this.req(\"POST\", \"api/scheduler\", { on })).catchUp; }\n  async saveSettings(st) { await this.req(\"PUT\", \"api/settings\", st); this._local(s => { s.settings = st; }); }\n  async testTrigger(jid, tid) { return this.req(\"POST\", `api/jobs/${encodeURIComponent(jid)}/triggers/${encodeURIComponent(tid)}/test`); }\n  async log(r) {\n    const d = await this.req(\"GET\", `api/runs/${encodeURIComponent(r.id)}/log`);\n    return d.text.split(\"\\n\").filter(Boolean).map(l => { const m = l.match(/^(\\S+) (SYS|OUT|ERR) (.*)$/); return m ? { t: Date.parse(m[1]), c: m[2] === \"ERR\" ? \"er\" : m[2] === \"SYS\" ? (/^Finished OK/.test(m[3]) ? \"ok\" : /^(Failed|Killed|Timeout)/.test(m[3]) ? \"er\" : /^\\$ /.test(m[3]) ? \"cmd\" : \"\") : \"out\", x: m[3] } : { t: null, c: \"\", x: l }; });\n  }\n  async clearHistory() { await this.req(\"POST\", \"api/runs/clear\"); }\n  async exportAll() { return this.req(\"GET\", \"api/export\"); }\n  async importJobs(list) { return (await this.req(\"POST\", \"api/import\", { jobs: list })).imported; }\n}\n","cronyard/ui/demo-data.js":"/* Example jobs for the in-browser demo (simulated, nothing really runs). */\nfunction demoJobs() {\n  const iso = ms => new Date(ms).toISOString();\n  const mk = o => normJob({ ...o, sample: true });\n  const L = [\n    mk({ name: \"Nightly Postgres backup\", folder: \"/Backups\", color: \"#2C74E0\", desc: \"Full logical dump of the app database to object storage.\", owner: \"dba\",\n      action: { type: \"shell\", shell: \"bash\", cmd: \"pg_dump -Fc app | gzip > /ba \" data-cmd=\"askReset\">Reset the demo<\/button>' : \"\"}<\/div><div id=\"dataMsg\"><\/div><\/div>\n    <div class=\"panel grid\"><span class=\"h3\">About<\/span><div class=\"hint\">${demo ? \"Cronyard demo running entirely in this page. Nothing is executed; outcomes are simulated from each job's expected duration and failure rate.\" : `Cronyard ${esc(API.hello.version)} on ${esc(API.hello.platform)} · Node ${esc(API.hello.node)} · data in <span class=\"mono\">${esc(API.hello.home)}<\/span>`}<\/div><\/div>\n  <\/div>`;\n}\n","cronyard/ui/app.js":"/* ================= job editor ================= */\nlet draft = null, saveT = 0, lastUndoAt = 0;\nfunction openJob(id, tab) { const j = J(id); if (!j) return; U.drawer = \"job\"; U.sel = id; if (tab) U.tab = tab; draft = clone(j); showDrawer(); renderDrawer(); }\nfunction openRun(id) { U.drawer = \"run\"; U.runSel = id; showDrawer(); renderDrawer(); }\nfunction showDrawer() { $(\"#drawer\").hidden = false; $(\"#scrim\").hidden = false; }\nfunction closeDrawer() { flushSave(); U.drawer = null; U.sel = null; $(\"#drawer\").hidden = true; $(\"#scrim\").hidden = true; clearInterval(logT); if (U.view === \"jobs\") fillJobs(true); }\nasync function newJob(over = {}) {\n  const j = normJob({ name: \"New job\", folder: U.folder || \"/\", color: COLORS[allJ().length % COLORS.length], triggers: [{ type: \"cron\", expr: \"0 * * * *\" }], action: { type: \"shell\", cmd: \"\" }, policy: { timeout: 600 }, ...over });\n  try { const n = await API.saveJob(j); U.jm.set(n.id, n); pushUndo(null, n, \"Job created\"); U.tab = over.triggers ? \"triggers\" : \"action\"; openJob(n.id); setTimeout(() => { const t = $(\".dr-h .ttl\"); t?.focus(); t?.select(); }, 30); } catch (e) { fail(e); }\n}\nfunction pushUndo(before, after, label) { U.undo.push({ b: before && clone(before), a: after && clone(after), label }); if (U.undo.length > 50) U.undo.shift(); U.redo = []; }\nasync function undo() { const e = U.undo.pop(); if (!e) return toast(\"Nothing to undo\"); try { if (e.b) await API.saveJob(e.b); else await API.deleteJob(e.a.id); U.redo.push(e); toast(`Undid: ${e.label}`); if (U.drawer === \"job\" && draft && draft.id === (e.b || e.a).id) { e.b ? openJob(e.b.id) : closeDrawer(); } } catch (x) { fail(x); } }\nasync function redo() { const e = U.redo.pop(); if (!e) return toast(\"Nothing to redo\"); try { if (e.a) await API.saveJob(e.a); else await API.deleteJob(e.b.id); U.undo.push(e); toast(`Redid: ${e.label}`); } catch (x) { fail(x); } }\nfunction scheduleSave() { clearTimeout(saveT); saveT = setTimeout(flushSave, 450); }\nasync function flushSave() {\n  clearTimeout(saveT); if (!draft) return; const cur = J(draft.id); if (!cur) return;\n  const n = normJob(draft); if (JSON.stringify(n) === JSON.stringify(cur)) return;\n  const now = Date.now(); if (now - lastUndoAt > 2500 || !U.undo.length || U.undo[U.undo.length - 1].a?.id !== n.id) pushUndo(cur, n, `Edited “${n.name}”`); else U.undo[U.undo.length - 1].a = clone(n);\n  lastUndoAt = now; U.jm.set(n.id, n);\n  try { await API.saveJob(n); } catch (e) { fail(e); }\n}\nfunction setPath(path, v) {\n  if (path.startsWith(\"t.\")) { const [, id, f] = path.split(\".\"); const t = draft.triggers.find(t => t.id === id); if (t) t[f] = v; return; }\n  if (path.startsWith(\"env.\")) { const [, i, f] = path.split(\".\"); draft.action.env[+i][f] = v; return; }\n  const ks = path.split(\".\"); let o = draft; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v;\n}\nfunction valOf(el) { if (el.type === \"checkbox\") return el.dataset.inv ? !el.checked : el.checked; if (el.type === \"number\" || el.dataset.num) return el.value === \"\" ? 0 : +el.value; if (el.type === \"datetime-local\") return el.value ? new Date(el.value).toISOString() : \"\"; return el.value; }\nconst dtLocal = iso => { if (!iso) return \"\"; const d = new Date(iso); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };\nconst TABS = [[\"general\", \"General\"], [\"triggers\", \"Triggers\"], [\"action\", \"Action\"], [\"conditions\", \"Conditions\"], [\"policies\", \"Policies\"], [\"history\", \"History\"], [\"export\", \"Export\"]];\nfunction renderDrawer() {\n  if (U.drawer === \"run\") return renderRunDrawer();\n  const j = draft; if (!j || !J(j.id)) return closeDrawer();\n  const W = lint(normJob(j), ctx()), bad = W.filter(w => w.lvl !== \"info\").length, runN = snap().runs.some(r => r.j === j.id && r.s === \"running\");\n  $(\"#drawer\").innerHTML = `<div class=\"dr-h\"><span class=\"lamp ${runN ? \"blink\" : \"\"}\" style=\"--c:${j.color}\"><\/span><input class=\"ttl\" data-p=\"name\" value=\"${esc(j.name)}\" aria-label=\"Job name\">\n      <label class=\"sw\"><input type=\"checkbox\" data-p=\"enabled\" ${j.enabled ? \"checked\" : \"\"}><span class=\"tr\"><\/span>${j.enabled ? \"Enabled\" : \"Disabled\"}<\/label>\n      <button class=\"btn sm primary\" data-runnow=\"${j.id}\">${I.play} Run now<\/button><button class=\"btn sm\" data-cmd=\"dupJob\">Duplicate<\/button><button class=\"btn sm danger\" data-cmd=\"askDelJob\">Delete<\/button>\n      <button class=\"btn icon ghost\" data-cmd=\"closeDrawer\" aria-label=\"Close\">${I.x}<\/button><div id=\"drConfirm\" style=\"flex-basis:100%\"><\/div><\/div>\n    <div class=\"tabs\" role=\"tablist\">${TABS.map(([id, n]) => `<button role=\"tab\" data-tab=\"${id}\" aria-selected=\"${U.tab === id}\">${n}${id === \"general\" && bad ? `<span class=\"b w\">${bad}<\/span>` : id === \"triggers\" ? `<span class=\"b\">${j.triggers.length}<\/span>` : \"\"}<\/button>`).join(\"\")}<\/div>\n    <div class=\"dr-body\" id=\"drBody\">${tabHTML(j, W)}<\/div>`;\n}\nfunction lintHTML(W) { return W.length ? `<div class=\"lint\" id=\"lint\">${W.map(w => `<div style=\"--c:${w.lvl === \"bad\" ? \"var(--fail)\" : w.lvl === \"warn\" ? \"var(--warn)\" : \"var(--run)\"}\">${esc(w.msg)}<\/div>`).join(\"\")}<\/div>` : `<div class=\"lint\" id=\"lint\"><div style=\"--c:var(--ok)\">No problems found.<\/div><\/div>`; }\nfunction tabHTML(j, W) {\n  const opt = (v, cur, n) => `<option value=\"${v}\" ${v === cur ? \"selected\" : \"\"}>${n}<\/option>`;\n  const demo = API.mode === \"demo\";\n  if (U.tab === \"general\") return `${lintHTML(W)}\n    <div class=\"row\"><div class=\"fld\"><label for=\"fFolder\">Folder<\/label><input class=\"inp\" id=\"fFolder\" data-p=\"folder\" value=\"${esc(j.folder)}\" list=\"folderList\"><datalist id=\"folderList\">${folders().map(([f]) => `<option value=\"${esc(f)}\">`).join(\"\")}<\/datalist><\/div>\n    <div class=\"fld\"><label for=\"fOwner\">Owner<\/label><input class=\"inp\" id=\"fOwner\" data-p=\"owner\" value=\"${esc(j.owner)}\"><\/div><\/div>\n    <div class=\"fld\"><label for=\"fDesc\">Description<\/label><textarea class=\"inp\" id=\"fDesc\" data-p=\"desc\" rows=\"2\">${esc(j.desc)}<\/textarea><\/div>\n    <div class=\"fld\"><span class=\"lab\">Color<\/span><div style=\"display:flex;gap:8px;flex-wrap:wrap\">${COLORS.map(c => `<button class=\"btn icon\" data-color=\"${c}\" aria-label=\"Color ${c}\" aria-pressed=\"${j.color === c}\" style=\"width:30px;height:30px;padding:0;background:${c};${j.color === c ? \"outline:2px solid var(--ink);outline-offset:2px\" : \"\"}\"><\/button>`).join(\"\")}<\/div><\/div>\n    <div class=\"hint mono\">ID ${esc(j.id)} · created ${new Date(j.created).toLocaleString()}<\/div>`;\n  if (U.tab === \"triggers\") return `${j.triggers.map(t => trigHTML(j, t)).join(\"\") || `<div class=\"empty\"><b>No triggers<\/b>Without a trigger this job only runs when you press Run now.<\/div>`}\n    <div class=\"panel\"><div class=\"panel-h\" style=\"margin-bottom:8px\"><span class=\"h3\">Add a trigger<\/span><\/div><div style=\"display:flex;gap:6px;flex-wrap:wrap\">${Object.entries(TRIG_TYPES).map(([k, n]) => `<button class=\"btn sm\" data-addtrig=\"${k}\">${n}<\/button>`).join(\"\")}<\/div><\/div>`;\n  if (U.tab === \"action\") {\n    const a = j.action; let body = \"\";\n    if (a.type === \"shell\") body = `<div class=\"row\" style=\"grid-template-columns:1fr 200px\"><div class=\"fld\"><label for=\"aCmd\">Command<\/label><textarea class=\"inp mono\" id=\"aCmd\" data-p=\"action.cmd\" rows=\"3\" spellcheck=\"false\" placeholder=\"${demo ? \"pg_dump app > /backups/app.sql\" : \"e.g. /opt/scripts/backup.sh --full\"}\">${esc(a.cmd)}<\/textarea><\/div>\n      <div class=\"fld\"><label for=\"aShell\">Shell<\/label><select class=\"inp\" id=\"aShell\" data-p=\"action.shell\">${opt(\"default\", a.shell, \"System default (sh / cmd)\")}${opt(\"bash\", a.shell, \"bash\")}${opt(\"powershell\", a.shell, \"PowerShell\")}${opt(\"cmd\", a.shell, \"cmd.exe\")}<\/select><\/div><\/div>`;\n    else if (a.type === \"script\") body = `<div class=\"fld\"><label for=\"aLang\">Language<\/label><select class=\"inp\" id=\"aLang\" data-p=\"action.lang\" style=\"max-width:240px\">${Object.entries(LANGS).map(([k, n]) => opt(k, a.lang, n)).join(\"\")}<\/select><\/div>\n      <div class=\"fld\"><label for=\"aScript\">Script<\/label><textarea class=\"inp mono\" id=\"aScript\" data-p=\"action.script\" rows=\"12\" spellcheck=\"false\" style=\"font-size:12.5px\">${esc(a.script)}<\/textarea><span class=\"hint\">Saved with the job and written to the data folder before each run.<\/span><\/div>`;\n    else if (a.type === \"http\") body = `<div class=\"row\" style=\"grid-template-columns:130px 1fr\"><div class=\"fld\"><label for=\"aM\">Method<\/label><select class=\"inp\" id=\"aM\" data-p=\"action.method\">${[\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\", \"HEAD\"].map(m => opt(m, a.method, m)).join(\"\")}<\/select><\/div><div class=\"fld\"><label for=\"aU\">URL<\/label><input class=\"inp mono\" id=\"aU\" data-p=\"action.url\" value=\"${esc(a.url)}\" placeholder=\"https://\"><\/div><\/div>\n      <div class=\"fld\"><label for=\"aH\">Headers (JSON)<\/label><textarea class=\"inp mono\" id=\"aH\" data-p=\"action.headers\" rows=\"2\" placeholder='{\"Authorization\": \"Bearer …\"}'>${esc(a.headers)}<\/textarea><\/div>\n      <div class=\"fld\"><label for=\"aB\">Body<\/label><textarea class=\"inp mono\" id=\"aB\" data-p=\"action.body\" rows=\"4\">${esc(a.body)}<\/textarea><span class=\"hint\">Any status from 200 to 299 counts as success.<\/span><\/div>`;\n    else if (a.type === \"docker\") body = `<div class=\"row\"><div class=\"fld\"><label for=\"aI\">Image<\/label><input class=\"inp mono\" id=\"aI\" data-p=\"action.image\" value=\"${esc(a.image)}\" placeholder=\"ghcr.io/acme/tool:1.2\"><\/div><div class=\"fld\"><label for=\"aA\">Arguments<\/label><input class=\"inp mono\" id=\"aA\" data-p=\"action.args\" value=\"${esc(a.args)}\"><\/div><\/div><span class=\"hint\">Runs <span class=\"mono\">docker run --rm<\/span>. Docker must be installed on the host.<\/span>`;\n    else if (a.type === \"claude\") body = `<div class=\"fld\"><label for=\"aP\">Prompt<\/label><textarea class=\"inp\" id=\"aP\" data-p=\"action.prompt\" rows=\"5\">${esc(a.prompt)}<\/textarea><span class=\"hint\">Runs <span class=\"mono\">claude -p<\/span> with the working directory below. The Claude Code CLI must be installed and signed in for the account Cronyard runs as.<\/span><\/div>`;\n    return `<div class=\"seg\" role=\"group\" aria-label=\"Action type\">${Object.entries(ACTIONS).map(([k, n]) => `<button data-atype=\"${k}\" aria-pressed=\"${a.type === k}\">${n}<\/button>`).join(\"\")}<\/div>${body}\n      ${a.type !== \"http\" ? `<div class=\"row\"><div class=\"fld\"><label for=\"aCwd\">Working directory<\/label><input class=\"inp mono\" id=\"aCwd\" data-p=\"action.cwd\" value=\"${esc(a.cwd)}\" placeholder=\"defaults to the data folder\"><\/div>\n      <div class=\"fld\"><label for=\"aUser\">Run as user<\/label><input class=\"inp mono\" id=\"aUser\" data-p=\"action.user\" value=\"${esc(a.user)}\" placeholder=\"service account\"><\/div><\/div>` : \"\"}\n      <div class=\"fld\"><span class=\"lab\">Environment variables<\/span>${a.env.map((e, i) => `<div class=\"row\" style=\"grid-template-columns:1fr 2fr auto\"><input class=\"inp mono\" data-p=\"env.${i}.k\" value=\"${esc(e.k)}\" aria-label=\"Name\"><input class=\"inp mono\" data-p=\"env.${i}.v\" value=\"${esc(e.v)}\" aria-label=\"Value\"><button class=\"btn xs danger\" data-delenv=\"${i}\">Remove<\/button><\/div>`).join(\"\")}\n        <button class=\"btn sm\" data-cmd=\"addEnv\" style=\"justify-self:start\">Add variable<\/button>\n        <span class=\"hint\">Every run also gets <span class=\"mono\">CRONYARD_JOB, CRONYARD_RUN_ID, CRONYARD_ATTEMPT, CRONYARD_TRIGGER, CRONYARD_SCHEDULED_AT<\/span>, plus <span class=\"mono\">CRONYARD_FILE<\/span> for file triggers and <span class=\"mono\">CRONYARD_PAYLOAD<\/span> / <span class=\"mono\">CRONYARD_PAYLOAD_FILE<\/span> for webhooks.<\/span><\/div>`;\n  }\n  if (U.tab === \"conditions\") return `<p class=\"hint\" style=\"margin:0\">A run only starts when every checked condition holds. Otherwise it waits (if you allow it) or is skipped.<\/p>\n    <label class=\"chk\"><input type=\"checkbox\" data-p=\"cond.network\" ${j.cond.network ? \"checked\" : \"\"}> Only when the network is available<\/label>\n    <label class=\"chk\"><input type=\"checkbox\" data-p=\"cond.ac\" ${j.cond.ac ? \"checked\" : \"\"}> Only when on AC power (not battery)<\/label>\n    <div class=\"fld\" style=\"max-width:320px\"><label for=\"cW\">If a condition isn't met, wait up to (minutes)<\/label><input class=\"inp\" type=\"number\" min=\"0\" id=\"cW\" data-p=\"cond.wait\" value=\"${j.cond.wait}\"><span class=\"hint\">0 skips the run right away.<\/span><\/div>`;\n  if (U.tab === \"policies\") {\n    const p = j.policy; const ce = { allow: \"Start another copy alongside it, up to the limit below.\", forbid: \"Skip the new run (Kubernetes Forbid, Windows “Do not start a new instance”).\", replace: \"Stop the running copy and start the new one.\", queue: \"Wait until the running copy finishes, then start.\" };\n    return `<div class=\"fld\"><span class=\"lab\">If the previous run is still going<\/span><div class=\"seg\">${[\"forbid\", \"queue\", \"replace\", \"allow\"].map(k => `<button data-conc=\"${k}\" aria-pressed=\"${p.conc === k}\">${{ forbid: \"Skip\", queue: \"Queue\", replace: \"Replace\", allow: \"Run in parallel\" }[k]}<\/button>`).join(\"\")}<\/div><span class=\"hint\">${ce[p.conc]}<\/span><\/div>\n      <div class=\"row\">${p.conc === \"allow\" ? `<div class=\"fld\"><label for=\"pPar\">Max parallel copies<\/label><input class=\"inp\" type=\"number\" min=\"1\" id=\"pPar\" data-p=\"policy.par\" value=\"${p.par}\"><\/div>` : \"\"}\n        <div class=\"fld\"><label for=\"pT\">Timeout (seconds, 0 = none)<\/label><input class=\"inp\" type=\"number\" min=\"0\" id=\"pT\" data-p=\"policy.timeout\" value=\"${p.timeout}\"><\/div>\n        <div class=\"fld\"><label for=\"pPool\">Worker pool<\/label><select class=\"inp\" id=\"pPool\" data-p=\"policy.pool\">${snap().settings.pools.map(x => opt(x.id, p.pool, `${x.id} (${x.slots} slot${x.slots === 1 ? \"\" : \"s\"})`)).join(\"\")}<\/select><\/div>\n        <div class=\"fld\"><label for=\"pPr\">Priority in the queue<\/label><select class=\"inp\" id=\"pPr\" data-p=\"policy.prio\">${opt(\"high\", p.prio, \"High\")}${opt(\"normal\", p.prio, \"Normal\")}${opt(\"low\", p.prio, \"Low\")}<\/select><\/div><\/div>\n      <div class=\"row\"><div class=\"fld\"><label for=\"pR\">Retries on failure<\/label><input class=\"inp\" type=\"number\" min=\"0\" max=\"20\" id=\"pR\" data-p=\"policy.retries\" value=\"${p.retries}\"><\/div>\n        <div class=\"fld\"><label for=\"pD\">Retry delay (seconds)<\/label><input class=\"inp\" type=\"number\" min=\"1\" id=\"pD\" data-p=\"policy.delay\" value=\"${p.delay}\"><\/div>\n        <div class=\"fld\"><label for=\"pB\">Backoff<\/label><select class=\"inp\" id=\"pB\" data-p=\"policy.backoff\">${opt(\"fixed\", p.backoff, \"Fixed\")}${opt(\"exp\", p.backoff, \"Exponential (×2 each try)\")}<\/select><\/div><\/div>\n      ${p.retries ? `<div class=\"hint\">R = [[\"general\", \"General\"], [\"triggers\", \"Triggers\"], [\"action\", \"Action\"], [\"conditions\", \"Conditions\"], [\"policies\", \"Policies\"], [\"history\", \"History\"], [\"export\", \"Export\"]];\nfunction renderDrawer() {\n  if (U.drawer === \"run\") return renderRunDrawer();\n  const j = draft; if (!j || !J(j.id)) return closeDrawer();\n  const W = lint(normJob(j), ctx()), bad = W.filter(w => w.lvl !== \"info\").length, runN = snap().runs.some(r => r.j === j.id && r.s === \"running\");\n  $(\"#drawer\").innerHTML = `<div class=\"dr-h\"><span class=\"lamp ${runN ? \"blink\" : \"\"}\" style=\"--c:${j.color}\"><\/span><input class=\"ttl\" data-p=\"name\" value=\"${esc(j.name)}\" aria-label=\"Job name\">\n      <label class=\"sw\"><input type=\"checkbox\" data-p=\"enabled\" ${j.enabled ? \"checked\" : \"\"}><span class=\"tr\"><\/span>${j.enabled ? \"Enabled\" : \"Disabled\"}<\/label>\n      <button class=\"btn sm primary\" data-runnow=\"${j.id}\">${I.play} Run now<\/button><button class=\"btn sm\" data-cmd=\"dupJob\">Duplicate<\/button><button class=\"btn sm danger\" data-cmd=\"askDelJob\">Delete<\/button>\n      <button class=\"btn icon ghost\" data-cmd=\"closeDrawer\" aria-label=\"Close\">${I.x}<\/button><div id=\"drConfirm\" style=\"flex-basis:100%\"><\/div><\/div>\n    <div class=\"tabs\" role=\"tablist\">${TABS.map(([id, n]) => `<button role=\"tab\" data-tab=\"${id}\" aria-selected=\"${U.tab === id}\">${n}${id === \"general\" && bad ? `<span class=\"b w\">${bad}<\/span>` : id === \"triggers\" ? `<span class=\"b\">${j.triggers.length}<\/span>` : \"\"}<\/button>`).join(\"\")}<\/div>\n    <div class=\"dr-body\" id=\"drBody\">${tabHTML(j, W)}<\/div>`;\n}\nfunction lintHTML(W) { return W.length ? `<div class=\"lint\" id=\"lint\">${W.map(w => `<div style=\"--c:${w.lvl === \"bad\" ? \"var(--fail)\" : w.lvl === \"warn\" ? \"var(--warn)\" : \"var(--run)\"}\">${esc(w.msg)}<\/div>`).join(\"\")}<\/div>` : `<div class=\"lint\" id=\"lint\"><div style=\"--c:var(--ok)\">No problems found.<\/div><\/div>`; }\nfunction tabHTML(j, W) {\n  const opt = (v, cur, n) => `<option value=\"${v}\" ${v === cur ? \"selected\" : \"\"}>${n}<\/option>`;\n  const demo = API.mode === \"demo\";\n  if (U.tab === \"general\") return `${lintHTML(W)}\n    <div class=\"row\"><div class=\"fld\"><label for=\"fFolder\">Folder<\/label><input class=\"inp\" id=\"fFolder\" data-p=\"folder\" value=\"${esc(j.folder)}\" list=\"folderList\"><datalist id=\"folderList\">${folders().map(([f]) => `<option value=\"${esc(f)}\">`).join(\"\")}<\/datalist><\/div>\n    <div class=\"fld\"><label for=\"fOwner\">Owner<\/label><input class=\"inp\" id=\"fOwner\" data-p=\"owner\" value=\"${esc(j.owner)}\"><\/div><\/div>\n    <div class=\"fld\"><label for=\"fDesc\">Description<\/label><textarea class=\"inp\" id=\"fDesc\" data-p=\"desc\" rows=\"2\">${esc(j.desc)}<\/textarea><\/div>\n    <div class=\"fld\"><span class=\"lab\">Color<\/span><div style=\"display:flex;gap:8px;flex-wrap:wrap\">${COLORS.map(c => `<button class=\"btn icon\" data-color=\"${c}\" aria-label=\"Color ${c}\" aria-pressed=\"${j.color === c}\" style=\"width:30px;height:30px;padding:0;background:${c};${j.color === c ? \"outline:2px solid var(--ink);outline-offset:2px\" : \"\"}\"><\/button>`).join(\"\")}<\/div><\/div>\n    <div class=\"hint mono\">ID ${esc(j.id)} · created ${new Date(j.created).toLocaleString()}<\/div>`;\n  if (U.tab === \"triggers\") return `${j.triggers.map(t => trigHTML(j, t)).join(\"\") || `<div class=\"empty\"><b>No triggers<\/b>Without a trigger this job only runs when you press Run now.<\/div>`}\n    <div class=\"panel\"><div class=\"panel-h\" style=\"margin-bottom:8px\"><span class=\"h3\">Add a trigger<\/span><\/div><div style=\"display:flex;gap:6px;flex-wrap:wrap\">${Object.entries(TRIG_TYPES).map(([k, n]) => `<button class=\"btn sm\" data-addtrig=\"${k}\">${n}<\/button>`).join(\"\")}<\/div><\/div>`;\n  if (U.tab === \"action\") {\n    const a = j.action; let body = \"\";\n    if (a.type === \"shell\") body = `<div class=\"row\" style=\"grid-template-columns:1fr 200px\"><div class=\"fld\"><label for=\"aCmd\">Command<\/label><textarea class=\"inp mono\" id=\"aCmd\" data-p=\"action.cmd\" rows=\"3\" spellcheck=\"false\" placeholder=\"${demo ? \"pg_dump app > /backups/app.sql\" : \"e.g. /opt/scripts/backup.sh --full\"}\">${esc(a.cmd)}<\/textarea><\/div>\n      <div class=\"fld\"><label for=\"aShell\">Shell<\/label><select class=\"inp\" id=\"aShell\" data-p=\"action.shell\">${opt(\"default\", a.shell, \"System default (sh / cmd)\")}${opt(\"bash\", a.shell, \"bash\")}${opt(\"powershell\", a.shell, \"PowerShell\")}${opt(\"cmd\", a.shell, \"cmd.exe\")}<\/select><\/div><\/div>`;\n    else if (a.type === \"script\") body = `<div class=\"fld\"><label for=\"aLang\">Language<\/label><select class=\"inp\" id=\"aLang\" data-p=\"action.lang\" style=\"max-width:240px\">${Object.entries(LANGS).map(([k, n]) => opt(k, a.lang, n)).join(\"\")}<\/select><\/div>\n      <div class=\"fld\"><label for=\"aScript\">Script<\/label><textarea class=\"inp mono\" id=\"aScript\" data-p=\"action.script\" rows=\"12\" spellcheck=\"false\" style=\"font-size:12.5px\">${esc(a.script)}<\/textarea><span class=\"hint\">Saved with the job and written to the data folder before each run.<\/span><\/div>`;\n    else if (a.type === \"http\") body = `<div class=\"row\" style=\"grid-template-columns:130px 1fr\"><div class=\"fld\"><label for=\"aM\">Method<\/label><select class=\"inp\" id=\"aM\" data-p=\"action.method\">${[\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\", \"HEAD\"].map(m => opt(m, a.method, m)).join(\"\")}<\/select><\/div><div class=\"fld\"><label for=\"aU\">URL<\/label><input class=\"inp mono\" id=\"aU\" data-p=\"action.url\" value=\"${esc(a.url)}\" placeholder=\"https://\"><\/div><\/div>\n      <div class=\"fld\"><label for=\"aH\">Headers (JSON)<\/label><textarea class=\"inp mono\" id=\"aH\" data-p=\"action.headers\" rows=\"2\" placeholder='{\"Authorization\": \"Bearer …\"}'>${esc(a.headers)}<\/textarea><\/div>\n      <div class=\"fld\"><label for=\"aB\">Body<\/label><textarea class=\"inp mono\" id=\"aB\" data-p=\"action.body\" rows=\"4\">${esc(a.body)}<\/textarea><span class=\"hint\">Any status from 200 to 299 counts as success.<\/span><\/div>`;\n    else if (a.type === \"docker\") body = `<div class=\"row\"><div class=\"fld\"><label for=\"aI\">Image<\/label><input class=\"inp mono\" id=\"aI\" data-p=\"action.image\" value=\"${esc(a.image)}\" placeholder=\"ghcr.io/acme/tool:1.2\"><\/div><div class=\"fld\"><label for=\"aA\">Arguments<\/label><input class=\"inp mono\" id=\"aA\" data-p=\"action.args\" value=\"${esc(a.args)}\"><\/div><\/div><span class=\"hint\">Runs <span class=\"mono\">docker run --rm<\/span>. Docker must be installed on the host.<\/span>`;\n    else if (a.type === \"claude\") body = `<div class=\"fld\"><label for=\"aP\">Prompt<\/label><textarea class=\"inp\" id=\"aP\" data-p=\"action.prompt\" rows=\"5\">${esc(a.prompt)}<\/textarea><span class=\"hint\">Runs <span class=\"mono\">claude -p<\/span> with the working directory below. The Claude Code CLI must be installed and signed in for the account Cronyard runs as.<\/span><\/div>`;\n    return `<div class=\"seg\" role=\"group\" aria-label=\"Action type\">${Object.entries(ACTIONS).map(([k, n]) => `<button data-atype=\"${k}\" aria-pressed=\"${a.type === k}\">${n}<\/button>`).join(\"\")}<\/div>${body}\n      ${a.type !== \"http\" ? `<div class=\"row\"><div class=\"fld\"><label for=\"aCwd\">Working directory<\/label><input class=\"inp mono\" id=\"aCwd\" data-p=\"action.cwd\" value=\"${esc(a.cwd)}\" placeholder=\"defaults to the data folder\"><\/div>\n      <div class=\"fld\"><label for=\"aUser\">Run as user<\/label><input class=\"inp mono\" id=\"aUser\" data-p=\"action.user\" value=\"${esc(a.user)}\" placeholder=\"service account\"><\/div><\/div>` : \"\"}\n      <div class=\"fld\"><span class=\"lab\">Environment variables<\/span>${a.env.map((e, i) => `<div class=\"row\" style=\"grid-template-columns:1fr 2fr auto\"><input class=\"inp mono\" data-p=\"env.${i}.k\" value=\"${esc(e.k)}\" aria-label=\"Name\"><input class=\"inp mono\" data-p=\"env.${i}.v\" value=\"${esc(e.v)}\" aria-label=\"Value\"><button class=\"btn xs danger\" data-delenv=\"${i}\">Remove<\/button><\/div>`).join(\"\")}\n        <button class=\"btn sm\" data-cmd=\"addEnv\" style=\"justify-self:start\">Add variable<\/button>\n        <span class=\"hint\">Every run also gets <span class=\"mono\">CRONYARD_JOB, CRONYARD_RUN_ID, CRONYARD_ATTEMPT, CRONYARD_TRIGGER, CRONYARD_SCHEDULED_AT<\/span>, plus <span class=\"mono\">CRONYARD_FILE<\/span> for file triggers and <span class=\"mono\">CRONYARD_PAYLOAD<\/span> / <span class=\"mono\">CRONYARD_PAYLOAD_FILE<\/span> for webhooks.<\/span><\/div>`;\n  }\n  if (U.tab === \"conditions\") return `<p class=\"hint\" style=\"margin:0\">A run only starts when every checked condition holds. Otherwise it waits (if you allow it) or is skipped.<\/p>\n    <label class=\"chk\"><input type=\"checkbox\" data-p=\"cond.network\" ${j.cond.network ? \"checked\" : \"\"}> Only when the network is available<\/label>\n    <label class=\"chk\"><input type=\"checkbox\" data-p=\"cond.ac\" ${j.cond.ac ? \"checked\" : \"\"}> Only when on AC power (not battery)<\/label>\n    <div class=\"fld\" style=\"max-width:320px\"><label for=\"cW\">If a condition isn't met, wait up to (minutes)<\/label><input class=\"inp\" type=\"number\" min=\"0\" id=\"cW\" data-p=\"cond.wait\" value=\"${j.cond.wait}\"><span class=\"hint\">0 skips the run right away.<\/span><\/div>`;\n  if (U.tab === \"policies\") {\n    const p = j.policy; const ce = { allow: \"Start another copy alongside it, up to the limit below.\", forbid: \"Skip the new run (Kubernetes Forbid, Windows “Do not start a new instance”).\", replace: \"Stop the running copy and start the new one.\", queue: \"Wait until the running copy finishes, then start.\" };\n    return `<div class=\"fld\"><span class=\"lab\">If the previous run is still going<\/span><div class=\"seg\">${[\"forbid\", \"queue\", \"replace\", \"allow\"].map(k => `<button data-conc=\"${k}\" aria-pressed=\"${p.conc === k}\">${{ forbid: \"Skip\", queue: \"Queue\", replace: \"Replace\", allow: \"Run in parallel\" }[k]}<\/button>`).join(\"\")}<\/div><span class=\"hint\">${ce[p.conc]}<\/span><\/div>\n      <div class=\"row\">${p.conc === \"allow\" ? `<div class=\"fld\"><label for=\"pPar\">Max parallel copies<\/label><input class=\"inp\" type=\"number\" min=\"1\" id=\"pPar\" data-p=\"policy.par\" value=\"${p.par}\"><\/div>` : \"\"}\n        <div class=\"fld\"><label for=\"pT\">Timeout (seconds, 0 = none)<\/label><input class=\"inp\" type=\"number\" min=\"0\" id=\"pT\" data-p=\"policy.timeout\" value=\"${p.timeout}\"><\/div>\n        <div class=\"fld\"><label for=\"pPool\">Worker pool<\/label><select class=\"inp\" id=\"pPool\" data-p=\"policy.pool\">${snap().settings.pools.map(x => opt(x.id, p.pool, `${x.id} (${x.slots} slot${x.slots === 1 ? \"\" : \"s\"})`)).join(\"\")}<\/select><\/div>\n        <div class=\"fld\"><label for=\"pPr\">Priority in the queue<\/label><select class=\"inp\" id=\"pPr\" data-p=\"policy.prio\">${opt(\"high\", p.prio, \"High\")}${opt(\"normal\", p.prio, \"Normal\")}${opt(\"low\", p.prio, \"Low\")}<\/select><\/div><\/div>\n      <div class=\"row\"><div class=\"fld\"><label for=\"pR\">Retries on failure<\/label><input class=\"inp\" type=\"number\" min=\"0\" max=\"20\" id=\"pR\" data-p=\"policy.retries\" value=\"${p.retries}\"><\/div>\n        <div class=\"fld\"><label for=\"pD\">Retry delay (seconds)<\/label><input class=\"inp\" type=\"number\" min=\"1\" id=\"pD\" data-p=\"policy.delay\" value=\"${p.delay}\"><\/div>\n        <div class=\"fld\"><label for=\"pB\">Backoff<\/label><select class=\"inp\" id=\"pB\" data-p=\"policy.backoff\">${opt(\"fixed\", p.backoff, \"Fixed\")}${opt(\"exp\", p.backoff, \"Exponential (×2 each try)\")}<\/select><\/div><\/div>\n      ${p.retries ? `<div class=\"hint\">Retry schedule: ${Array.from({ length: p.retries }, (_, i) => fmtDur(p.delay * (p.backoff === \"exp\" ? 2 ** i : 1))).join(\" → \")}<\/div>` : \"\"}\n      <div class=\"row\"><div class=\"fld\"><label for=\"pM\">Missed runs (after downtime)<\/label><select class=\"inp\" id=\"pM\" data-p=\"policy.misfire\">${opt(\"once\", p.misfire, \"Run once to catch up\")}${opt(\"all\", p.misfire, \"Run every missed one (max 10)\")}${opt(\"skip\", p.misfire, \"Skip them\")}<\/select><\/div>\n        <div class=\"fld\"><label for=\"pDl\">Start deadline (seconds, 0 = none)<\/label><input class=\"inp\" type=\"number\" min=\"0\" id=\"pDl\" data-p=\"policy.deadline\" value=\"${p.deadline}\"><span class=\"hint\">Skip if it can't start this long after its scheduled time.<\/span><\/div>\n        <div class=\"fld\"><label for=\"pS\">SLA: finish within (seconds)<\/label><input class=\"inp\" type=\"number\" min=\"0\" id=\"pS\" data-p=\"policy.sla\" value=\"${p.sla}\"><span class=\"hint\">Measured from the scheduled time.<\/span><\/div><\/div>\n      <div class=\"row\"><div class=\"fld\"><label for=\"pN\">Alerts<\/label><select class=\"inp\" id=\"pN\" data-p=\"policy.notify\">${opt(\"failure\", p.notify, \"On failure\")}${opt(\"always\", p.notify, \"On every run\")}${opt(\"none\", p.notify, \"Never\")}<\/select><\/div>\n        <div class=\"fld\"><label for=\"pK\">Keep last N runs<\/label><input class=\"inp\" type=\"number\" min=\"5\" max=\"1000\" id=\"pK\" data-p=\"policy.keep\" value=\"${p.keep}\"><\/div>\n        <div class=\"fld\"><label for=\"sA\">Expected duration (seconds)<\/label><input class=\"inp\" type=\"number\" min=\"0.1\" step=\"any\" id=\"sA\" data-p=\"sim.avg\" value=\"${j.sim.avg}\"><span class=\"hint\">Used for planning, warnings and the runway.<\/span><\/div><\/div>\n      ${demo ? `<div class=\"panel row\" style=\"background:var(--panel-2)\"><div class=\"fld\"><label for=\"sF\">Demo: failure rate (%)<\/label><input class=\"inp\" type=\"number\" min=\"0\" max=\"100\" id=\"sF\" data-p=\"sim.failpct\" value=\"${Math.round(j.sim.fail * 100)}\"><\/div><div class=\"fld\"><label for=\"sJ\">Demo: duration variance (%)<\/label><input class=\"inp\" type=\"number\" min=\"0\" max=\"200\" id=\"sJ\" data-p=\"sim.jitpct\" value=\"${Math.round(j.sim.jit * 100)}\"><\/div><\/div>` : \"\"}`;\n  }\n  if (U.tab === \"history\") {\n    const rs = runsOf(j.id).slice().reverse(), done = rs.filter(r => r.dur != null), d = done.map(r => r.dur).sort((a, b) => a - b), q = p => d.length ? d[Math.min(d.length - 1, Math.floor(p * d.length))] : null;\n    const okN = rs.filter(r => r.s === \"success\").length, badN = rs.filter(r => [\"failed\", \"timeout\"].includes(r.s)).length;\n    return `<div class=\"kpis\" style=\"grid-template-columns:repeat(4,minmax(0,1fr))\"><div class=\"kpi\"><div class=\"lab\">Success<\/div><div class=\"v\">${okN + badN ? Math.round(okN / (okN + badN) * 100) + \"<small>%<\/small>\" : \"—\"}<\/div><div class=\"d\">${okN} ok · ${badN} failed<\/div><\/div>\n      <div class=\"kpi\"><div class=\"lab\">Median<\/div><div class=\"v\">${q(.5) != null ? fmtDur(q(.5)) : \"—\"}<\/div><div class=\"d\">duration<\/div><\/div><div class=\"kpi\"><div class=\"lab\">p95<\/div><div class=\"v\">${q(.95) != null ? fmtDur(q(.95)) : \"—\"}<\/div><div class=\"d\">duration<\/div><\/div>\n      <div class=\"kpi\"><div class=\"lab\">Skipped<\/div><div class=\"v\">${rs.filter(r => r.s === \"skipped\").length}<\/div><div class=\"d\">of ${rs.length} kept<\/div><\/div><\/div>\n      <div class=\"list\">${rs.slice(0, 60).map(r => `<div class=\"li\" data-run=\"${r.id}\">${pill(r.s)}<div style=\"min-width:0\"><div class=\"n\" style=\"font-weight:500\">${esc(r.why)}<\/div><div class=\"s\">${fmtDT(r.st || r.sch, tzS())}${r.a > 1 ? ` · attempt ${r.a}` : \"\"}${r.msg ? \" · \" + esc(r.msg) : \"\"}<\/div><\/div><span class=\"r\">${r.dur != null ? fmtDur(r.dur) : r.s === \"running\" ? \"running\" : \"—\"}<\/span><\/div>`).join(\"\") || `<div class=\"empty\"><b>No runs yet<\/b>Press Run now to try it.<\/div>`}<\/div>`;\n  }\n  if (U.tab === \"export\") {\n    const [, fn, ext] = EXPORTS[U.exp]; const code = fn(normJob(j), ctx());\n    return `<p class=\"hint\" style=\"margin:0\">Move this job to another scheduler, or keep a copy in version control. Notes in comments flag anything that doesn't translate exactly.<\/p>\n      <div class=\"seg\">${Object.entries(EXPORTS).map(([k, [n]]) => `<button data-exp=\"${k}\" aria-pressed=\"${U.exp === k}\">${n}<\/button>`).join(\"\")}<\/div>\n      <div class=\"code\" id=\"expCode\">${esc(code).replace(/^(#.*)$/gm, '<span class=\"c\">$1<\/span>')}<\/div>\n      <div style=\"display:flex;gap:8px\"><button class=\"btn\" data-cmd=\"copyExp\">${I.copy} Copy<\/button><button class=\"btn\" data-cmd=\"dlExp\">${I.dl} Download .${ext}<\/button><\/div>`;\n  }\n  return \"\";\n}\nfunction trigHTML(j, t) {\n  const opt = (v, cur, n) => `<option value=\"${v}\" ${v === cur ? \"selected\" : \"\"}>${n}<\/option>`;\n  const p = `t.${t.id}.`; let body = \"\";\n  if (t.type === \"cron\") { const c = cronOf(t.expr); body = `<div class=\"row\" style=\"grid-template-columns:1fr 200px\"><div class=\"fld\"><label>Cron expression<\/label><input class=\"inp mono\" data-p=\"${p}expr\" value=\"${esc(t.expr)}\" spellcheck=\"false\" style=\"font-size:15px\"><\/div>\n      <div class=\"fld\"><label>Preset<\/label><select class=\"inp\" data-preset-t=\"${t.id}\"><option value=\"\">Choose…<\/option>${PRESETS.map(([n, e]) => `<option value=\"${esc(e)}\">${n}<\/option>`).join(\"\")}<\/select><\/div><\/div>${c.ok ? \"\" : `<div class=\"lint\"><div style=\"--c:var(--fail)\">${esc(c.err)}<\/div><\/div>`}`; }\n  else if (t.type === \"interval\") body = `<div class=\"row\"><div class=\"fld\"><label>Every<\/label><input class=\"inp\" type=\"number\" min=\"1\" data-p=\"${p}every\" value=\"${t.every}\"><\/div><div class=\"fld\"><label>Unit<\/label><select class=\"inp\" data-p=\"${p}unit\">${Object.entries(UNIT_N).map(([k, n]) => opt(k, t.unit, n + \"s\")).join(\"\")}<\/select><\/div><div class=\"fld\"><label>Starting from<\/label><input class=\"inp\" type=\"datetime-local\" data-p=\"${p}anchor\" value=\"${dtLocal(t.anchor)}\"><\/div><\/div>`;\n  else if (t.type === \"once\") body = `<div class=\"fld\" style=\"max-width:280px\"><label>Run at<\/label><input class=\"inp\" type=\"datetime-local\" data-p=\"${p}at\" value=\"${dtLocal(t.at)}\"><\/div>`;\n  else if (t.type === \"startup\") body = `<div class=\"fld\" style=\"max-width:280px\"><label>Delay after start (seconds)<\/label><input class=\"inp\" type=\"number\" min=\"0\" data-p=\"${p}delay\" value=\"${t.delay}\"><\/div><span class=\"hint\">Fires when the Cronyard service starts, which is normally at boot.<\/span>`;\n  else if (t.type === \"file\") body = `<div class=\"fld\"><label>Path or pattern to watch<\/label><input class=\"inp mono\" data-p=\"${p}path\" value=\"${esc(t.path)}\" placeholder=\"/srv/inbox/*.csv  or  C:\\\\Drop\\\\*.xlsx\"><\/div><span class=\"hint\">Fires when a matching file is created or changed. Wildcards: <span class=\"mono\">*<\/span>, <span class=\"mono\">?<\/span>, <span class=\"mono\">**<\/span>. The file path is passed in <span class=\"mono\">CRONYARD_FILE<\/span>.<\/span>`;\n  else if (t.type === \"webhook\") { const url = API.mode === \"server\" ? `${location.origin}/hooks/${t.hook || \"name\"}` : `http://your-server:7878/hooks/${t.hook || \"name\"}`; body = `<div class=\"row\"><div class=\"fld\"><label>Path name<\/label><input class=\"inp mono\" data-p=\"${p}hook\" value=\"${esc(t.hook)}\" placeholder=\"deploy-finished\"><\/div><div class=\"fld\"><label>Secret (recommended)<\/label><input class=\"inp mono\" data-p=\"${p}secret\" value=\"${esc(t.secret)}\" placeholder=\"any long random string\"><\/div><\/div>\n      <div class=\"code\" style=\"padding:8px 10px;white-space:pre-wrap\">curl -X POST ${esc(url)}${t.secret ? ` \\\\\\n  -H \"X-Cronyard-Secret: ${esc(t.secret)}\"` : \"\"} \\\\\\n  -d '{\"any\":\"json\"}'<\/div>`; }\n  else if (t.type === \" ===== */\nconst CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();\nfunction makeZip(files) {\n  const enc = new TextEncoder(), parts = [], cen = []; let off = 0; const d = new Date(), dt = ((d.getFullYear() - 1980) << 25) | ((d.getMonth() + 1) << 21) | (d.getDate() << 16) | (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);\n  for (const [name, text] of Object.entries(files)) {\n    const nb = enc.encode(name), data = enc.encode(text), crc = CRC(data), exec = /\\.sh$|index\\.js$/.test(name);\n    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(8, 0, true); h.setUint32(10, dt, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);\n    parts.push(new Uint8Array(h.buffer), nb, data);\n    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 0x0314, true); c.setUint16(6, 20, true); c.setUint32(12, dt, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(38, ((exec ? 0o100755 : 0o100644) << 16) >>> 0, true); c.setUint32(42, off, true);\n    cen.push(new Uint8Array(c.buffer), nb); off += 30 + nb.length + data.length;\n  }\n  const cs = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, Object.keys(files).length, true); e.setUint16(10, Object.keys(files).length, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);\n  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: \"application/zip\" } <script>
"use strict";
/* Cronyard shared time + cron library. Runs in Node and the browser. */
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, "0");
const num = (a, b) => a - b;
const MONN = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const MONL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DOWN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DOWS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const ORD = ["", "first", "second", "third", "fourth", "fifth"];

/* ================= time zones ================= */
const TZ_LOCAL = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch { return "UTC"; } })();
const TZ_LIST = (() => { try { const l = Intl.supportedValuesOf("timeZone"); return l.includes("UTC") ? l : ["UTC", ...l]; } catch { return ["UTC", "America/New_York", "America/Chicago", "America/Denver", "America/Los_Angeles", "Europe/London", "Europe/Berlin", "Asia/Tokyo", "Asia/Kolkata", "Australia/Sydney"]; } })();
const _dtf = {};
function tzParts(ms, tz) {
  let f = _dtf[tz];
  if (!f) { try { f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short" }); } catch { f = _dtf.UTC || new Intl.DateTimeFormat("en-US", { timeZone: "UTC", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short" }); } _dtf[tz] = f; }
  const p = {}; for (const x of f.formatToParts(new Date(ms))) p[x.type] = x.value;
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, s: +p.second, dow: DOWS.indexOf(p.weekday) };
}
function tzOffset(ms, tz) { const p = tzParts(ms, tz); return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000; }
function zoned(y, mo, d, h, mi, s, tz) {

  if (o2 !== o1) t = g - o2; return t;
}
const observesDST = tz => { const y = new Date().getFullYear(); return tzOffset(Date.UTC(y, 0, 15), tz) !== tzOffset(Date.UTC(y, 6, 15), tz); };
const dimOf = (y, mo) => new Date(Date.UTC(y, mo, 0)).getUTCDate();
const fmtClock = (ms, tz, sec = false) => { const p = tzParts(ms, tz); return `${pad2(p.h)}:${pad2(p.mi)}${sec ? ":" + pad2(p.s) : ""}`; };
const fmtDate = (ms, tz) => { const p = tzParts(ms, tz); return `${DOWS[p.dow]} ${MONN[p.mo - 1].charAt(0) + MONN[p.mo - 1].slice(1).toLowerCase()} ${p.d}`; };
const fmtDT = (ms, tz) => `${fmtDate(ms, tz)} ${fmtClock(ms, tz)}`;
const isoDay = (ms, tz) => { const p = tzParts(ms, tz); return `${p.y}-${pad2(p.mo)}-${pad2(p.d)}`; };
function fmtDur(sec) {
  sec = Math.round(sec); if (sec < 1) return "<1s"; if (sec < 60) return sec + "s";
  const m = Math.floor(sec / 60), s = sec % 60; if (m < 60) return s && m < 10 ? `${m}m ${s}s` : `${m}m`;
  const h = Math.floor(m / 60), mm = m % 60; if (h < 48) return mm ? `${h}h ${mm}m` : `${h}h`;
  return `${Math.floor(h / 24)}d ${h % 24}h`;
}
function fmtRel(ms, now) {
  const d = (ms - now) / 1000, a = Math.abs(d);
  const s = a < 60 ? `${Math.round(a)}s` : a < 3600 ? `${Math.round(a / 60)}m` : a < 86400 ? `${(a / 3600).toFixed(a < 36000 ? 1 : 0)}h` : `${(a / 86400).toFixed(1)}d`;
  return d >= 0 ? `in ${s}` : `${s} ago`;
}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();

    const nb = enc.encode(name), data = enc.encode(text), crc = CRC(data), exec = /\.sh$|index\.js$/.test(name);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(8, 0, true); h.setUint32(10, dt, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);

    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 0x0314, true); c.setUint16(6, 20, true); c.setUint32(12, dt, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(38, ((exec ? 0o100755 : 0o100644) << 16) >>> 0, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nb); off += 30 + nb.length + data.length;

}

      const p = el.dataset.p, v = valOf(el);
      if (p === "sim.failpct") draft.sim.fail = clamp(v / 100, 0, 1); else if (p === "sim.jitpct") draft.sim.jit = clamp(v / 100, 0, 2); else setPath(p, v);
      scheduleSave(); if (el.type === "checkbox" || el.tagName === "SELECT" || el.type === "datetime-local") { if (p === "enabled" || p === "name") renderDrawer(); else rerenderBody(); }
    }
  });
  document.addEventListener("input", e => {
    const el = e.target; if (!el.dataset.p || !draft || !$("#drawer").contains(el) || el.type === "checkbox" || el.tagName === "SELECT") return;
    const p = el.dataset.p; if (p === "sim.failpct" || p === "sim.jitpct") return;
    setPath(p, valOf(el)); scheduleSave(); liveUpdate();
  });
  $("#scrim").onclick = () => { closeDrawer(); $("#rail").classList.remove("open"); };
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  $("#menuBtn").onclick = () => { $("#rail").classList.add("open"); $("#scrim").hidden = false; };
  $("#powerBtn").onclick = togglePower; $("#palBtn").onclick = openPalette; $("#themeBtn").onclick = cycleTheme; $("#newBtn").onclick = () => newJob();
  document.addEventListener("keydown", e => {
    const typing = e.target.closest?.("input,textarea,select"), mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); return openPalette(); }
    if (e.key === "Escape") { if (!$("#modal").hidden) return closeModal(); if (U.drawer) return closeDrawer(); return; }
    if (typing) return;
    if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
    if (mod || e.altKey || !$("#modal").hidden) return;
    const v = VIEWS.find(v => v.k === e.key); if (v) return setView(v.id);
    if (e.key === "n") { e.preventDefault(); return newJob(); }
    if (e.key === "/") { e.preventDefault(); return openPalette(); }
    if (e.key === "?") return openKeys();
    if (e.key === "Enter" && e.target.matches("tr[data-job],tr[data-run]")) e.target.click();
  });
}

/* ================= boot ================= */
function onApi(ev, d) {
  if (ev === "change") { U.jm = new Map(snap().jobs.map(j => [j.id, j])); renderChrome(); refreshView(); }
  else if (ev === "clock") updateClock();
  else if (ev === "alert" && (d.kind === "fail" || d.kind === "sla")) toast(d.msg, { bad: d.kind === "fail", action: d.r ? { label: "View", fn: () => openRun(d.r) } : null });
  else if (ev === "offline") toast("Lost the connection to Cronyard. Reconnecting…", { bad: true });
}
function loginCard(hello) {
  return new Promise(res => {
    $("#view").innerHTML = `<div class="empty" style="min-height:70vh"><div class="panel grid" style="width:min(420px,100%);text-align:left"><span class="h2">Sign in to Cronyard on ${esc(hello.host)}</span><p class="hint" style="margin:0">Enter the access token. On the server, run <span class="mono">node server/index.js token</span> or open <span class="mono">config.json</span> in the data folder.</p><input class="inp mono" id="tok" type="password" autocomplete="current-password" aria-label="Access token"><button class="btn primary" id="tokGo">Sign in</button><div id="tokMsg" class="hint"></div></div></div>`;
    const go = async () => { const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: $("#tok").value.trim() }) }); if (r.ok) res(); else $("#tokMsg").textContent = (await r.json().catch(() => ({}))).error || "That didn't work."; };
    $("#tokGo").onclick = go; $("#tok").onkeydown = e => { if (e.key === "Enter") go(); }; $("#tok").focus();
  });
}
async function boot() {
  const th = lsGet("cronyard:theme"); if (th) document.documentElement.dataset.theme = th;
  let hello = null;
  if (!window.CRONYARD_DEMO_ONLY && /^https?:$/.test(location.protocol)) { try { const r = await fetch("api/hello", { cache: "no-store", signal: AbortSignal.timeout(2500) }); if (r.ok) { const d = await r.json(); if (d.app === "cronyard") hello = d; } } catch {} }
  if (hello) {
    if (hello.authRequired) { await loginCard(hello); hello.authRequired = false; }
    API = new RemoteAPI(hello);
    try { await API.connect(); } catch (e) { $("#view").innerHTML = `<div class="empty"><b>Couldn't connect to Cronyard</b>${esc(e.message)}. Check that the service is running, then reload.</div>`; return; }
  } else API = new LocalAPI(demoJobs);
  U.jm = new Map(snap().jobs.map(j => [j.id, j]));
  API.on(onApi); wire(); renderChrome(); renderView();
  if (API.mode === "demo" && !lsGet("cronyard:seen")) { lsSet("cronyard:seen", 1); setTimeout(() => toast("This is a live demo: jobs are simulated in your browser. Install Cronyard to run real jobs.", { action: { label: "How", fn: openInstall } }), 1200); }
}
boot();

</script>
