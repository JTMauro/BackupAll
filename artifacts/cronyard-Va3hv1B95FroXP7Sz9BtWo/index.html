<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cronyard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument console — a machined rail on the left, a control strip on top, extruded panels on a brushed-metal deck; runs are physical blocks on a 3D runway. */
:root{
  --bg:#D9DDE2; --deck:#E4E7EB; --panel:#F4F5F7; --panel-2:#EAECEF; --panel-3:#DCE0E5; --well:#E1E4E8;
  --ink:#171C24; --muted:#58616F; --faint:#8790A0; --line:rgba(23,28,36,.12); --line-2:rgba(23,28,36,.22);
  --accent:#F2A900; --accent-ink:#1B1400; --accent-deep:#B57E00; --accent-soft:rgba(242,169,0,.16);
  --ok:#17935F; --fail:#D93B3B; --warn:#DE6A1F; --run:#2C74E0; --queue:#7E5BE6; --wait:#0F95A6; --skip:#8A93A3;
  --shadow-rgb:30,38,52; --edge:rgba(23,28,36,.2); --hi:rgba(255,255,255,.9);
  --term-bg:#12161D; --term-ink:#CFD6E2; --term-dim:#6D7787;
  --f-display:"Chakra Petch","Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --slab:0 1px 0 var(--hi) inset,0 -1px 0 rgba(0,0,0,.05) inset,0 2px 0 var(--edge),0 3px 0 rgba(var(--shadow-rgb),.1),0 22px 40px -22px rgba(var(--shadow-rgb),.5),0 6px 12px -6px rgba(var(--shadow-rgb),.2);
  --key:0 1px 0 var(--hi) inset,0 2px 0 var(--edge),0 4px 8px -3px rgba(var(--shadow-rgb),.35);
  --key-down:0 1px 0 var(--edge) inset,0 1px 2px rgba(var(--shadow-rgb),.25);
  --inset:0 2px 4px rgba(var(--shadow-rgb),.18) inset,0 1px 0 var(--hi);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0E13; --deck:#11151C; --panel:#191E27; --panel-2:#20262F; --panel-3:#2A313C; --well:#0F1319;
  --ink:#E7EBF1; --muted:#9AA3B2; --faint:#687284; --line:rgba(231,235,241,.08); --line-2:rgba(231,235,241,.17);
  --accent:#FFB81C; --accent-ink:#1B1400; --accent-deep:#FFCB55; --accent-soft:rgba(255,184,28,.14);
  --ok:#3CCB8B; --fail:#FF6262; --warn:#FF8A3D; --run:#5E9BFF; --queue:#A58BFF; --wait:#3BC3D4; --skip:#7B8494;
  --shadow-rgb:0,0,0; --edge:rgba(0,0,0,.6); --hi:rgba(255,255,255,.06);
  --term-bg:#07090D; --term-ink:#CFD6E2; --term-dim:#5F6878;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0E13; --deck:#11151C; --panel:#191E27; --panel-2:#20262F; --panel-3:#2A313C; --well:#0F1319;
  --ink:#E7EBF1; --muted:#9AA3B2; --faint:#687284; --line:rgba(231,235,241,.08); --line-2:rgba(231,235,241,.17);
  --accent:#FFB81C; --accent-ink:#1B1400; --accent-deep:#FFCB55; --accent-soft:rgba(255,184,28,.14);
  --ok:#3CCB8B; --fail:#FF6262; --warn:#FF8A3D; --run:#5E9BFF; --queue:#A58BFF; --wait:#3BC3D4; --skip:#7B8494;
  --shadow-rgb:0,0,0; --edge:rgba(0,0,0,.6); --hi:rgba(255,255,255,.06);
  --term-bg:#07090D; --term-ink:#CFD6E2; --term-dim:#5F6878;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  background-image:linear-gradient(180deg,var(--deck),var(--bg) 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hint{font-size:12px;color:var(--muted)}
.lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:var(--f-display)}

/* frame */
.app{height:100%;display:grid;grid-template-columns:212px minmax(0,1fr);gap:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:12px}
.rail{background:var(--panel);border-radius:16px;box-shadow:var(--slab);display:flex;flex-direction:column;gap:12px;padding:14px 10px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 8px;border-bottom:1px solid var(--line)}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.02em;display:block;line-height:1}
.brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gear{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);display:grid;place-items:center;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 3px 0 var(--accent-deep),0 8px 14px -6px rgba(var(--shadow-rgb),.5)}
.gear svg{width:22px;height:22px;color:var(--accent-ink)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:9px;text-align:left;color:var(--muted);font-weight:600}
.nav button svg{width:18px;height:18px;flex:none}
.nav button .b{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;padding:0 6px;border-radius:5px;background:var(--panel-3);color:var(--muted)}
.nav button .b.bad{background:var(--fail);color:#fff}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:var(--key)}
.nav button[aria-current="true"] svg{color:var(--accent-deep)}
.rail-sec{display:grid;gap:6px}
.rail-sec .lab{padding:0 8px}
.envs{display:grid;gap:6px;padding:0 4px}
.rail-foot{margin-top:auto;display:grid;gap:6px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-radius:16px;box-shadow:var(--slab);overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2))}
.clock{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:11px;background:var(--term-bg);color:var(--term-ink);box-shadow:0 2px 6px rgba(0,0,0,.45) inset,0 1px 0 var(--hi);min-width:0}
.clock .t{font-family:var(--f-mono);font-size:20px;font-weight:600;letter-spacing:.02em;color:#FFD36A;text-shadow:0 0 12px rgba(255,190,40,.35)}
.clock .d{font-size:11px;line-height:1.2;color:var(--term-dim);font-family:var(--f-mono)}
.clock .d b{color:var(--term-ink);font-weight:500}
.clock .lag{color:#FF9F5A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--panel-2);color:var(--ink);padding:8px 12px;border-radius:9px;font-weight:600;box-shadow:var(--key);transition:transform .07s,box-shadow .07s;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn:active,.btn[aria-pressed="true"]{transform:translateY(2px);box-shadow:var(--key-down)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{padding:8px;width:36px;height:36px}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 7px;font-size:11.5px;border-radius:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 3px 0 var(--accent-deep),0 8px 16px -6px rgba(var(--shadow-rgb),.4)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
.btn.danger{color:var(--fail)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--panel-2)}
.seg{display:inline-flex;background:var(--well);padding:3px;border-radius:10px;gap:2px;box-shadow:var(--inset);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-weight:600;color:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--key)}
.spacer{flex:1}
/* 3D toggle switch */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600;font-size:12.5px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:40px;height:22px;border-radius:12px;background:var(--well);box-shadow:var(--inset);position:relative;flex:none;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,#fff,#d9dde3);box-shadow:0 2px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked + .tr{background:var(--ok)}
.sw input:checked + .tr::after{transform:translateX(18px)}
.sw input:focus-visible + .tr{outline:2px solid var(--accent);outline-offset:2px}
.power{display:inline-flex;align-items:center;gap:8px;border:0;padding:6px 12px 6px 8px;border-radius:10px;font-weight:700;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:12px;background:var(--panel-2);box-shadow:var(--key)}
.lamp{width:11px;height:11px;border-radius:50%;background:var(--c,var(--skip));box-shadow:0 0 0 2px rgba(0,0,0,.12),0 0 10px var(--c,transparent);flex:none;display:inline-block}
.lamp.blink{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.35}}

/* view */
.view{flex:1;min-height:0;overflow:auto;position:relative}
.pad{padding:14px}
.grid{display:grid;gap:14px}
.h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.01em;margin:0}
.h3{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0}
.panel{background:var(--panel);border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 18px 30px -20px rgba(var(--shadow-rgb),.5)}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel-h .spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:13px;padding:11px 13px;box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 12px 20px -14px rgba(var(--shadow-rgb),.5);min-width:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.scene{position:relative;border-radius:16px;overflow:hidden;height:440px;background:radial-gradient(120% 90% at 50% 0%,var(--panel-2),var(--well));box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 30px 50px -30px rgba(var(--shadow-rgb),.55);touch-action:none}
.scene canvas{display:block;width:100%;height:100%;cursor:grab}
.scene-cap{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.scene-cap > *{pointer-events:auto}
.scene-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none;padding:20px}
.legend{position:absolute;left:12px;bottom:10px;right:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* status pills */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:2px 8px 2px 6px;border-radius:6px;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.st.running::before{animation:blink 1s infinite}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--panel-3);color:var(--ink);white-space:nowrap}
.tag.c::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}

/* lists / tables */
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel-2);box-shadow:0 1px 0 var(--hi) inset,0 1px 0 var(--edge);cursor:pointer;min-width:0}
.li:hover{background:var(--panel-3)}
.li .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.li .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--well);overflow:hidden;margin-top:4px;box-shadow:0 1px 1px rgba(var(--shadow-rgb),.2) inset}
.bar i{display:block;height:100%;background:var(--run)}
.tbl-wrap{overflow-x:auto;border-radius:12px;box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr[data-job],.tbl tr[data-run]{cursor:pointer}
.tbl tr[data-job]:hover td,.tbl tr[data-run]:hover td{background:var(--panel-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.tbl .nm .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,#000)}
.tbl .off{opacity:.55}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:16px;vertical-align:middle}
.spark i{width:4px;border-radius:1px;background:var(--c);height:100%}

/* jobs layout */
.jobs{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;padding:14px;align-items:start}
.tree{display:grid;gap:2px}
.tree button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 9px;border-radius:8px;text-align:left;font-size:13px}
.tree button:hover{background:var(--panel-2)}
.tree button[aria-pressed="true"]{background:var(--accent-soft);font-weight:700}
.tree button .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tree svg{width:15px;height:15px;color:var(--muted);flex:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.inp{width:100%;border:0;background:var(--well);border-radius:9px;padding:8px 10px;box-shadow:var(--inset);outline:none;min-width:0}
.inp:focus{box-shadow:0 0 0 2px var(--accent) inset}
.inp.mono{font-family:var(--f-mono)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5}
select.inp{padding-right:6px}
.fld{display:grid;gap:5px;min-width:0}
.fld > label,.fld > .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:var(--f-display)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:9px;font-weight:500;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent-deep)}

/* editor drawer */
.scrim{position:fixed;inset:0;background:rgba(var(--shadow-rgb),.3);z-index:90;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);z-index:100;background:var(--panel);display:flex;flex-direction:column;
  box-shadow:-2px 0 0 var(--edge),-30px 0 60px -20px rgba(var(--shadow-rgb),.55);animation:slidein .2s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px max(16px, env(safe-area-inset-right,0px)) 10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dr-h .ttl{flex:1;min-width:160px;font-family:var(--f-display);font-size:20px;font-weight:700;border:0;background:transparent;outline:none;padding:2px 0}
.dr-h .ttl:focus{box-shadow:0 2px 0 var(--accent)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;background:transparent;padding:10px 11px 9px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .b{font-family:var(--f-mono);font-size:10.5px;background:var(--panel-3);padding:0 5px;border-radius:5px;margin-left:4px}
.tabs button .b.w{background:var(--warn);color:#fff}
.dr-body{flex:1;overflow:auto;padding:16px max(16px, env(safe-area-inset-right,0px)) 24px 16px;display:grid;gap:14px;align-content:start}
.trig{background:var(--panel-2);border-radius:13px;padding:12px;box-shadow:0 1px 0 var(--hi) inset,0 2px 0 var(--edge),0 10px 18px -12px rgba(var(--shadow-rgb),.45);display:grid;gap:10px}
.trig-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trig-h b{font-family:var(--f-display);font-size:14px}
.trig .eng{font-size:13px;color:var(--ink);background:var(--accent-soft);padding:6px 9px;border-radius:8px}
.nexts{display:flex;flex-wrap:wrap;gap:5px}
.nexts span{font-family:var(--f-mono);font-size:11.5px;background:var(--panel);padding:2px 7px;border-radius:6px;box-shadow:0 1px 0 var(--edge)}
.lint{display:grid;gap:6px}
.lint div{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:8px 10px;border-radius:9px;font-size:13px;background:color-mix(in srgb,var(--c) 11%,transparent)}
.lint div::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c);box-shadow:0 0 6px var(--c)}
.code{position:relative;background:var(--term-bg);color:var(--term-ink);border-radius:12px;padding:14px 14px 14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;overflow:auto;white-space:pre;box-shadow:0 2px 8px rgba(0,0,0,.45) inset,0 1px 0 var(--hi);max-height:52vh}
.code .c{color:var(--term-dim)}
.code .k{color:#FFD36A}
.term{background:var(--term-bg);color:var(--term-ink);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:12px;line-height:1.6;overflow:auto;max-height:46vh;box-shadow:0 2px 8px rgba(0,0,0,.45) inset}
.term div{white-space:pre-wrap;word-break:break-word}
.term .ts{color:var(--term-dim)}
.term .er{color:#FF7A7A}
.term .ok{color:#59D99B}
.term .wa{color:#FFB15A}
.term .cmd{color:#FFD36A}

/* schedule heat (CSS 3D) */
.heat-wrap{overflow-x:auto;padding:10px 0 0}
.heat-stage{perspective:1600px;min-width:760px;height:390px;display:grid;place-items:center;overflow:hidden}
.heat{transform-style:preserve-3d;transform:rotateX(56deg) rotateZ(-32deg);display:grid;grid-template-columns:repeat(24,24px);grid-auto-rows:24px;gap:4px;padding:16px;background:var(--panel-2);border-radius:14px;box-shadow:0 0 0 1px var(--line) inset;position:relative}
.hb{position:relative;transform-style:preserve-3d;border-radius:3px;background:var(--well)}
.hb .tp,.hb .sx,.hb .sy{position:absolute;left:0;top:0;width:24px;height:24px}
.hb .tp{transform:translateZ(var(--h));background:var(--c);border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.hb .sx{height:var(--h);top:24px;transform-origin:top;transform:rotateX(-90deg);background:color-mix(in srgb,var(--c) 62%,#000)}
.hb .sy{width:var(--h);left:24px;transform-origin:left;transform:rotateY(90deg);background:color-mix(in srgb,var(--c) 78%,#000)}
.hb.zero .tp{background:var(--panel-3);transform:translateZ(1px)}
.hb.zero .sx,.hb.zero .sy{display:none}
.hb:hover .tp{outline:2px solid var(--ink)}
.heat-lbl{position:absolute;font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.gantt{display:grid;gap:4px;min-width:760px}
.g-row{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:8px}
.g-row .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:7px;align-items:center}
.g-row .nm .dot{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.g-track{position:relative;height:22px;background:var(--well);border-radius:6px;box-shadow:var(--inset);background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100%/24) 100%}
.g-tick{position:absolute;top:3px;bottom:3px;min-width:3px;border-radius:2px;background:var(--c);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 50%,#000)}
.g-tick.x{background:repeating-linear-gradient(45deg,var(--fail) 0 3px,var(--c) 3px 6px)}
.g-axis{display:grid;grid-template-columns:190px 1fr;gap:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.g-axis div:last-child{display:flex;justify-content:space-between}
.g-now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* DAG */
.dag-wrap{overflow:auto;padding:14px;height:100%}
.dag-stage{perspective:1800px}
.dag{position:relative;transform-style:preserve-3d;transform:rotateX(16deg);transform-origin:50% 0;background:var(--panel-2);border-radius:16px;box-shadow:0 0 0 1px var(--line) inset,0 2px 0 var(--edge),0 40px 60px -30px rgba(var(--shadow-rgb),.5);background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:22px 22px}
.dag > svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.node{--c:#888;position:absolute;width:210px;background:var(--panel);border-radius:12px;padding:10px 12px 10px 14px;cursor:pointer;transform:translateZ(14px);transition:transform .15s;
  box-shadow:0 1px 0 var(--hi) inset,0 2px 0 var(--edge),0 4px 0 rgba(var(--shadow-rgb),.12),0 18px 26px -10px rgba(var(--shadow-rgb),.5);display:grid;gap:4px}
.node::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.node:hover{transform:translateZ(30px)}
.node b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.node .s{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* cron lab */
.lab-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:14px;padding:14px}
.cron-in{font-family:var(--f-mono);font-size:22px;padding:12px 14px;letter-spacing:.04em}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.fcell{background:var(--panel-2);border-radius:10px;padding:8px;box-shadow:0 1px 0 var(--hi) inset,0 2px 0 var(--edge);min-width:0}
.fcell .v{font-family:var(--f-mono);font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcell .x{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.fcell.bad{box-shadow:0 0 0 2px var(--fail) inset}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.days i{display:block;border-radius:4px 4px 2px 2px;background:var(--accent);box-shadow:0 2px 0 var(--accent-deep);min-height:3px;position:relative}
.days span{font-size:10px;text-align:center;color:var(--muted);font-family:var(--f-mono)}

/* modal / toast / tip */
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:start center;padding:9vh 16px 16px;background:rgba(var(--shadow-rgb),.34);backdrop-filter:blur(3px)}
.modal-card{width:min(620px,100%);max-height:82vh;overflow:auto;background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--slab),0 40px 80px -20px rgba(var(--shadow-rgb),.6);display:grid;gap:12px;animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-card h3{margin:0;font-family:var(--f-display);font-size:19px}
.pal-list{display:grid;gap:2px;max-height:52vh;overflow:auto}
.pal-list button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px}
.pal-list button.on,.pal-list button:hover{background:var(--panel-2)}
.pal-list button kbd,.kb kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pal-list .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 10px 2px;font-family:var(--f-display)}
.kb{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kb kbd{margin:0;background:var(--panel-2);border-radius:6px;padding:2px 7px;box-shadow:0 2px 0 var(--edge);justify-self:start;color:var(--ink)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:300;display:grid;gap:8px;justify-items:center;width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--panel);padding:10px 12px 10px 14px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 20px 40px -10px rgba(var(--shadow-rgb),.6);animation:pop .18s ease;max-width:100%}
.toast.bad{background:var(--fail);color:#fff}
.toast button{border:0;background:rgba(255,255,255,.16);color:inherit;padding:5px 10px;border-radius:7px;font-weight:700}
.tip{position:fixed;z-index:250;pointer-events:none;background:var(--ink);color:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 10px 20px -6px rgba(var(--shadow-rgb),.5);max-width:300px}
.empty{display:grid;place-items:center;gap:6px;text-align:center;padding:30px 16px;color:var(--muted)}
.empty b{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--fail) 12%,transparent);font-size:13px}
.note{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}

@media (max-width:1180px){ .ov{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .lab-grid{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:10px;padding-block:10px}
  .rail{position:fixed;z-index:120;left:0;top:0;bottom:0;width:260px;border-radius:0 16px 16px 0;transform:translateX(-105%);transition:transform .22s;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(10px, env(safe-area-inset-left,0px))}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex!important}
  .jobs{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fields{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top .wide{display:none}
  .scene{height:340px}
}
.menu-btn{display:none!important}
@media (max-width:860px){ .menu-btn{display:inline-flex!important} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

<script>window.CRONYARD_DEMO_ONLY = true; window.CRONYARD_SRC = {"cronyard/package.json":"{\n  \"name\": \"cronyard\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Self-hosted job scheduler with a 3D web console. Runs as a background service, no login session needed.\",\n  \"license\": \"MIT\",\n  \"main\": \"server/index.js\",\n  \"bin\": { \"cronyard\": \"server/index.js\" },\n  \"engines\": { \"node\": \">=18\" },\n  \"scripts\": {\n    \"start\": \"node server/index.js\",\n    \"build\": \"node build.js\",\n    \"test\": \"node test/run.js && node test/catchup.js\"\n  }\n}\n","cronyard/README.md":"# Cronyard\n\nA self-hosted job scheduler with a 3D web console. It runs as a background service, so jobs run at boot and whether or not anyone is logged in, like Windows Task Scheduler's \"run whether user is logged on or not\", cron or systemd timers.\n\n- **Zero dependencies.** Plain Node.js 18+. No database, no npm install. Data is JSON files plus one log file per run.\n- **Runs anything.** Shell commands (sh, bash, PowerShell, cmd), scripts stored with the job (Python, Node.js, Bash, PowerShell, batch), HTTP calls, Docker containers and Claude Code prompts.\n- **Works offline.** The console is served by the service itself, with no external accounts or sign-in services. The 3D views use a built-in renderer with no CDN.\n\n## Install\n\n| OS | Command (from the unzipped folder) | What it does |\n|---|---|---|\n| Windows | `.\\install\\install-windows.ps1` in PowerShell **as Administrator** | Copies to `C:\\Program Files\\Cronyard` and registers a startup task that runs as **SYSTEM** and restarts itself if it stops |\n| Linux | `sudo bash install/install-linux.sh` | `/opt/cronyard` plus a `cronyard.service` systemd unit (`Restart=always`) |\n| macOS | `sudo bash install/install-macos.sh` | `/usr/local/cronyard` plus a LaunchDaemon that starts before login |\n| Try it | `node server/index.js` | Runs in the foreground until you press Ctrl+C |\n\nThen open **http://localhost:7878**. Each installer also takes `--uninstall` (`-Uninstall` on Windows), which keeps your data.\n\nData folder: `C:\\ProgramData\\Cronyard`, `/var/lib/cronyard`, or `/Library/Application Support/Cronyard`. Set `CRONYARD_HOME` or pass `--home` to change it.\n\n### Remote access\n\nThe console listens on `127.0.0.1` only. To reach it from other machines, set `\"host\": \"0.0.0.0\"` in `config.json` in the data folder and restart. Browsers on other machines then sign in with the access token:\n\n```\nnode server/index.js token --home <data folder>\n```\n\nLocal browsers on the server don't need the token (set `\"localNoAuth\": false` to require it there too). Put Cronyard behind HTTPS (a reverse proxy) before exposing it beyond a trusted network: anyone with the token can run commands as the service account.\n\n## What it can do\n\n**Triggers** (any number per job)\n- Cron: 5 or 6 fields (seconds), names (`MON`, `JAN`), `L` (last day), `5L` (last Friday), `MON#2` (second Monday), `@daily` and other macros, `CRON_TZ=` prefix\n- Repeat every N seconds, minutes, hours or days from an anchor time\n- One time\n- When Cronyard starts (at boot), with an optional delay\n- On file change (`/srv/in/*.csv`, `C:\\Drop\\**\\*.xlsx`); the path is passed in `CRONYARD_FILE`\n- On webhook: `POST /hooks/<name>` with an optional secret (`X-Cronyard-Secret` header or `?secret=`); the body is passed in `CRONYARD_PAYLOAD` and `CRONYARD_PAYLOAD_FILE`\n- After another job succeeds, fails, or finishes either way (pipelines)\n\nEvery time-based trigger has its own time zone (DST-aware), random jitter, a time window (e.g. 08:00–18:00), weekdays-only, skip-holidays (shared calendar) and active-from/until dates.\n\n**Conditions:** only when the network is up, only on AC power, and optionally wait up to N minutes for them.\n\n**Policies**\n- When the previous run is still going: skip, queue, replace, or run in parallel up to N copies\n- Retries with fixed or exponential backoff\n- Timeouts that kill the whole process tree\n- Missed runs after downtime (machine off, service stopped): run once, run each (max 10), or skip\n- Starting deadline, priority, worker pools (e.g. one database job at a time), SLA alerts, history retention per job\n- Run as another user (Linux/macOS when the service runs as root)\n\n**Operations:** live 3D runway of past and upcoming runs, a 7-day 3D load map that shows thundering herds, a 24-hour timeline with pool-contention markers, a pipeline graph, run history with full logs (live tail), alerts, Slack/Teams webhook notifications, a cron lab with English explanations, lint warnings (DST traps, impossible dates, timeouts shorter than runtimes, missing secrets, dependency loops), undo/redo, and import/export.\n\n**Export** any job to crontab, systemd units, Windows Task Scheduler (PowerShell), a Kubernetes CronJob, GitHub Actions or an Airflow DAG.\n\n## API\n\nEverything the console does is available over HTTP (send `Authorization: Bearer <token>` from other machines):\n\n```\nGET    /api/state                      jobs, settings, recent runs, alerts, next run times\nGET    /api/events                     Server-Sent Events stream of state changes\nPOST   /api/jobs                       create a job (JSON)\nPUT    /api/jobs/:id                   create or replace a job\nDELETE /api/jobs/:id\nPOST   /api/jobs/:id/run               run now\nPOST   /api/runs/:id/cancel\nGET    /api/runs/:id/log?from=<byte>   log text\nPOST   /api/scheduler {\"on\": false}    stop or start scheduling\nGET    /api/export   POST /api/import\nPOST   /hooks/:name                    webhook trigger\n```\n\n## Develop\n\n```\nnode build.js        # rebuild ui/dist/index.html after editing ui/ or shared/\nnpm test             # end-to-end test against a real service in a temp folder\n```\n\n`shared/engine.js` is the scheduler. The service runs it with a real process executor; the in-browser demo runs the same code with a simulated one.\n","cronyard/build.js":"#!/usr/bin/env node\n\"use strict\";\n/* Builds the single-file web console.\n   ui/dist/index.html     served by the Cronyard service\n   ui/dist/demo.html      standalone demo that also carries the service source (for the zip download) */\nconst fs = require(\"fs\"), path = require(\"path\");\nconst R = p => fs.readFileSync(path.join(__dirname, p), \"utf8\");\nconst scripts = [\"shared/cron.js\", \"shared/engine.js\", \"ui/iso3d.js\", \"ui/api.js\", \"ui/demo-data.js\", \"ui/views.js\", \"ui/app.js\"].map(R).join(\"\\n;\\n\");\nconst page = extra => `${R(\"ui/head.html\")}\\n${R(\"ui/body.html\")}\\n${extra}<script>\\n${scripts.replace(/<\\/script/gi, \"<\\\\/script\")}\\n<\/script>\\n`;\nfs.mkdirSync(path.join(__dirname, \"ui\", \"dist\"), { recursive: true });\nconst doc = s => `<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><\/head><body style=\"margin:0\">${s}<\/body><\/html>`;\nfs.writeFileSync(path.join(__dirname, \"ui\", \"dist\", \"index.html\"), doc(page(\"\")));\nconst SRC = [\"package.json\", \"README.md\", \"build.js\", \"shared/cron.js\", \"shared/engine.js\", \"server/index.js\", \"server/store.js\", \"server/executor.js\", \"server/host.js\", \"server/http.js\",\n  \"install/install-linux.sh\", \"install/install-macos.sh\", \"install/install-windows.ps1\", \"test/run.js\", \"test/catchup.js\", \"ui/head.html\", \"ui/body.html\", \"ui/iso3d.js\", \"ui/api.js\", \"ui/demo-data.js\", \"ui/views.js\", \"ui/app.js\"];\nconst files = {}; for (const f of SRC) if (fs.existsSync(path.join(__dirname, f))) files[\"cronyard/\" + f] = R(f);\nfiles[\"cronyard/ui/dist/index.html\"] = fs.readFileSync(path.join(__dirname, \"ui\", \"dist\", \"index.html\"), \"utf8\");\nconst embed = `<script>window.CRONYARD_DEMO_ONLY = true; window.CRONYARD_SRC = ${JSON.stringify(files).replace(/<\\//g, \"<\\\\/\").replace(/<\!--/g, \"<\\\\!--\")};<\/script>\\n`;\nfs.writeFileSync(path.join(__dirname, \"ui\", \"dist\", \"demo.html\"), page(embed));\nconsole.log(`built ui/dist/index.html (${(fs.statSync(path.join(__dirname, \"ui\", \"dist\", \"index.html\")).size / 1024).toFixed(0)} KB) and ui/dist/demo.html (${(fs.statSync(path.join(__dirname, \"ui\", \"dist\", \"demo.html\")).size / 1024).toFixed(0)} KB, ${Object.keys(files).length} files embedded)`);\n","cronyard/shared/cron.js":"\"use strict\";\n/* Cronyard shared time + cron library. Runs in Node and the browser. */\nconst clone = o => JSON.parse(JSON.stringify(o));\nconst uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst pad2 = n => String(n).padStart(2, \"0\");\nconst num = (a, b) => a - b;\nconst MONN = [\"JAN\", \"FEB\", \"MAR\", \"APR\", \"MAY\", \"JUN\", \"JUL\", \"AUG\", \"SEP\", \"OCT\", \"NOV\", \"DEC\"];\nconst MONL = [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\", \"August\", \"September\", \"October\", \"November\", \"December\"];\nconst DOWN = [\"SUN\", \"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\", \"SAT\"];\nconst DOWL = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"];\nconst DOWS = [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\"];\nconst ORD = [\"\", \"first\", \"second\", \"third\", \"fourth\", \"fifth\"];\n\n/* ================= time zones ================= */\nconst TZ_LOCAL = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || \"UTC\"; } catch { return \"UTC\"; } })();\nconst TZ_LIST = (() => { try { const l = Intl.supportedValuesOf(\"timeZone\"); return l.includes(\"UTC\") ? l : [\"UTC\", ...l]; } catch { return [\"UTC\", \"America/New_York\", \"America/Chicago\", \"America/Denver\", \"America/Los_Angeles\", \"Europe/London\", \"Europe/Berlin\", \"Asia/Tokyo\", \"Asia/Kolkata\", \"Australia/Sydney\"]; } })();\nconst _dtf = {};\nfunction tzParts(ms, tz) {\n  let f = _dtf[tz];\n  if (!f) { try { f = new Intl.DateTimeFormat(\"en-US\", { timeZone: tz, hourCycle: \"h23\", year: \"numeric\", month: \"2-digit\", day: \"2-digit\", hour: \"2-digit\", minute: \"2-digit\", second: \"2-digit\", weekday: \"short\" }); } catch { f = _dtf.UTC || new Intl.DateTimeFormat(\"en-US\", { timeZone: \"UTC\", hourCycle: \"h23\", year: \"numeric\", month: \"2-digit\", day: \"2-digit\", hour: \"2-digit\", minute: \"2-digit\", second: \"2-digit\", weekday: \"short\" }); } _dtf[tz] = f; }\n  const p = {}; for (const x of f.formatToParts(new Date(ms))) p[x.type] = x.value;\n  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, s: +p.second, dow: DOWS.indexOf(p.weekday) };\n}\nfunction tzOffset(ms, tz) { const p = tzParts(ms, tz); return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000; }\nfunction zoned(y, mo, d, h, mi, s, tz) {\n  const g = Date.UTC(y, mo - 1, d, h, mi, s); const o1 = tzOffset(g, tz); let t = g - o1; const o2 = tzOffset(t, tz);\n  if (o2 !== o1) t = g - o2; return t;\n}\nconst observesDST = tz => { const y = new Date().getFullYear(); return tzOffset(Date.UTC(y, 0, 15), tz) !== tzOffset(Date.UTC(y, 6, 15), tz); };\nconst dimOf = (y, mo) => new Date(Date.UTC(y, mo, 0)).getUTCDate();\nconst fmtClock = (ms, tz, sec = false) => { const p = tzParts(ms, tz); return `${pad2(p.h)}:${pad2(p.mi)}${sec ? \":\" + pad2(p.s) : \"\"}`; };\nconst fmtDate = (ms, tz) => { const p = tzParts(ms, tz); return `${DOWS[p.dow]} ${MONN[p.mo - 1].charAt(0) + MONN[p.mo - 1].slice(1).toLowerCase()} ${p.d}`; };\nconst fmtDT = (ms, tz) => `${fmtDate(ms, tz)} ${fmtClock(ms, tz)}`;\nconst isoDay = (ms, tz) => { const p = tzParts(ms, tz); return `${p.y}-${pad2(p.mo)}-${pad2(p.d)}`; };\nfunction fmtDur(sec) {\n  sec = Math.round(sec); if (sec < 1) return \"<1s\"; if (sec < 60) return sec + \"s\";\n  const m = Math.floor(sec / 60), s = sec % 60; if (m < 60) return s && m < 10 ? `${m}m ${s}s` : `${m}m`;\n  const h = Math.floor(m / 60), mm = m % 60; if (h < 48) return mm ? `${h}h ${mm}m` : `${h}h`;\n  return `${Math.floor(h / 24)}d ${h % 24}h`;\n}\nfunction fmtRel(ms, now) {\n  const d = (ms - now) / 1000, a = Math.abs(d);\n  const s = a < 60 ? `${Math.round(a)}s` : a < 3600 ? `${Math.round(a / 60)}m` : a < 86400 ? `${(a / 3600).toFixed(a < 36000 ? 1 : 0)}h` : `${(a / 86400).toFixed(1)}d`;\n  return d >= 0 ? `in ${s}` : `${s} ago`;\n}\n\n/* ================= cron parsing ================= */\nconst MACROS = { \"@yearly\": \"0 0 1 1 *\", \"@annually\": \"0 0 1 1 *\", \"@monthly\": \"0 0 1 * *\", \"@weekly\": \"0 0 * * 0\", \"@daily\": \"0 0 * * *\", \"@midnight\": \"0 0 * * *\", \"@hourly\": \"0 * * * *\" };\nconst FSPEC = [[\"second\", 0, 59], [\"minute\", 0, 59], [\"hour\", 0, 23], [\"day of month\", 1, 31], [\"month\", 1, 12, MONN], [\"day of week\", 0, 7, DOWN]];\nfunction parseVal(tok, lo, hi, names) {\n  if (names) { const i = names.indexOf(tok.toUpperCase().slice(0, 3)); if (i >= 0 && /^[a-z]+$/i.test(tok)) return names === MONN ? i + 1 : i; }\n  if (!/^\\d+$/.test(tok)) return NaN;\n  return +tok;\n}\nfunction parseField(raw, idx) {\n  const [name, lo, hi, names] = FSPEC[idx];\n  const r = { raw, set: new Set(), star: false, L: false, lastDow: new Set(), nth: [] };\n  const err = m => { throw { field: idx, err: `${name[0].toUpperCase() + name.slice(1)} “${raw}”: ${m}` }; };\n  if (raw === \"*\" || raw === \"?\") { r.star = true; for (let i = lo; i <= hi; i++) r.set.add(idx === 5 ? i % 7 : i); return r; }\n  for (const tok of raw.split(\",\")) {\n    if (!tok) err(\"has an empty item.\");\n    if (idx === 3 && tok.toUpperCase() === \"L\") { r.L = true; continue; }\n    if (idx === 5) {\n      let m = tok.match(/^(\\w+)L$/i); if (m) { const v = parseVal(m[1], 0, 7, DOWN); if (isNaN(v) || v > 7) err(\"bad weekday before L.\"); r.lastDow.add(v % 7); continue; }\n      m = tok.match(/^(\\w+)#([1-5])$/); if (m) { const v = parseVal(m[1], 0, 7, DOWN); if (isNaN(v) || v > 7) err(\"bad weekday before #.\"); r.nth.push([v % 7, +m[2]]); continue; }\n    }\n    const [rng, stepS, extra] = tok.split(\"/\"); if (extra !== undefined) err(\"has more than one “/”.\");\n    let step = 1; if (stepS !== undefined) { if (!/^\\d+$/.test(stepS) || +stepS < 1) err(\"step after “/” must be a positive number.\"); step = +stepS; }\n    let a, b;\n    if (rng === \"*\" || rng === \"?\") { a = lo; b = hi; }\n    else if (rng.includes(\"-\")) { const [x, y] = rng.split(\"-\"); a = parseVal(x, lo, hi, names); b = parseVal(y, lo, hi, names); if (isNaN(a) || isNaN(b)) err(`“${rng}” isn't a valid range.`); }\n    else { a = parseVal(rng, lo, hi, names); if (isNaN(a)) err(`“${rng}” isn't a number${names ? \" or name\" : \"\"}.`); b = stepS !== undefined ? hi : a; }\n    if (a < lo || b > hi) err(`values must be between ${lo} and ${hi}.`);\n    if (a > b) err(`range ${a}-${b} runs backwards.`);\n    for (let i = a; i <= b; i += step) r.set.add(idx === 5 ? i % 7 : i);\n  }\n  return r;\n}\nfunction parseCron(src) {\n  let s = String(src || \"\").trim().replace(/\\s+/g, \" \"), tz = null;\n  const tm = s.match(/^(?:CRON_)?TZ=(\\S+)\\s+(.*)$/i); if (tm) { tz = tm[1]; s = tm[2]; }\n  if (!s) return { ok: false, err: \"Type a cron expression, like “*/15 * * * *”.\", field: -1 };\n  if (s.toLowerCase() === \"@reboot\") return { ok: false, err: \"@reboot means “when the machine starts”. Use a Startup trigger for that.\", field: -1, reboot: true };\n  if (MACROS[s.toLowerCase()]) s = MACROS[s.toLowerCase()];\n  const parts = s.split(\" \");\n  if (parts.length < 5 || parts.length > 6) return { ok: false, err: `Expected 5 fields (minute hour day month weekday), or 6 with seconds first. Found ${parts.length}.`, field: -1 };\n  const hasSec = parts.length === 6; const raw = hasSec ? parts : [\"0\", ...parts];\n  try {\n    const f = raw.map((r, i) => parseField(r, i));\n    return { ok: true, hasSec, tz, raw, sec: f[0], min: f[1], hour: f[2], dom: f[3], mon: f[4], dow: f[5], expr: s };\n  } catch (e) { if (e && e.err) return { ok: false, err: e.err, field: hasSec ? e.field : e.field - 1 }; throw e; }\n}\nfunction dayMatch(c, y, mo, d) {\n  const dim = dimOf(y, mo), dow = new Date(Date.UTC(y, mo - 1, d)).getUTCDay();\n  const domOK = c.dom.star || c.dom.set.has(d) || (c.dom.L && d === dim);\n  const dowOK = c.dow.star || c.dow.set.has(dow) || (c.dow.lastDow.has(dow) && d + 7 > dim) || c.dow.nth.some(([x, n]) => x === dow && Math.ceil(d / 7) === n);\n  if (c.dom.star || c.dow.star) return domOK && dowOK;\n  return domOK || dowOK; // classic cron: both restricted means either\n}\nfunction cronNext(c, after, tz) {\n  const p = tzParts(after + 1000, tz);\n  const secs = [...c.sec.set].sort(num), mins = [...c.min.set].sort(num), hrs = [...c.hour.set].sort(num);\n  let y = p.y, mo = p.mo, d = p.d, first = true;\n  for (let i = 0; i < 366 * 6; i++) {\n    if (c.mon.set.has(mo) && dayMatch(c, y, mo, d)) {\n      for (const h of hrs) {\n        if (first && h < p.h) continue;\n        for (const mi of mins) {\n          if (first && h === p.h && mi < p.mi) continue;\n          for (const s of secs) {\n            if (first && h === p.h && mi === p.mi && s < p.s) continue;\n            const t = zoned(y, mo, d, h, mi, s, tz); if (t > after) return t;\n          }\n        }\n      }\n    }\n    first = false;\n    if (!c.mon.set.has(mo)) { d = 1; mo++; if (mo > 12) { mo = 1; y++; } }\n    else { d++; if (d > dimOf(y, mo)) { d = 1; mo++; if (mo > 12) { mo = 1; y++; } } }\n  }\n  return null;\n}\n\n/* ================= cron → English ================= */\nfunction compress(vals, fmt = String, sep = \"–\") {\n  const v = [...vals].sort(num), out = []; let i = 0;\n  while (i < v.length) { let j = i; while (j + 1 < v.length && v[j + 1] === v[j] + 1) j++; out.push(j - i >= 2 ? `${fmt(v[i])}${sep}${fmt(v[j])}` : j > i ? `${fmt(v[i])}, ${fmt(v[j])}` : fmt(v[i])); i = j + 1; }\n  return out.join(\", \");\n}\nconst stepOf = raw => { const m = raw.match(/^(\\*|\\d+(?:-\\d+)?)\\/(\\d+)$/); return m ? { base: m[1], n: +m[2] } : null; };\nconst hhmm = (h, m) => `${pad2(h)}:${pad2(m)}`;\nfunction explainCron(c) {\n  if (!c.ok) return \"\";\n  const S = c.sec, M = c.min, H = c.hour; let time = \"\";\n  const secPart = !c.hasSec || S.raw === \"0\" ? \"\" : S.star ? \"every second\" : stepOf(S.raw) && stepOf(S.raw).base === \"*\" ? `every ${stepOf(S.raw).n} seconds` : `at second ${compress(S.set)}`;\n  const mStep = stepOf(M.raw), hStep = stepOf(H.raw);\n  if (!M.star && !mStep && !H.star && !hStep && M.set.size * H.set.size <= 8 && !M.raw.includes(\"-\") && !H.raw.includes(\"-\")) {\n    const ts = []; for (const h of [...H.set].sort(num)) for (const m of [...M.set].sort(num)) ts.push(hhmm(h, m));\n    time = `at ${ts.join(\", \")}`;\n  } else {\n    const mp = M.star ? \"every minute\" : mStep && mStep.base === \"*\" ? `every ${mStep.n} minutes` : M.set.size === 1 ? `at minute ${[...M.set][0]}` : `at minutes ${compress(M.set)}`;\n    let hp = \"\";\n    if (H.star) hp = M.set.size === 1 && !M.star ? \"of every hour\" : \"\";\n    else if (hStep && hStep.base === \"*\") hp = `every ${hStep.n} hours`;\n    else if (H.raw.match(/^\\d+-\\d+$/)) { const [a, b] = H.raw.split(\"-\").map(Number); hp = `between ${hhmm(a, 0)} and ${hhmm(b, 59)}`; }\n    else hp = `during hour${H.set.size > 1 ? \"s\" : \"\"} ${compress(H.set, h => pad2(h) + \":00\")}`;\n    time = [mp, hp].filter(Boolean).join(\" \");\n  }\n  if (secPart) time = M.star && H.star ? secPart : `${secPart}, ${time}`;\n  const dowP = () => { const bits = []; if (!c.dow.star && c.dow.set.size) bits.push(c.dow.set.size === 5 && [1, 2, 3, 4, 5].every(d => c.dow.set.has(d)) ? \"on weekdays\" : c.dow.set.size === 2 && c.dow.set.has(0) && c.dow.set.has(6) ? \"on weekends\" : `on ${compress(c.dow.set, d => DOWL[d], \" through \")}`);\n    c.dow.nth.forEach(([d, n]) => bits.push(`on the ${ORD[n]} ${DOWL[d]}`)); c.dow.lastDow.forEach(d => bits.push(`on the last ${DOWL[d]}`)); return bits.join(\" and \"); };\n  const domP = () => { const bits = []; if (c.dom.set.size && !c.dom.star) bits.push(`on day ${compress(c.dom.set)} of the month`); if (c.dom.L) bits.push(\"on the last day of the month\"); return bits.join(\" and \"); };\n  let day = \"\";\n  if (!c.dom.star && !c.dow.star) day = `${domP()}, or ${dowP()}`;\n  else if (!c.dom.star) day = domP(); else if (!c.dow.star) day = dowP();\n  const mo = c.mon.star ? \"\" : stepOf(c.mon.raw) ? `every ${stepOf(c.mon.raw).n} months` : `in ${compress(c.mon.set, m => MONL[m - 1], \" through \")}`;\n  const out = [time, day, mo].filter(Boolean).join(\", \");\n  return out.charAt(0).toUpperCase() + out.slice(1) + \".\";\n}\n\n/* ================= triggers ================= */\nconst TIME_TRIG = new Set([\"cron\", \"interval\", \"once\"]);\nconst TRIG_TYPES = {\n  cron: \"Schedule (cron)\", interval: \"Repeat every…\", once: \"One time\", startup: \"When Cronyard starts\",\n  file: \"On file change\", webhook: \"On webhook\", after: \"After another job\"\n};\nconst UNIT_S = { s: 1, m: 60, h: 3600, d: 86400 };\nconst UNIT_N = { s: \"second\", m: \"minute\", h: \"hour\", d: \"day\" };\nconst _pc = new Map();\nfunction cronOf(expr) { let c = _pc.get(expr); if (!c) { c = parseCron(expr); _pc.set(expr, c); if (_pc.size > 400) _pc.clear(); } return c; }\nfunction hmToMin(s) { const [h, m] = String(s || \"0:0\").split(\":\").map(Number); return (h || 0) * 60 + (m || 0); }\nfunction passesFilters(t, ms, holidays) {\n  const tz = t.tz || TZ_LOCAL;\n  if (t.from && ms < Date.parse(t.from)) return false;\n  if (t.until && ms > Date.parse(t.until)) return false;\n  if (!t.win && !t.biz && !t.hol) return true;\n  const p = tzParts(ms, tz);\n  if (t.biz && (p.dow === 0 || p.dow === 6)) return false;\n  if (t.hol && holidays && holidays.includes(`${p.y}-${pad2(p.mo)}-${pad2(p.d)}`)) return false;\n  if (t.win) { const m = p.h * 60 + p.mi, a = hmToMin(t.winA), b = hmToMin(t.winB); if (a <= b ? (m < a || m >= b) ile(\"powershell.exe\", [\"-NoProfile\", \"-Command\", \"(Get-CimInstance Win32_Battery | Select-Object -First 1).BatteryStatus\"], { windowsHide: true, timeout: 10000 }, (e, out) => { const v = String(out || \"\").trim(); res(e || !v ? true : v === \"2\"); });\n    res(true);\n  });\n}\nasync function probeNet(host) {\n  try { await Promise.race([dns.resolve(host || \"example.com\"), new Promise((_, r) => setTimeout(() => r(new Error(\"timeout\")), 4000))]); return true; } catch { return false; }\n}\nfunction startProbes(sched) {\n  const run = async () => {\n    const [network, ac] = await Promise.all([probeNet(sched.settings.netHost), probeAC()]);\n    if (network !== sched.env.network || ac !== sched.env.ac) { sched.env = { ...sched.env, network, ac }; sched.changed(); }\n  };\n  run(); setInterval(run, 30000).unref();\n}\n\nasync function notify(sched, a) {\n  const s = sched.settings; if (!s.notifyUrl) return;\n  const want = s.notifyOn === \"all\" ? [\"fail\", \"sla\", \"ok\", \"warn\"] : s.notifyOn === \"none\" ? [] : [\"fail\", \"sla\"];\n  if (!want.includes(a.kind)) return;\n  const j = sched.jobs.get(a.j);\n  const text = `${a.kind === \"fail\" ? \"🔴\" : a.kind === \"sla\" ? \"🟠\" : a.kind === \"ok\" ? \"🟢\" : \"⚠️\"} [Cronyard on ${s.host}] ${a.msg}`;\n  try { await fetch(s.notifyUrl, { method: \"POST\", headers: { \"Content-Type\": \"application/json\", \"User-Agent\": \"Cronyard/1.0\" }, body: JSON.stringify({ text, kind: a.kind, job: j ? { id: j.id, name: j.name } : null, run: a.r || null, at: new Date(a.t).toISOString(), host: s.host }), signal: AbortSignal.timeout(10000) }); }\n  catch (e) { console.error(`[notify] ${e.message}`); }\n}\nmodule.exports = { FileWatchers, startProbes, notify, globToRe, splitWatch };\n","cronyard/server/http.js":"\"use strict\";\n/* REST API, live updates (Server-Sent Events), webhooks and the web interface. */\nconst http = require(\"http\");\nconst fs = require(\"fs\");\nconst path = require(\"path\");\nconst crypto = require(\"crypto\");\nconst { normJob } = require(\"../shared/engine.js\");\n\nconst LOOPBACK = new Set([\"127.0.0.1\", \"::1\", \"::ffff:127.0.0.1\"]);\nconst safeEq = (a, b) => { const x = Buffer.from(String(a)), y = Buffer.from(String(b)); return x.length === y.length && crypto.timingSafeEqual(x, y); };\nconst cookies = req => Object.fromEntries((req.headers.cookie || \"\").split(/;\\s*/).filter(Boolean).map(c => { const i = c.indexOf(\"=\"); return [c.slice(0, i), decodeURIComponent(c.slice(i + 1))]; }));\n\nfunction createServer({ sched, store, config, version, uiFile, persistJobs, persistSettings, log }) {\n  const clients = new Set();\n  let pushT = 0;\n  const push = (ev, data) => { const s = `event: ${ev}\\ndata: ${JSON.stringify(data)}\\n\\n`; for (const c of clients) c.write(s); };\n  const broadcast = () => { if (pushT) return; pushT = setTimeout(() => { pushT = 0; if (clients.size) push(\"state\", sched.snapshot()); }, 300); };\n  setInterval(() => { for (const c of clients) c.write(\": ping\\n\\n\"); }, 25000).unref();\n\n  const authed = req => {\n    if (config.localNoAuth !== false && LOOPBACK.has(req.socket.remoteAddress)) return true;\n    const h = req.headers.authorization || \"\"; const tok = h.startsWith(\"Bearer \") ? h.slice(7) : cookies(req).cy_token || new URL(req.url, \"http://x\").searchParams.get(\"token\");\n    return !!tok && safeEq(tok, config.token);\n  };\n  const send = (res, code, body, type = \"application/json\") => {\n    res.writeHead(code, { \"Content-Type\": type, \"Cache-Control\": \"no-store\", \"X-Content-Type-Options\": \"nosniff\", \"Referrer-Policy\": \"no-referrer\" });\n    res.end(type === \"application/json\" ? JSON.stringify(body) : body);\n  };\n  const body = req => new Promise((resolve, reject) => { let n = 0; const chunks = []; req.on(\"data\", c => { n += c.length; if (n > 2e6) { reject(Object.assign(new Error(\"Body too large (2 MB max)\"), { code: 413 })); req.destroy(); } else chunks.push(c); }); req.on(\"end\", () => resolve(Buffer.concat(chunks).toString(\"utf8\"))); req.on(\"error\", reject); });\n  const json = async req => { const t = await body(req); if (!t) return {}; try { return JSON.parse(t); } catch { throw Object.assign(new Error(\"Body isn't valid JSON\"), { code: 400 }); } };\n\n  const server = http.createServer(async (req, res) => {\n    const u = new URL(req.url, \"http://localhost\"); const p = u.pathname; const m = req.method;\n    try {\n      /* webhooks: authenticated by their own secret, not the admin token */\n      if (p.startsWith(\"/hooks/\")) {\n        if (![\"POST\", \"GET\", \"PUT\"].includes(m)) return send(res, 405, { error: \"Use POST\" });\n        const name = decodeURIComponent(p.slice(7)); const raw = m === \"GET\" ? \"\" : await body(req);\n        const given = req.headers[\"x-cronyard-secret\"] || u.searchParams.get(\"secret\") || (req.headers.authorization || \"\").replace(/^Bearer /, \"\");\n        let payload = raw; try { payload = raw ? JSON.parse(raw) : Object.fromEntries(u.searchParams); } catch {}\n        let fired = 0, denied = 0;\n        for (const j of sched.jobs.values()) if (j.enabled) for (const t of j.triggers) if (t.type === \"webhook\" && !t.off && t.hook === name) {\n          if (t.secret && !(given && safeEq(given, t.secret))) { denied++; continue; }\n          sched.fire(j, `webhook /hooks/${name}`, Date.now(), { delay: t.delay, meta: { payload } }); fired++;\n        }\n        if (!fired) return send(res, denied ? 401 : 404, { error: denied ? \"Wrong or missing secret\" : `No enabled job listens on /hooks/${name}` });\n        return send(res, 202, { fired });\n      }\n      if (p === \"/\" || p === \"/index.html\") {\n        if (!fs.existsSync(uiFile)) return send(res, 500, \"The web interface hasn't been built. Run: node build.js\", \"text/plain\");\n        return send(res, 200, fs.readFileSync(uiFile), \"text/html; charset=utf-8\");\n      }\n      if (p === \"/api/hello\") return send(res, 200, { app: \"cronyard\", version, mode: \"server\", host: sched.settings.host, platform: process.platform, node: process.version, home: store.home, authRequired: !authed(req), pid: process.pid });\n      if (p === \"/api/login\" && m === \"POST\") {\n        const { token } = await json(req);\n        if (!token || !safeEq(token, config.token)) return send(res, 401, { error: \"That token doesn't match. Find it in config.json in the Cronyard data folder.\" });\n        res.setHeader(\"Set-Cookie\", `cy_token=${encodeURIComponent(token)}; HttpOnly; SameSite=Strict; Path=/; Max-Age=31536000`);\n        return send(res, 200, { ok: true });\n      }\n      if (!p.startsWith(\"/api/\")) return send(res, 404, { error: \"Not found\" });\n      if (!authed(req)) return send(res, 401, { error: \"Sign in with the access token from config.json\" });\n      if (m !== \"GET\" && req.headers[\"sec-fetch-site\"] === \"cross-site\") return send(res, 403, { error: \"Cross-site requests aren't allowed\" });\n\n      if (p === \"/api/events\") {\n        res.writeHead(200, { \"Content-Type\": \"text/event-stream\", \"Cache-Control\": \"no-store\", Connection: \"keep-alive\", \"X-Accel-Buffering\": \"no\" });\n        res.write(`retry: 3000\\nevent: state\\ndata: ${JSON.stringify(sched.snapshot())}\\n\\n`);\n        clients.add(res); req.on(\"close\", () => clients.delete(res)); return;\n      }\n      if (p === \"/api/state\") return send(res, 200, sched.snapshot());\n      let mm;\n      if (p === \"/api/jobs\" && m === \"POST\") { const j = sched.upsert(normJob(await json(req))); persistJobs(); return send(res, 201, j); }\n      if ((mm = p.match(/^\\/api\\/jobs\\/([\\w-]+)$/))) {\n        if (m === \"PUT\") { const j = await json(req); j.id = mm[1]; const n = sched.upsert(j); persistJobs(); return send(res, 200, n); }\n        if (m === \"DELETE\") { sched.remove(mm[1]); persistJobs(); return send(res, 200, { ok: true }); }\n        if (m === \"GET\") { const j = sched.jobs.get(mm[1 alues()] });\n      if (p === \"/api/import\" && m === \"POST\") { const d = await json(req); const list = Array.isArray(d) ? d : d.jobs; if (!Array.isArray(list)) return send(res, 400, { error: \"No jobs in that file\" }); for (const j of list) sched.upsert(j); persistJobs(); return send(res, 200, { imported: list.length }); }\n      if (p === \"/api/runs/clear\" && m === \"POST\") { const keep = sched.runs.filter(r => [\"queued\", \"running\", \"waiting\"].includes(r.s)); store.dropLogs(sched.runs.filter(r => !keep.includes(r))); sched.runs = keep; sched.alerts = []; sched.changed(); return send(res, 200, { ok: true }); }\n      return send(res, 404, { error: \"Not found\" });\n    } catch (e) { log(`[http] ${m} ${p}: ${e.message}`); return send(res, e.code >= 400 && e.code < 600 ? e.code : 500, { error: e.message }); }\n  });\n  return { server, broadcast, push };\n}\nmodule.exports = { createServer };\n","cronyard/install/install-linux.sh":"#!/usr/bin/env bash\n# Installs Cronyard as a systemd service that starts at boot (no login needed).\n#   sudo bash install/install-linux.sh              install or upgrade\n#   sudo bash install/install-linux.sh --uninstall  remove (keeps your data)\n#   PORT=9000 sudo -E ./install/install-linux.sh  use another port\nset -euo pipefail\nPREFIX=/opt/cronyard\nDATA=/var/lib/cronyard\nUNIT=/etc/systemd/system/cronyard.service\nPORT=\"${PORT:-7878}\"\n[ \"$(id -u)\" = 0 ] || { echo \"Please run with sudo.\"; exit 1; }\nif [ \"${1:-}\" = \"--uninstall\" ]; then\n  systemctl disable --now cronyard 2>/dev/null || true\n  rm -f \"$UNIT\"; systemctl daemon-reload; rm -rf \"$PREFIX\"\n  echo \"Cronyard removed. Your jobs and logs are still in $DATA (delete it to remove them).\"; exit 0\nfi\ncommand -v systemctl >/dev/null || { echo \"systemd is required. Run 'node server/index.js' under your own supervisor instead.\"; exit 1; }\nNODE=\"$(command -v node || true)\"\n[ -n \"$NODE\" ] || { echo \"Node.js 18 or newer is required (e.g. 'sudo apt install nodejs' or https://nodejs.org).\"; exit 1; }\n\"$NODE\" -e 'process.exit(+process.versions.node.split(\".\")[0] >= 18 ? 0 : 1)' || { echo \"Node.js 18 or newer is required; found $(\"$NODE\" --version).\"; exit 1; }\nSRC=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\nmkdir -p \"$PREFIX\" \"$DATA\"\nfor p in package.json README.md build.js server shared ui install test; do [ -e \"$SRC/$p\" ] && cp -R \"$SRC/$p\" \"$PREFIX/\"; done\n[ -f \"$PREFIX/ui/dist/index.html\" ] || \"$NODE\" \"$PREFIX/build.js\"\nchmod 700 \"$DATA\"\ncat > \"$UNIT\" <<UNITEOF\n[Unit]\nDescription=Cronyard job scheduler\nDocumentation=file://$PREFIX/README.md\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=simple\nExecStart=$NODE $PREFIX/server/index.js --home $DATA --port $PORT\nRestart=always\nRestartSec=3\nKillMode=mixed\nTimeoutStopSec=20\nEnvironment=NODE_ENV=production\n\n[Install]\nWantedBy=multi-user.target\nUNITEOF\nsystemctl daemon-reload\nsystemctl enable cronyard >/dev/null\nsystemctl restart cronyard\nsleep 1.5\nif systemctl is-active --quiet cronyard; then\n  echo \"Cronyard is running and will start at every boot.\"\n  echo \"  Console:  http://localhost:$PORT\"\n  echo \"  Data:     $DATA\"\n  echo \"  Logs:     journalctl -u cronyard -f\"\n  echo \"  Token for remote browsers: $(\"$NODE\" \"$PREFIX/server/index.js\" token --home \"$DATA\")\"\nelse\n  echo \"The service didn't start. See: journalctl -u cronyard -n 50\"; exit 1\nfi\n","cronyard/install/install-macos.sh":"#!/usr/bin/env bash\n# Installs Cronyard as a LaunchDaemon that starts at boot, before anyone logs in.\n#   sudo bash install/install-macos.sh              install or upgrade\n#   sudo bash install/install-macos.sh --uninstall  remove (keeps your data)\nset -euo pipefail\nPREFIX=\"/usr/local/cronyard\"\nDATA=\"/Library/Application Support/Cronyard\"\nPLIST=\"/Library/LaunchDaemons/dev.cronyard.plist\"\nPORT=\"${PORT:-7878}\"\n[ \"$(id -u)\" = 0 ] || { echo \"Please run with sudo.\"; exit 1; }\nif [ \"${1:-}\" = \"--uninstall\" ]; then\n  launchctl bootout system \"$PLIST\" 2>/dev/null || true\n  rm -f \"$PLIST\"; rm -rf \"$PREFIX\"\n  echo \"Cronyard removed. Your jobs and logs are still in \\\"$DATA\\\".\"; exit 0\nfi\nNODE=\"$(command -v node || true)\"\n[ -n \"$NODE\" ] || { echo \"Node.js 18 or newer is required ('brew install node' or https://nodejs.org).\"; exit 1; }\n\"$NODE\" -e 'process.exit(+process.versions.node.split(\".\")[0] >= 18 ? 0 : 1)' || { echo \"Node.js 18 or newer is required.\"; exit 1; }\nSRC=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\nmkdir -p \"$PREFIX\" \"$DATA\"\nfor p in package.json README.md build.js server shared ui install test; do [ -e \"$SRC/$p\" ] && cp -R \"$SRC/$p\" \"$PREFIX/\"; done\n[ -f \"$PREFIX/ui/dist/index.html\" ] || \"$NODE\" \"$PREFIX/build.js\"\ncat > \"$PLIST\" <<PLISTEOF\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\"><dict>\n  <key>Label<\/key><string>dev.cronyard<\/string>\n  <key>ProgramArguments<\/key><array>\n    <string>$NODE<\/string><string>$PREFIX/server/index.js<\/string><string>--home<\/string><string>$DATA<\/string><string>--port<\/string><string>$PORT<\/string>\n  <\/array>\n  <key>WorkingDirectory<\/key><string>$PREFIX<\/string>\n  <key>RunAtLoad<\/key><true/>\n  <key>KeepAlive<\/key><true/>\n  <key>EnvironmentVariables<\/key><dict><key>PATH<\/key><string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin<\/string><\/dict>\n  <key>StandardOutPath<\/key><string>/Library/Logs/Cronyard.log<\/string>\n  <key>StandardErrorPath<\/key><string>/Library/Logs/Cronyard.log<\/string>\n<\/dict><\/plist>\nPLISTEOF\nchmod 644 \"$PLIST\"\nlaunchctl bootout system \"$PLIST\" 2>/dev/null || true\nlaunchctl bootstrap system \"$PLIST\"\nsleep 1.5\necho \"Cronyard is running and will start at every boot.\"\necho \"  Console:  http://localhost:$PORT\"\necho \"  Logs:     /Library/Logs/Cronyard.log\"\necho \"  Token for remote browsers: $(\"$NODE\" \"$PREFIX/server/index.js\" token --home \"$DATA\")\"\n","cronyard/install/install-windows.ps1":"<#\n  Installs Cronyard on Windows as a startup task that runs as SYSTEM,\n  so jobs run whether or not anyone is logged on. Run in PowerShell as Administrator:\n    .\\install\\install-windows.ps1               install or upgrade\n    .\\install\\install-windows.ps1 -Port 9000    use another port\n    .\\install\\install-windows.ps1 -Uninstall    remove (keeps your data)\n#>\nparam([switch]$Uninstall, [int]$Port = 7878)\n$ErrorActionPreference = \"Stop\"\n$isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)\nif (-not $isAdmin) { Write-Error \"Please run PowerShell as Administrator.\"; exit 1 }\n$Dest = Join-Path $env:ProgramFiles \"Cronyard\"\n$Data = Join-Path $env:ProgramData \"Cronyard\"\n$Task = \"Cronyard\"\nif ($Uninstall) {\n  Stop-ScheduledTask -TaskName $Task -ErrorAction SilentlyContinue\n  Unregister-ScheduledTask -TaskName $Task -Confirm:$false -ErrorAction SilentlyContinue\n  Get-CimInstance Win32_Process -Filter \"Name='node.exe'\" | Where-Object { $_.CommandLine -like \"*Cronyard\\server\\index.js*\" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }\n  Remove-Item $Dest -Recurse -Force -ErrorAction SilentlyContinue\n  Write-Host \"Cronyard removed. Your jobs and logs are still in $Data.\"; exit 0\n}\n$node = (Get-Command node -ErrorAction SilentlyContinue).Source\nif (-not $node) { Write-Error \"Node.js 18 or newer is required. Install it with: winget install OpenJS.NodeJS.LTS  (then open a new PowerShell)\"; exit 1 }\n$major = [int]((& $node --version).TrimStart(\"v\").Split(\".\")[0])\nif ($major -lt 18) { Write-Error \"Node.js 18 or newer is required; found $(& $node --version).\"; exit 1 }\n$src = Split-Path -Parent $PSScriptRoot\nStop-ScheduledTask -TaskName $Task -ErrorAction SilentlyContinue\nGet-CimInstance Win32_Process -Filter \"Name='node.exe'\" | Where-Object { $_.CommandLine -like \"*Cronyard\\server\\index.js*\" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }\nNew-Item -ItemType Directory -Force -Path $Dest, $Data | Out-Null\nforeach ($p in \"package.json\",\"README.md\",\"build.js\",\"server\",\"shared\",\"ui\",\"install\",\"test\") { if (Test-Path (Join-Path $src $p)) { Copy-Item -Recurse -Force (Join-Path $src $p) $Dest } }\nif (-not (Test-Path (Join-Path $Dest \"ui\\dist\\index.html\"))) { & $node (Join-Path $Dest \"build.js\") }\n$action = New-ScheduledTaskAction -Execute $node -Argument \"`\"$Dest\\server\\index.js`\" --home `\"$Data`\" --port $Port\" -WorkingDirectory $Dest\n$trigger = New-ScheduledTaskTrigger -AtStartup\n$settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew\n$principal = New-ScheduledTaskPrincipal -UserId \"SYSTEM\" -LogonType ServiceAccount -RunLevel Highest\nRegister-ScheduledTask -TaskName $Task -Action $action -Trigger $trigger -Settings $settings -Principal $principal -Description \"Cronyard job scheduler. Runs at startup as SYSTEM, whether or not anyone is logged on.\" -Force | Out-Null\nStart-ScheduledTask -TaskName $Task\nStart-Sleep -Seconds 3\ntry { Invoke-RestMethod \"http://127.0.0.1:$Port/api/hello\" | Out-Null; $ok = $true } catch { $ok = $false }\nif ($ok) {\n  Write-Host \"Cronyard is running and will start at every boot.\"\n  Write-Host \"  Console:  http://localhost:$Port\"\n  Write-Host \"  Data:     $Data\"\n  Write-Host \"  Token for remote browsers: $(& $node \"$Dest\\server\\index.js\" token --home \"$Data\")\"\n} else { Write-Warning \"The task was registered but the console isn't answering yet. Check Task Scheduler > Cronyard > History.\" }\n","cronyard/test/run.js":"\"use strict\";\n/* End-to-end test: starts a real Cronyard service in a temp folder and drives it over HTTP. */\nconst { spawn } = require(\"child_process\");\nconst fs = require(\"fs\"), os = require(\"os\"), path = require(\"path\");\nconst home = fs.mkdtempSync(path.join(os.tmpdir(), \"cronyard-test-\"));\nconst port = 17000 + Math.floor(Math.random() * 2000);\nconst base = `http://127.0.0.1:${port}`;\nconst WIN = process.platform === \"win32\";\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst api = async (m, p, b) => { const r = await fetch(base + p, { method: m, headers: { \"Content-Type\": \"application/json\" }, body: b ? JSON.stringify(b) : undefined }); const t = await r.text(); try { return { status: r.status, body: JSON.parse(t) }; } catch { return { status: r.status, body: t }; } };\nlet pass = 0, fail = 0;\nconst ok = (c, msg) => { if (c) { pass++; console.log(\"  ✓\", msg); } else { fail++; console.log(\"  ✗\", msg); } };\n\n(async () => {\n  fs.writeFileSync(path.join(home, \"jobs.json\"), \"[]\");\n  const srv = spawn(process.execPath, [path.join(__dirname, \"..\", \"server\", \"index.js\"), \"--home\", home, \"--port\", String(port)], { stdio: [\"ignore\", \"pipe\", \"pipe\"] });\n  let out = \"\"; srv.stdout.on(\"data\", d => out += d); srv.stderr.on(\"data\", d => out += d);\n  for (let i = 0; i < 50 && !out.includes(\"running\"); i++) await sleep(100);\n  try {\n    const hello = await api(\"GET\", \"/api/hello\"); ok(hello.body.app === \"cronyard\", \"service answers /api/hello\");\n    const watchDir = path.join(home, \"inbox\"); fs.mkdirSync(watchDir);\n    const mk = async j => (await api(\"POST\", \"/api/jobs\", j)).body;\n    const every2 = await mk({ name: \"every 2s\", action: { type: \"shell\", cmd: WIN ? \"echo tick\" : \"echo tick; echo oops >&2\" }, triggers: [{ type: \"cron\", expr: \"*/2 * * * * *\" }], policy: { conc: \"allow\", par: 3 } });\n    const flaky = await mk({ name: \"flaky\", action: { type: \"shell\", cmd: \"exit 3\" }, triggers: [], policy: { retries: 2, delay: 1 } });\n    const slow = await mk({ name: \"slow\", action: { type: \"shell\", cmd: WIN ? \"ping -n 6 127.0.0.1 >NUL\" : \"sleep 5\" }, triggers: [], policy: { timeout: 1 } });\n    const after = await mk({ name: \"after flaky fails\", action: { type: \"shell\", cmd: \"echo downstream\" }, triggers: [{ type: \"after\", job: flaky.id, on: \"failure\" }] });\n    const hook = await mk({ name: \"hook\", action: { type: \"shell\", cmd: WIN ? \"echo %CRONYARD_PAYLOAD%\" : 'echo \"got $CRONYARD_PAYLOAD\"' }, triggers: [{ type: \"webhook\", hook: \"deploy\", secret: \"s3cret\" }] });\n    const file = await mk({ name: \"file\", action: { type: \"shell\", cmd: WIN ? \"echo %CRONYARD_FILE%\" : 'echo \"file=$CRONYARD_FILE\"' }, triggers: [{ type: \"file\", path: path.join(watchDir, \"*.csv\") }] });\n    const httpj = await mk({ name: \"http\", action: { type: \"http\", method: \"GET\", url: `${base}/api/hello` }, triggers: [] });\n    const script = await mk({ name: \"node script\", action: { type: \"script\", lang: \"node\", script: \"console.log('script ok', process.env.CRONYARD_JOB)\" }, triggers: [] });\n    const forbid = await mk({ name: \"forbid\", action: { type: \"shell\", cmd: WIN ? \"ping -n 3 127.0.0.1 >NUL\" : \"sleep 2\" }, triggers: [], policy: { conc: \"forbid\" } });\n    const missing = await mk({ name: \"missing binary\", action: { type: \"shell\", shell: \"bash\", cmd: \"definitely-not-a-command-xyz\" }, triggers: [] });\n    await api(\"POST\", `/api/jobs/${flaky.id}/run`); await api(\"POST\", `/api/jobs/${slow.id}/run`); await api(\"POST\", `/api/jobs/${httpj.id}/run`); await api(\"POST\", `/api/jobs/${script.id}/run`);\n    await api(\"POST\", `/api/jobs/${forbid.id}/run`); await api(\"POST\", `/api/jobs/${forbid.id}/run`); await api(\"POST\", `/api/jobs/${missing.id}/run`);\n    const bad = await fetch(`${base}/hooks/deploy`, { method: \"POST\", body: \"{}\" }); ok(bad.status === 401, \"webhook without secret is rejected (401)\");\n    const good = await fetch(`${base}/hooks/deploy`, { method: \"POST\", headers: { \"X-Cronyard-Secret\": \"s3cret\" }, body: JSON.stringify({ sha: \"abc123\" }) }); ok(good.status === 202, \"webhook with secret is accepted (202)\");\n    await sleep(800); fs.writeFileSync(path.join(watchDir, \"data.csv\"), \"a,b\\n\");\n    await sleep(6500);\n    const st = (await api(\"GET\", \"/api/state\")).body; const runs = j => st.runs.filter(r => r.j === j.id);\n    const log = async r => (await api(\"GET\", `/api/runs/${r.id}/log`)).body.text;\n    ok(runs(every2).filter(r => r.s === \"success\").length >= 2, `cron */2s fired and succeeded (${runs(every2).length} runs)`);\n    ok(/OUT tick/.test(await log(runs(every2).find(r => r.s === \"success\"))), \"stdout captured in log\");\n    ok(runs(flaky).length === 3 && runs(flaky).every(r => r.s === \"failed\") && runs(flaky)[2].a === 3, \"failing job retried twice (3 attempts)\");\n    ok(runs(after).some(r => r.s === \"success\"), \"after-failure trigger ran the downstream job\");\n    ok(runs(slow)[0]?.s === \"timeout\", \"1s timeout killed the 5s job\");\n    ok(runs(httpj)[0]?.s === \"success\" && runs(httpj)[0].x === 200, \"HTTP job got 200\");\n    ok(runs(script)[0]?.s === \"success\" && /script ok node script/.test(await log(runs(script)[0])), \"Node script ran with CRONYARD_JOB set\");\n    ok(runs(forbid).some(r => r.s === \"skipped\"), \"concurrency forbid skipped the overlapping run\");\n    ok(runs(missing)[0]?.s === \"failed\", \"missing command fails cleanly\");\n    ok(runs(hook).length === 1 && /abc123/.test(await log(runs(hook)[0])), \"webhook payload reached the job\");\n    ok(runs(file).length >= 1 && /data\\.csv/.test(await log(runs(file)[0])), \"file trigger fired with CRONYARD_FILE\");\n    ok(st.alerts.some(a => a.kind === \"fail\"), \"failure alert raised\");\n    // persistence + catch-up\n    await api(\"PUT\", `/api/jobs/${every2.id}`, { ...every2, enabled: false });\n    srv.kill(\"SIGTERM\"); await sleep(800);\n    const saved = JSON.parse(fs.readFileSync(path.join(home, \"jobs.json\"), \"utf8\")); ok(saved.length === 10, \"jobs persisted to disk\");\n    const state = JSON.parse(fs.readFileSync(path.join(home, \"state.json\"), \"utf8\")); ok(state.runs.length > 5 && state.lastTick, \"run history persisted\");\n  } catch (e) { fail++; console.error(e); console.error(out); }\n  finally { try { srv.kill(\"SIGKILL\"); } catch {} fs.rmSync(home, { recursive: true, force: true }); console.log(`\\n${pass} passed, ${fail} failed`); process.exit(fail ? 1 : 0); }\n})();\n","cronyard/test/catchup.js":"\"use strict\";\n/* Downtime test: a job due every 2 s, the service is stopped for ~7 s, then restarted.\n   Expect exactly one \"catch-up\" run (missed-run policy \"once\") and startup triggers to fire. */\nconst { spawn } = require(\"child_process\");\nconst fs = require(\"fs\"), os = require(\"os\"), path = require(\"path\");\nconst home = fs.mkdtempSync(path.join(os.tmpdir(), \"cronyard-catchup-\"));\nconst port = 19000 + Math.floor(Math.random() * 500), base = `http://127.0.0.1:${port}`;\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst start = () => { const p = spawn(process.execPath, [path.join(__dirname, \"..\", \"server\", \"index.js\"), \"--home\", home, \"--port\", String(port)], { stdio: \"ignore\" }); return p; };\nconst api = async (m, p, b) => (await fetch(base + p, { method: m, headers: { \"Content-Type\": \"application/json\" }, body: b ? JSON.stringify(b) : undefined })).json();\n(async () => {\n  fs.writeFileSync(path.join(home, \"jobs.json\"), \"[]\");\n  let srv = start(); await sleep(1200);\n  const j = await api(\"POST\", \"/api/jobs\", { name: \"tick\", action: { type: \"shell\", cmd: \"echo hi\" }, triggers: [{ type: \"cron\", expr: \"*/2 * * * * *\" }], policy: { misfire: \"once\" } });\n  const boot = await api(\"POST\", \"/api/jobs\", { name: \"on boot\", action: { type: \"shell\", cmd: \"echo booted\" }, triggers: [{ type: \"startup\" }] });\n  await sleep(3000); srv.kill(\"SIGTERM\"); await sleep(7000);\n  srv = start(); await sleep(2500);\n  const st = await api(\"GET\", \"/api/state\"); srv.kill(\"SIGTERM\");\n  const catchup = st.runs.filter(r => r.j === j.id && /catch-up/.test(r.why));\n  const booted = st.runs.filter(r => r.j === boot.id && r.s === \"success\");\n  console.log(catchup.length === 1 ? \"  ✓\" : \"  ✗\", `one catch-up run after downtime (${catchup.map(r => r.why).join(\"; \")})`);\n  console.log(booted.length >= 1 ? \"  ✓\" : \"  ✗\", `startup trigger ran after restart (${booted.length})`);\n  await sleep(500); fs.rmSync(home, { recursive: true, force: true });\n  process.exit(catchup.length === 1 && booted.length >= 1 ? 0 : 1);\n})();\n","cronyard/ui/head.html":"<title>Cronyard<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Layout: an instrument console — a machined rail on the left, a control strip on top, extruded panels on a brushed-metal deck; runs are physical blocks on a 3D runway. */\n:root{\n  --bg:#D9DDE2; --deck:#E4E7EB; --panel:#F4F5F7; --panel-2:#EAECEF; --panel-3:#DCE0E5; --well:#E1E4E8;\n  --ink:#171C24; --muted:#58616F; --faint:#8790A0; --line:rgba(23,28,36,.12); --line-2:rgba(23,28,36,.22);\n  --accent:#F2A900; --accent-ink:#1B1400; --accent-deep:#B57E00; --accent-soft:rgba(242,169,0,.16);\n  --ok:#17935F; --fail:#D93B3B; --warn:#DE6A1F; --run:#2C74E0; --queue:#7E5BE6; --wait:#0F95A6; --skip:#8A93A3;\n  --shadow-rgb:30,38,52; --edge:rgba(23,28,36,.2); --hi:rgba(255,255,255,.9);\n  --term-bg:#12161D; --term-ink:#CF
