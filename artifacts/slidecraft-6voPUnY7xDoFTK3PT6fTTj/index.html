      }
      if (name === 'AlternateContent') {
        const pick = kid(node, 'Choice') || kid(node, 'Fallback');
        if (pick) for (const c of Array.from(pick.children)) await convert(c, part, ctx, map, out, groupId);
        return;
      }
      if (!['sp', 'pic', 'cxnSp', 'graphicFrame'].includes(name)) return;
      const ph = phOf(node);
      if (part.isTemplate && ph) return; // template placeholders are not content
      if (ph && /^(dt|ftr|sldNum)$/.test(ph.type) && !path(node, 'txBody')) return;
      let x = xfrmOf(node);
      let inheritedFrom = null;
      if (!x && ph) {
        const l = part.layout && findPh(part.layout.tree, ph);
        const m = part.master && findPh(part.master.tree, ph);
        inheritedFrom = l || m;
        x = (l && xfrmOf(l)) || (m && xfrmOf(m));
      }
      if (!x) return;
      const g = geomFromX(map(x));
      const common = { ...g, groupId: groupId || undefined, locked: part.isTemplate || undefined };
      if (x.flipH) common.flipH = true;
      if (x.flipV) common.flipV = true;
      const spPr = kid(node, 'spPr');
      const refs = styleRefs(node, ctx);

      if (name === 'pic') {
        const nvPr = path(node, 'nvPicPr', 'nvPr');
        const media = nvPr && (desc(nvPr, 'media')[0] || kid(nvPr, 'videoFile'));
        if (media) {
          const rel = part.rels[rEmbed(media) || rId(media, 'link')];
          const asset = rel && !rel.external ? await assetFor(rel.target) : null;
          if (asset && assets[asset].startsWith('data:video')) { out.push(SC.make.video({ ...common, asset })); return; }
          warnings.add('Some videos could not be imported');
        }
        const blip = path(node, 'blipFill', 'blip');
        const rel = blip && part.rels[rEmbed(blip)];
        if (!rel) return;
        const asset = rel.external ? null : await assetFor(rel.target);
        if (!asset) return;
        const crop = path(node, 'blipFill', 'srcRect');
        const el = SC.make.image({ ...common, asset, fit: 'fill', ph: ph && ph.type === 'pic' ? 'picture' : null });
        if (crop && Array.from(crop.attributes).length) {
          const l = num(attr(crop, 'l')) / 1000, r = num(attr(crop, 'r')) / 1000, t = num(attr(crop, 't')) / 1000, b = num(attr(crop, 'b')) / 1000;
          el.fit = 'cover';
          el.posX = SC.clamp(Math.round(l + r ? (l / (l + r)) * 100 : 50), 0, 100);
          el.posY = SC.clamp(Math.round(t + b ? (t / (t + b)) * 100 : 50), 0, 100);
        }
        const ln = lineOf(spPr, ctx);
        if (ln.stroke !== 'none') Object.assign(el, { stroke: ln.stroke, strokeW: ln.strokeW });
        if (path(spPr, 'prstGeom') && attr(path(spPr, 'prstGeom'), 'prst') === 'ellipse') el.radius = Math.min(el.w, el.h) / 2;
        out.push(el);
        return;
      }

      if (name === 'graphicFrame') {
        const gd = path(node, 'graphic', 'graphicData');
        if (!gd) return;
        const tbl = kid(gd, 'tbl');
        if (tbl) { out.push(tableOf(tbl, common, ctx, part)); return; }
        const chartRef = desc(gd, 'chart')[0];
        if (chartRef) { const c = await chartOf(part.rels[rId(chartRef)], common, ctx); if (c) out.push(c); return; }
        // SmartArt: PowerPoint stores a pre-drawn copy of the diagram; import it as ordinary shapes.
        const dgm = desc(gd, 'relIds')[0];
        if (dgm) {
          const drawing = await smartArtDrawing(dgm, part);
          if (drawing) {
            const tree = desc(drawing.xml, 'spTree')[0];
            const fx = x;
            const childMap = (cx) => map({ ...cx, x: fx.x + cx.x, y: fx.y + cx.y });
            const dPart = { ...part, rels: drawing.rels, layout: null };
            const gid = groupId || SC.uid();
            for (const c of Array.from(tree.children)) await convert(c, dPart, { ...ctx, rels: drawing.rels }, childMap, out, gid);
            return;
          }
          warnings.add('Some SmartArt graphics had no saved drawing and were skipped');
          return;
        }
        // Embedded objects (Excel sheets, equations…): use the preview picture.
        const ole = desc(gd, 'oleObj')[0];
        if (ole) {
          const pic = desc(ole, 'pic')[0];
          const blip = pic && path(pic, 'blipFill', 'blip');
          const rel = blip && part.rels[rEmbed(blip)];
          const asset = rel && !rel.external ? await assetFor(rel.target) : null;
          if (asset) { out.push(SC.make.image({ ...common, asset, fit: 'fill' })); return; }
          warnings.add('Some embedded objects had no preview picture and were skipped');
          return;
        }
        warnings.add('Some unsupported objects were skipped');
        return;
      }

      const geom = path(spPr, 'prstGeom');
      const prst = geom ? attr(geom, 'prst') : kid(spPr, 'custGeom') ? 'rect' : 'rect';
      const fill = fillOf(spPr, ctx);
      let fillVal = fill === 'none' ? 'none' : fill && fill.color ? fill.color : fill === null && refs.fill ? refs.fill : 'none';
      common.pattern = fill && fill.pattern ? fill.pattern : undefined;
      const ln = lineOf(spPr, ctx, refs.line);

      if (name === 'cxnSp' || LINE_PRST.test(prst)) {
        // Line from one corner of its box to the other.
        const fx = common.flipH ? -1 : 1, fy = common.flipV ? -1 : 1;
        const cxp = g.x + g.w / 2, cyp = g.y + g.h / 2;
        const t = (g.rot * Math.PI) / 180;
        const dx0 = (g.w / 2) * fx, dy0 = (g.h / 2) * fy;
        const dx = dx0 * Math.cos(t) - dy0 * Math.sin(t), dy = dx0 * Math.sin(t) + dy0 * Math.cos(t);
        const len = Math.max(2, Math.hypot(dx, dy) * 2);
        const ang = (Math.atan2(dy, dx) * 180) / Math.PI;
        const lh = 24;
        const shape = ln.head && ln.tail ? 'dblarrow' : ln.tail ? 'arrow' : ln.head ? 'arrow' : 'line';
        const rot = Math.round((((ln.head && !ln.tail ? ang + 180 : ang) % 360) + 360) % 360);
        out.push(SC.make.line({ x: Math.round(cxp - len / 2), y: Math.round(cyp - lh / 2), w: Math.round(len), h: lh, rot, shape, stroke: ln.stroke === 'none' ? (refs.line ? refs.line.stroke : '#000000') : ln.stroke, strokeW: ln.strokeW || 1, dash: ln.dash, groupId: common.groupId, locked: common.locked }));
        return;
      }

      // Picture fill inside a shape
      if (fill && fill.image) {
        const rel = part.rels[fill.image];
        const asset = rel && !rel.external ? await assetFor(rel.target) : null;
        if (asset && fill.tile) common.fillTile = asset;
        else if (asset) out.push(SC.make.image({ ...common, asset, fit: 'cover', radius: prst === 'ellipse' ? Math.min(g.w, g.h) / 2 : prst === 'roundRect' ? 16 : 0 }));
        fillVal = 'none';
      }

      const chain = styleChain(node, part, ph);
      const defaults = ph ? { heading: phGroup(ph.type) === 'title', valign: phGroup(ph.type) === 'title' ? (ph.type === 'ctrTitle' ? 'bottom' : 'middle') : 'top' } : {};
      if (refs.fontColor) defaults.color = refs.fontColor;
      let txBody = path(node, 'txBody');
      if (inheritedFrom && !(txBody && kids(txBody, 'p').some((p) => kid(p, 'r')))) txBody = txBody || null;
      const tx = textOf(txBody, chain, ctx, defaults) || {};
      // Inherit body insets / anchor from the layout placeholder when the slide doesn't set them.
      if (ph && txBody && !attr(kid(txBody, 'bodyPr'), 'anchor')) {
        const l = (part.layout && findPh(part.layout.tree, ph)) || (part.master && findPh(part.master.tree, ph));
        const a = l && attr(path(l, 'txBody', 'bodyPr'), 'anchor');
        if (a) tx.valign = a === 'ctr' ? 'middle' : a === 'b' ? 'bottom' : 'top';
      }
      const hasFill = fillVal !== 'none';
      const hasLine = ln.stroke !== 'none' && ln.strokeW > 0;
      const cust = !geom && kid(spPr, 'custGeom') ? custGeomOf(kid(spPr, 'custGeom')) : null;
      const mapped = cust ? 'custom' : PRST[prst] || 'rect';
      const isBox = ((mapped === 'rect' || (!hasFill && !hasLine)) && !cust) || !!common.fillTile;
      const textBits = { html: tx.html || '', size: tx.size || 18, bold: !!tx.bold, italic: !!tx.italic, underline: !!tx.underline, strike: !!tx.strike, color: tx.color || '#000000', font: tx.font || '@body', align: tx.align || 'left', valign: tx.valign || 'top', lh: tx.lh || 1.2, ls: tx.ls || 0, pad: tx.pad ?? 10 };
      if (!textBits.html && !hasFill && !hasLine && !ph && !common.fillTile) return;
      const phKind = ph ? (phGroup(ph.type) === 'title' ? 'title' : ph.type === 'subTitle' ? 'subtitle' : 'body') : null;
      if (isBox) {
        out.push(SC.make.text({ ...common, ...textBits, fill: hasFill ? fillVal : 'none', fill2: fill && fill.color2 ? fill.color2 : '', gradAngle: fill && fill.angle != null ? fill.angle : 90,
          stroke: hasLine ? ln.stroke : 'none', strokeW: hasLine ? ln.strokeW : 2, dash: ln.dash, autofit: 'none', ph: phKind, phText: phKind === 'title' ? 'Click to add title' : 'Click to add text', list: tx.list || null }));
      } else {
        const adj = desc(geom, 'gd').find((d) => attr(d, 'name') === 'adj');
        const radius = mapped === 'roundRect' ? Math.round(Math.min(g.w, g.h) * (adj ? num(String(attr(adj, 'fmla')).replace('val ', '')) / 100000 : 0.1667)) : 18;
        out.push(SC.make.shape({ ...common, ...textBits, shape: mapped, geom: cust || undefined, radius, fill: fillVal, fill2: fill && fill.color2 ? fill.color2 : '', gradAngle: fill && fill.angle != null ? fill.angle : 90,
          stroke: hasLine ? ln.stroke : 'none', strokeW: hasLine ? ln.strokeW : 3, dash: ln.dash }));
      }
    }

    function tableOf(tbl, common, ctx, part) {
      const tblPr = kid(tbl, 'tblPr');
      const rows = kids(tbl, 'tr');
      let size = null, color = null, accent = null;
      const data = rows.map((tr, ri) => kids(tr, 'tc').map((tc) => {
        if (attr(tc, 'hMerge') === '1' || attr(tc, 'vMerge') === '1') return '';
        const t = textOf(kid(tc, 'txBody'), [], { ...ctx, rels: part.rels }, { sz: 18 });
        if (t && size == null && t.html) size = t.size;
        if (t && ri > 0 && !color && t.html) color = t.color;
        const f = fillOf(kid(tc, 'tcPr'), ctx);
        if (ri === 0 && f && f.color && !accent) accent = f.color;
        if (!t || !t.html) return '';
        // unwrap single-paragraph cells
        return t.html.replace(/^<div>([\s\S]*)<\/div>$/, '$1');
      }));
      return SC.make.table({ ...common, rows: data.length ? data : [['']], header: attr(tblPr, 'firstRow') === '1', banded: attr(tblPr, 'bandRow') === '1', accent: accent || theme.colors.accent1, size: size || 18, color: color || theme.colors.text });
    }

    async function chartOf(rel, common, ctx) {
      if (!rel) return null;
      const x = await readXml(rel.target);
      if (!x) return null;
      const plot = desc(x, 'plotArea')[0];
      if (!plot) return null;
      const typeEl = Array.from(plot.children).find((c) => /Chart$/.test(c.localName));
      if (!typeEl) return null;
      const t = typeEl.localName;
      let chart = 'bar';
      if (/^bar/.test(t)) chart = attr(kid(typeEl, 'barDir'), 'val') === 'bar' ? 'hbar' : 'bar';
      else if (/^line/.test(t) || /^scatter/.test(t)) chart = 'line';
      else if (/^area/.test(t)) chart = 'area';
      else if (/^doughnut/.test(t)) chart = 'doughnut';
      else if (/^pie/.test(t) || /^ofPie/.test(t)) chart = 'pie';
      else warnings.add('Some chart types were converted to column charts');
      const pts = (ref) => {
        if (!ref) return [];
        const cache = desc(ref, 'strCache')[0] || desc(ref, 'numCache')[0] || desc(ref, 'strLit')[0] || desc(ref, 'numLit')[0];
        if (!cache) return [];
        const n = num(attr(kid(cache, 'ptCount'), 'val'), 0);
        const arr = Array(n).fill('');
        for (const p of kids(cache, 'pt')) arr[num(attr(p, 'idx'))] = (kid(p, 'v') || {}).textContent || '';
        return arr;
      };
      const sers = kids(typeEl, 'ser');
      if (!sers.length) return null;
      const labels = pts(kid(sers[0], 'cat')).map(String);
      const series = sers.map((s, i) => ({ name: pts(kid(s, 'tx'))[0] || `Series ${i + 1}`, values: pts(kid(s, 'val')).map((v) => +v || 0) }));
      const serFill = (n) => { const f = fillOf(kid(n, 'spPr'), ctx); return f && f.color ? f.color : null; };
      let colors = sers.map(serFill);
      if (chart === 'pie' || chart === 'doughnut') { const dp = kids(sers[0], 'dPt'); colors = []; for (const d of dp) colors[num(attr(kid(d, 'idx'), 'val'))] = serFill(d); }
      if (!colors.some(Boolean)) colors = null;
      const n = Math.max(labels.length, ...series.map((s) => s.values.length));
      const titleEl = desc(x, 'title')[0];
      const deleted = desc(x, 'autoTitleDeleted')[0];
      let title = titleEl ? desc(titleEl, 't').map((t2) => t2.textContent).join('') : '';
      if (!title && !(deleted && attr(deleted, 'val') === '1') && series.length === 1 && (titleEl || !deleted)) title = series[0].name;
      const szEl = desc(x, 'defRPr').find((d) => attr(d, 'sz'));
      const fsz = szEl ? Math.round((num(attr(szEl, 'sz')) / 100) * PTPX) : Math.round(13.5 * PTPX);
      const dl = desc(typeEl, 'dLbls')[0];
      return SC.make.chart({ ...common, chart, title, colors: colors ? Array.from(colors, (c) => c || null) : undefined, labels: Array.from({ length: n }, (_, i) => labels[i] || String(i + 1)), series: series.map((s) => ({ ...s, values: Array.from({ length: n }, (_, i) => s.values[i] || 0) })),
        legend: !!desc(x, 'legend')[0], dataLabels: !!(dl && (desc(dl, 'showVal').some((e) => attr(e, 'val') === '1') || desc(dl, 'showPercent').some((e) => attr(e, 'val') === '1'))), size: fsz, color: theme.colors.text });
    }

    /* Background of a part: returns slide bg object or null if not defined there. */
    async function bgOf(xml, part, ctx) {
      const bg = desc(xml, 'bg')[0];
      if (!bg) return null;
      const bgPr = kid(bg, 'bgPr');
      if (bgPr) {
        const f = fillOf(bgPr, ctx);
        if (f && f.image) { const rel = part.rels[f.image]; const asset = rel ? await assetFor(rel.target) : null; return asset ? { type: 'image', asset, hideDecor: true } : null; }
        if (f && f.color2) return { type: f.radial ? 'radial' : 'gradient', color: f.color, color2: f.color2, angle: f.angle, hideDecor: true };
        if (f && f.color) return { type: 'solid', color: f.color, hideDecor: true };
        return null;
      }
      const ref = kid(bg, 'bgRef');
      if (ref) {
        const c = colorOf(ref, ctx);
        const idx = num(attr(ref, 'idx'));
        const style = idx >= 1001 ? fmtFills[idx - 1001] : null;
        if (style && style.localName === 'gradFill') {
          const holder = document.createElementNS('x', 'w');
          holder.append(style.cloneNode(true));
          const f = fillOf(holder, { ...ctx, phClr: c });
          if (f && f.color2) return { type: 'gradient', color: f.color, color2: f.color2, angle: f.angle, hideDecor: true };
        }
        return { type: 'solid', color: c || '#ffffff', hideDecor: true };
      }
      return null;
    }

    const TRANS = { fade: 'fade', push: 'push', wipe: 'wipe', cover: 'cover', pull: 'uncover', split: 'split', circle: 'circle', zoom: 'zoom', morph: 'morph', flip: 'flip', dissolve: 'fade', randomBar: 'wipe', random: 'random', blinds: 'wipe', checker: 'fade', strips: 'wipe', wheel: 'circle', plus: 'circle', diamond: 'circle', newsflash: 'zoom', reveal: 'fadeBlack', vortex: 'zoom', prism: 'flip', switch: 'flip', gallery: 'push', conveyor: 'push', pan: 'push', ferris: 'push', doors: 'split', window: 'split', shred: 'fade', flash: 'fadeBlack' };
    const DIRS = { l: 'right', r: 'left', u: 'up', d: 'down' };
    const transitionOf = (sld) => {
      const all = desc(sld, 'transition');
      const t = all.find((x) => x.parentNode && x.parentNode.localName === 'Choice') || all[0];
      if (!t) return { type: 'none', dur: 0.7, dir: 'left' };
      const eff = Array.from(t.children).find((c) => c.localName !== 'sndAc' && c.localName !== 'extLst');
      const effName = eff ? eff.localName : 'none';
      let type = TRANS[effName] || (eff ? 'fade' : 'none');
      if (effName === 'fade' && attr(eff, 'thruBlk') === '1') type = 'fadeBlack';
      if (effName === 'prstTrans') type = 'fade';
      const dur = attr(t, 'p14:dur') || attr(t, 'dur') ? num(attr(t, 'p14:dur') || attr(t, 'dur')) / 1000 : { slow: 1, med: 0.75, fast: 0.5 }[attr(t, 'spd') || 'fast'];
      const dir = DIRS[attr(eff, 'dir')] || 'left';
      const o = { type, dur: SC.round(dur || 0.7, 2), dir };
      if (attr(t, 'advTm')) o.auto = num(attr(t, 'advTm')) / 1000;
      return o;
    };

    async function smartArtDrawing(relIds, part) {
      const dm = part.rels[rId(relIds, 'dm')];
      let target = null;
      if (dm) {
        const dx = await readXml(dm.target);
        const ext = dx && desc(dx, 'dataModelExt')[0];
        const rel = ext && part.rels[attr(ext, 'relId')];
        if (rel) target = rel.target;
        if (!target) { const n = (/(\d+)\.xml$/.exec(dm.target) || [])[1]; const cand = Object.values(part.rels).find((r) => r.type === 'diagramDrawing' && r.target.endsWith(`drawing${n}.xml`)); if (cand) target = cand.target; }
      }
      if (!target) return null;
      const xml = await readXml(target);
      return xml ? { xml, rels: await relsOf(target) } : null;
    }

    /* Map PowerPoint animation presets to Slidecraft effects. */
    const ENTR = { 1: 'appear', 2: 'fly', 3: 'wipe', 4: 'zoom', 5: 'fade', 6: 'zoom', 7: 'fly', 8: 'zoom', 9: 'fade', 10: 'fade', 12: 'float', 13: 'zoom', 14: 'wipe', 15: 'fly', 16: 'split', 17: 'zoom', 18: 'wipe', 19: 'spin', 20: 'zoom', 21: 'spin', 22: 'wipe', 23: 'zoom', 24: 'fade', 25: 'spin', 26: 'bounce', 30: 'float', 31: 'grow', 35: 'spin', 37: 'float', 42: 'float', 45: 'spin', 47: 'float', 49: 'grow', 53: 'zoom', 55: 'zoom' };
    const EMPH = { 6: 'growE', 8: 'spinE', 9: 'flash', 26: 'pulse', 27: 'flash', 32: 'teeter', 35: 'flash', 36: 'flash' };
    const EXIT = { 1: 'fadeOut', 2: 'flyOut', 3: 'wipeOut', 4: 'zoomOut', 6: 'zoomOut', 7: 'flyOut', 10: 'fadeOut', 12: 'flyOut', 16: 'wipeOut', 17: 'zoomOut', 18: 'wipeOut', 22: 'wipeOut', 23: 'zoomOut', 42: 'flyOut', 47: 'flyOut', 53: 'zoomOut' };
    const SUBDIR = (n) => (n & 4 ? 'bottom' : n & 1 ? 'top' : n & 8 ? 'left' : n & 2 ? 'right' : 'bottom');
    function animationsOf(sx, spMap) {
      const main = desc(sx, 'cTn').find((c) => attr(c, 'nodeType') === 'mainSeq');
      if (!main) return;
      let order = 0;
      const seen = new Set();
      for (const c of desc(main, 'cTn')) {
        const cls = attr(c, 'presetClass');
        if (!cls) continue;
        const tgt = desc(c, 'spTgt')[0];
        const ids = tgt && spMap[attr(tgt, 'spid')];
        if (!ids || !ids.length) continue;
        const id0 = num(attr(c, 'presetID'));
        const effect = cls === 'entr' ? ENTR[id0] || 'fade' : cls === 'exit' ? EXIT[id0] || 'fadeOut' : cls === 'emph' ? EMPH[id0] || 'pulse' : null;
        if (!effect) { warnings.add('Motion-path animations are not supported and were skipped'); continue; }
        const durs = desc(c, 'cTn').map((x) => attr(x, 'dur')).filter((d) => d && /^\d+$/.test(d)).map(Number);
        const dur = durs.length ? Math.max(...durs) / 1000 : 0.5;
        // The effect's own start delay (group offsets are reproduced by the trigger model).
        const cond = path(c, 'stCondLst', 'cond');
        const delay = cond && /^\d+$/.test(attr(cond, 'delay') || '') ? num(attr(cond, 'delay')) : 0;
        const trigger = { clickEffect: 'click', withEffect: 'with', afterEffect: 'after' }[attr(c, 'nodeType')] || 'click';
        ids.forEach((id, k) => {
          seen.add(id);
          ctxAnim.push({ id, anim: { effect, dir: SUBDIR(num(attr(c, 'presetSubtype'))), trigger: k ? 'with' : trigger, dur: SC.round(dur, 2), delay: SC.round(delay / 1000, 2), order: ++order } });
        });
      }
    }
    let ctxAnim = [];

    /* ---------- slides ---------- */
    const doc = SC.newDoc();
    doc.title = opts.title || 'Imported Presentation';
    doc.size = { w: W, h: H };
    doc.ratio = Math.abs(W / H - 16 / 9) < 0.02 ? '16:9' : Math.abs(W / H - 4 / 3) < 0.02 ? '4:3' : Math.abs(W / H - 1.6) < 0.02 ? '16:10' : 'custom';
    doc.theme = 'custom';
    doc.customTheme = theme;
    doc.assets = assets;
    doc.slides = [];
    const core = await readXml('docProps/core.xml');
    const ttl = core && desc(core, 'title')[0];
    if (ttl && ttl.textContent.trim()) doc.title = ttl.textContent.trim();

    const ids = desc(pres, 'sldId');
    let no = 0;
    for (const sid of ids) {
      const rel = presRels[rId(sid)];
      if (!rel) continue;
      no++;
      const sp = rel.target;
      const sx = await readXml(sp);
      if (!sx) continue;
      const rels = await relsOf(sp);
      const lRel = Object.values(rels).find((r) => r.type === 'slideLayout');
      const layout = lRel ? await loadLayout(lRel.target) : null;
      const master = layout ? layout.master : null;
      const ctx = { scheme, clrMap: master ? master.clrMap : { tx1: 'dk1', bg1: 'lt1', tx2: 'dk2', bg2: 'lt2' }, theme, slideNo: no, rels, spMap: {} };
      const slideMeta = desc(sx, 'sld')[0];
      const slide = SC.makeSlide('blank', W, H);
      slide.layout = 'imported';
      slide.hidden = attr(slideMeta, 'show') === '0';
      slide.transition = transitionOf(sx);
      slide.bg = (await bgOf(sx, { rels }, ctx)) || (layout && (await bgOf(layout.xml, layout, ctx))) || (master && (await bgOf(master.xml, master, ctx))) || { type: 'solid', color: theme.colors.bg, hideDecor: true };
      const els = [];
      const ident = (x) => x;
      const showMaster = attr(slideMeta, 'showMasterSp') !== '0';
      if (showMaster && layout) {
        if (layout.showMasterSp && master) for (const c of Array.from(master.tree.children)) await convert(c, { ...master, isTemplate: true, master, rels: master.rels }, { ...ctx, rels: master.rels }, ident, els);
        for (const c of Array.from(layout.tree.children)) await convert(c, { ...layout, isTemplate: true, layout, master, rels: layout.rels }, { ...ctx, rels: layout.rels }, ident, els);
      }
      const tree = desc(sx, 'spTree')[0];
      if (tree) for (const c of Array.from(tree.children)) await convert(c, { rels, layout, master }, ctx, ident, els);
      slide.elements = els;

          if (!!cf.underline !== el.underline) stl.push(`text-decoration:${cf.underline ? 'underline' : 'none'}`);
          const col = cfColor(cf.color, ctx.scheme);
          if (col && col !== el.color) stl.push(`color:${col}`);
          const fnt = toFont(cf.font);
          if (fnt && fnt !== el.font) stl.push(`font-family:'${fnt.replace(/'/g, '')}'`);

    /* Parse a shape container into elements. frame maps raw coordinates to px. */
    async function shapeOf(sp, ctx, frame, out, groupId) {

      // lines / connectors

        const fx = flipH ? -1 : 1, fy = flipV ? -1 : 1;

      // text
      let textRec = null;
      const tb = R.kid(sp, T.ClientTextbox);

        const ref = R.kid(tb, T.OutlineTextRefAtom);
        if (ref) textRec = ctx.texts[R.u32(ref.data)] || null;

          const th = R.kid(tb, T.TextHeaderAtom);
          const tc = R.kid(tb, T.TextCharsAtom), tby = R.kid(tb, T.TextBytesAtom);
          textRec = { type: th ? R.u32(th.data) : 4, text: tc ? R.utf16(tc.data, tc.len) : tby ? R.latin1(tby.data, tby.len) : '', style: R.kid(tb, T.StyleTextPropAtom) };

      if (!textRec && pha) textRec = { type: [13, 15, 17].includes(placement) ? 0 : 1, text: '', style: null };
      const tx = textRec ? buildText(textRec, ctx) : null;
      const anchor = typeof props[0x0087] === 'number' ? props[0x0087] : 0;
      const valign = [0, 3, 6, 8].includes(anchor) ? 'top' : [1, 4, 7, 9].includes(anchor) ? 'middle' : 'bottom';
      const pad = Math.round(((typeof props[0x0081] === 'number' ? props[0x0081] : 91440) * EMU + (typeof props[0x0082] === 'number' ? props[0x0082] : 45720) * EMU) / 2);
      const phKind = pha ? ([13, 15, 17].includes(placement) ? 'title' : placement === 16 ? 'subtitle' : placement === 26 ? 'picture' : 'body') : null;
      const textBits = tx ? { html: tx.html, size: tx.size, bold: tx.bold, italic: tx.italic, underline: tx.underline, color: tx.color, font: tx.font, align: tx.align, lh: tx.lh, valign, pad, list: tx.list || null } : {};

      } else {
        out.push(SC.make.shape({ ...common, ...textBits, shape, geom: geom || undefined, fill, fill2, gradAngle: 90, stroke, strokeW: strokeW || 3, dash, flipH, flipV, radius: Math.round(Math.min(common.w, common.h) * 0.16), color: textBits.color || '#000000' }));
      }
    }

    /* Freeform / custom geometry: vertices (possibly formula-driven) + segment info -> normalized path commands. */
    function freeform(props, w, h) {
      try {
        const num = (k, d) => (typeof props[k] === 'number' ? props[k] : d);
        let left = num(0x0140, 0), top = num(0x0141, 0);
        let right = num(0x0142, 21600), bottom = num(0x0143, 21600);
        const emptySpace = right <= left || bottom <= top;
        const adj = (i) => num(0x0147 + i, [5400, 5400, 5400, 5400, 5400, 5400, 5400, 5400, 5400, 5400][i]);
        // Guides
        const guides = [];
        const gp = props[0x0156];
        const special = (v) => {
          if (v >= 0x0400 && v < 0x0400 + 128) return guides[v - 0x0400] || 0;
          if (v >= 0x0147 && v <= 0x0150) return adj(v - 0x0147);
          switch (v) {
            case 0x0140: return left; case 0x0141: return top; case 0x0142: return right; case 0x0143: return bottom;
            case 0x04f7: case 0x04f8: return 1; case 0x04f9: return 1;
            case 0x04fc: return w; case 0x04fd: return h; case 0x04fe: return w / 2; case 0x04ff: return h / 2;
            default: return 0;
          }
        };
        if (gp && typeof gp === 'object') {
          const n = R.u16(gp.off);
          for (let i = 0; i < n; i++) {
            const o = gp.off + 6 + i * 8;
            const f = R.u16(o), op = f & 0x1fff;
            const raw = [R.u16(o + 2), R.u16(o + 4), R.u16(o + 6)];
            const [a, b, c] = raw.map((v, k) => (f & (0x2000 << k) ? special(v) : (v << 16) >> 16));
            const deg = (x) => (x / 65536) * Math.PI / 180;
            let r = 0;
            switch (op) {
              case 0: r = a + b - c; break;
              case 1: r = c ? (a * b) / c : 0; break;
              case 2: r = (a + b) / 2; break;
              case 3: r = Math.abs(a); break;
              case 4: r = Math.min(a, b); break;
              case 5: r = Math.max(a, b); break;
              case 6: r = a > 0 ? b : c; break;
              case 7: r = Math.sqrt(a * a + b * b + c * c); break;
              case 8: r = (Math.atan2(b, a) * 180 / Math.PI) * 65536; break;
              case 9: r = a * Math.sin(deg(b)); break;
              case 10: r = a * Math.cos(deg(b)); break;
              case 11: r = a * Math.cos(Math.atan2(c, b)); break;
              case 12: r = a * Math.sin(Math.atan2(c, b)); break;
              case 13: r = Math.sqrt(Math.max(0, a)); break;
              case 14: r = a + b * 65536 - c * 65536; break;
              case 15: r = b ? c * Math.sqrt(Math.max(0, 1 - (a / b) * (a / b))) : 0; break;
              case 16: r = a * Math.tan(deg(b)); break;
              default: r = 0;
            }
            guides[i] = r;
          }
        }
        const v = props[0x0145], sgi = props[0x0146];
        const n = R.u16(v.off), cb = R.u16(v.off + 4);
        const val = (raw, bits) => {
          if (bits === 32 ? raw >>> 0 >= 0x80000000 && (raw >>> 0) < 0x80000000 + 0x10000 : (raw & 0xffff) >= 0x8000 && (raw & 0xffff) < 0x8100) return guides[raw & 0xff] ?? special(0x0400 + (raw & 0xff));

          const sp = [c0[0] + rx * Math.cos(a0), c0[1] + ry * Math.sin(a0)];

          if (cw) { while (d < 0) d += 2 * Math.PI; } else { while (d > 0) d -= 2 * Math.PI; }

            const type = seg >> 13;
            const cnt = seg & 0x1fff;

            else if (type === 1) for (let j = 0; j < Math.max(1, cnt); j++) { if (pts[k + 2]) { out.push(['C', ...N(pts[k]), ...N(pts[k + 1]), ...N(pts[k + 2])]); cur = pts[k + 2]; k += 3; } }
            else if (type === 2) { if (pts[k]) { out.push(['M', ...N(pts[k])]); cur = pts[k++]; quadX = true; } }

      } catch (_) { return null; }
    }

    async function walkGroup(spgr, ctx, frame, out, groupId) {
      const items = R.kids(spgr);
      if (!items.length) return;
      // First child describes the group itself.
      const head = items[0];
      let childFrame = frame;
      const fspgr = R.kid(head, T.FSPGR);
      const gfsp = R.kid(head, T.FSP);
      const patriarch = gfsp && R.u32(gfsp.data + 4) & 0x4;
      if (fspgr && !patriarch) {
        const gl = R.i32(fspgr.data), gt = R.i32(fspgr.data + 4), gr = R.i32(fspgr.data + 8), gb = R.i32(fspgr.data + 12);
        const ca = R.kid(head, T.ClientAnchor), cha = R.kid(head, T.ChildAnchor);
        let outer = null;
        if (cha) outer = { l: R.i32(cha.data), t: R.i32(cha.data + 4), r: R.i32(cha.data + 8), b: R.i32(cha.data + 12) };
        else if (ca) outer = ca.len >= 16 ? { t: R.i32(ca.data), l: R.i32(ca.data + 4), r: R.i32(ca.data + 8), b: R.i32(ca.data + 12) } : { t: R.i16(ca.data), l: R.i16(ca.data + 2), r: R.i16(ca.data + 4), b: R.i16(ca.data + 6) };
        if (outer) {
          const o = frame(outer);
          const sx = o.w / Math.max(1, gr - gl), sy = o.h / Math.max(1, gb - gt);

        }

        if (c.type === T.SpContainer) await shapeOf(c, ctx, childFrame, out, gid);
        else if (c.type === T.SpgrContainer) await walkGroup(c, ctx, childFrame, out, gid);
      }
    }

    const topFrame = (b) => ({ x: b.l * S, y: b.t * S, w: (b.r - b.l) * S, h: (b.b - b.t) * S });

    async function drawingOf(container, ctx) {
      const out = [];
      const dg = R.kid(R.kid(container, T.Drawing), T.DgContainer);
      if (!dg) return { els: out, bg: null };
      let bg = null;
      for (const k of R.kids(dg)) {
        if (k.type === T.SpgrContainer) await walkGroup(k, ctx, topFrame, out, null);
        else if (k.type === T.SpContainer) {
          const fsp = R.kid(k, T.FSP);

            for (const f of R.kids(k)) if (f.type === T.FOPT || f.type === T.FOPT2 || f.type === T.FOPT3) readFOPT(R, f, props);

            else bg = { type: 'solid', color: c1, hideDecor: true };
          }
        }
      }
      return { els: out, bg };
    }

    /* ---------- build document ---------- */
    const doc = SC.newDoc();
    doc.title = opts.title || 'Imported Presentation';
    doc.size = { w: W, h: H };
    doc.ratio = Math.abs(W / H - 16 / 9) < 0.02 ? '16:9' : Math.abs(W / H - 4 / 3) < 0.02 ? '4:3' : Math.abs(W / H - 1.6) < 0.02 ? '16:10' : 'custom';
    doc.theme = 'custom';
    doc.customTheme = theme;
    doc.assets = assets;
    doc.slides = [];
    const masterDrawings = {};

    for (const entry of slideEntries) {
      const sr = R.rec(persist[entry.persist]);
      if (!sr || sr.type !== T.Slide) continue;
      const sa = R.kid(sr, T.SlideAtom);
      const masterId = sa ? R.u32(sa.data + 12) : null;
      const notesId = sa ? R.u32(sa.data + 16) : 0;
      const sflags = sa ? R.u16(sa.data + 20) : 0x7;

            if (e.shape === 'custom' && e.geom) {
              opts.shape = 'custGeom';
              const X = (v) => v * b.w, Y = (v) => v * b.h;
              opts.points = e.geom.map((c) => {
                switch (c[0]) {
                  case 'M': return { x: X(c[1]), y: Y(c[2]), moveTo: true };
                  case 'L': case 'A': return { x: X(c[c.length - 2]), y: Y(c[c.length - 1]) };
                  case 'C': return { x: X(c[5]), y: Y(c[6]), curve: { type: 'cubic', x1: X(c[1]), y1: Y(c[2]), x2: X(c[3]), y2: Y(c[4]) } };
                  case 'Q': return { x: X(c[3]), y: Y(c[4]), curve: { type: 'quadratic', x1: X(c[1]), y1: Y(c[2]) } };
                  default: return { close: true };
                }
              });
            }
            if (e.shape === 'roundRect') opts.rectRadius = Math.min(e.radius, e.w / 2, e.h / 2) * PX;
            if (e.pattern) opts.fill = { color: hex(SC.mix(SC.colorToHex(SC.resolveColor(e.pattern.fg, theme)) || '#000000', SC.colorToHex(SC.resolveColor(e.pattern.bg, theme)) || '#ffffff', 0.5)), transparency };
            else if (e.fill && e.fill !== 'none') opts.fill = { color: hex(SC.resolveColor(e.fill, theme)), transparency };
            if (e.stroke && e.stroke !== 'none' && e.strokeW) opts.line = { color: hex(SC.resolveColor(e.stroke, theme)), width: e.strokeW * PT, dashType: { dash: 'dash', dot: 'sysDot', longdash: 'lgDash', dashdot: 'dashDot' }[e.dash] || 'solid' };
            if (e.flipH) opts.flipH = true;
            if (e.flipV) opts.flipV = true;
            if (e.link) opts.hyperlink = e.link.startsWith('#') ? { slide: parseInt(e.link.slice(1), 10) } : { url: e.link };
            const runs = SC.isEmptyHtml(e.html) ? [{ text: '', options: {} }] : htmlRuns(e.html, e, theme);
            sl.addText(runs, opts);
          } else if (e.type === 'shape') {
            const t = (e.rot || 0) * Math.PI / 180;
            const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
            const x1 = cx - Math.cos(t) * e.w / 2, y1 = cy - Math.sin(t) * e.w / 2, x2 = cx + Math.cos(t) * e.w / 2, y2 = cy + Math.sin(t) * e.w / 2;
            sl.addShape('line', {
              x: Math.min(x1, x2) * PX, y: Math.min(y1, y2) * PX, w: Math.max(0.01, Math.abs(x2 - x1) * PX), h: Math.max(0.0001, Math.abs(y2 - y1) * PX), flipV: (x2 - x1) * (y2 - y1) < 0,
              line: { color: hex(SC.resolveColor(e.stroke, theme)), width: (e.strokeW || 2) * PT, dashType: { dash: 'dash', dot: 'sysDot', longdash: 'lgDash', dashdot: 'dashDot' }[e.dash] || 'solid', endArrowType: e.shape !== 'line' ? 'triangle' : undefined, beginArrowType: e.shape === 'dblarrow' ? 'triangle' : undefined },
            });
          } else if (e.type === 'image') {
            if (!e.asset) continue;
            const data = doc.assets[e.asset];
            const nat = await SC.imageSize(data);
            const o = { ...b, data, transparency, shadow: shadowOpt(e) };
            if (e.fit === 'cover') o.sizing = { type: 'cover', w: b.w, h: b.h };
            else if (e.fit === 'contain') o.sizing = { type: 'contain', w: b.w, h: b.h };
            if (e.radius >= Math.min(e.w, e.h) / 2) o.rounding = true;
            if (e.flipH) o.flipH = true;
            if (e.flipV) o.flipV = true;
            if (e.link) o.hyperlink = e.link.startsWith('#') ? { slide: parseInt(e.link.slice(1), 10) } : { url: e.link };
            void nat;
            sl.addImage(o);
          } else if (e.type === 'video') {
            if (!e.asset) continue;
            const data = doc.assets[e.asset];
            const ext = (data.slice(5, data.indexOf(';')).split('/')[1] || 'mp4').replace('quicktime', 'mov');
            sl.addMedia({ ...b, type: 'video', data, extn: ext });
          } else if (e.type === 'table') {
            const accent = hex(SC.resolveColor(e.accent, theme));
            const head = SC.luminance('#' + accent) > 0.5 ? '111111' : 'FFFFFF';
            const rows = e.rows.map((r, ri) => r.map((c) => {
              const isHead = e.header && ri === 0;
              const band = e.banded && !isHead && (ri - (e.header ? 1 : 0)) % 2 === 0;
              return { text: SC.htmlToText(c), options: { bold: isHead || e.bold, color: isHead ? head : hex(SC.resolveColor(e.color, theme)), fill: isHead ? { color: accent } : band ? { color: hex(SC.mix('#' + accent, SC.colorToHex(SC.resolveColor('@bg', theme)) || '#ffffff', 0.88)) } : undefined } };
            }));
            sl.addTable(rows, { x: b.x, y: b.y, w: b.w, colW: Array(e.rows[0].length).fill(b.w / e.rows[0].length), rowH: b.h / e.rows.length, fontSize: e.size * PT, fontFace: SC.primaryFont(SC.resolveFont(e.font, theme)), align: e.align, valign: e.valign === 'middle' ? 'middle' : e.valign, border: { type: 'solid', pt: 0.75, color: accent } });
          } else if (e.type === 'chart') {
            const type = { bar: 'bar', hbar: 'bar', line: 'line', area: 'area', pie: 'pie', doughnut: 'doughnut' }[e.chart];
            const series = (e.chart === 'pie' || e.chart === 'doughnut' ? e.series.slice(0, 1) : e.series).map((s2) => ({ name: s2.name, labels: e.labels.map(String), values: e.labels.map((_, i) => +s2.values[i] || 0) }));
            const accents = ['accent1', 'accent2', 'accent3', 'accent4', 'accent5', 'accent6'].map((k) => hex(theme.colors[k]));
            const count = e.chart === 'pie' || e.chart === 'doughnut' ? e.labels.length : e.series.length;
            const colors = Array.from({ length: Math.max(6, count) }, (_, i) => (e.colors && e.colors[i] ? hex(SC.resolveColor(e.colors[i], theme)) : accents[i % 6]));
            const tc = hex(SC.resolveColor(e.color, theme));
            sl.addChart(type, series, {
              ...b, barDir: e.chart === 'hbar' ? 'bar' : 'col', chartColors: colors, showLegend: !!e.legend, legendPos: 'b', legendColor: tc, legendFontSize: e.size * PT * 0.9,
              showTitle: !!e.title, title: e.title || undefined, titleColor: tc, titleFontSize: e.size * PT * 1.2,
              showValue: !!e.dataLabels && type !== 'pie' && type !== 'doughnut', showPercent: !!e.dataLabels && (type === 'pie' || type === 'doughnut'),
              catAxisLabelColor: tc, valAxisLabelColor: tc, catAxisLabelFontSize: e.size * PT * 0.85, valAxisLabelFontSize: e.size * PT * 0.85,
              valGridLine: e.gridlines === false ? { style: 'none' } : { color: 'D9D9D9', size: 0.75 }, holeSize: 55, lineSize: 2,
            });
          }
        } catch (err) {
          console.warn('PPTX export: skipped element', e.type, err);
        }
      }
      if (doc.footer && (doc.footer.num || doc.footer.text || doc.footer.date) && s.layout !== 'title') {
        const fo = { y: (H - 40) * PX, h: 28 * PX, fontSize: 11, color: hex(theme.colors.muted), fontFace: SC.primaryFont(theme.fonts.body) };
        if (doc.footer.date) sl.addText(new Date().toLocaleDateString(), { ...fo, x: 40 * PX, w: 300 * PX, align: 'left' });
        if (doc.footer.text) sl.addText(doc.footer.text, { ...fo, x: (W / 2 - 300) * PX, w: 600 * PX, align: 'center' });
        if (doc.footer.num) sl.addText(String(si + 1), { ...fo, x: (W - 140) * PX, w: 100 * PX, align: 'right' });
      }
    }
    return pptx.write({ outputType: 'arraybuffer' });
  };

  app.saveBinary = async (name, buf, desc, exts, mime) => {
    if (SC.api) {
      const r = await SC.api.saveBinary(name, [{ name: desc, extensions: exts }], new Uint8Array(buf));
      if (r) SC.toast(`Exported ${r.path.split(/[\\/]/).pop()}`);
      return;
    }
    SC.download(new Blob([buf], { type: mime }), name);
    SC.toast(`Exported ${name}`);
  };

  /* ---------- PDF / print ---------- */
  app.exportPdf = async (printOnly = false) => {
    if (app.editing) app.endEdit();
    const root = SC.$('#print-root');
    root.innerHTML = '';
    const { w: W, h: H } = app.doc.size;
    app.doc.slides.forEach((s, i) => { if (!s.hidden) root.append(h('div', { class: 'print-page', style: { width: W + 'px', height: H + 'px' } }, SC.renderSlide(s, app.doc, { mode: 'print', index: i }))); });
    let st = SC.$('#print-size');
    if (!st) { st = h('style', { id: 'print-size' }); document.head.append(st); }
    st.textContent = `@page { size: ${W}px ${H}px; margin: 0; }`;
    document.body.classList.add('printing');
    await Promise.all(SC.$$('img', root).map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    await new Promise((r) => setTimeout(r, 120));
    try {
      if (SC.api && !printOnly) {
        const r = await SC.api.printToPDF(baseName() + '.pdf', { width: W / 96, height: H / 96 });
        if (r) SC.toast(`Exported ${r.path.split(/[\\/]/).pop()}`);
      } else {
        await new Promise((res) => { const done = () => { removeEventListener('afterprint', done); res(); }; addEventListener('afterprint', done); window.print(); setTimeout(res, 60000); });
      }
    } finally {
      document.body.classList.remove('printing');
      root.innerHTML = '';
    }
  };

  /* ---------- PNG ---------- */
  const slideToPng = async (i, scale = 2) => {
    const s = app.doc.slides[i];
    const { w: W, h: H } = app.doc.size;
    const node = SC.renderSlide(s, app.doc, { mode: 'print', index: i });
    // Inline computed styles are already on nodes; serialise with the stylesheet rules that matter.
    const css = SC.RENDER_CSS;
    const xml = new XMLSerializer().serializeToString(node);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css.replace(/</g, '\\3c ')}</style>${xml}</div></foreignObject></svg>`;
    return svgToPng(svg, W, H, scale);
  };
  app.exportPng = async (all = false) => {
    if (app.editing) app.endEdit();
    const list = all ? app.doc.slides.map((_, i) => i) : [app.cur];
    if (SC.api && all) {
      const dir = await SC.api.pickFolder();
      if (!dir) return;
      for (const i of list) {
        const url = await slideToPng(i);
        if (url) await SC.api.writeFileIn(dir, `${baseName()}-${String(i + 1).padStart(2, '0')}.png`, Uint8Array.from(atob(url.split(',')[1]), (c) => c.charCodeAt(0)));
      }
      SC.toast(`Exported ${list.length} images`);
      return;
    }
    for (const i of list) {
      const url = await slideToPng(i);
      if (!url) { SC.toast('Could not render slide image'); return; }
      const bytes = Uint8Array.from(atob(url.split(',')[1]), (c) => c.charCodeAt(0));
      await app.saveBinary(`${baseName()}-${i + 1}.png`, bytes.buffer, 'PNG Image', ['png'], 'image/png');
    }
  };
})();

</script>
  <script>
'use strict';
/* Start-up: build the UI, wire up the desktop shell, load the welcome deck. */
(() => {
  const app = SC.app, M = SC.make;

  SC.sampleDoc = () => {
    const d = SC.newDoc();
    d.title = 'Welcome to Slidecraft';
    d.theme = 'midnight';
    const W = 1280, H = 720;
    const s1 = SC.makeSlide('title', W, H);
    s1.elements[0].html = 'Welcome to Slidecraft';
    s1.elements[1].html = 'Design, animate and present — on macOS and Windows';
    s1.elements[0].anim = { effect: 'float', dir: 'bottom', trigger: 'after', dur: 0.8, delay: 0.2, order: 1 };

    s1.notes = 'Press F5 to present. Use the arrow keys or click to advance.';

    const s2 = SC.makeSlide('content', W, H);

    s2.elements[1].size = 26;
    s2.elements[1].anim = { effect: 'fly', dir: 'left', trigger: 'click', dur: 0.6, delay: 0, order: 1 };
    s2.transition = { type: 'push', dur: 0.7, dir: 'left' };

    const s3 = SC.makeSlide('titleOnly', W, H);
    s3.elements[0].html = 'Build diagrams in seconds';
    const box = (shape, x, label, fill, mid) => M.shape({ shape, x, y: 290, w: 300, h: 170, fill, html: label, size: 26, bold: true, mid, shadow: 'soft' });
    const a = box('roundRect', 90, 'Idea', '@accent1', 'm-a'), b = box('roundRect', 490, 'Design', '@accent2', 'm-b'), c = box('roundRect', 890, 'Present', '@accent3', 'm-c');
    const l1 = M.line({ shape: 'arrow', x: 400, y: 363, w: 80, h: 24, stroke: '@text', strokeW: 4 });
    const l2 = M.line({ shape: 'arrow', x: 800, y: 363, w: 80, h: 24, stroke: '@text', strokeW: 4 });

    b.anim = { effect: 'zoom', trigger: 'after', dur: 0.5, delay: 0, order: 3 };
    l2.anim = { effect: 'wipe', dir: 'left', trigger: 'after', dur: 0.4, delay: 0, order: 4 };

    document.documentElement.classList.add('ready');
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
