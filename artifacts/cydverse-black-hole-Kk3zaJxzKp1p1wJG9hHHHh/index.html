<style>
/* Layout: one full-bleed 3D stage in the CydFTP drive-bay look; a small label top-left and a Replay control bottom-centre. Single dark look on purpose, matching CydFTP. */
:root{
  --chassis:#0f1319; --chassis-hi:#1c2633; --panel:#18202a; --rule:#2c3644;
  --text:#e8eef6; --dim:#9fb0c3; --led:#38bdf8; --led-deep:#0c6aa0;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--chassis);color:var(--text);font-family:var(--body);overflow:hidden}
.app{position:relative;height:100%;overflow:hidden;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse 80% 70% at 50% 35%,var(--chassis-hi) 0%,var(--chassis) 72%)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl:active{cursor:grabbing}
.label{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:2px;pointer-events:none}
.label b{font:700 18px/1.1 var(--display);letter-spacing:.12em}
.label span{font:500 12px var(--body);color:var(--dim);display:flex;gap:8px;align-items:center}
.led{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led)}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:max-content;max-width:calc(100% - 32px);display:grid;gap:8px;justify-items:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:3px;border-radius:10px;background:rgba(24,32,42,.85);border:1px solid var(--rule)}
.seg button{appearance:none;cursor:pointer;font:600 13px var(--body);color:var(--dim);background:transparent;border:0;border-radius:7px;padding:6px 11px;min-height:30px}
.seg button[aria-pressed="true"]{background:#0c4f75;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.seg button:focus-visible{outline:2px solid #e0f6ff;outline-offset:1px}
.btn{appearance:none;cursor:pointer;font:600 14px var(--body);color:#fff;padding:10px 18px;border-radius:10px;
  background:linear-gradient(180deg,#5ccbf7,#1d93cf 50%,#12709f);border:1px solid #063149;border-top-color:#9be3ff;
  box-shadow:0 6px 18px rgba(14,165,233,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid #e0f6ff;outline-offset:3px}
.hint{font:500 12px var(--body);color:var(--dim)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:600 14px var(--body);color:var(--dim)}
.info{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 32px));
  background:rgba(17,24,33,.88);border:1px solid var(--rule);border-top:3px solid var(--mod,#38bdf8);border-radius:12px;
  padding:14px 16px 12px;box-shadow:0 18px 40px rgba(0,0,0,.45);backdrop-filter:blur(6px);transition:opacity .35s,transform .35s}
.info.swap{opacity:0;transform:translateY(-6px)}
.info .kick{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.info h2{margin:6px 0 2px;font:700 22px/1.1 var(--display);letter-spacing:.04em;color:var(--mod,#38bdf8)}
.info .role{font:600 14px/1.35 var(--body);color:var(--text);margin:0 0 8px}
.info ul{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:6px}
.info li{font:500 12.5px/1.4 var(--body);color:#c9d6e4;padding-left:14px;position:relative}
.info li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:2px;background:var(--mod,#38bdf8)}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;border-top:1px solid var(--rule);padding-top:8px}
.info dt{font:600 11px/1.5 var(--body);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.info dd{margin:0;font:500 12px/1.5 var(--body);color:var(--text)}
.info .note{margin:8px 0 0;font:500 11.5px/1.4 var(--body);color:var(--dim)}

@media (max-width:760px){.info{top:auto;bottom:calc(118px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);padding:10px 12px}
  .info.swap{transform:translateX(50%) translateY(-6px)}.info h2{font-size:18px}.info ul,.info dl{display:none}.info .role{margin:0}.info .note{display:none}
  .label{max-width:45%}}
@media (max-width:520px){.seg button{padding:5px 8px;font-size:12px}}
</style>

<div class="app">

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('gl');

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, 1, 0.5, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false; controls.minDistance = 30; controls.maxDistance = 120;
controls.minPolarAngle = 0.5; controls.maxPolarAngle = 1.75;
const TARGET = new THREE.Vector3(0, 8.4, 0);
controls.target.copy(TARGET);
controls.enabled = false;   // the camera stays fixed; dragging turns Cydni only

scene.add(new THREE.HemisphereLight(0xdff3ff, 0x2a3644, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-5, 30, 11); key.target.position.set(0, 6, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left:-15, right:15, top:18, bottom:-10, near:2, far:70 });
key.shadow.radius = 9; key.shadow.blurSamples = 12; key.shadow.bias = -0.0006; key.shadow.normalBias = 0.06;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x9fdcff, 1.6); rim.position.set(10, 12, -16); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(14, 6, 10); scene.add(fill);

/* ground: shadow catcher + a hard-drive platter, CydFTP's motif */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity:0.35 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
{
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  const R = 512;
  const grad = g.createRadialGradient(R,R,60,R,R,R);
  grad.addColorStop(0,'rgba(120,150,180,0.35)'); grad.addColorStop(0.7,'rgba(70,95,125,0.22)'); grad.addColorStop(1,'rgba(40,55,75,0)');
  g.fillStyle = grad; g.beginPath(); g.arc(R,R,R,0,Math.PI*2); g.fill();
  for (let r=90; r<500; r+=9){ g.strokeStyle = `rgba(160,200,235,${0.05 + (r%45===0?0.08:0)})`; g.lineWidth = 1.5; g.beginPath(); g.arc(R,R,r,0,Math.PI*2); g.stroke(); }
  g.strokeStyle = 'rgba(56,189,248,0.55)'; g.lineWidth = 3; g.beginPath(); g.arc(R,R,496,0,Math.PI*2); g.stroke();
  g.fillStyle = 'rgba(30,40,52,0.9)'; g.beginPath(); g.arc(R,R,70,0,Math.PI*2); g.fill();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const platter = new THREE.Mesh(new THREE.CircleGeometry(10, 96), new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false }));
  platter.rotation.x = -Math.PI/2; platter.position.y = 0.005; scene.add(platter);
  var platterMesh = platter;
}

/* stars: the "universe" */
{
  const N = 900, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const u = Math.random()*2-1, th = Math.random()*Math.PI*2, r = 90 + Math.random()*90;
    const s = Math.sqrt(1-u*u);
    pos[i*3] = r*s*Math.cos(th); pos[i*3+1] = Math.abs(r*u)*0.9 + 4; pos[i*3+2] = r*s*Math.sin(th);
    const cy = Math.random() < 0.3; col[i*3] = cy?0.55:1; col[i*3+1] = cy?0.85:1; col[i*3+2] = 1;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('color', new THREE.BufferAttribute(col,3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({ size:0.55, vertexColors:true, transparent:true, opacity:0.75, depthWrite:false }));
  scene.add(stars);
}

/* soft contact shadow */
const blobCanvas = document.createElement('canvas'); blobCanvas.width = blobCanvas.height = 256;
{ const g = blobCanvas.getContext('2d'); const r = g.createRadialGradient(128,128,0,128,128,128);
  r.addColorStop(0,'rgba(0,0,0,0.6)'); r.addColorStop(0.5,'rgba(0,0,0,0.25)'); r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0,0,256,256); }
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(blobCanvas), transparent:true, depthWrite:false }));
blob.rotation.x = -Math.PI/2; blob.position.y = 0.012; scene.add(blob);

/* ---------- Cydni materials (same as the CYDNI 3D model) ---------- */
const M = {
  shell: new THREE.MeshPhysicalMaterial({ color:0xf1f2f3, roughness:0.32, clearcoat:1, clearcoatRoughness:0.18 }),
  ring:  new THREE.MeshPhysicalMaterial({ color:0xc9cbcd, roughness:0.38, clearcoat:0.8, clearcoatRoughness:0.25 }),
  visor: new THREE.MeshPhysicalMaterial({ color:0x1b1c1e, roughness:0.12, metalness:0.1, clearcoat:1, clearcoatRoughness:0.05 }),
  dark:  new THREE.MeshPhysicalMaterial({ color:0x2a2b2d, roughness:0.35, metalness:0.2, clearcoat:0.6 }),
  stick: new THREE.MeshStandardMaterial({ color:0xe6e8ea, roughness:0.3, metalness:0.4 }),
  cyan:  new THREE.MeshPhysicalMaterial({ color:0x0096dc, roughness:0.3, clearcoat:1, clearcoatRoughness:0.12 }),
  eye:   new THREE.MeshStandardMaterial({ color:0x00e1ff, emissive:0x00e1ff, emissiveIntensity:1.5, toneMapped:false }),
  logo:  new THREE.MeshPhysicalMaterial({ color:0x0a0a0a, roughness:0.35, clearcoat:0.7 }),
};

function stadiumShape(w, h){
  const s = new THREE.Shape(), hw = w/2, hh = h/2;
  if (w >= h){ const r = hh;
    s.moveTo(0, -hh); s.lineTo(hw-r, -hh); s.absarc(hw-r, 0, r, -Math.PI/2, Math.PI/2, false);
    s.lineTo(-hw+r, hh); s.absarc(-hw+r, 0, r, Math.PI/2, Math.PI*1.5, false); s.closePath();
  } else { const r = hw;
    s.moveTo(hw, 0); s.lineTo(hw, hh-r); s.absarc(0, hh-r, r, 0, Math.PI, false);
    s.lineTo(-hw, -hh+r); s.absarc(0, -hh+r, r, Math.PI, Math.PI*2, false); s.closePath(); }
  return s;
}
function slab(w, h, depth, b, segs=10){
  const g = new THREE.ExtrudeGeometry(stadiumShape(w-2*b, h-2*b),
    { depth:Math.max(0.001, depth-2*b), bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:segs, curveSegments:64 });
  g.center(); g.computeVertexNormals(); return g;
}
function mesh(geo, mat, parent, x=0, y=0, z=0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}

/* ---------- Cydni ---------- */
const robot = new THREE.Group(); scene.add(robot);
const BODY_ZS = 0.72;
const bodyR = y => 1.39 + (y - 0.95) / 5.7 * 1.16;
const prof = [];
for (let i=0;i<=16;i++){ const a=i/16*Math.PI/2; prof.push(new THREE.Vector2(Math.max(0.001,1.39*Math.sin(a)), 0.95-0.95*Math.cos(a))); }
for (let i=1;i<=12;i++){ const y=0.95+i/12*5.7; prof.push(new THREE.Vector2(bodyR(y), y)); }
for (let i=1;i<=18;i++){ const a=i/18*Math.PI/2; prof.push(new THREE.Vector2(1.45+1.1*Math.cos(a), 6.65+1.15*Math.sin(a))); }
prof.push(new THREE.Vector2(0.001, 7.8));
const body = mesh(new THREE.LatheGeometry(prof, 128), M.shell, robot);
body.scale.z = BODY_ZS;

const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100.06 103"><path d="M51.14,17.19s3.1.02,3.1,2.52c0,2.72-3.1,2.72-3.1,2.72-16.17-.37-30.34,14.89-28.63,30.97.75,16.11,17.65,29.27,32.89,26.3,13.5-2.62,26.63-13.09,27.48-28.43,1.12,15.75-11.53,31.54-28.28,33.76-18.62,2.45-36.92-13.25-37.38-32.03-1.57-18.75,15.11-36.26,33.92-35.81Z"/><path d="M77.23,53.75s-.21,2.43-2.49,2.43-2.61-2.43-2.61-2.43c.25-11.2-10.31-21.02-21.45-19.83-11.16.52-19.22,11.89-18.23,22.79.87,9.5,8.66,18.97,19.7,19.84-11.3,1.02-23.01-7.93-24.83-20.25-1.8-13.7,9.75-27.16,23.56-27.5,13.8-1.15,26.68,11.12,26.34,24.96Z"/><path d="M63.75,45.63s1.97,2.35.33,3.76c-1.63,1.42-3.42-.67-3.42-.67-4.43-4.63-12.67-4.33-16.7.65-4.3,4.72-3.22,13.83,1.19,17.97,4.02,3.77,7.03,4.52,10.29,4.77-4.14,1.17-8.94-.38-12.8-3.11-6.91-5.3-7.76-16.45-1.75-22.76,5.63-6.66,16.85-6.93,22.86-.61Z"/></svg>`;
{
  const LOGO_Y = 5.9, S = 0.0276;
  const data = new SVGLoader().parse(LOGO_SVG);
  data.paths.forEach(p => SVGLoader.createShapes(p).forEach(shape => {
    const g = new THREE.ExtrudeGeometry(shape, { depth:5, bevelEnabled:true, bevelThickness:1, bevelSize:0.6, bevelSegments:3, curveSegments:24 });
    g.translate(-50, -52, 0); g.scale(S, -S, S);
    const pos = g.attributes.position;
    for (let i=0;i<pos.count;i+=3){ for (let c=0;c<3;c++){ const a = pos.array[(i+1)*3+c]; pos.array[(i+1)*3+c] = pos.array[(i+2)*3+c]; pos.array[(i+2)*3+c] = a; } }
    for (let i=0;i<pos.count;i++){
      const x = pos.getX(i), y = pos.getY(i), R = bodyR(LOGO_Y + y);
      pos.setZ(i, pos.getZ(i) + BODY_ZS*Math.sqrt(Math.max(0, R*R - x*x)) - 0.05);
    }
    g.deleteAttribute('normal'); g.deleteAttribute('uv'); g.computeVertexNormals();
    mesh(g, M.logo, robot, 0, LOGO_Y, 0);
  }));
}

function finShape(side){
  const s = new THREE.Shape(), k = side;
  s.moveTo(0, 0);
  s.bezierCurveTo(0.62*k, -0.08, 0.52*k, -0.86, 0.42*k, -1.6);
  s.bezierCurveTo(0.22*k, -2.85, -0.28*k, -3.95, -0.82*k, -4.56);
  s.lineTo(0, 0);
  return s;
}
function makeArm(side){
  const pivot = new THREE.Group(); pivot.position.set(2.4*side, 7.0, -0.05); robot.add(pivot);
  const g = new THREE.ExtrudeGeometry(finShape(side), { depth:0.75, bevelEnabled:true, bevelThickness:0.2, bevelSize:0.16, bevelSegments:8, curveSegments:48 });
  g.translate(0, 0, -0.375); g.computeVertexNormals();
  mesh(g, M.cyan, pivot);
  return pivot;
}
const armL = makeArm(-1), armR = makeArm(1);

mesh(new THREE.CylinderGeometry(0.52, 0.56, 1.0, 48), M.dark, robot, 0, 7.98, 0);
const head = new THREE.Group(); head.position.set(0, 10.43, 0); robot.add(head);
mesh(slab(7.32, 4.5, 4.2, 0.7), M.ring, head);
mesh(slab(6.66, 3.84, 2.4, 0.22), M.shell, head, 0, 0, 1.11);
mesh(slab(5.04, 2.22, 0.5, 0.16), M.visor, head, 0, 0, 2.32);
for (const s of [-1, 1]){ const e = mesh(slab(2.0, 1.62, 0.8, 0.2), M.cyan, head, 3.72*s, 0, 0); e.rotation.y = Math.PI/2; }
mesh(new RoundedBoxGeometry(2.36, 0.62, 1.8, 6, 0.22), M.dark, head, 0, 2.38, 0);
mesh(new THREE.SphereGeometry(0.38, 48, 24, 0, Math.PI*2, 0, Math.PI/2), M.dark, head, 0, 2.62, 0);
mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.95, 24), M.stick, head, 0, 3.3, 0);
const antennaBall = mesh(new THREE.SphereGeometry(0.37, 48, 32), M.cyan, head, 0, 3.94, 0);

function domeGeo(){
  const s = new THREE.Shape();
  s.moveTo(0.39, 0); s.absarc(0, 0, 0.39, 0, Math.PI, false);
  s.lineTo(-0.39, -0.14); s.quadraticCurveTo(-0.39, -0.26, -0.27, -0.26);
  s.lineTo(0.27, -0.26); s.quadraticCurveTo(0.39, -0.26, 0.39, -0.14); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:0.05, bevelEnabled:true, bevelThickness:0.03, bevelSize:0.025, bevelSegments:3, curveSegments:32 });
  g.translate(0, -0.06, 0); return g;
}
const arcGeo = () => new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(-0.36,-0.16,0), new THREE.Vector3(0,0.42,0), new THREE.Vector3(0.36,-0.16,0)), 32, 0.085, 12, false);
const eyesRoot = new THREE.Group(); eyesRoot.position.set(0, 0, 2.6); head.add(eyesRoot);
const faces = {};
function face(name, left, right){
  const g = new THREE.Group();
  const l = new THREE.Mesh(left(), M.eye); l.position.x = -1.1;
  const r = new THREE.Mesh(right(), M.eye); r.position.x = 1.1;
  g.add(l, r); g.visible = false; eyesRoot.add(g); faces[name] = g;
}
face('normal', domeGeo, domeGeo);
face('happy', arcGeo, arcGeo);
const ringGeo = () => { const g = new THREE.CylinderGeometry(0.31, 0.31, 0.08, 48); g.rotateX(Math.PI/2); return g; };
face('surprised', ringGeo, ringGeo);
function setFace(n){ for (const k in faces) faces[k].visible = (k === n); }
setFace('normal');

/* ---------- an assortment of files on the ground (scene-level, so they never move with Cydni) ---------- */

/* ---------- 3D letters: layered glyph slices give each letter real depth ---------- */
const EM = 3.6, PX = 512, PAD = 40, SCALE = EM/PX, LAYERS = 18, LAYER_GAP = 0.034;
const WORDS = 'CydVerse';
const BASE_Y = 20.2, SUB_EM = 1.75, SUB_Y = 17.75;
const subRoot = new THREE.Group(); scene.add(subRoot);
let subLetters = [], subPickedTl = 0;
const textRoot = new THREE.Group(); scene.add(textRoot);
let letters = [];
const FONT = `700 ${PX}px "Chakra Petch", "Segoe UI", system-ui, sans-serif`;
function glyphCanvas(ch, w, fillStyle){
  const c = document.createElement('canvas'); c.width = w; c.height = Math.round(PX*1.25);
  const g = c.getContext('2d'); g.font = FONT; g.textBaseline = 'alphabetic';
  if (fillStyle === 'grad-cap'){
    const gr = g.createLinearGradient(0, PX*0.15, 0, PX); gr.addColorStop(0,'#bdeeff'); gr.addColorStop(0.45,'#38bdf8'); gr.addColorStop(1,'#1288c4'); g.fillStyle = gr;
  } else if (fillStyle === 'grad-low'){
    const gr = g.createLinearGradient(0, PX*0.3, 0, PX); gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#c9d6e4'); g.fillStyle = gr;
  } else g.fillStyle = fillStyle;
  g.fillText(ch, PAD, PX*0.98);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function makeLetter(ch, advPx, em, cap, layers){
  const sc = em/PX, cw = Math.ceil(advPx) + PAD*2, ch_ = Math.round(PX*1.25);
  const geo = new THREE.PlaneGeometry(cw*sc, ch_*sc);
  const solid = glyphCanvas(ch, cw, '#ffffff'), front = glyphCanvas(ch, cw, cap ? 'grad-cap' : 'grad-low');
  const grp = new THREE.Group();
  const sideA = new THREE.Color(cap ? 0x0f7fb8 : 0x8a9aae), sideB = new THREE.Color(cap ? 0x062a40 : 0x26303c);
  const gap = LAYER_GAP*em/EM;
  for (let k=layers; k>=1; k--){
    const mat = new THREE.MeshBasicMaterial({ map:solid, color:sideA.clone().lerp(sideB, k/layers), transparent:true, alphaTest:0.5, toneMapped:false, side:THREE.DoubleSide });
    const p = new THREE.Mesh(geo, mat); p.position.z = -k*gap; grp.add(p);
  }
  const f = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map:front, transparent:true, alphaTest:0.5, toneMapped:false }));
  f.position.z = 0.002; grp.add(f);
  return { grp, offY: (ch_/2 - PX*0.98)*sc };
}
function buildLetters(){
  textRoot.clear(); letters = [];
  const m = document.createElement('canvas').getContext('2d'); m.font = FONT;
  const chars = [...WORDS], adv = chars.map(ch => m.measureText(ch).width);
  const total = adv.reduce((a,b)=>a+b, 0) * SCALE;
  const capsIdx = chars.map((ch, i) => (ch !== ' ' && ch === ch.toUpperCase() && ch !== ch.toLowerCase()) ? i : -1).filter(i => i >= 0);
  let x = -total/2;
  chars.forEach((ch, i) => {
    const w = adv[i]*SCALE; const cx = x + w/2; x += w;
    if (ch === ' ') return;
    const cap = capsIdx.includes(i);
    const capAt = capsIdx.filter(c => c <= i).pop() ?? capsIdx[0];
    const { grp, offY } = makeLetter(ch, adv[i], EM, cap, LAYERS);
    grp.userData = { ch, cap, finalX: cx, y: BASE_Y - offY, word: capsIdx.indexOf(capAt), order: cap ? 0 : i - capAt, adv: w };
    textRoot.add(grp); letters.push(grp);
  });
  // the capitals stand together first, centred with a gap, before the word opens up
  const caps = letters.filter(l => l.userData.cap), gap = EM*0.55;
  const row = caps.reduce((a, l) => a + l.userData.adv, 0) + gap*(caps.length - 1);
  let cx = -row/2;
  caps.forEach(l => { l.userData.startX = cx + l.userData.adv/2; cx += l.userData.adv + gap; });
  letters.forEach(l => { if (!l.userData.cap) l.userData.startX = caps[l.userData.word].userData.finalX; });
  const gc = document.createElement('canvas'); gc.width = gc.height = 256; const gg = gc.getContext('2d');
  const rg = gg.createRadialGradient(128,128,0,128,128,128); rg.addColorStop(0,'rgba(56,189,248,0.55)'); rg.addColorStop(1,'rgba(56,189,248,0)');
  gg.fillStyle = rg; gg.fillRect(0,0,256,256);
  const gtex = new THREE.CanvasTexture(gc);
  for (const L of caps){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:gtex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
    sp.scale.set(EM*1.6, EM*1.6, 1); sp.position.set(0, -0.05*EM, -0.8); L.add(sp); L.userData.glow = sp;
  }
}
// the product name under the title (Orbit, Starport, Launchpad, Vault); empty for the CydVerse umbrella
const PRODUCTS = {
  cydverse:  ['', 'CydVerse · the umbrella platform'],
  orbit:     ['Orbit', 'Orbit · internal file share'],
  starport:  ['Starport', 'Starport · external drop and client portal'],
  launchpad: ['Launchpad', 'Launchpad · FTP and SFTP server'],
  vault:     ['Vault', 'Vault · secure storage and archive'],
};
function buildSub(name){
  subRoot.clear(); subLetters = [];
  if (!name) return;
  const m = document.createElement('canvas').getContext('2d'); m.font = FONT;
  const chars = [...name], adv = chars.map(ch => m.measureText(ch).width*SUB_EM/PX);
  const total = adv.reduce((a,b)=>a+b, 0);
  let x = -total/2;
  chars.forEach((ch, i) => {
    const cx = x + adv[i]/2; x += adv[i];
    const { grp, offY } = makeLetter(ch, adv[i]*PX/SUB_EM, SUB_EM, true, 10);
    grp.userData = { i, x: cx, y: SUB_Y - offY };
    grp.position.set(cx, SUB_Y - offY, 0); grp.scale.setScalar(0.001);
    subRoot.add(grp); subLetters.push(grp);
  });
}

const vTmp = new THREE.Vector3(), qTmp = new THREE.Quaternion(), zAxis = new THREE.Vector3(0, 0, 1);
function updateBlackHole(tl, now){

  const fo = Math.max(1 - Math.abs(tl - T.holeOpenA - 0.25)/0.45, 1 - Math.abs(tl - T.holeCloseB + 0.1)/0.4, 0);
  flash.material.opacity = fo; flash.scale.setScalar(6 + 14*fo);
  const bt = seg(tl, T.holeCloseB + 0.05, T.holeCloseB + 0.55);
  const bv = bt > 0 && bt < 1 ? Math.sin(bt*Math.PI) : 0;
  blip.visible = bv > 0.001; blip.material.opacity = bv; blip.scale.setScalar(0.25 + 1.1*bv);
  for (const f of fileStarts){
    const a = T.pullA + f.order*T.pullStep, u = seg(tl, a, a + T.pullDur);
    if (u <= 0){ f.o.position.copy(f.p); f.o.quaternion.copy(f.q); f.o.scale.copy(f.s); f.o.visible = true; continue; }
    if (u >= 1){ f.o.visible = false; continue; }
    f.o.visible = true;
    // lift off and shudder, then spiral in, tumbling and shrinking
    const lift = easeIO(seg(u, 0, 0.3)), pull = Math.pow(seg(u, 0.18, 1), 1.6);
    vTmp.copy(f.p).sub(HOLE); vTmp.y += lift*2.2;
    vTmp.applyAxisAngle(zAxis, pull*Math.PI*2.4);
    vTmp.multiplyScalar(1 - pull);
    f.o.position.copy(HOLE).add(vTmp);
    if (u < 0.3) f.o.position.x += Math.sin(now*40 + f.order)*0.05*(1 - lift);
    qTmp.setFromAxisAngle(f.spin, pull*9 + lift*0.4);
    f.o.quaternion.copy(f.q).premultiply(qTmp);
    f.o.scale.copy(f.s).multiplyScalar(Math.max(0.001, 1 - Math.pow(pull, 0.8)*0.97));
  }
}

/* ---------- framing ---------- */
const VIEW_AZ = THREE.MathUtils.degToRad(8), VIEW_PO = THREE.MathUtils.degToRad(77);
let fitDist = 56;
function frame(){
  const halfW = 13.6, halfH = 17.0;
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  fitDist = Math.max(halfH / tv, halfW / (tv * camera.aspect)) + 4;
  controls.maxDistance = Math.max(120, fitDist*1.6);
}
function resetCamera(){
  camera.position.setFromSpherical(new THREE.Spherical(fitDist, VIEW_PO, VIEW_AZ)).add(TARGET);
  controls.target.copy(TARGET); controls.update();
}
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const before = fitDist; frame();
  if (!userMoved) resetCamera(); else if (before !== fitDist) controls.update();
}
let userMoved = false;
// drag sideways to turn Cydni on the spot; nothing else in the scene moves
let userYaw = 0, dragX = null;
canvas.addEventListener('pointerdown', e => { dragX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (dragX === null) return; userYaw += (e.clientX - dragX) * 0.012; dragX = e.clientX; });
const endDrag = () => { dragX = null; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

/* ---------- timeline ---------- */
const easeIO = x => x<0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp01((t - a)/(b - a));
// spin first; then both documents come out toward the viewer together; F U appears, holds for 1 second, then opens into File Universe
const T = { spinA:0.3, spinB:2.2, docsIn:2.2, capsIn:2.35, expandA:4.1, expandB:5.5, end:5.95,
  holeOpenA:6.6, holeOpenB:7.7, pullA:7.5, pullStep:0.32, pullDur:2.1, holeCloseA:11.4, holeCloseB:12.3, allDone:12.8 };
const OUT_Z = 0.62, OUT_X = -1.0;        // arms held out in front (radians)

let tl = 0, floatY = 0, blinkT = 2.5, armLz = -0.05, armRz = 0.05, armX = 0;
function restart(){
  tl = reduceMotion ? T.end + 1 : 0;
  robot.rotation.y = 0; userYaw = 0; armLz = -0.05; armRz = 0.05; armX = 0;
  armL.rotation.set(0, 0, armLz); armR.rotation.set(0, 0, armRz);
  setFace(reduceMotion ? 'happy' : 'normal');
  resetFiles();
  subPickedTl = 0;
}

const clock = new THREE.Clock();
const lerp = THREE.MathUtils.lerp;
const BASE = 0.85;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05); tl += dt;
  const now = clock.elapsedTime;

  // float
  floatY = lerp(floatY, reduceMotion ? 0.2 : 0.35 + Math.sin(now*1.6)*0.28, 1 - Math.pow(0.001, dt));

  // spin once, with a little hop
  const sp = easeIO(seg(tl, T.spinA, T.spinB));
  robot.rotation.y = sp * Math.PI * 2 + userYaw;
  const hop = Math.sin(sp*Math.PI) * 0.9;
  robot.position.y = BASE + floatY + hop;
  head.rotation.z = Math.sin(sp*Math.PI*2) * 0.06;

  // arms: tucked during the spin, then both held out toward the viewer at the same time
  let tL, tR, tX;
  if (tl < T.docsIn){ tL = -0.06 - Math.sin(now*1.6)*0.04 - Math.sin(sp*Math.PI)*0.35; tR = -tL; tX = 0; }
  else { const b = tl > T.end ? Math.sin(now*1.6)*0.03 : 0; tL = -OUT_Z; tR = OUT_Z; tX = OUT_X + b; }
  const k = 1 - Math.pow(0.0004, dt);
  armLz = lerp(armLz, tL, k); armRz = lerp(armRz, tR, k); armX = lerp(armX, tX, k);
  armL.rotation.set(armX, 0, armLz); armR.rotation.set(armX, 0, armRz);

  // documents pop into the hands and stay upright, leaning out a little
  const ds = tl < T.docsIn ? 0.001 : easeOutBack(seg(tl, T.docsIn, T.docsIn + 0.45));
  for (const h of [holdL, holdR]){ h.scale.setScalar(Math.max(0.001, ds)); h.visible = ds > 0.01; }
  aimHolder(holdL, armL, 0.1);
  aimHolder(holdR, armR, -0.1);

  if (tl >= T.docsIn && tl - dt < T.docsIn) setFace('happy');
  if (tl >= T.holeOpenA && tl - dt < T.holeOpenA) setFace('surprised');
  if (tl >= T.allDone && tl - dt < T.allDone) setFace('happy');
  updateBlackHole(tl, now);

  // letters: F and U drop in, then open up into File Universe
  const ex = easeIO(seg(tl, T.expandA, T.expandB));
  for (const L of letters){
    const u = L.userData;
    if (u.cap){
      const inP = easeOutBack(seg(tl, T.capsIn + (u.word ? 0.15 : 0), T.capsIn + (u.word ? 0.15 : 0) + 0.6));
      const s = Math.max(0.001, inP) * lerp(1.3, 1, ex);
      L.scale.setScalar(s);
      L.position.set(lerp(u.startX, u.finalX, ex), u.y + (1 - clamp01(inP))*4 + lerp(-0.7, 0, ex), 0);
      L.visible = tl >= T.capsIn + (u.word ? 0.15 : 0);
      if (u.glow) u.glow.material.opacity = lerp(0.8, 0.45, ex) + Math.sin(now*2.4 + u.word)*0.12;
    } else {
      const d = T.expandA + 0.2 + u.order*0.08;
      const p = seg(tl, d, d + 0.55);
      const s = Math.max(0.001, easeOutBack(p));
      L.scale.setScalar(s);
      L.position.set(lerp(u.startX, u.finalX, easeIO(p)), u.y, -0.4*(1-p));
      L.visible = p > 0;
    }
  }

  // product name pops in letter by letter once the title has formed
  const ls = tl - Math.max(subPickedTl, T.expandB + 0.15);
  for (const L of subLetters){
    const p = seg(ls, L.userData.i*0.06, L.userData.i*0.06 + 0.5);
    L.scale.setScalar(Math.max(0.001, easeOutBack(p)));
    L.position.y = L.userData.y + (1 - clamp01(p))*0.8;
  }

  // ambient
  const hgt = robot.position.y;
  const sc = 7.2 + hgt*0.9; blob.scale.set(sc, sc*0.55, 1);
  blob.material.opacity = THREE.MathUtils.clamp(0.95 - hgt*0.28, 0.35, 0.95);

  // blink
  blinkT -= dt; let ey = 1;
  if (blinkT < 0.14 && !faces.happy.visible && !faces.surprised.visible) ey = Math.abs(blinkT - 0.07) / 0.07;
  if (blinkT <= 0) blinkT = 2.5 + Math.random()*3;
  eyesRoot.scale.y = Math.max(0.08, ey);

  controls.update();
  renderer.render(scene, camera);
}

const infoEl = document.getElementById('info');
function showInfo(p){
  const d = INFO[p]; infoEl.classList.add('swap');
  setTimeout(() => {
    infoEl.style.setProperty('--mod', d.color);
    infoEl.innerHTML = `<div class="kick">${d.kick}</div><h2>${d.name}</h2><p class="role">${d.role}</p>`
      + `<ul>${d.pts.map(x=>`<li>${x}</li>`).join('')}</ul>`
      + `<dl>${d.meta.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`
      + (d.note ? `<p class="note">${d.note}</p>` : '');
    infoEl.classList.remove('swap');
  }, infoEl.innerHTML ? 180 : 0);
}
showInfo('cydverse');
const productSeg = document.getElementById('product'), caption = document.getElementById('caption');
productSeg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  productSeg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  const [name, text] = PRODUCTS[b.dataset.p];
  caption.textContent = text; buildSub(name); subPickedTl = tl; showInfo(b.dataset.p);
});
document.getElementById('replay').addEventListener('click', () => { userMoved = false; resetCamera(); restart(); });

const fontReady = Promise.race([
  document.fonts ? document.fonts.load(`700 120px "Chakra Petch"`) : Promise.resolve(),
  new Promise(r => setTimeout(r, 2500)),
]);
fontReady.catch(() => {}).finally(() => {

  document.getElementById('loading').remove();
  tick();
});
